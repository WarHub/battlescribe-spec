name: Set up a CI job
description: >-
  The provisioning every ci.yml job that builds the solution shares — the .NET SDK from global.json,
  the WarHub bot token, the caches, a JDK, setup.ps1 and, optionally, the BS UI Java agent. Checkout
  and Build stay in the job.

# ONE COPY OF THE SETUP, BECAUSE FIVE COPIES DRIFTED. Every job that builds the solution used to carry
# its own 25-50 lines of setup-dotnet, token, cache, setup-java and setup.ps1 steps, and they had
# already diverged in ways nobody chose: setup-java before setup.ps1 in three jobs and after it in two,
# and a JDK comment copied three times. A change to how CI provisions (a new cache, a new pinned
# input, an action bump) was an edit per job, and the job that was missed found out on its own
# thorough run. Each job now states WHAT it needs in one `with:` block, and this file says HOW, once.
#
# CHECKOUT AND BUILD STAY IN THE JOB. Checkout must run first (this file lives in the repository), and
# the Build step keeps `id: build` in the job because every test step's condition reads
# `steps.build.outcome` — a step id inside a composite action is not visible to the job that uses it.
# The build's flags are the job's to state as well: `checks` is the analyzer gate and builds plain,
# every other job builds with -p:FunctionalBuild=true (CiWorkflowDriftTests holds both).
#
# THE INPUTS ARE CHECKED, NOT TRUSTED. A composite action ignores an input it does not declare, and
# the two places below that read an input disagree about case: an `if:` expression compares strings
# ignoring it, a bash test compares them exactly. So `playwright: True` would restore the browser
# cache (`if:`) and still pass -SkipPlaywright (bash) — on a cache miss, no browser, and a missing
# browser makes the frozen NR UI lanes skip rather than fail, which reads as green — and
# `java: jdk+fx` would match no setup-java step at all. The first step refuses any value but the
# exact ones, so both readers see the same thing. No input has a default, on purpose: a job states
# its whole provisioning, and nothing is inherited from a default nobody reads. (GitHub does not
# enforce `required` on a composite action's inputs — an omitted one arrives empty — so the check
# step is what refuses an omission.)
#
# The scans that hold CI to its rules read this file as well as the workflows (CiDefinitionFiles):
# ToolchainPinDriftTests (no SDK chosen outside global.json), the retired-knob scan, the
# step-reference lint, the test-step classifier and the ban on spelling out FunctionalBuild's
# properties. Dependabot watches it through `directories` in .github/dependabot.yml, which
# EveryActionDirectory_IsWatchedByDependabot keeps true.

inputs:
  app-client-id:
    description: The WarHub bot app's client id (vars.WARHUB_BOT_APP_CLIENT_ID).
    required: true
  app-private-key:
    description: >-
      The WarHub bot app's private key (secrets.WARHUB_BOT_APP_PRIVATE_KEY). A composite action cannot
      read secrets itself, so the job passes it in; GitHub still masks it in the log.
    required: true
  setup-args:
    description: >-
      Extra setup.ps1 switches: any of -SkipJavaAgent, -SkipWh40k, -Force, or empty. -SkipPlaywright is
      not one of them — it follows `playwright`, so the browser cache and the install cannot disagree.
    required: true
  java:
    description: >-
      `plain` — Liberica 11, for the engine-jar patch tool every build of the BattleScribe engine runs
      (src/bs-engine-patch, #401). `jdk-fx` — Liberica 11 with JavaFX, which the BS UI Java agent
      compiles against and the desktop app runs on. `none` — no setup-java step.
    required: true
  nr-caches:
    description: "`true` restores the frozen NR HAR and NR Editor snapshot caches (keyed on testdata.json)."
    required: true
  playwright:
    description: "`true` restores the browser cache and lets setup.ps1 install Chromium; `false` passes -SkipPlaywright."
    required: true
  agent-jar:
    description: "`true` restores the bs-ui-java-agent jar cache and builds the agent. Needs `java: jdk-fx`."
    required: true

runs:
  using: composite
  steps:
    - name: Check inputs
      shell: bash
      env:
        SETUP_ARGS: ${{ inputs.setup-args }}
        JAVA: ${{ inputs.java }}
        NR_CACHES: ${{ inputs.nr-caches }}
        PLAYWRIGHT: ${{ inputs.playwright }}
        AGENT_JAR: ${{ inputs.agent-jar }}
      run: |
        fail() { echo "::error title=.github/actions/setup::$1"; exit 1; }
        case "$JAVA" in none|plain|jdk-fx) ;; *) fail "java must be none, plain or jdk-fx (got '$JAVA')" ;; esac
        for pair in "nr-caches=$NR_CACHES" "playwright=$PLAYWRIGHT" "agent-jar=$AGENT_JAR"; do
          case "${pair#*=}" in true|false) ;; *) fail "${pair%%=*} must be true or false (got '${pair#*=}')" ;; esac
        done
        if [ "$AGENT_JAR" = true ] && [ "$JAVA" != jdk-fx ]; then
          fail "agent-jar: true needs java: jdk-fx — the agent compiles against JavaFX"
        fi
        read -ra args <<< "$SETUP_ARGS"
        for a in "${args[@]}"; do
          case "$a" in
            -SkipJavaAgent|-SkipWh40k|-Force) ;;
            -SkipPlaywright) fail "pass playwright: false instead of -SkipPlaywright in setup-args" ;;
            *) fail "setup-args: '$a' is not a setup.ps1 switch this action passes on" ;;
          esac
        done

    # THE BUILD'S STRICTNESS USED TO BE WHATEVER MICROSOFT SHIPPED THAT WEEK. `AnalysisLevel` is
    # `latest-recommended` and `TreatWarningsAsErrors` is true (Directory.Build.props), so the set of CA
    # rules that can fail a build is resolved from the installed SDK — and every job used to ask
    # setup-dotnet for a floating `dotnet-version: '10.0.x'`, which installs the newest 10.0 SDK in
    # existence at that moment. global.json's `rollForward: latestFeature` then accepted it, whatever
    # band it was.
    #
    # That is not theoretical. SDK 10.0.400 was released 2026-08-11; run 31746128450 (main, 2026-08-13)
    # installed it and built on a feature band no commit in this repo had ever seen. It was green. That
    # was luck, not a property of the repo: a feature band is where analyzers get stricter, the previous
    # band change surfaced ~22 CA errors in TestKit and TraceSummary on untouched files (#312), and the
    # commit that would have gone red was a docs-only one.
    #
    # `global-json-file` makes global.json the single declaration of the toolchain, for CI and for
    # contributors alike — setup-dotnet honours `latestPatch` and installs the newest SDK inside the
    # pinned band. The band still moves; it moves through a Dependabot PR that CI actually builds (see
    # .github/dependabot.yml), so a stricter analyzer set arrives as a reviewable diff instead of as a
    # red build on a commit that changed nothing.
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: WarHub
        repositories: newrecruit-har,battlescribe-archive

    # The BattleScribe project IKVM-compiles lib/battlescribe/lib/*.jar at build time, so every job
    # that builds the solution needs the app. Every key carries runner.os: the windows-pre-push job
    # runs this action too, and an archive saved on one OS is not restored on another.
    - name: Cache the BattleScribe app
      uses: actions/cache@v6
      with:
        path: lib/battlescribe
        key: bsapp-${{ runner.os }}-${{ hashFiles('testdata.json') }}
    - name: Cache the frozen NR HAR
      if: inputs.nr-caches == 'true'
      uses: actions/cache@v6
      with:
        path: .testdata/newrecruit-har
        key: nrhar-${{ runner.os }}-${{ hashFiles('testdata.json') }}
    - name: Cache the frozen NR Editor snapshot
      if: inputs.nr-caches == 'true'
      uses: actions/cache@v6
      with:
        path: .testdata/nr-editor
        key: nreditor-${{ runner.os }}-${{ hashFiles('testdata.json') }}
    # Where Playwright keeps its browsers, which differs per OS (setup.ps1 resolves the same paths).
    - name: Cache the Playwright browsers
      if: inputs.playwright == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || '~/.cache/ms-playwright' }}
        key: pw-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
    - name: Cache the BS UI Java agent
      if: inputs.agent-jar == 'true'
      uses: actions/cache@v6
      with:
        path: src/bs-ui-java-agent/bs-ui-java-agent.jar
        key: bsjar-${{ runner.os }}-${{ hashFiles('src/bs-ui-java-agent/**', 'testdata.json') }}

    # BEFORE setup.ps1, in every job. setup.ps1 compiles the engine-jar patch tool with JAVA_HOME (it
    # skips its own Liberica download under CI=true), and two jobs used to run it before setup-java,
    # compiling with whatever JDK the runner image defaulted to. That worked only because the tool
    # compiles with --release 11; one order everywhere removes the question.
    - name: Setup Java (Liberica 11, for the engine-jar patch tool)
      if: inputs.java == 'plain'
      uses: actions/setup-java@v6
      with:
        distribution: 'liberica'
        java-version: '11'
    - name: Setup Java (Liberica 11 with JavaFX, for the BS UI agent and app)
      if: inputs.java == 'jdk-fx'
      uses: actions/setup-java@v6
      with:
        distribution: 'liberica'
        java-version: '11'
        java-package: 'jdk+fx'

    - name: Setup dependencies
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        SETUP_ARGS: ${{ inputs.setup-args }}
        PLAYWRIGHT: ${{ inputs.playwright }}
      run: |
        read -ra args <<< "$SETUP_ARGS"
        if [ "$PLAYWRIGHT" != true ]; then args+=(-SkipPlaywright); fi
        pwsh ./setup.ps1 "${args[@]}"

    # After setup.ps1: the agent compiles against lib/battlescribe's Gson and shades lib/asm, both of
    # which setup.ps1 provides.
    - name: Build bs-ui-java-agent
      if: inputs.agent-jar == 'true'
      shell: bash
      run: pwsh -File src/bs-ui-java-agent/build.ps1
