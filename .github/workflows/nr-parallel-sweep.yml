name: NR parallelism sweep (temporary)

# TEMPORARY measurement workflow (#271): finds the NR_PARALLEL value that minimises wall time for
# the NR frozen lanes ON REAL RUNNER HARDWARE. A local sweep is not transferable — a dev box has
# ~32 cores, ubuntu-latest has ~4 vCPU — and NR's browser work is IO-bound, so the optimum is not
# simply "core count". Delete this workflow once ci.yml has been tuned.
#
# Triggered by pushing a change to THIS file on the measurement branch (workflow_dispatch only works
# from the default branch, and this workflow is intentionally never merged there).

on:
  push:
    branches: [feat/271-nr-warm-reuse]
    paths: ['.github/workflows/nr-parallel-sweep.yml']

jobs:
  sweep:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        parallel: [2, 4, 6, 8, 12, 16]
    name: "NR_PARALLEL=${{ matrix.parallel }}"
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WARHUB_BOT_APP_ID }}
          private-key: ${{ secrets.WARHUB_BOT_PRIVATE_KEY }}
          owner: WarHub
          repositories: newrecruit-har,battlescribe-archive
      - uses: actions/cache@v6
        with:
          path: lib/battlescribe
          key: bsapp-${{ hashFiles('testdata.json') }}
      - uses: actions/cache@v6
        with:
          path: .testdata/newrecruit-har
          key: nrhar-${{ hashFiles('testdata.json') }}
      - uses: actions/cache@v6
        with:
          path: .testdata/nr-editor
          key: nreditor-${{ hashFiles('testdata.json') }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-linux-${{ hashFiles('Directory.Packages.props') }}

      - name: Runner capacity (context for the numbers)
        run: |
          echo "vCPU: $(nproc)"
          free -m | awk '/Mem:/ {print "RAM MB: " $2}'

      - name: Setup dependencies
        run: pwsh ./setup.ps1 -SkipJavaAgent -SkipWh40k
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Build
        run: dotnet build

      # The dominant pooled NR lane: 113 UI-driven gamedata specs, scaled by NR_PARALLEL.
      - name: "nr-editor-ui-frozen @ NR_PARALLEL=${{ matrix.parallel }}"
        run: |
          start=$(date +%s)
          dotnet test tests/BattleScribeSpec.Tests.csproj -p:TestProfile=nr-editor-ui-frozen \
            --no-build --logger "console;verbosity=minimal"
          wall=$(( $(date +%s) - start ))
          echo "::notice title=editor-ui P=${{ matrix.parallel }}::${wall}s"
          echo "EDITOR_UI_WALL=$wall" >> "$GITHUB_ENV"
        env:
          NR_HEADLESS: true
          NR_PARALLEL: ${{ matrix.parallel }}

      # The store-driven roster lane (365 specs) — cheap, but confirms the knob's effect there too.
      - name: "nr-frozen @ NR_PARALLEL=${{ matrix.parallel }}"
        run: |
          start=$(date +%s)
          dotnet test tests/BattleScribeSpec.Tests.csproj -p:TestProfile=nr-frozen \
            --no-build --logger "console;verbosity=minimal"
          wall=$(( $(date +%s) - start ))
          echo "::notice title=roster P=${{ matrix.parallel }}::${wall}s"
          echo "ROSTER_WALL=$wall" >> "$GITHUB_ENV"
        env:
          NR_HEADLESS: true
          NR_PARALLEL: ${{ matrix.parallel }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### NR_PARALLEL=${{ matrix.parallel }} on $(nproc) vCPU"
            echo ""
            echo "| lane | wall |"
            echo "|---|---:|"
            echo "| nr-editor-ui-frozen (113 UI specs) | ${EDITOR_UI_WALL:-n/a}s |"
            echo "| nr-frozen (365 store specs) | ${ROSTER_WALL:-n/a}s |"
          } >> "$GITHUB_STEP_SUMMARY"
