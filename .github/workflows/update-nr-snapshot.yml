name: Update NR Snapshot

on:
  schedule:
    - cron: '30 4 * * *' # daily at 04:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-snapshot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup dependencies
        run: pwsh ./setup.ps1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build HarTool
        run: dotnet build src/BattleScribeSpec.NewRecruit.HarTool

      - name: Record new HAR snapshot
        id: record
        run: |
          dotnet run --project src/BattleScribeSpec.NewRecruit.HarTool --no-build -- -o .har-staging
          HAR_SHA256=$(sha256sum .har-staging/newrecruit.har | cut -d' ' -f1)
          echo "har_sha256=$HAR_SHA256" >> "$GITHUB_OUTPUT"

          CLIENT_VERSION=$(grep -oP '"ClientVersion":\s*"\K[^"]+' .har-staging/metadata.json || echo "unknown")
          echo "client_version=$CLIENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Get current release digest
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch the current latest release asset digest for newrecruit.har
          DIGEST=$(gh api repos/WarHub/newrecruit-har/releases/latest \
            --jq '.assets[] | select(.name == "newrecruit.har") | .digest' 2>/dev/null || echo "")
          # digest format is "sha256:hexstring" — extract just the hex
          CURRENT_SHA256="${DIGEST#sha256:}"
          echo "current_sha256=$CURRENT_SHA256" >> "$GITHUB_OUTPUT"

          CURRENT_TAG=$(gh api repos/WarHub/newrecruit-har/releases/latest --jq '.tag_name' 2>/dev/null || echo "")
          echo "current_tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: check
        run: |
          NEW="${{ steps.record.outputs.har_sha256 }}"
          OLD="${{ steps.current.outputs.current_sha256 }}"
          echo "new_sha256=$NEW"
          echo "old_sha256=$OLD"
          if [ "$NEW" = "$OLD" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected — snapshot is identical."
            {
              echo "## NR Snapshot Update"
              echo ""
              echo "No changes detected — snapshot is identical to the current release (\`${{ steps.current.outputs.current_tag }}\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected — new snapshot needed."
          fi

      - name: Determine release tag
        if: steps.check.outputs.changed == 'true'
        id: tag
        run: |
          VERSION="${{ steps.record.outputs.client_version }}"
          CURRENT_TAG="${{ steps.current.outputs.current_tag }}"
          BASE_TAG="v${VERSION}"

          if [ "$CURRENT_TAG" = "$BASE_TAG" ] || [[ "$CURRENT_TAG" == "${BASE_TAG}-"* ]]; then
            # Same version — append date
            NEW_TAG="${BASE_TAG}-$(date +%Y%m%d)"
          else
            NEW_TAG="$BASE_TAG"
          fi
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $NEW_TAG"

      - name: Generate GitHub App token
        if: steps.check.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.WARHUB_BOT_APP_ID }}
          private-key: ${{ secrets.WARHUB_BOT_PRIVATE_KEY }}
          owner: WarHub
          repositories: newrecruit-har,battlescribe-spec

      - name: Download current HAR for diff
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.current.outputs.current_tag }}"
          if [ -n "$TAG" ]; then
            mkdir -p .har-old
            gh release download "$TAG" \
              -R WarHub/newrecruit-har \
              -p 'newrecruit.har' -p 'metadata.json' \
              -D .har-old || echo "Could not download previous HAR — skipping diff"
          fi

      - name: Generate change summary
        if: steps.check.outputs.changed == 'true'
        id: summary
        run: |
          OLD_VERSION=""
          DIFF_ARGS="--new .har-staging/newrecruit.har --new-version ${{ steps.record.outputs.client_version }}"
          if [ -f .har-old/newrecruit.har ]; then
            OLD_VERSION=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('.har-old/metadata.json','utf8')).ClientVersion||'')}catch{console.log('')}")
            DIFF_ARGS="--old .har-old/newrecruit.har --old-version $OLD_VERSION $DIFF_ARGS"
          fi
          node scripts/har-diff.mjs $DIFF_ARGS > .har-staging/summary.md 2>/dev/null || echo "_(change summary unavailable)_" > .har-staging/summary.md
          echo "--- Change Summary ---"
          cat .har-staging/summary.md

      - name: Publish release to WarHub/newrecruit-har
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TAG="${{ steps.tag.outputs.new_tag }}"
          VERSION="${{ steps.record.outputs.client_version }}"
          {
            echo "Automated snapshot of newrecruit.eu client version ${VERSION}."
            echo ""
            cat .har-staging/summary.md
          } > .har-staging/release-notes.md
          gh release create "$TAG" \
            .har-staging/newrecruit.har \
            .har-staging/metadata.json \
            -R WarHub/newrecruit-har \
            --title "NR snapshot $TAG" \
            --notes-file .har-staging/release-notes.md

      - name: Update testdata.json
        if: steps.check.outputs.changed == 'true'
        run: |
          TAG="${{ steps.tag.outputs.new_tag }}"
          python3 -c "
          import json, pathlib
          p = pathlib.Path('testdata.json')
          d = json.loads(p.read_text())
          d['newrecruit-har']['tag'] = '$TAG'
          p.write_text(json.dumps(d, indent=2) + '\n')
          "

      - name: Open or update PR
        if: steps.check.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update-nr-snapshot
          commit-message: |
            chore: update NR snapshot to ${{ steps.tag.outputs.new_tag }}

            New Recruit client version: ${{ steps.record.outputs.client_version }}
            Release: https://github.com/WarHub/newrecruit-har/releases/tag/${{ steps.tag.outputs.new_tag }}
          title: "Update NR snapshot to ${{ steps.tag.outputs.new_tag }}"
          body-path: .har-staging/summary.md

      - name: Write job summary
        if: steps.check.outputs.changed == 'true'
        env:
          TAG: ${{ steps.tag.outputs.new_tag }}
          VERSION: ${{ steps.record.outputs.client_version }}
          OLD_TAG: ${{ steps.current.outputs.current_tag }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          {
            echo "## NR Snapshot Updated: $TAG"
            echo ""
            echo "**Client version:** $VERSION"
            echo "**Previous release:** [\`$OLD_TAG\`](https://github.com/WarHub/newrecruit-har/releases/tag/$OLD_TAG)"
            echo "**New release:** [\`$TAG\`](https://github.com/WarHub/newrecruit-har/releases/tag/$TAG)"
            if [ -n "$PR_URL" ]; then
              echo "**Pull request:** $PR_URL"
            fi
            echo ""
            cat .har-staging/summary.md
          } >> "$GITHUB_STEP_SUMMARY"
