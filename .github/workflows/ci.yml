name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'
      timezone: Europe/Warsaw

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout battlescribe-spec
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WARHUB_BOT_APP_ID }}
          private-key: ${{ secrets.WARHUB_BOT_PRIVATE_KEY }}
          owner: WarHub
          repositories: newrecruit-har,battlescribe-archive

      - name: Setup dependencies
        run: pwsh ./setup.ps1 -SkipPlaywright
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Verify formatting
        run: dotnet format BattleScribeSpec.slnx --no-restore --verify-no-changes --exclude .deps/

      - name: Run script tests
        run: node --test scripts/har-diff.test.mjs

      - name: Test
        run: dotnet test --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false" --filter "Engine!=FrozenNrRoster&Engine!=FrozenNrGameData&Engine!=LiveNrRoster&Engine!=LiveNrGameData&Engine!=FrozenNrUiRoster&Engine!=LiveNrUiRoster&Engine!=FrozenNrGameDataUi&Engine!=LiveNrGameDataUi"

      - name: End-to-end spec runner test
        run: |
          dotnet artifacts/bin/BattleScribeSpec.Runner/debug/bs-spec-runner.dll \
            --adapter "dotnet:artifacts/bin/BattleScribeSpec.ReferenceAdapter/debug/bs-reference-adapter.dll" \
            --specs specs \
            --filter "protocol/protocol-kitchen-sink,category/" \
            --engine battlescribe \
            --expected-failures battlescribe \
            --output github-actions \
            --workers 2

  nr-and-ui:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WARHUB_BOT_APP_ID }}
          private-key: ${{ secrets.WARHUB_BOT_PRIVATE_KEY }}
          owner: WarHub
          repositories: newrecruit-har,battlescribe-archive

      - name: Setup dependencies
        run: pwsh ./setup.ps1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Setup Liberica JDK (with JavaFX)
        uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: '11'
          java-package: 'jdk+fx'

      - name: Build bs-ui-java-agent
        run: pwsh -File src/bs-ui-java-agent/build.ps1

      - name: Build
        run: dotnet build

      - name: Run frozen NR roster conformance tests
        run: dotnet test tests/BattleScribeSpec.Tests.csproj --filter "Engine=FrozenNrRoster&Mode!=Sequential" --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
        env:
          NR_HEADLESS: true
          NR_PARALLEL: 4

      - name: Run frozen NR Editor GameData tests
        run: dotnet test tests/BattleScribeSpec.Tests.csproj --filter "Engine=FrozenNrGameData" --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
        env:
          NR_HEADLESS: true

      - name: Run frozen NR Editor GameData UI tests
        run: dotnet test tests/BattleScribeSpec.Tests.csproj --filter "Engine=FrozenNrGameDataUi" --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
        env:
          NR_HEADLESS: true

      - name: Run frozen NR UI conformance tests
        run: dotnet test tests/BattleScribeSpec.Tests.csproj --filter "Engine=FrozenNrUiRoster" --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
        env:
          NR_HEADLESS: true

      - name: Run kitchen-sink via BS UI driver
        run: |
          xvfb-run -a dotnet run --project src/BattleScribeSpec.Debugger -- \
            --engine bs-ui protocol-kitchen-sink
        env:
          BS_UI_JAVA_PATH: ${{ env.JAVA_HOME }}/bin/java

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nr-and-ui-diagnostics
          path: |
            artifacts/bs-ui-diagnostics/
            artifacts/nr-ui-diagnostics/

  nr-conformance:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.head_commit.message, '[nr-test]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WARHUB_BOT_APP_ID }}
          private-key: ${{ secrets.WARHUB_BOT_PRIVATE_KEY }}
          owner: WarHub
          repositories: newrecruit-har,battlescribe-archive

      - name: Setup dependencies
        run: pwsh ./setup.ps1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Build
        run: dotnet build

      - name: Run NR smoke tests
        run: dotnet test tests/BattleScribeSpec.Tests.csproj --filter "Engine=LiveNrRoster&Category=Smoke" --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
        env:
          NR_ENGINE_URL: https://newrecruit.eu
          NR_HEADLESS: true

      - name: Run NR conformance tests
        run: dotnet test tests/BattleScribeSpec.Tests.csproj --filter "Engine=LiveNrRoster&Category=Conformance" --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
        env:
          NR_ENGINE_URL: https://newrecruit.eu
          NR_HEADLESS: true
          NR_PARALLEL: 2

      - name: Generate conformance report
        run: |
          dotnet artifacts/bin/BattleScribeSpec.Runner/debug/bs-spec-runner.dll \
            --adapter "dotnet:artifacts/bin/BattleScribeSpec.ReferenceAdapter/debug/bs-reference-adapter.dll" \
            --specs specs \
            --engine newrecruit \
            --assertion-engine battlescribe \
            --expected-failures battlescribe \
            --output github-actions \
            --report artifacts/nr-conformance-report.json

      - name: Upload conformance report
        uses: actions/upload-artifact@v7
        with:
          name: nr-conformance-report
          path: artifacts/nr-conformance-report.json

  ci-gate:
    if: always()
    needs: [build-and-test, nr-and-ui, nr-conformance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check job results
        id: gate
        shell: pwsh
        run: |
          $results = @{
            'build-and-test' = '${{ needs.build-and-test.result }}'
            'nr-and-ui' = '${{ needs.nr-and-ui.result }}'
            'nr-conformance' = '${{ needs.nr-conformance.result }}'
          }
          $failed = $results.GetEnumerator() | Where-Object { $_.Value -notin @('success', 'skipped') }
          if ($failed) {
            Write-Host "##[error]The following jobs did not succeed:"
            $failed | ForEach-Object { Write-Host "  - $($_.Key): $($_.Value)" }
            "failed=true" >> $env:GITHUB_OUTPUT
            exit 1
          }
          Write-Host "All required jobs passed or were skipped."
          $results.GetEnumerator() | ForEach-Object { Write-Host "  $($_.Key): $($_.Value)" }
          "failed=false" >> $env:GITHUB_OUTPUT

      - name: Check for existing open issue
        if: >-
          always()
          && github.event_name == 'schedule'
          && steps.gate.outputs.failed == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          gh label create scheduled-ci-failure --color D93F0B --description "Auto-created by scheduled CI on failure" --force --repo $env:GH_REPO
          $count = (gh issue list --label scheduled-ci-failure --state open --json number --repo $env:GH_REPO | ConvertFrom-Json).Count
          "count=$count" >> $env:GITHUB_OUTPUT

      - name: Find last non-bot committer
        if: >-
          always()
          && github.event_name == 'schedule'
          && steps.gate.outputs.failed == 'true'
          && steps.existing.outputs.count == '0'
        id: assignee
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $commits = gh api "repos/${{ github.repository }}/commits?per_page=20" | ConvertFrom-Json
          $username = $commits |
            Where-Object { $_.author -and $_.author.login -and $_.author.type -ne 'Bot' } |
            Select-Object -First 1 -ExpandProperty author |
            Select-Object -ExpandProperty login
          "username=$username" >> $env:GITHUB_OUTPUT
          Write-Host "Found assignee: $username"

      - name: Create issue
        if: >-
          always()
          && github.event_name == 'schedule'
          && steps.gate.outputs.failed == 'true'
          && steps.existing.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: pwsh
        run: |
          $failed = @()
          if ('${{ needs.build-and-test.result }}' -eq 'failure') { $failed += 'build-and-test' }
          if ('${{ needs.nr-and-ui.result }}' -eq 'failure') { $failed += 'nr-and-ui' }
          if ('${{ needs.nr-conformance.result }}' -eq 'failure') { $failed += 'nr-conformance' }
          $failedList = ($failed | ForEach-Object { "- $_" }) -join "`n"
          $body = @"
          ## Scheduled CI failure

          The weekly scheduled CI run had failures.

          **Failed jobs:**
          $failedList

          **Workflow run:** $env:RUN_URL

          ---
          _This issue was auto-created by the scheduled CI workflow.
          Close it once the failures are resolved._
          "@
          $body = ($body -split "`n" | ForEach-Object { $_.TrimStart() }) -join "`n"
          $title = "Scheduled CI failure — $(Get-Date -Format 'yyyy-MM-dd')"
          $assignee = '${{ steps.assignee.outputs.username }}'
          $ghArgs = @('issue', 'create', '--title', $title, '--body', $body, '--label', 'scheduled-ci-failure', '--repo', $env:GH_REPO)
          if ($assignee) { $ghArgs += '--assignee'; $ghArgs += $assignee }
          & gh @ghArgs
