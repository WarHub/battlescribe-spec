name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout battlescribe-spec
        uses: actions/checkout@v4

      - name: Checkout wham (sibling)
        run: git clone https://github.com/WarHub/wham.git ../wham

      - name: Checkout wh40k-9e (sibling)
        run: git clone --depth 1 --branch v9.8.0 https://github.com/BSData/wh40k-9e.git ../wh40k-9e

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --logger GitHubActions --filter "FullyQualifiedName!~NewRecruit&FullyQualifiedName!~FrozenNewRecruit&FullyQualifiedName!~HarRecording"
        env:
          WH40K_DATA_DIR: ${{ github.workspace }}/../wh40k-9e

      - name: End-to-end spec runner test
        run: |
          dotnet src/BattleScribeSpec.Runner/bin/Debug/net10.0/bs-spec-runner.dll \
            --adapter "dotnet:src/BattleScribeSpec.ReferenceAdapter/bin/Debug/net10.0/bs-reference-adapter.dll" \
            --specs specs \
            --output github-actions

  nr-frozen:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download frozen NR snapshot
        run: gh release download -R WarHub/newrecruit-har -D .testdata/newrecruit-har
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone wham
        run: git clone https://github.com/WarHub/wham.git ../wham

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Playwright browsers
        run: dotnet build src/BattleScribeSpec.NewRecruit && pwsh src/BattleScribeSpec.NewRecruit/bin/Debug/net10.0/playwright.ps1 install chromium

      - name: Build
        run: dotnet build

      - name: Run frozen NR conformance tests
        run: dotnet test tests/BattleScribeSpec.Tests.csproj --filter "FrozenNewRecruitConformanceTests" --no-build --logger GitHubActions
        env:
          NR_HEADLESS: true

  nr-conformance:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[nr-test]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Clone wham
        run: git clone https://github.com/WarHub/wham.git ../wham

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Playwright browsers
        run: dotnet build src/BattleScribeSpec.NewRecruit && pwsh src/BattleScribeSpec.NewRecruit/bin/Debug/net10.0/playwright.ps1 install chromium

      - name: Build
        run: dotnet build

      - name: Run NR smoke tests
        run: dotnet test tests/BattleScribeSpec.Tests.csproj --filter "NewRecruitSmokeTests" --logger GitHubActions
        env:
          NR_ENGINE_URL: https://newrecruit.eu
          NR_HEADLESS: true

      - name: Run NR conformance tests
        run: dotnet test tests/BattleScribeSpec.Tests.csproj --filter "NewRecruitConformanceTests" --logger GitHubActions
        env:
          NR_ENGINE_URL: https://newrecruit.eu
          NR_HEADLESS: true

      - name: Generate conformance report
        run: |
          dotnet src/BattleScribeSpec.Runner/bin/Debug/net10.0/bs-spec-runner.dll \
            --adapter "dotnet:src/BattleScribeSpec.ReferenceAdapter/bin/Debug/net10.0/bs-reference-adapter.dll" \
            --specs specs \
            --engine newrecruit \
            --output github-actions \
            --report artifacts/nr-conformance-report.json

      - name: Upload conformance report
        uses: actions/upload-artifact@v4
        with:
          name: nr-conformance-report
          path: artifacts/nr-conformance-report.json
