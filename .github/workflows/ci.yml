name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'
      timezone: Europe/Warsaw

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Decide whether this run owes the thorough suites and the live NR lane. ──
  # (env context is not available in job-level `if:`, so we expose boolean outputs.)
  #
  # THE DECISION IS scripts/thorough-inputs.mjs, AND WHAT FORCES IT IS scripts/ci-gate.json. Both are
  # unit-tested (node --test, in `checks`), and the same data file is read by ci-gate and by
  # CiWorkflowDriftTests — so the list of inputs, the jobs they turn on and the jobs ci-gate excuses
  # when skipped are one record, not three that drift. Each entry carries the reason it is there, and
  # the gate writes the reasons that fired to the job summary.
  #
  # The history that built the list: #301 (a testdata.json bump, v34.93 → v35.12) was green for three
  # weeks on the kitchen-sink lanes, merged, and broke the NR-UI roster driver and the store-direct NR
  # export; #503 (IKVM 8.15 → 8.16.1, Playwright 1.61 → 1.63) was headed for merge on kitchen-sink
  # alone. The gate is on the FILE, not the author: a maintainer hand-editing a pin has exactly the
  # exposure the bot has. CI-definition and profile edits joined the list because they can drop,
  # narrow or mis-wire a lane that only the thorough jobs exercise.
  #
  # TWO MORE RULES, both in the script with the reasoning beside them: a PR whose base is not the
  # default branch (a layer of a stack) owes thorough on its own, with no label; and the live lane is a
  # separate output, because ten stacked PRs must not drive a volunteer-run site ten times at once.
  # The `[nr-test]` commit-message trigger is gone: it only ever fired on pushes to main (a PR's event
  # has no head commit message), and a manual workflow_dispatch run asks for the same thing explicitly.
  gate:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      thorough: ${{ steps.decide.outputs.thorough }}
      live: ${{ steps.decide.outputs.live }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      # The PR-files API as it comes (every page, slurped into one array), not a `--jq` projection of
      # it: a renamed file carries its old path in `previous_filename`, and a file moved OUT of an input
      # path changes that input as surely as an edit does. The script reads both paths, is unit-tested
      # on that shape, and refuses anything else — so this step and the script cannot drift apart into
      # a list that silently drops renames.
      - id: inputs
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --slurp > pr-files.json
      # toJSON(...) and the refs go through env, never spliced into the command line: a label or a
      # branch name is user text, and env is the one place it cannot become shell.
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/thorough-inputs.mjs pr-files.json

  # ── CHECKS — every push. Offline/CPU: unit + protocol + lint + formatting +
  #    the in-process BattleScribe reference engine (kitchen-sink). No browsers. ──
  checks:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # Four 5-minute step bounds plus room for setup, build and formatting: the job must outlive its
    # steps' own timeouts, or a hang ends here and takes the uploads with it (CiWorkflowDriftTests).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      # Setup is one composite action (.github/actions/setup): the SDK from global.json, the bot token,
      # the caches, a JDK and setup.ps1. This job needs no browser, no NR snapshot and no BS UI agent —
      # only the BattleScribe app (the build IKVM-compiles it) and a plain JDK for the engine-jar patch.
      - name: Set up
        uses: ./.github/actions/setup
        with:
          app-client-id: ${{ vars.WARHUB_BOT_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.WARHUB_BOT_APP_PRIVATE_KEY }}
          setup-args: -SkipJavaAgent -SkipWh40k
          java: plain
          nr-caches: 'false'
          playwright: 'false'
          agent-jar: 'false'
      # THE ANALYZER GATE IS THIS BUILD, AND ONLY THIS ONE. Analyzers, code style
      # (EnforceCodeStyleInBuild) and XML doc generation run here; every other job in this file builds
      # with -p:FunctionalBuild=true (Directory.Build.props), which turns the three off and produces the
      # same binaries ~25s sooner. CiWorkflowDriftTests.Checks_BuildsWithAnalyzers fails if this step —
      # or an env: block it inherits — ever sets the switch, a property it controls, or another that
      # turns a gate off (TreatWarningsAsErrors, RunAnalyzersDuringBuild, AnalysisLevel, …), because
      # then no job in CI would be checking what TreatWarningsAsErrors exists to check.
      - name: Build
        id: build
        run: dotnet build
      # WHAT MACHINE IS THIS, ACTUALLY? Every constant in docs/concurrency-policy-measurements.md is
      # machine-relative (`ceil(cpuCount × k)`, `maxParallelThreads: "0.5x"`), the doc calls this the
      # "4-vCPU / 16 GiB CI runner" throughout — and nobody had ever checked. The first CI run of the
      # CLI test project reported a worker count that is only consistent with cpuCount = 2. Print it,
      # so the next person tuning against "the CI runner" is reading a measurement and not a memory.
      - name: Runner profile (the machine every constant here is relative to)
        run: |
          echo "nproc:    $(nproc)"
          echo "MemTotal: $(awk '/MemTotal/ {printf "%.1f GiB", $2/1048576}' /proc/meminfo)"
          echo ""
          echo "ConcurrencyPolicy reads Environment.ProcessorCount and GC.GetGCMemoryInfo()."
          echo "The 'Reference adapter' step below prints 'Workers: N' for a Local, k=1.0, unmeasured"
          echo "engine — i.e. N == min(ProcessorCount, UndeclaredMemoryWorkerCap=8). That is the number"
          echo "the policy actually saw."
      # Style rules are enforced during the build (EnforceCodeStyleInBuild); this only needs
      # to add the whitespace/formatting check, which is much faster than a full format run.
      - name: Verify formatting (whitespace)
        run: dotnet format whitespace BattleScribeSpec.slnx --no-restore --verify-no-changes --exclude .deps/
      # The shell expands the glob, so a new *.test.mjs joins this step without an edit here. The log
      # shows each file's suites (har-diff, thorough-inputs, ci-gate).
      - name: Run script tests
        run: node --test scripts/*.test.mjs
      # EVERY TEST STEP IN THIS FILE GOES THROUGH scripts/dotnet-test-step.ps1, WHICH FAILS THE STEP
      # WHEN IT EXECUTED NO TESTS (passed + failed == 0, read from the TRX counters — not scraped from
      # console text). Bare `dotnet test` is forbidden here, and
      # ConcurrencyConfigurationDriftTests.EveryCiTestStep_ExecutesAtLeastOneTest (a Lint test, run by
      # the very step below) keeps it that way — reintroduce one and the build goes red.
      #
      # The invariant is "this step RAN a test", not "the filter matched something", because both
      # frozen NR roster lanes failed in different ways and only one of them was empty:
      #   * `Engine=FrozenNrUiRoster&DisplayName~kitchen-sink` matched 0 tests — that class is a single
      #     [Fact] AllSpecs(), so no display name carries a spec id and the clause can never match.
      #   * `Engine=FrozenNrRoster&DisplayName~kitchen-sink` matched exactly 1 — the Mode=Sequential
      #     variant, gated behind NR_SEQUENTIAL, which self-skips. Total: 1, Passed: 0, exit 0.
      # Both were green on every PR. The second is the more insidious one and a non-empty-selection
      # check (RunConfiguration.TreatNoTestsAsError, which the script also passes) does not catch it.
      #
      # The guard is per invocation rather than a runsettings setting because a runsettings would also
      # bind `dotnet test -p:TestProfile=<x>` run against the SOLUTION — the form AGENTS.md documents —
      # where an engine filter legitimately matches nothing in BattleScribeSpec.Cli.Tests.
      #
      # AND EVERY STEP THAT RUNS tests/BattleScribeSpec.Tests.csproj RUNS A PROFILE, AND ONLY THAT:
      # `-TestProfile <name>`, no --filter, and no env: entry that changes what the lane runs. The lane
      # is defined once, in tests/TestProfiles/TestProfiles.cs — its filter and every switch it depends
      # on (NR_FROZEN_SMOKE, NR_UI_SMOKE, NR_UI_ROSTER_FULL used to be set here, so a profile of the same
      # name ran something else on a laptop) — and `dotnet test -p:TestProfile=<name>` runs exactly what
      # this file runs. CiProfileLaneTests holds that: a Tests-project step names one registry profile
      # and adds no filter (on VSTest a command-line filter REPLACES the profile's), and no lane-defining
      # or profile-owned switch appears anywhere under .github/.
      #
      # AND EVERY TEST STEP CARRIES THE SAME TWO KEYS — CiWorkflowDriftTests checks both, in every job:
      #   * `if: !cancelled() && steps.build.outcome == 'success'` — test steps are independent of each
      #     other (a red lint step must not hide whether the CLI tests pass), yet all of them skip when
      #     there is nothing built to test (IndependentTestSteps_RunOnASuccessfulBuild). The one
      #     exception is `nr-conformance`, sequential on purpose (see that job); there the lint requires
      #     the default instead. A separate lint checks every `steps.<id>` resolves: a renamed
      #     `id: build` would evaluate to null and skip every test step in a job that still reports
      #     success.
      #   * `timeout-minutes` of about 2.5x the step's duration in run 36772377382, and never under 5
      #     (runner variance on a 2-vCPU box). A hang becomes a failed step, so the `failure()` and
      #     `always()` uploads after it still run, instead of a job that burns its budget and names no
      #     step. The job's own bound must hold all its steps' bounds plus setup, or the job timeout
      #     fires first and the point is lost (EveryJob_OutlastsItsStepBounds).
      # Each test step is also exactly one invocation (optionally under `xvfb-run -a`), with no pipe,
      # `;`, `&&` or `||` that could swallow its exit code — the lint parses the run line for that.
      - name: Unit / protocol / lint (offline)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: pwsh scripts/dotnet-test-step.ps1 -TestProfile non-conformance tests/BattleScribeSpec.Tests.csproj --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
      # THE CLI'S OWN TESTS. There are two test projects in this repo and, until now, CI ran ONE of
      # them: every `dotnet test` step here targeted tests/BattleScribeSpec.Tests.csproj, and nothing
      # ran tests/BattleScribeSpec.Cli.Tests — not even a solution-wide sweep. So every gate on the
      # CLI's concurrency model (EngineSpecTests: the third-party load limit, the fail-safe for
      # undeclared adapters, the --policy rejection gates), plus RunBatchSurfaceTests and
      # CompareCommandTests, had never once been executed by CI. A gate nobody invokes is a gate
      # nobody has.
      #
      # It belongs in THIS job: these tests are offline and CPU-only. They drive the in-process
      # BattleScribe engine and the dotnet: reference adapter — both of which this job already builds
      # and runs in the two steps below — and they touch no browser and no network.
      - name: CLI (engine selection / load target / protocol surface)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: pwsh scripts/dotnet-test-step.ps1 tests/BattleScribeSpec.Cli.Tests/BattleScribeSpec.Cli.Tests.csproj --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
      - name: BattleScribe reference engine — kitchen-sink
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: pwsh scripts/dotnet-test-step.ps1 -TestProfile smoke-bs tests/BattleScribeSpec.Tests.csproj --no-build --logger "console;verbosity=minimal"
      # No --policy here, deliberately: this engine is a LAUNCHABLE (dotnet:) adapter, and a plan
      # cannot be conveyed to one — there is no channel for it, so the CLI errors rather than
      # silently dropping the flag (#305). This step used to pass `--workers 2`; the flag's
      # replacement (`--policy workers=2`) is exactly what a launchable adapter must refuse, so
      # the step was failing on every run of this job. The worker count is ConcurrencyPolicy's to
      # choose anyway — that is the whole point of the model.
      #
      # It picks min(cpuCount, UndeclaredMemoryWorkerCap=8) — see the "Runner profile" step for what
      # cpuCount actually is here; the previous version of this comment asserted 4 without checking.
      #
      # --engine-endpoint local IS LOAD-BEARING, AND IT IS A DECLARATION, NOT A TUNING FLAG. Without it
      # this connectable is an executable the harness has never seen: its endpoint is UNDECLARED, and an
      # undeclared endpoint fails safe to "a third party's live service" — so CI announced an in-process
      # IKVM adapter with no network code at all as "third-party live service — held to 2 concurrent
      # sessions", on every run, and throttled it. The flag states the fact (this adapter's service is
      # this machine) and the throttle lifts. It is stated HERE, by the people who chose the binary,
      # rather than inferred from the name: an adapter named `battlescribe` is not necessarily ours, and
      # letting a NAME grant a built-in's endpoint and measured profile is how `newrecruit=exec:./anything`
      # briefly got 12 workers and no load limit (EngineRegistry.Resolve).
      #
      # Note the throttle was INVISIBLE on this runner — a 2-vCPU box is already at the load limit on its
      # own — which is exactly how it survived: it cost CI nothing it could measure, and would have halved
      # any larger runner.
      - name: Reference adapter (dotnet) — roster kitchen-sink
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          dotnet artifacts/bin/BattleScribeSpec.Cli/debug/bs-spec.dll run --all \
            --engine "battlescribe=dotnet:artifacts/bin/BattleScribeSpec.ReferenceAdapter/debug/bs-reference-adapter.dll" \
            --engine-endpoint local \
            --specs specs/roster \
            --roster \
            --filter "protocol/protocol-kitchen-sink,category/" \
            --expected-failures battlescribe \
            --output github-actions
      # The trace summary (wall time, cold-starts vs reuses, peak live resources) for the steps
      # above is appended to $GITHUB_STEP_SUMMARY automatically by the CLI/dotnet-test telemetry
      # code itself (TraceSummary.AppendToGitHubStepSummary) — no extra script needed here.
      - name: Upload telemetry
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telemetry-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: artifacts/telemetry/
          if-no-files-found: ignore

  # ── DOCKER — every push. Builds the published-image Dockerfile. Build only, no push. ──
  #
  # THIS JOB EXISTS BECAUSE NOTHING BUILT THESE FILES AND THEY ROTTED IN SILENCE. As of 2026-08 both
  # Dockerfiles were unbuildable and had been for months: reference-adapter.Dockerfile copied
  # `src/BattleScribeSpec.Oracle/`, a project renamed away on 2026-04-23, and it went unnoticed for
  # four months; bs-spec.Dockerfile never copied the two Telemetry csprojs the CLI has
  # ProjectReferenced since 2026-07-13, and its runtime base lacked the ASP.NET Core shared framework
  # the Collector pulls in — so it failed at restore, and would then have failed at startup.
  #
  # None of that is catchable by a lint rule or a drift test, because a stale COPY list is only wrong
  # relative to a project graph that changes. The only thing that finds it is building the image.
  # It is a plain `docker build` with no push, no registry auth and no secrets: nothing here needs the
  # BattleScribe archive, because this image ships no engine.
  docker:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # submodules: recursive is load-bearing — the Dockerfile COPYs .deps/ for the vendored wham
      # projects XmlGen references, and an uninitialised submodule is an empty directory that fails
      # restore rather than the checkout.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build bs-spec image
        run: docker build -f docker/bs-spec.Dockerfile -t bs-spec:ci .
      # A built image that cannot start is the failure mode that motivated the aspnet base, and the
      # build stage cannot see it. `--help` exercises the real entrypoint and framework resolution.
      - name: The image starts and resolves its frameworks
        run: docker run --rm bs-spec:ci --help

  # ── SMOKE — every push. Kitchen-sink through every real engine, proving each
  #    engine/adapter/submodule/dependency wires up end-to-end. ──
  smoke:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # Six 5-minute step bounds plus room for setup and build (~3 min measured, more on cold caches).
    # Lower than this and a hang across the NR steps would hit the job timeout before the later steps'
    # own bounds, taking the diagnostics upload with it (CiWorkflowDriftTests.EveryJob_OutlastsItsStepBounds).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      # Every engine this job drives: both NR snapshots, the browsers, and the BS desktop app with its
      # Java agent (which needs the JavaFX JDK).
      - name: Set up
        uses: ./.github/actions/setup
        with:
          app-client-id: ${{ vars.WARHUB_BOT_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.WARHUB_BOT_APP_PRIVATE_KEY }}
          setup-args: -SkipWh40k
          java: jdk-fx
          nr-caches: 'true'
          playwright: 'true'
          agent-jar: 'true'
      # A functional build (Directory.Build.props): `checks` is the analyzer gate, so this job skips the
      # analyzers, code style and doc generation; the test binaries are identical.
      - name: Build
        id: build
        run: dotnet build -p:FunctionalBuild=true
      # Each smoke lane is a smoke-* profile (tests/TestProfiles/TestProfiles.cs), whose Purpose keeps
      # the history this block used to: a [Fact] AGGREGATE CANNOT BE NARROWED BY DisplayName.
      # `Engine=FrozenNrRoster&DisplayName~kitchen-sink` selected exactly ONE test — the Mode=Sequential
      # theory row, gated behind NR_SEQUENTIAL and so SKIPPED on every run (`Skipped! - Failed: 0,
      # Passed: 0, Skipped: 1`, exit 0, green) — and `Engine=FrozenNrUiRoster&DisplayName~kitchen-sink`
      # matched ZERO, right through the frozen NR UI suite breaking on a HAR client change. The aggregates
      # are narrowed from the engine side instead (NR_FROZEN_SMOKE, NR_UI_SMOKE, or the class itself),
      # and those switches are the profiles' now, not these steps' env: — the profile lint
      # (TestProfileRegistryTests.EverySelection_ClaimsTheLanesItsFilterReaches) fails a profile whose
      # filter cannot reach the lane it claims, before CI ever runs it. Headless is every fixture's
      # default, so no step sets NR_HEADLESS.
      - name: NR frozen roster — kitchen-sink
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: pwsh scripts/dotnet-test-step.ps1 -TestProfile smoke-nr-frozen tests/BattleScribeSpec.Tests.csproj --no-build --logger "console;verbosity=minimal"
      - name: NR UI roster — kitchen-sink
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: pwsh scripts/dotnet-test-step.ps1 -TestProfile smoke-nr-ui tests/BattleScribeSpec.Tests.csproj --no-build --logger "console;verbosity=minimal"
      - name: NR Editor GameData — kitchen-sink
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: pwsh scripts/dotnet-test-step.ps1 -TestProfile smoke-nr-editor tests/BattleScribeSpec.Tests.csproj --no-build --logger "console;verbosity=minimal"
      # NR_GAMEDATA_UI_DIAGNOSTICS: this driver writes its screenshot, DOM and editor state only when
      # it is set — without it the upload below collects nothing for this lane. It costs nothing on a
      # passing run: the capture runs in the driver's catch block. It stays a CI setting rather than the
      # profile's: it changes what is recorded, not what runs, and locally it would write a capture for
      # every expected failure too (CiProfileLaneTests.EveryUiLane_UploadsTheDiagnosticsItWrites).
      - name: NR Editor GameData UI — kitchen-sink
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: pwsh scripts/dotnet-test-step.ps1 -TestProfile smoke-nr-editor-ui tests/BattleScribeSpec.Tests.csproj --no-build --logger "console;verbosity=minimal"
        env:
          NR_GAMEDATA_UI_DIAGNOSTICS: 1
      # Warm start (the JVM survives between specs) is ConcurrencyPolicy's decision now, taken from
      # the engine's declared ColdStartCost/ReuseSafeGameData — not the BS_UI_KEEP_ALIVE env var this
      # step used to set. The variable is read nowhere; setting it here would be decoration.
      - name: BS GameData UI — kitchen-sink (engine + Java agent + app)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: xvfb-run -a pwsh scripts/dotnet-test-step.ps1 -TestProfile smoke-bs-gamedata-ui tests/BattleScribeSpec.Tests.csproj --no-build --logger "console;verbosity=minimal"
      - name: BS UI roster driver — kitchen-sink
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        # --no-build: reuse the binaries from the Build step above. Without it, `dotnet run`
        # rebuilds with default props (analyzers on), re-doing the whole solution.
        run: xvfb-run -a dotnet run --project src/BattleScribeSpec.Cli --no-build -- run --engine battlescribe --ui protocol-kitchen-sink
        env:
          # One spec, so a line per driven control is affordable — and it is the only way this lane
          # can say WHICH control shapes it covers. A passing spec proves an entry was reached, not
          # what was clicked to reach it, and that gap is how the driver's checkbox branch survived
          # without anyone knowing whether BattleScribe renders one at all.
          BS_UI_PANEL_TRACE: 1
      # This job drives all four UI drivers over kitchen-sink on every push, and it was the one job
      # that uploaded nothing: a smoke failure left the exception text and no screenshot, DOM, store
      # dump or trace — and a smoke failure is the one every PR author meets first.
      # CiProfileLaneTests.EveryUiLane_UploadsTheDiagnosticsItWrites derives what each job must upload
      # from the lanes its steps' profiles run and the directory each lane's driver writes
      # (tests/TestProfiles/EngineLanes.cs, DiagnosticsDir), plus the bs-spec --ui step below.
      # Three drivers write here today (the NR Editor GameData UI one only with the switch set above).
      # The BS GameData UI driver writes nothing yet — its capture has no caller, as in thorough-ui-bs
      # — so its path is here for the day it does.
      - name: Upload UI diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-ui-diagnostics
          path: |
            artifacts/nr-ui-diagnostics*/
            artifacts/nr-gamedata-ui-diagnostics*/
            artifacts/bs-ui-diagnostics*/
            artifacts/bs-gamedata-ui-diagnostics*/
          # A step can fail before any driver reaches its capture path (a fixture or a timeout), so an
          # empty upload is a fact about the failure, not a broken step.
          if-no-files-found: ignore
      - name: Upload telemetry
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telemetry-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: artifacts/telemetry/
          if-no-files-found: ignore

  # ── THOROUGH conformance (opt-in): the full offline + frozen-NR suites that the
  #    every-push lanes trim to kitchen-sink — all of them except the NR UI roster lane, which is
  #    thorough-nr-ui-roster's below. ──
  thorough-conformance:
    needs: [gate]
    if: needs.gate.outputs.thorough == 'true'
    runs-on: ubuntu-latest
    # Four lanes, ~6 minutes of tests (run 36772377382: core 154s, frozen NR roster 35s, NR Editor
    # GameData 113s, its UI 57s) plus setup and build. Bounded explicitly rather than left on GitHub's
    # 360-minute default: three of the four lanes drive a browser against a replayed snapshot, and a
    # hung SPA is a realistic failure mode that would otherwise burn six hours of runner time before
    # anyone saw it. The margin to 45 is for a slower runner and for a snapshot that costs more than
    # the last one, not for a hang — and it must hold the steps' own bounds plus setup
    # (CiWorkflowDriftTests.EveryJob_OutlastsItsStepBounds).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up
        uses: ./.github/actions/setup
        with:
          app-client-id: ${{ vars.WARHUB_BOT_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.WARHUB_BOT_APP_PRIVATE_KEY }}
          setup-args: -SkipJavaAgent -SkipWh40k
          java: plain
          nr-caches: 'true'
          playwright: 'true'
          agent-jar: 'false'
      - name: Build
        id: build
        run: dotnet build -p:FunctionalBuild=true
      # EVERY LANE HERE RUNS REGARDLESS OF THE LANES BEFORE IT — `!cancelled()` plus a successful
      # build, the condition every test step outside nr-conformance carries (see the `checks` job). It
      # was the default `success()` here, which made each lane hostage to every lane above it. This
      # job's own history is one flaky NR-UI spec per run, each time a different one, and PR #338 (the v35.27 HAR
      # bump) was reported red having never run two of the four lanes it exists to verify — the NR
      # Editor lanes replay a DIFFERENT snapshot than the HAR above them, so a red NR-UI roster lane says
      # nothing about them, and learning their verdict cost another hour of runner time. Those two lanes
      # were then special-cased with `!cancelled()`; now no lane waits on another's verdict.
      - name: Full offline suite (core)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 7
        run: pwsh scripts/dotnet-test-step.ps1 -TestProfile core tests/BattleScribeSpec.Tests.csproj --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
      - name: Full frozen NR roster
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: pwsh scripts/dotnet-test-step.ps1 -TestProfile nr-frozen tests/BattleScribeSpec.Tests.csproj --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
      - name: Full frozen NR Editor GameData
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: pwsh scripts/dotnet-test-step.ps1 -TestProfile nr-editor-frozen tests/BattleScribeSpec.Tests.csproj --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
      # NR_GAMEDATA_UI_DIAGNOSTICS: without it this driver writes no diagnostics, and the upload below
      # had been collecting nothing for this lane (same switch, and same reason it is CI's, as smoke's step).
      - name: Full frozen NR Editor GameData UI (parallelized)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: pwsh scripts/dotnet-test-step.ps1 -TestProfile nr-editor-ui-frozen tests/BattleScribeSpec.Tests.csproj --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
        env:
          NR_GAMEDATA_UI_DIAGNOSTICS: 1
      # The NR UI drivers write a screenshot, DOM snapshot, Pinia dump and console log for every
      # failed action — and the thorough lanes, the only ones that run them over the full spec set,
      # were throwing all of it away. A `Timeout 20000ms exceeded.` in the log was the whole record
      # of the failure. This job runs the NR Editor GameData UI driver; the NR UI roster driver's
      # directory is uploaded by thorough-nr-ui-roster. `*` matches the per-worker suffixes.
      - name: Upload NR Editor GameData UI diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: thorough-conformance-nr-gamedata-ui-diagnostics
          path: |
            artifacts/nr-gamedata-ui-diagnostics*/
          # A lane can fail without any driver reaching its capture path (a lint or fixture failure),
          # so an empty upload here is a fact about the failure, not a broken step.
          if-no-files-found: ignore
      - name: Upload telemetry
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telemetry-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: artifacts/telemetry/
          if-no-files-found: ignore

  # ── THOROUGH: the full frozen NR UI roster lane (opt-in), in a job of its own. ──
  #
  #    It is the longest lane in CI, over three times the next (the BS roster UI half, 489s): ~27
  #    minutes (1606s in run 36772377382) of one browser driving every applicable spec in sequence
  #    against the replayed HAR. It used to be one step of thorough-conformance, which made that job
  #    the critical path of every thorough run (36 minutes) and held the other four lanes' verdicts
  #    until it finished. Split out, it runs beside them: the critical path drops to this job (setup,
  #    a functional build and the lane, ~31 minutes), and a red NR UI roster lane is a red job of its
  #    own name rather than one step of a job that also holds four lanes that passed.
  #
  #    NOT SHARDED. The lane reuses one warm browser session across specs, so what one spec leaves
  #    behind is what the next starts from — splitting it splits the chain it exists to exercise
  #    (docs/warm-reuse.md). The same reasoning keeps thorough-ui-bs whole.
  thorough-nr-ui-roster:
    needs: [gate]
    if: needs.gate.outputs.thorough == 'true'
    runs-on: ubuntu-latest
    # The step's own 60 plus room for setup and build (~3 minutes measured, more on cold caches):
    # the job must outlive its step's bound, or a hang ends here and takes the diagnostics with it.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      # The HAR, the browsers, and a plain JDK for the engine-jar patch. The NR Editor snapshot is not
      # this lane's, but setup.ps1 fetches every pinned archive, so its cache is restored too rather
      # than re-downloaded on every run.
      - name: Set up
        uses: ./.github/actions/setup
        with:
          app-client-id: ${{ vars.WARHUB_BOT_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.WARHUB_BOT_APP_PRIVATE_KEY }}
          setup-args: -SkipJavaAgent -SkipWh40k
          java: plain
          nr-caches: 'true'
          playwright: 'true'
          agent-jar: 'false'
      - name: Build
        id: build
        run: dotnet build -p:FunctionalBuild=true
      # The nr-ui-frozen profile is the FULL lane: it sets NR_UI_ROSTER_FULL, without which the class
      # runs kitchen-sink only — which is what it did for its whole life, and is why docs/warm-reuse.md
      # records "CI never caught the original bug because the NR-UI roster lane runs a single spec". The
      # switch used to be this step's env:, so `-p:TestProfile=nr-ui-frozen` ran one spec everywhere
      # but here; it is the profile's now, and the same command runs this lane on a laptop.
      # CiProfileLaneTests.ThoroughNrUiRosterStep_RunsTheFullSpecSet fails if this step stops running a
      # profile that sets it, because a lane silently shrinking from ~378 specs to 1 still exits 0. This
      # step is the long one: ~27 minutes (1606s in run 36772377382), so its own ceiling is 60 rather
      # than 2.5x — enough for a snapshot that costs more than the last, and a hang ends here with the
      # diagnostics upload still to run, not at the job's 75.
      - name: Full frozen NR UI roster
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 60
        run: pwsh scripts/dotnet-test-step.ps1 -TestProfile nr-ui-frozen tests/BattleScribeSpec.Tests.csproj --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
      # The NR UI roster driver writes a screenshot, DOM snapshot, Pinia dump and console log for every
      # failed action; without this upload the log's `Timeout 20000ms exceeded.` is the whole record.
      # `nr-ui-diagnostics*` matches the per-worker suffixes the driver appends.
      - name: Upload NR UI diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: thorough-nr-ui-roster-diagnostics
          path: |
            artifacts/nr-ui-diagnostics*/
          # The lane can fail before the driver reaches its capture path (a fixture or HAR failure),
          # so an empty upload here is a fact about the failure, not a broken step.
          if-no-files-found: ignore
      - name: Upload telemetry
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telemetry-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: artifacts/telemetry/
          if-no-files-found: ignore

  # ── THOROUGH: the BS desktop UI, BOTH halves of it (opt-in). Warm start, one job per half. ──
  #
  #    The `suite` axis exists because this job used to run one half. `BsGameDataUiConformanceTests`
  #    covered the Data Editor; `BsRosterUiConformanceTests` covered the Roster Editor and ran
  #    nowhere — so every change to BsUiRosterEngine and RosterActions.java reached main having been
  #    exercised by unit tests and one teardown test (#355).
  #
  #    A matrix axis and not a second job: the two halves need identical artifacts, JDK, agent build
  #    and xvfb, and a copy of fifty lines of setup is a copy that drifts. Only the profile and the
  #    artifact names differ. The CI lints read each leg with its own matrix values, so both legs'
  #    profiles, display and upload are checked (CiProfileLaneTests).
  #
  #    UNSHARDED, deliberately. Each half reuses one warm app across its specs, so what a spec leaves
  #    behind is what the next one starts from — and splitting the lane splits exactly the chain the
  #    lane exists to exercise. Both defects found in it so far lived in that chain and neither could
  #    reach a split lane: a roster built on the PREVIOUS spec's game system (the two specs landed in
  #    different shards — docs/bs-ui-roster-coverage.md, "The shards hid it, by luck") and a modal
  #    prompt left standing into the next spec's setup. Sharding also cost a `Shard` trait on every
  #    row, and a test that carried none ran in neither job while looking covered.
  #
  #    It is bought with wall-clock nobody waits on: ~13m for the roster half against a
  #    thorough-nr-ui-roster projected at ~31m in the same run (its lane's 1606s in run 36772377382,
  #    plus setup and a functional build).
  thorough-ui-bs:
    needs: [gate]
    if: needs.gate.outputs.thorough == 'true'
    runs-on: ubuntu-latest
    # A ceiling, not a target: the roster lane measures ~13m and the gamedata lane less, so anything
    # approaching this is a hang. Without it both inherit GitHub's 6-hour default, and a wedged
    # JavaFX app is the failure this suite has most often had.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: gamedata, profile: bs-ui-gamedata, diagnostics: artifacts/bs-gamedata-ui-diagnostics/ }
          - { name: roster, profile: bs-ui-roster, diagnostics: artifacts/bs-ui-diagnostics/ }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up
        uses: ./.github/actions/setup
        with:
          app-client-id: ${{ vars.WARHUB_BOT_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.WARHUB_BOT_APP_PRIVATE_KEY }}
          setup-args: -SkipWh40k
          java: jdk-fx
          nr-caches: 'false'
          playwright: 'false'
          agent-jar: 'true'
      - name: Build
        id: build
        run: dotnet build -p:FunctionalBuild=true
      # "warm start" is ConcurrencyPolicy.For(machine, battlescribe-ui).ReuseGameData — the fixture
      # asks the policy. It used to be BS_UI_KEEP_ALIVE, set here and nowhere else, so this suite ran
      # warm in CI and cold on every developer's machine. Both now run warm, from one decision.
      # 21 = 2.5x the roster half (489s in run 36772377382), the slower of the two legs.
      - name: BS ${{ matrix.suite.name }} UI (warm start)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 21
        run: xvfb-run -a pwsh scripts/dotnet-test-step.ps1 -TestProfile ${{ matrix.suite.profile }} tests/BattleScribeSpec.Tests.csproj --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: thorough-ui-bs-diagnostics-${{ matrix.suite.name }}
          path: |
            ${{ matrix.suite.diagnostics }}
          # The gamedata half writes none today — BsGameDataUiDiagnostics has no caller — so an empty
          # upload there is a fact about that driver, not a broken step.
          if-no-files-found: ignore
      - name: Upload telemetry
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telemetry-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: artifacts/telemetry/
          if-no-files-found: ignore

  # ── LIVE NR conformance (opt-in). ──
  #
  # Gated on `live`, not `thorough` (scripts/thorough-inputs.mjs has the reasoning): every stack PR
  # owes the thorough suites, but ten of them must not drive newrecruit.eu at once on every restack.
  # The steps stay sequential — default `success()` — so a site that is down is not hammered by the
  # lanes after the one that found out; CiWorkflowDriftTests.IndependentTestSteps_RunOnASuccessfulBuild
  # holds this job to that, the inverse of every other job's rule. Live durations are the site's, not
  # ours, hence the margin.
  nr-conformance:
    needs: [gate]
    if: needs.gate.outputs.live == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Set up
        uses: ./.github/actions/setup
        with:
          app-client-id: ${{ vars.WARHUB_BOT_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.WARHUB_BOT_APP_PRIVATE_KEY }}
          setup-args: -SkipJavaAgent -SkipWh40k
          java: plain
          nr-caches: 'false'
          playwright: 'true'
          agent-jar: 'false'
      - name: Build
        id: build
        run: dotnet build -p:FunctionalBuild=true
      - name: Run NR smoke tests
        timeout-minutes: 5
        run: pwsh scripts/dotnet-test-step.ps1 -TestProfile nr-live-smoke tests/BattleScribeSpec.Tests.csproj --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
      - name: Run NR conformance tests
        timeout-minutes: 12
        run: pwsh scripts/dotnet-test-step.ps1 -TestProfile nr-live-conformance tests/BattleScribeSpec.Tests.csproj --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
      # --engine-endpoint local: same declaration as the `checks` job's reference-adapter step — this
      # adapter's service is this machine. Without it the endpoint is undeclared and the fail-safe holds
      # the run to the third-party live load limit. See that step for why it is declared and not inferred.
      - name: Generate BattleScribe conformance report
        timeout-minutes: 5
        run: |
          dotnet artifacts/bin/BattleScribeSpec.Cli/debug/bs-spec.dll run --all \
            --engine "battlescribe=dotnet:artifacts/bin/BattleScribeSpec.ReferenceAdapter/debug/bs-reference-adapter.dll" \
            --engine-endpoint local \
            --specs specs/roster \
            --roster \
            --expected-failures battlescribe \
            --output github-actions \
            --report artifacts/battlescribe-conformance-report.json
      - name: Upload BattleScribe conformance report
        uses: actions/upload-artifact@v7
        with:
          name: battlescribe-conformance-report
          path: artifacts/battlescribe-conformance-report.json
      # `if: always()` — this is the ONE lane that drives a third party's live site, so it is the one
      # lane whose diagnostics matter most on a FAILING run, and it was the only lane in this workflow
      # without this step. When it crashed (#318) the traces died with the runner: no pool size, no
      # span timings, nothing to distinguish a resource exhaustion from a network blip. Telemetry is
      # cheap; a crash you cannot read twice is not.
      - name: Upload telemetry
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telemetry-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: artifacts/telemetry/
          if-no-files-found: ignore

  # ── The one required check. scripts/ci-gate.mjs reads every job in `needs` (toJSON, through env)
  #    and scripts/ci-gate.json's job lists. Every job must succeed; a thorough job may skip only when
  #    the gate said thorough=false, a live job only when it said live=false, and the gate's outputs
  #    must be exactly "true" or "false" — "true" on a scheduled or manual run. A draft is RED ("draft:
  #    nothing ran"): every job skips on a draft, and a required check whose inputs all skipped used
  #    to read as a pass. CiWorkflowDriftTests.CiGate_NeedsEveryOtherJob keeps `needs` complete. ──
  ci-gate:
    if: always()
    needs: [gate, checks, docker, smoke, thorough-conformance, thorough-nr-ui-roster, thorough-ui-bs, nr-conformance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - name: Check job results
        id: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: node scripts/ci-gate.mjs

      - name: Check for existing open issue
        if: >-
          always()
          && github.event_name == 'schedule'
          && steps.gate.outputs.failed == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          gh label create scheduled-ci-failure --color D93F0B --description "Auto-created by scheduled CI on failure" --force --repo $env:GH_REPO
          $count = (gh issue list --label scheduled-ci-failure --state open --json number --repo $env:GH_REPO | ConvertFrom-Json).Count
          "count=$count" >> $env:GITHUB_OUTPUT

      - name: Find last non-bot committer
        if: >-
          always()
          && github.event_name == 'schedule'
          && steps.gate.outputs.failed == 'true'
          && steps.existing.outputs.count == '0'
        id: assignee
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $commits = gh api "repos/${{ github.repository }}/commits?per_page=20" | ConvertFrom-Json
          $username = $commits |
            Where-Object { $_.author -and $_.author.login -and $_.author.type -ne 'Bot' } |
            Select-Object -First 1 -ExpandProperty author |
            Select-Object -ExpandProperty login
          "username=$username" >> $env:GITHUB_OUTPUT
          Write-Host "Found assignee: $username"

      # The failed-job list comes from the same verdict that failed the run. It used to be a second,
      # hand-kept list of `if` lines, which had dropped `docker`.
      - name: Create issue
        if: >-
          always()
          && github.event_name == 'schedule'
          && steps.gate.outputs.failed == 'true'
          && steps.existing.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED_JOBS: ${{ steps.gate.outputs.failed-jobs }}
        shell: pwsh
        run: |
          $failed = if ($env:FAILED_JOBS) { @($env:FAILED_JOBS | ConvertFrom-Json) } else { @() }
          if ($failed.Count -eq 0) { $failed = @('(ci-gate failed without naming a job; see the run)') }
          $failedList = ($failed | ForEach-Object { "- $_" }) -join "`n"
          $body = @"
          ## Scheduled CI failure

          The weekly scheduled CI run had failures.

          **Failed jobs:**
          $failedList

          **Workflow run:** $env:RUN_URL

          ---
          _This issue was auto-created by the scheduled CI workflow.
          Close it once the failures are resolved._
          "@
          $body = ($body -split "`n" | ForEach-Object { $_.TrimStart() }) -join "`n"
          $title = "Scheduled CI failure — $(Get-Date -Format 'yyyy-MM-dd')"
          $assignee = '${{ steps.assignee.outputs.username }}'
          $ghArgs = @('issue', 'create', '--title', $title, '--body', $body, '--label', 'scheduled-ci-failure', '--repo', $env:GH_REPO)
          if ($assignee) { $ghArgs += '--assignee'; $ghArgs += $assignee }
          & gh @ghArgs
