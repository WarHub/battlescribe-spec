name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'
      timezone: Europe/Warsaw

jobs:
  build-and-test:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout battlescribe-spec
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WARHUB_BOT_APP_ID }}
          private-key: ${{ secrets.WARHUB_BOT_PRIVATE_KEY }}
          owner: WarHub
          repositories: newrecruit-har

      - name: Setup dependencies
        run: pwsh ./setup.ps1 -SkipPlaywright
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Verify formatting
        run: dotnet format BattleScribeSpec.slnx --no-restore --verify-no-changes --exclude .deps/

      - name: Test
        run: dotnet test --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false" --filter "Engine!=FrozenNrRoster&Engine!=FrozenNrGameData&Engine!=LiveNrRoster&Engine!=LiveNrGameData"

      - name: End-to-end spec runner test
        run: |
          dotnet artifacts/bin/BattleScribeSpec.Runner/debug/bs-spec-runner.dll \
            --adapter "dotnet:artifacts/bin/BattleScribeSpec.ReferenceAdapter/debug/bs-reference-adapter.dll" \
            --specs specs \
            --filter "protocol/protocol-kitchen-sink,category/" \
            --engine battlescribe \
            --expected-failures battlescribe \
            --output github-actions \
            --workers 2

  script-tests:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Run har-diff tests
        run: node --test scripts/har-diff.test.mjs

  nr-frozen:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WARHUB_BOT_APP_ID }}
          private-key: ${{ secrets.WARHUB_BOT_PRIVATE_KEY }}
          owner: WarHub
          repositories: newrecruit-har

      - name: Setup dependencies
        run: pwsh ./setup.ps1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Build
        run: dotnet build

      - name: Run frozen NR roster conformance tests
        run: dotnet test tests/BattleScribeSpec.Tests.csproj --filter "Engine=FrozenNrRoster&Mode!=Sequential" --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
        env:
          NR_HEADLESS: true
          NR_PARALLEL: 4

      - name: Run frozen NR Editor GameData tests
        run: dotnet test tests/BattleScribeSpec.Tests.csproj --filter "Engine=FrozenNrGameData" --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
        env:
          NR_HEADLESS: true

  bs-ui:
    if: >-
      github.event.pull_request.draft != true
      && (
        github.event_name == 'pull_request'
        || github.event_name == 'workflow_dispatch'
        || github.event_name == 'schedule'
        || contains(github.event.head_commit.message, '[bs-ui-test]')
      )
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WARHUB_BOT_APP_ID }}
          private-key: ${{ secrets.WARHUB_BOT_PRIVATE_KEY }}
          owner: WarHub
          repositories: battlescribe-archive

      - name: Download BattleScribe app
        run: |
          pwsh -Command '
            $config = Get-Content testdata.json -Raw | ConvertFrom-Json
            $entry = $config."battlescribe-app"
            $destDir = ".testdata/battlescribe-app"
            if (Test-Path $destDir) { Remove-Item $destDir -Recurse -Force }
            New-Item -ItemType Directory -Path $destDir -Force | Out-Null
            gh release download $($entry.tag) -R $($entry.repo) -D $destDir --pattern $($entry.pattern)
            $zip = Get-ChildItem $destDir -Filter "*.zip" | Select-Object -First 1
            unzip -q $zip.FullName -d $destDir
            Remove-Item $zip.FullName -Force
          '
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Setup Liberica JDK (with JavaFX)
        uses: actions/setup-java@v4
        with:
          distribution: 'liberica'
          java-version: '11'
          java-package: 'jdk+fx'

      - name: Build bs-ui-java-agent
        run: pwsh -File src/bs-ui-java-agent/build.ps1

      - name: Build
        run: dotnet build

      - name: Run kitchen-sink via BS UI driver
        run: |
          xvfb-run -a dotnet run --project src/BattleScribeSpec.Debugger -- \
            --engine bs-ui protocol-kitchen-sink
        env:
          BS_UI_JAVA_PATH: ${{ env.JAVA_HOME }}/bin/java

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bs-ui-diagnostics
          path: artifacts/bs-ui-diagnostics/

  nr-conformance:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.head_commit.message, '[nr-test]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WARHUB_BOT_APP_ID }}
          private-key: ${{ secrets.WARHUB_BOT_PRIVATE_KEY }}
          owner: WarHub
          repositories: newrecruit-har

      - name: Setup dependencies
        run: pwsh ./setup.ps1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Build
        run: dotnet build

      - name: Run NR smoke tests
        run: dotnet test tests/BattleScribeSpec.Tests.csproj --filter "Engine=LiveNrRoster&Category=Smoke" --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
        env:
          NR_ENGINE_URL: https://newrecruit.eu
          NR_HEADLESS: true

      - name: Run NR conformance tests
        run: dotnet test tests/BattleScribeSpec.Tests.csproj --filter "Engine=LiveNrRoster&Category=Conformance" --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
        env:
          NR_ENGINE_URL: https://newrecruit.eu
          NR_HEADLESS: true
          NR_PARALLEL: 2

      - name: Generate conformance report
        run: |
          dotnet artifacts/bin/BattleScribeSpec.Runner/debug/bs-spec-runner.dll \
            --adapter "dotnet:artifacts/bin/BattleScribeSpec.ReferenceAdapter/debug/bs-reference-adapter.dll" \
            --specs specs \
            --engine newrecruit \
            --assertion-engine battlescribe \
            --expected-failures battlescribe \
            --output github-actions \
            --report artifacts/nr-conformance-report.json

      - name: Upload conformance report
        uses: actions/upload-artifact@v7
        with:
          name: nr-conformance-report
          path: artifacts/nr-conformance-report.json

  notify-failure:
    if: >-
      always()
      && github.event_name == 'schedule'
      && (
        needs.build-and-test.result == 'failure'
        || needs.script-tests.result == 'failure'
        || needs.nr-frozen.result == 'failure'
        || needs.bs-ui.result == 'failure'
        || needs.nr-conformance.result == 'failure'
      )
    needs: [build-and-test, script-tests, nr-frozen, bs-ui, nr-conformance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check for existing open issue
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh label create scheduled-ci-failure --color D93F0B --description "Auto-created by scheduled CI on failure" --force
          $count = (gh issue list --label scheduled-ci-failure --state open --json number | ConvertFrom-Json).Count
          "count=$count" >> $env:GITHUB_OUTPUT

      - name: Find last non-bot committer
        if: steps.existing.outputs.count == '0'
        id: assignee
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $commits = gh api "repos/${{ github.repository }}/commits?per_page=20" | ConvertFrom-Json
          $username = $commits |
            Where-Object { $_.author -and $_.author.login -and $_.author.type -ne 'Bot' } |
            Select-Object -First 1 -ExpandProperty author |
            Select-Object -ExpandProperty login
          "username=$username" >> $env:GITHUB_OUTPUT
          Write-Host "Found assignee: $username"

      - name: Create issue
        if: steps.existing.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: pwsh
        run: |
          $failed = @()
          if ('${{ needs.build-and-test.result }}' -eq 'failure') { $failed += 'build-and-test' }
          if ('${{ needs.script-tests.result }}' -eq 'failure') { $failed += 'script-tests' }
          if ('${{ needs.nr-frozen.result }}' -eq 'failure') { $failed += 'nr-frozen' }
          if ('${{ needs.bs-ui.result }}' -eq 'failure') { $failed += 'bs-ui' }
          if ('${{ needs.nr-conformance.result }}' -eq 'failure') { $failed += 'nr-conformance' }
          $failedList = ($failed | ForEach-Object { "- $_" }) -join "`n"
          $body = @"
          ## Scheduled CI failure

          The weekly scheduled CI run had failures.

          **Failed jobs:**
          $failedList

          **Workflow run:** $env:RUN_URL

          ---
          _This issue was auto-created by the scheduled CI workflow.
          Close it once the failures are resolved._
          "@
          $body = ($body -split "`n" | ForEach-Object { $_.TrimStart() }) -join "`n"
          $title = "Scheduled CI failure — $(Get-Date -Format 'yyyy-MM-dd')"
          $assignee = '${{ steps.assignee.outputs.username }}'
          $ghArgs = @('issue', 'create', '--title', $title, '--body', $body, '--label', 'scheduled-ci-failure')
          if ($assignee) { $ghArgs += '--assignee'; $ghArgs += $assignee }
          & gh @ghArgs
