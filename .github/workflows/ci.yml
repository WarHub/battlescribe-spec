name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'
      timezone: Europe/Warsaw

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Decide whether the opt-in "thorough" suites run this time. ──
  # (env context is not available in job-level `if:`, so we expose a boolean output.)
  gate:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    outputs:
      thorough: ${{ steps.decide.outputs.thorough }}
    steps:
      - id: decide
        shell: pwsh
        run: |
          $thorough = (
            ('${{ github.event_name }}' -in @('workflow_dispatch', 'schedule')) -or
            ('${{ contains(github.event.head_commit.message, '[nr-test]') }}' -eq 'true') -or
            ('${{ contains(github.event.pull_request.labels.*.name, 'thorough-ci') }}' -eq 'true')
          )
          "thorough=$($thorough.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "thorough = $thorough"

  # ── CHECKS — every push. Offline/CPU: unit + protocol + lint + formatting +
  #    the in-process BattleScribe reference engine (kitchen-sink). No browsers. ──
  checks:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WARHUB_BOT_APP_ID }}
          private-key: ${{ secrets.WARHUB_BOT_PRIVATE_KEY }}
          owner: WarHub
          repositories: newrecruit-har,battlescribe-archive
      # The BattleScribe project IKVM-compiles lib/battlescribe/lib/*.jar at build time.
      - uses: actions/cache@v6
        with:
          path: lib/battlescribe
          key: bsapp-${{ hashFiles('testdata.json') }}
      - name: Setup dependencies
        run: pwsh ./setup.ps1 -SkipPlaywright -SkipJavaAgent -SkipWh40k
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Build
        run: dotnet build
      # Style rules are enforced during the build (EnforceCodeStyleInBuild); this only needs
      # to add the whitespace/formatting check, which is much faster than a full format run.
      - name: Verify formatting (whitespace)
        run: dotnet format whitespace BattleScribeSpec.slnx --no-restore --verify-no-changes --exclude .deps/
      - name: Run script tests
        run: node --test scripts/har-diff.test.mjs
      - name: Unit / protocol / lint (offline)
        run: dotnet test tests/BattleScribeSpec.Tests.csproj --no-build --filter "Category!=Conformance" --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
      - name: BattleScribe reference engine — kitchen-sink
        run: dotnet test tests/BattleScribeSpec.Tests.csproj --no-build --filter "(Engine=BsRoster|Engine=BsGameData)&DisplayName~kitchen-sink" --logger "console;verbosity=minimal"
      - name: Reference adapter (dotnet) — roster kitchen-sink
        run: |
          dotnet artifacts/bin/BattleScribeSpec.Cli/debug/bs-spec.dll run --all \
            --engine "battlescribe=dotnet:artifacts/bin/BattleScribeSpec.ReferenceAdapter/debug/bs-reference-adapter.dll" \
            --specs specs/roster \
            --roster \
            --filter "protocol/protocol-kitchen-sink,category/" \
            --expected-failures battlescribe \
            --output github-actions \
            --workers 2
      # The trace summary (wall time, cold-starts vs reuses, peak live resources) for the steps
      # above is appended to $GITHUB_STEP_SUMMARY automatically by the CLI/dotnet-test telemetry
      # code itself (TraceSummary.AppendToGitHubStepSummary) — no extra script needed here.
      - name: Upload telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: artifacts/telemetry/
          if-no-files-found: ignore

  # ── SMOKE — every push. Kitchen-sink through every real engine, proving each
  #    engine/adapter/submodule/dependency wires up end-to-end. ──
  smoke:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WARHUB_BOT_APP_ID }}
          private-key: ${{ secrets.WARHUB_BOT_PRIVATE_KEY }}
          owner: WarHub
          repositories: newrecruit-har,battlescribe-archive
      - uses: actions/cache@v6
        with:
          path: lib/battlescribe
          key: bsapp-${{ hashFiles('testdata.json') }}
      - uses: actions/cache@v6
        with:
          path: .testdata/newrecruit-har
          key: nrhar-${{ hashFiles('testdata.json') }}
      - uses: actions/cache@v6
        with:
          path: .testdata/nr-editor
          key: nreditor-${{ hashFiles('testdata.json') }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-linux-${{ hashFiles('Directory.Packages.props') }}
      - uses: actions/cache@v6
        with:
          path: src/bs-ui-java-agent/bs-ui-java-agent.jar
          key: bsjar-${{ hashFiles('src/bs-ui-java-agent/**', 'testdata.json') }}
      - name: Setup dependencies
        run: pwsh ./setup.ps1 -SkipWh40k
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Setup Liberica JDK (with JavaFX)
        uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: '11'
          java-package: 'jdk+fx'
      - name: Build bs-ui-java-agent
        run: pwsh -File src/bs-ui-java-agent/build.ps1
      # Functional build only — the checks job is the analyzer/style gate, so skip the
      # (expensive) analyzers/doc generation here; the test binaries are identical.
      - name: Build
        run: dotnet build -p:RunAnalyzers=false -p:EnforceCodeStyleInBuild=false -p:GenerateDocumentationFile=false
      - name: NR frozen roster — kitchen-sink
        run: dotnet test tests/BattleScribeSpec.Tests.csproj --no-build --filter "Engine=FrozenNrRoster&DisplayName~kitchen-sink" --logger "console;verbosity=minimal"
        env:
          NR_HEADLESS: true
      - name: NR UI roster — kitchen-sink
        run: dotnet test tests/BattleScribeSpec.Tests.csproj --no-build --filter "Engine=FrozenNrUiRoster&DisplayName~kitchen-sink" --logger "console;verbosity=minimal"
        env:
          NR_HEADLESS: true
      - name: NR Editor GameData — kitchen-sink
        run: dotnet test tests/BattleScribeSpec.Tests.csproj --no-build --filter "Engine=FrozenNrGameData&DisplayName~kitchen-sink" --logger "console;verbosity=minimal"
        env:
          NR_HEADLESS: true
      - name: NR Editor GameData UI — kitchen-sink
        run: dotnet test tests/BattleScribeSpec.Tests.csproj --no-build --filter "Engine=FrozenNrGameDataUi" --logger "console;verbosity=minimal"
        env:
          NR_HEADLESS: true
          NR_UI_SMOKE: 1
      - name: BS GameData UI — kitchen-sink (engine + Java agent + app)
        run: xvfb-run -a dotnet test tests/BattleScribeSpec.Tests.csproj --no-build --filter "Engine=BsGameDataUi&DisplayName~kitchen-sink" --logger "console;verbosity=minimal"
        env:
          BS_UI_KEEP_ALIVE: true
      - name: BS UI roster driver — kitchen-sink
        # --no-build: reuse the binaries from the Build step above. Without it, `dotnet run`
        # rebuilds with default props (analyzers on), re-doing the whole solution.
        run: xvfb-run -a dotnet run --project src/BattleScribeSpec.Cli --no-build -- run --engine battlescribe --ui protocol-kitchen-sink

  # ── THOROUGH conformance (opt-in): the full offline + frozen-NR suites that the
  #    every-push lanes trim to kitchen-sink. ──
  thorough-conformance:
    needs: [gate]
    if: needs.gate.outputs.thorough == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WARHUB_BOT_APP_ID }}
          private-key: ${{ secrets.WARHUB_BOT_PRIVATE_KEY }}
          owner: WarHub
          repositories: newrecruit-har,battlescribe-archive
      - uses: actions/cache@v6
        with:
          path: lib/battlescribe
          key: bsapp-${{ hashFiles('testdata.json') }}
      - uses: actions/cache@v6
        with:
          path: .testdata/newrecruit-har
          key: nrhar-${{ hashFiles('testdata.json') }}
      - uses: actions/cache@v6
        with:
          path: .testdata/nr-editor
          key: nreditor-${{ hashFiles('testdata.json') }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-linux-${{ hashFiles('Directory.Packages.props') }}
      - name: Setup dependencies
        run: pwsh ./setup.ps1 -SkipJavaAgent -SkipWh40k
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Build
        run: dotnet build
      - name: Full offline suite (core)
        run: dotnet test tests/BattleScribeSpec.Tests.csproj -p:TestProfile=core --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
      - name: Full frozen NR roster
        run: dotnet test tests/BattleScribeSpec.Tests.csproj -p:TestProfile=nr-frozen --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
        env:
          NR_HEADLESS: true
          NR_PARALLEL: 6
      - name: Full frozen NR UI roster
        run: dotnet test tests/BattleScribeSpec.Tests.csproj -p:TestProfile=nr-ui-frozen --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
        env:
          NR_HEADLESS: true
      - name: Full frozen NR Editor GameData
        run: dotnet test tests/BattleScribeSpec.Tests.csproj -p:TestProfile=nr-editor-frozen --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
        env:
          NR_HEADLESS: true
      - name: Full frozen NR Editor GameData UI (parallelized)
        run: dotnet test tests/BattleScribeSpec.Tests.csproj -p:TestProfile=nr-editor-ui-frozen --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
        env:
          NR_HEADLESS: true
          NR_PARALLEL: 6
      - name: Upload telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: artifacts/telemetry/
          if-no-files-found: ignore

  # ── THOROUGH: full BS GameData UI (opt-in). Warm start + sharded across N jobs.
  #    The matrix MUST match GameDataConformanceTestBase.ShardCount. ──
  thorough-ui-bs:
    needs: [gate]
    if: needs.gate.outputs.thorough == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WARHUB_BOT_APP_ID }}
          private-key: ${{ secrets.WARHUB_BOT_PRIVATE_KEY }}
          owner: WarHub
          repositories: newrecruit-har,battlescribe-archive
      - uses: actions/cache@v6
        with:
          path: lib/battlescribe
          key: bsapp-${{ hashFiles('testdata.json') }}
      - uses: actions/cache@v6
        with:
          path: src/bs-ui-java-agent/bs-ui-java-agent.jar
          key: bsjar-${{ hashFiles('src/bs-ui-java-agent/**', 'testdata.json') }}
      - name: Setup dependencies
        run: pwsh ./setup.ps1 -SkipPlaywright -SkipWh40k
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Setup Liberica JDK (with JavaFX)
        uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: '11'
          java-package: 'jdk+fx'
      - name: Build bs-ui-java-agent
        run: pwsh -File src/bs-ui-java-agent/build.ps1
      - name: Build
        run: dotnet build
      - name: BS GameData UI (shard ${{ matrix.shard }}, warm start)
        run: xvfb-run -a dotnet test tests/BattleScribeSpec.Tests.csproj --no-build --filter "Engine=BsGameDataUi&Shard=${{ matrix.shard }}" --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
        env:
          BS_UI_KEEP_ALIVE: true
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: thorough-ui-bs-diagnostics-${{ matrix.shard }}
          path: |
            artifacts/bs-ui-diagnostics/
      - name: Upload telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: artifacts/telemetry/
          if-no-files-found: ignore

  # ── LIVE NR conformance (opt-in). ──
  nr-conformance:
    needs: [gate]
    if: needs.gate.outputs.thorough == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WARHUB_BOT_APP_ID }}
          private-key: ${{ secrets.WARHUB_BOT_PRIVATE_KEY }}
          owner: WarHub
          repositories: newrecruit-har,battlescribe-archive
      # nr-conformance still needs the BS app: the BattleScribe project IKVM-compiles
      # lib/battlescribe/lib/*.jar at build time.
      - uses: actions/cache@v6
        with:
          path: lib/battlescribe
          key: bsapp-${{ hashFiles('testdata.json') }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-linux-${{ hashFiles('Directory.Packages.props') }}
      - name: Setup dependencies
        run: pwsh ./setup.ps1 -SkipJavaAgent -SkipWh40k
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Build
        run: dotnet build
      - name: Run NR smoke tests
        run: dotnet test tests/BattleScribeSpec.Tests.csproj -p:TestProfile=nr-live-smoke --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
        env:
          NR_HEADLESS: true
      - name: Run NR conformance tests
        run: dotnet test tests/BattleScribeSpec.Tests.csproj -p:TestProfile=nr-live-conformance --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
        env:
          NR_HEADLESS: true
          NR_PARALLEL: 2
      - name: Generate BattleScribe conformance report
        run: |
          dotnet artifacts/bin/BattleScribeSpec.Cli/debug/bs-spec.dll run --all \
            --engine "battlescribe=dotnet:artifacts/bin/BattleScribeSpec.ReferenceAdapter/debug/bs-reference-adapter.dll" \
            --specs specs/roster \
            --roster \
            --expected-failures battlescribe \
            --output github-actions \
            --report artifacts/battlescribe-conformance-report.json
      - name: Upload BattleScribe conformance report
        uses: actions/upload-artifact@v7
        with:
          name: battlescribe-conformance-report
          path: artifacts/battlescribe-conformance-report.json

  ci-gate:
    if: always()
    needs: [gate, checks, smoke, thorough-conformance, thorough-ui-bs, nr-conformance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check job results
        id: gate
        shell: pwsh
        run: |
          $results = @{
            'checks'               = '${{ needs.checks.result }}'
            'smoke'                = '${{ needs.smoke.result }}'
            'thorough-conformance' = '${{ needs.thorough-conformance.result }}'
            'thorough-ui-bs'       = '${{ needs.thorough-ui-bs.result }}'
            'nr-conformance'       = '${{ needs.nr-conformance.result }}'
          }
          $failed = $results.GetEnumerator() | Where-Object { $_.Value -notin @('success', 'skipped') }
          if ($failed) {
            Write-Host "##[error]The following jobs did not succeed:"
            $failed | ForEach-Object { Write-Host "  - $($_.Key): $($_.Value)" }
            "failed=true" >> $env:GITHUB_OUTPUT
            exit 1
          }
          Write-Host "All required jobs passed or were skipped."
          $results.GetEnumerator() | ForEach-Object { Write-Host "  $($_.Key): $($_.Value)" }
          "failed=false" >> $env:GITHUB_OUTPUT

      - name: Check for existing open issue
        if: >-
          always()
          && github.event_name == 'schedule'
          && steps.gate.outputs.failed == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          gh label create scheduled-ci-failure --color D93F0B --description "Auto-created by scheduled CI on failure" --force --repo $env:GH_REPO
          $count = (gh issue list --label scheduled-ci-failure --state open --json number --repo $env:GH_REPO | ConvertFrom-Json).Count
          "count=$count" >> $env:GITHUB_OUTPUT

      - name: Find last non-bot committer
        if: >-
          always()
          && github.event_name == 'schedule'
          && steps.gate.outputs.failed == 'true'
          && steps.existing.outputs.count == '0'
        id: assignee
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $commits = gh api "repos/${{ github.repository }}/commits?per_page=20" | ConvertFrom-Json
          $username = $commits |
            Where-Object { $_.author -and $_.author.login -and $_.author.type -ne 'Bot' } |
            Select-Object -First 1 -ExpandProperty author |
            Select-Object -ExpandProperty login
          "username=$username" >> $env:GITHUB_OUTPUT
          Write-Host "Found assignee: $username"

      - name: Create issue
        if: >-
          always()
          && github.event_name == 'schedule'
          && steps.gate.outputs.failed == 'true'
          && steps.existing.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: pwsh
        run: |
          $failed = @()
          if ('${{ needs.checks.result }}' -eq 'failure') { $failed += 'checks' }
          if ('${{ needs.smoke.result }}' -eq 'failure') { $failed += 'smoke' }
          if ('${{ needs.thorough-conformance.result }}' -eq 'failure') { $failed += 'thorough-conformance' }
          if ('${{ needs.thorough-ui-bs.result }}' -eq 'failure') { $failed += 'thorough-ui-bs' }
          if ('${{ needs.nr-conformance.result }}' -eq 'failure') { $failed += 'nr-conformance' }
          $failedList = ($failed | ForEach-Object { "- $_" }) -join "`n"
          $body = @"
          ## Scheduled CI failure

          The weekly scheduled CI run had failures.

          **Failed jobs:**
          $failedList

          **Workflow run:** $env:RUN_URL

          ---
          _This issue was auto-created by the scheduled CI workflow.
          Close it once the failures are resolved._
          "@
          $body = ($body -split "`n" | ForEach-Object { $_.TrimStart() }) -join "`n"
          $title = "Scheduled CI failure — $(Get-Date -Format 'yyyy-MM-dd')"
          $assignee = '${{ steps.assignee.outputs.username }}'
          $ghArgs = @('issue', 'create', '--title', $title, '--body', $body, '--label', 'scheduled-ci-failure', '--repo', $env:GH_REPO)
          if ($assignee) { $ghArgs += '--assignee'; $ghArgs += $assignee }
          & gh @ghArgs
