name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout battlescribe-spec
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup dependencies
        run: pwsh ./setup.ps1 -SkipPlaywright
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --logger GitHubActions --filter "FullyQualifiedName!~NewRecruit&FullyQualifiedName!~FrozenNewRecruit"

      - name: End-to-end spec runner test
        run: |
          dotnet artifacts/bin/BattleScribeSpec.Runner/debug/bs-spec-runner.dll \
            --adapter "dotnet:artifacts/bin/BattleScribeSpec.ReferenceAdapter/debug/bs-reference-adapter.dll" \
            --specs specs \
            --engine battlescribe \
            --expected-failures battlescribe \
            --output github-actions

  nr-frozen:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup dependencies
        run: pwsh ./setup.ps1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: dotnet build

      - name: Run frozen NR conformance tests
        run: dotnet test tests/BattleScribeSpec.Tests.csproj --filter "FrozenNewRecruitConformanceTests" --no-build --logger GitHubActions
        env:
          NR_HEADLESS: true

  nr-conformance:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[nr-test]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup dependencies
        run: pwsh ./setup.ps1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: dotnet build

      - name: Run NR smoke tests
        run: dotnet test tests/BattleScribeSpec.Tests.csproj --filter "NewRecruitSmokeTests" --logger GitHubActions
        env:
          NR_ENGINE_URL: https://newrecruit.eu
          NR_HEADLESS: true

      - name: Run NR conformance tests
        run: dotnet test tests/BattleScribeSpec.Tests.csproj --filter "NewRecruitConformanceTests" --logger GitHubActions
        env:
          NR_ENGINE_URL: https://newrecruit.eu
          NR_HEADLESS: true

      - name: Generate conformance report
        run: |
          dotnet artifacts/bin/BattleScribeSpec.Runner/debug/bs-spec-runner.dll \
            --adapter "dotnet:artifacts/bin/BattleScribeSpec.ReferenceAdapter/debug/bs-reference-adapter.dll" \
            --specs specs \
            --engine newrecruit \
            --output github-actions \
            --report artifacts/nr-conformance-report.json

      - name: Upload conformance report
        uses: actions/upload-artifact@v7
        with:
          name: nr-conformance-report
          path: artifacts/nr-conformance-report.json
