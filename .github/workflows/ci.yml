name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout battlescribe-spec
        uses: actions/checkout@v4

      - name: Checkout wham (sibling)
        run: git clone https://github.com/WarHub/wham.git ../wham

      - name: Checkout wh40k-9e (sibling)
        run: git clone --depth 1 --branch v9.8.0 https://github.com/BSData/wh40k-9e.git ../wh40k-9e

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --logger GitHubActions --filter "FullyQualifiedName!~Roster10_AeldariAlliedWarhost"
        env:
          WH40K_DATA_DIR: ${{ github.workspace }}/../wh40k-9e

      - name: End-to-end spec runner test
        run: |
          dotnet src/BattleScribeSpec.Runner/bin/Debug/net10.0/bs-spec-runner.dll \
            --adapter "dotnet:src/BattleScribeSpec.ReferenceAdapter/bin/Debug/net10.0/bs-reference-adapter.dll" \
            --specs specs \
            --output github-actions
