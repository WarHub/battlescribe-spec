name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'
      timezone: Europe/Warsaw

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Decide whether the opt-in "thorough" suites run this time. ──
  # (env context is not available in job-level `if:`, so we expose a boolean output.)
  gate:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      thorough: ${{ steps.decide.outputs.thorough }}
    steps:
      # EDITING testdata.json IS EDITING WHAT THE FROZEN SUITES REPLAY — a different NR client
      # HAR, a different NR Editor snapshot, a different BattleScribe app build. Those are exactly
      # the suites the every-push lanes trim to kitchen-sink, so a bump sails through PR CI while
      # changing the one input the trimmed lanes barely exercise. #301 (v34.93 → v35.12) was green
      # for three weeks of daily bot re-runs, merged, and broke the NR-UI roster driver and the
      # store-direct NR roster export: the client had dropped a navbar route and replaced every
      # raster icon with an SVG component.
      #
      # The gate is on the FILE, not the author. The exposure comes from the content change, and a
      # maintainer hand-editing a pin has precisely the exposure the nightly bot has.
      - id: testdata
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename' > changed-files.txt
          if grep -qxF 'testdata.json' changed-files.txt; then
            echo "This PR edits testdata.json — forcing the thorough suites."
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi
      - id: decide
        shell: pwsh
        run: |
          $thorough = (
            ('${{ github.event_name }}' -in @('workflow_dispatch', 'schedule')) -or
            ('${{ contains(github.event.head_commit.message, '[nr-test]') }}' -eq 'true') -or
            ('${{ contains(github.event.pull_request.labels.*.name, 'thorough-ci') }}' -eq 'true') -or
            ('${{ steps.testdata.outputs.touched }}' -eq 'true')
          )
          "thorough=$($thorough.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "thorough = $thorough"

  # ── CHECKS — every push. Offline/CPU: unit + protocol + lint + formatting +
  #    the in-process BattleScribe reference engine (kitchen-sink). No browsers. ──
  checks:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      # THE BUILD'S STRICTNESS USED TO BE WHATEVER MICROSOFT SHIPPED THAT WEEK. `AnalysisLevel` is
      # `latest-recommended` and `TreatWarningsAsErrors` is true (Directory.Build.props), so the set
      # of CA rules that can fail this job is resolved from the installed SDK — and every step here
      # used to ask setup-dotnet for a floating `dotnet-version: '10.0.x'`, which installs the newest
      # 10.0 SDK in existence at that moment. global.json's `rollForward: latestFeature` then
      # accepted it, whatever band it was.
      #
      # That is not theoretical. SDK 10.0.400 was released 2026-08-11; run 31746128450 (main,
      # 2026-08-13) installed it and built on a feature band no commit in this repo had ever seen.
      # It was green. That was luck, not a property of the repo: a feature band is where analyzers
      # get stricter, the previous band change surfaced ~22 CA errors in TestKit and TraceSummary on
      # untouched files (#312), and the commit that would have gone red was a docs-only one.
      #
      # `global-json-file` makes global.json the single declaration of the toolchain, for CI and for
      # contributors alike — setup-dotnet honours `latestPatch` and installs the newest SDK inside
      # the pinned band. The band still moves; it moves through a Dependabot PR that CI actually
      # builds (see .github/dependabot.yml), so a stricter analyzer set arrives as a reviewable diff
      # instead of as a red build on a commit that changed nothing.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WARHUB_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.WARHUB_BOT_APP_PRIVATE_KEY }}
          owner: WarHub
          repositories: newrecruit-har,battlescribe-archive
      # The BattleScribe project IKVM-compiles lib/battlescribe/lib/*.jar at build time.
      - uses: actions/cache@v6
        with:
          path: lib/battlescribe
          key: bsapp-${{ hashFiles('testdata.json') }}
      # The .NET build IKVM-compiles a PATCHED copy of the engine jar (src/bs-engine-patch, issue
      # #401), and the patch step runs `java PatchJarMain`. This lane skips the JavaFX agent build,
      # so it has no in-repo JDK — provide a plain one for the patch tool.
      - name: Setup Java (engine-jar patch tool)
        uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: '11'
      - name: Setup dependencies
        run: pwsh ./setup.ps1 -SkipPlaywright -SkipJavaAgent -SkipWh40k
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      # A LOCK FILE NOBODY VERIFIES IS DECORATION. RestorePackagesWithLockFile has been on since the
      # start (Directory.Build.props) and NOTHING has ever checked the result, so main shipped
      # packages.lock.json files that disagreed with Directory.Packages.props and nobody noticed:
      # #287 bumped seven central versions and updated ZERO lock files; #323 bumped nine, updated the
      # `src` locks, and left both test projects' CentralTransitive entries on OpenTelemetry 1.16.0 /
      # System.CommandLine 2.0.9. Both merged green. Downstream, four separate branches hit a plain
      # `dotnet restore` silently rewriting those files and each reverted the churn as unrelated
      # noise — the cost of the missing check was paid four times over, in the wrong place.
      #
      # This is `--locked-mode` on the command line and deliberately NOT RestoreLockedMode in
      # Directory.Build.props: locked mode belongs where a lock file that lies is a bug (CI), not on a
      # contributor's machine, where adding a PackageReference has to keep working.
      #
      # IT WILL GO RED ON SOME DEPENDABOT PRs, because dependabot's lock updates for this repo are
      # demonstrably partial — the entries it misses are the CentralTransitive ones for packages a
      # project reaches only through a ProjectReference, which is exactly the shape of both test
      # projects. That is not a reason to drop the check; the fix is one command on the PR branch,
      # and NU1004 names the offending project AND package, so the failure is actionable:
      #     dotnet restore --force-evaluate     # then commit the lock files
      # The bump path stays open. It just stops being silent.
      - name: Verify lock files (restore in locked mode)
        run: dotnet restore --locked-mode
      - name: Build
        run: dotnet build
      # WHAT MACHINE IS THIS, ACTUALLY? Every constant in docs/concurrency-policy-measurements.md is
      # machine-relative (`ceil(cpuCount × k)`, `maxParallelThreads: "0.5x"`), the doc calls this the
      # "4-vCPU / 16 GiB CI runner" throughout — and nobody had ever checked. The first CI run of the
      # CLI test project reported a worker count that is only consistent with cpuCount = 2. Print it,
      # so the next person tuning against "the CI runner" is reading a measurement and not a memory.
      - name: Runner profile (the machine every constant here is relative to)
        run: |
          echo "nproc:    $(nproc)"
          echo "MemTotal: $(awk '/MemTotal/ {printf "%.1f GiB", $2/1048576}' /proc/meminfo)"
          echo ""
          echo "ConcurrencyPolicy reads Environment.ProcessorCount and GC.GetGCMemoryInfo()."
          echo "The 'Reference adapter' step below prints 'Workers: N' for a Local, k=1.0, unmeasured"
          echo "engine — i.e. N == min(ProcessorCount, UndeclaredMemoryWorkerCap=8). That is the number"
          echo "the policy actually saw."
      # Style rules are enforced during the build (EnforceCodeStyleInBuild); this only needs
      # to add the whitespace/formatting check, which is much faster than a full format run.
      - name: Verify formatting (whitespace)
        run: dotnet format whitespace BattleScribeSpec.slnx --no-restore --verify-no-changes --exclude .deps/
      - name: Run script tests
        run: node --test scripts/har-diff.test.mjs
      # EVERY TEST STEP IN THIS FILE GOES THROUGH scripts/dotnet-test-step.ps1, WHICH FAILS THE STEP
      # WHEN IT EXECUTED NO TESTS (passed + failed == 0, read from the TRX counters — not scraped from
      # console text). Bare `dotnet test` is forbidden here, and
      # ConcurrencyConfigurationDriftTests.EveryCiTestStep_ExecutesAtLeastOneTest (a Lint test, run by
      # the very step below) keeps it that way — reintroduce one and the build goes red.
      #
      # The invariant is "this step RAN a test", not "the filter matched something", because both
      # frozen NR roster lanes failed in different ways and only one of them was empty:
      #   * `Engine=FrozenNrUiRoster&DisplayName~kitchen-sink` matched 0 tests — that class is a single
      #     [Fact] AllSpecs(), so no display name carries a spec id and the clause can never match.
      #   * `Engine=FrozenNrRoster&DisplayName~kitchen-sink` matched exactly 1 — the Mode=Sequential
      #     variant, gated behind NR_SEQUENTIAL, which self-skips. Total: 1, Passed: 0, exit 0.
      # Both were green on every PR. The second is the more insidious one and a non-empty-selection
      # check (RunConfiguration.TreatNoTestsAsError, which the script also passes) does not catch it.
      #
      # The guard is per invocation rather than a runsettings setting because a runsettings would also
      # bind `dotnet test -p:TestProfile=<x>` run against the SOLUTION — the form AGENTS.md documents —
      # where an engine filter legitimately matches nothing in BattleScribeSpec.Cli.Tests.
      - name: Unit / protocol / lint (offline)
        run: pwsh scripts/dotnet-test-step.ps1 tests/BattleScribeSpec.Tests.csproj --no-build --filter "Category!=Conformance" --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
      # THE CLI'S OWN TESTS. There are two test projects in this repo and, until now, CI ran ONE of
      # them: every `dotnet test` step here targeted tests/BattleScribeSpec.Tests.csproj, and nothing
      # ran tests/BattleScribeSpec.Cli.Tests — not even a solution-wide sweep. So every gate on the
      # CLI's concurrency model (EngineSpecTests: the third-party load limit, the fail-safe for
      # undeclared adapters, the --policy rejection gates), plus RunBatchSurfaceTests and
      # CompareCommandTests, had never once been executed by CI. A gate nobody invokes is a gate
      # nobody has.
      #
      # It belongs in THIS job: these tests are offline and CPU-only. They drive the in-process
      # BattleScribe engine and the dotnet: reference adapter — both of which this job already builds
      # and runs in the two steps below — and they touch no browser and no network.
      - name: CLI (engine selection / load target / protocol surface)
        run: pwsh scripts/dotnet-test-step.ps1 tests/BattleScribeSpec.Cli.Tests/BattleScribeSpec.Cli.Tests.csproj --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
      - name: BattleScribe reference engine — kitchen-sink
        run: pwsh scripts/dotnet-test-step.ps1 tests/BattleScribeSpec.Tests.csproj --no-build --filter "(Engine=BsRoster|Engine=BsGameData)&DisplayName~kitchen-sink" --logger "console;verbosity=minimal"
      # No --policy here, deliberately: this engine is a LAUNCHABLE (dotnet:) adapter, and a plan
      # cannot be conveyed to one — there is no channel for it, so the CLI errors rather than
      # silently dropping the flag (#305). This step used to pass `--workers 2`; the flag's
      # replacement (`--policy workers=2`) is exactly what a launchable adapter must refuse, so
      # the step was failing on every run of this job. The worker count is ConcurrencyPolicy's to
      # choose anyway — that is the whole point of the model.
      #
      # It picks min(cpuCount, UndeclaredMemoryWorkerCap=8) — see the "Runner profile" step for what
      # cpuCount actually is here; the previous version of this comment asserted 4 without checking.
      #
      # --engine-endpoint local IS LOAD-BEARING, AND IT IS A DECLARATION, NOT A TUNING FLAG. Without it
      # this connectable is an executable the harness has never seen: its endpoint is UNDECLARED, and an
      # undeclared endpoint fails safe to "a third party's live service" — so CI announced an in-process
      # IKVM adapter with no network code at all as "third-party live service — held to 2 concurrent
      # sessions", on every run, and throttled it. The flag states the fact (this adapter's service is
      # this machine) and the throttle lifts. It is stated HERE, by the people who chose the binary,
      # rather than inferred from the name: an adapter named `battlescribe` is not necessarily ours, and
      # letting a NAME grant a built-in's endpoint and measured profile is how `newrecruit=exec:./anything`
      # briefly got 12 workers and no load limit (EngineRegistry.Resolve).
      #
      # Note the throttle was INVISIBLE on this runner — a 2-vCPU box is already at the load limit on its
      # own — which is exactly how it survived: it cost CI nothing it could measure, and would have halved
      # any larger runner.
      - name: Reference adapter (dotnet) — roster kitchen-sink
        run: |
          dotnet artifacts/bin/BattleScribeSpec.Cli/debug/bs-spec.dll run --all \
            --engine "battlescribe=dotnet:artifacts/bin/BattleScribeSpec.ReferenceAdapter/debug/bs-reference-adapter.dll" \
            --engine-endpoint local \
            --specs specs/roster \
            --roster \
            --filter "protocol/protocol-kitchen-sink,category/" \
            --expected-failures battlescribe \
            --output github-actions
      # The trace summary (wall time, cold-starts vs reuses, peak live resources) for the steps
      # above is appended to $GITHUB_STEP_SUMMARY automatically by the CLI/dotnet-test telemetry
      # code itself (TraceSummary.AppendToGitHubStepSummary) — no extra script needed here.
      - name: Upload telemetry
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telemetry-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: artifacts/telemetry/
          if-no-files-found: ignore

  # ── DOCKER — every push. Builds the published-image Dockerfile. Build only, no push. ──
  #
  # THIS JOB EXISTS BECAUSE NOTHING BUILT THESE FILES AND THEY ROTTED IN SILENCE. As of 2026-08 both
  # Dockerfiles were unbuildable and had been for months: reference-adapter.Dockerfile copied
  # `src/BattleScribeSpec.Oracle/`, a project renamed away on 2026-04-23, and it went unnoticed for
  # four months; bs-spec.Dockerfile never copied the two Telemetry csprojs the CLI has
  # ProjectReferenced since 2026-07-13, and its runtime base lacked the ASP.NET Core shared framework
  # the Collector pulls in — so it failed at restore, and would then have failed at startup.
  #
  # None of that is catchable by a lint rule or a drift test, because a stale COPY list is only wrong
  # relative to a project graph that changes. The only thing that finds it is building the image.
  # It is a plain `docker build` with no push, no registry auth and no secrets: nothing here needs the
  # BattleScribe archive, because this image ships no engine.
  docker:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      # submodules: recursive is load-bearing — the Dockerfile COPYs .deps/ for the vendored wham
      # projects XmlGen references, and an uninitialised submodule is an empty directory that fails
      # restore rather than the checkout.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build bs-spec image
        run: docker build -f docker/bs-spec.Dockerfile -t bs-spec:ci .
      # A built image that cannot start is the failure mode that motivated the aspnet base, and the
      # build stage cannot see it. `--help` exercises the real entrypoint and framework resolution.
      - name: The image starts and resolves its frameworks
        run: docker run --rm bs-spec:ci --help

  # ── SMOKE — every push. Kitchen-sink through every real engine, proving each
  #    engine/adapter/submodule/dependency wires up end-to-end. ──
  smoke:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WARHUB_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.WARHUB_BOT_APP_PRIVATE_KEY }}
          owner: WarHub
          repositories: newrecruit-har,battlescribe-archive
      - uses: actions/cache@v6
        with:
          path: lib/battlescribe
          key: bsapp-${{ hashFiles('testdata.json') }}
      - uses: actions/cache@v6
        with:
          path: .testdata/newrecruit-har
          key: nrhar-${{ hashFiles('testdata.json') }}
      - uses: actions/cache@v6
        with:
          path: .testdata/nr-editor
          key: nreditor-${{ hashFiles('testdata.json') }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-linux-${{ hashFiles('Directory.Packages.props') }}
      - uses: actions/cache@v6
        with:
          path: src/bs-ui-java-agent/bs-ui-java-agent.jar
          key: bsjar-${{ hashFiles('src/bs-ui-java-agent/**', 'testdata.json') }}
      - name: Setup dependencies
        run: pwsh ./setup.ps1 -SkipWh40k
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Setup Liberica JDK (with JavaFX)
        uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: '11'
          java-package: 'jdk+fx'
      - name: Build bs-ui-java-agent
        run: pwsh -File src/bs-ui-java-agent/build.ps1
      # Functional build only — the checks job is the analyzer/style gate, so skip the
      # (expensive) analyzers/doc generation here; the test binaries are identical.
      - name: Build
        run: dotnet build -p:RunAnalyzers=false -p:EnforceCodeStyleInBuild=false -p:GenerateDocumentationFile=false
      # A [Fact] AGGREGATE CANNOT BE NARROWED BY DisplayName, AND THIS STEP USED TO PROVE IT THE HARD
      # WAY. `Engine=FrozenNrRoster&DisplayName~kitchen-sink` selected exactly ONE test — and it was
      # SequentialFrozenNrRosterConformanceTests' theory row, which is gated behind NR_SEQUENTIAL and
      # therefore SKIPPED on every run. Measured: `Skipped! - Failed: 0, Passed: 0, Skipped: 1`, exit
      # 0, green. The real suite (FrozenNrRosterConformanceTests.AllSpecs, a [Fact] whose display name
      # contains no spec id) was never selected at all. Per-spec narrowing comes from the engine side
      # instead — NR_FROZEN_SMOKE, the same shape as NR_UI_SMOKE two steps below — and the filter is
      # the profile's own (`Mode!=Sequential` keeps the 365 skipped sequential rows out).
      - name: NR frozen roster — kitchen-sink
        run: pwsh scripts/dotnet-test-step.ps1 tests/BattleScribeSpec.Tests.csproj --no-build --filter "Engine=FrozenNrRoster&Mode!=Sequential" --logger "console;verbosity=minimal"
        env:
          NR_HEADLESS: true
          NR_FROZEN_SMOKE: 1
      # Same defect, no env knob needed: FrozenNrUiRosterConformanceTests is hardcoded to
      # TargetSpecs = ["protocol/protocol-kitchen-sink"], so the CLASS is the narrowing and the
      # DisplayName clause only ever subtracted. It matched ZERO tests, exited 0, and reported green
      # right through the frozen NR UI suite breaking on the v35.12 HAR client change.
      - name: NR UI roster — kitchen-sink
        run: pwsh scripts/dotnet-test-step.ps1 tests/BattleScribeSpec.Tests.csproj --no-build --filter "Engine=FrozenNrUiRoster" --logger "console;verbosity=minimal"
        env:
          NR_HEADLESS: true
      - name: NR Editor GameData — kitchen-sink
        run: pwsh scripts/dotnet-test-step.ps1 tests/BattleScribeSpec.Tests.csproj --no-build --filter "Engine=FrozenNrGameData&DisplayName~kitchen-sink" --logger "console;verbosity=minimal"
        env:
          NR_HEADLESS: true
      - name: NR Editor GameData UI — kitchen-sink
        run: pwsh scripts/dotnet-test-step.ps1 tests/BattleScribeSpec.Tests.csproj --no-build --filter "Engine=FrozenNrGameDataUi" --logger "console;verbosity=minimal"
        env:
          NR_HEADLESS: true
          NR_UI_SMOKE: 1
      # Warm start (the JVM survives between specs) is ConcurrencyPolicy's decision now, taken from
      # the engine's declared ColdStartCost/ReuseSafeGameData — not the BS_UI_KEEP_ALIVE env var this
      # step used to set. The variable is read nowhere; setting it here would be decoration.
      - name: BS GameData UI — kitchen-sink (engine + Java agent + app)
        run: xvfb-run -a pwsh scripts/dotnet-test-step.ps1 tests/BattleScribeSpec.Tests.csproj --no-build --filter "Engine=BsGameDataUi&DisplayName~kitchen-sink" --logger "console;verbosity=minimal"
      - name: BS UI roster driver — kitchen-sink
        # --no-build: reuse the binaries from the Build step above. Without it, `dotnet run`
        # rebuilds with default props (analyzers on), re-doing the whole solution.
        run: xvfb-run -a dotnet run --project src/BattleScribeSpec.Cli --no-build -- run --engine battlescribe --ui protocol-kitchen-sink
        env:
          # One spec, so a line per driven control is affordable — and it is the only way this lane
          # can say WHICH control shapes it covers. A passing spec proves an entry was reached, not
          # what was clicked to reach it, and that gap is how the driver's checkbox branch survived
          # without anyone knowing whether BattleScribe renders one at all.
          BS_UI_PANEL_TRACE: 1

  # ── THOROUGH conformance (opt-in): the full offline + frozen-NR suites that the
  #    every-push lanes trim to kitchen-sink. ──
  thorough-conformance:
    needs: [gate]
    if: needs.gate.outputs.thorough == 'true'
    runs-on: ubuntu-latest
    # The NR UI roster step alone is ~25 minutes (378 specs, sequential, one shared browser) and the
    # job lands around 35. Bounded explicitly rather than left on GitHub's 360-minute default: every
    # step here drives a browser against a replayed HAR, and a hung SPA is a realistic failure mode
    # that would otherwise burn six hours of runner time before anyone saw it. The margin to 150 is
    # for a slower runner and for a snapshot that costs more than the last one — a bump has doubled
    # this job before — not for a hang.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WARHUB_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.WARHUB_BOT_APP_PRIVATE_KEY }}
          owner: WarHub
          repositories: newrecruit-har,battlescribe-archive
      - uses: actions/cache@v6
        with:
          path: lib/battlescribe
          key: bsapp-${{ hashFiles('testdata.json') }}
      - uses: actions/cache@v6
        with:
          path: .testdata/newrecruit-har
          key: nrhar-${{ hashFiles('testdata.json') }}
      - uses: actions/cache@v6
        with:
          path: .testdata/nr-editor
          key: nreditor-${{ hashFiles('testdata.json') }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-linux-${{ hashFiles('Directory.Packages.props') }}
      # The .NET build IKVM-compiles a PATCHED copy of the engine jar (src/bs-engine-patch, #401);
      # its patch step runs `java PatchJarMain`. This lane skips the agent build, so provide a JDK.
      - name: Setup Java (engine-jar patch tool)
        uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: '11'
      - name: Setup dependencies
        run: pwsh ./setup.ps1 -SkipJavaAgent -SkipWh40k
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Build
        run: dotnet build
      - name: Full offline suite (core)
        run: pwsh scripts/dotnet-test-step.ps1 -TestProfile core tests/BattleScribeSpec.Tests.csproj --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
      - name: Full frozen NR roster
        run: pwsh scripts/dotnet-test-step.ps1 -TestProfile nr-frozen tests/BattleScribeSpec.Tests.csproj --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
        env:
          NR_HEADLESS: true
      # NR_UI_ROSTER_FULL is what makes this step deserve the word "Full". Without it the class runs
      # kitchen-sink only — which is what it did for its whole life, and is why
      # docs/warm-reuse.md records "CI never caught the original bug because the NR-UI roster lane
      # runs a single spec". The knob is opt-in so the every-push lane and pre-push stay fast;
      # ConcurrencyConfigurationDriftTests.ThoroughNrUiRosterStep_RunsTheFullSpecSet fails if this
      # env entry is ever dropped, because a lane silently shrinking from 363 specs to 1 still
      # exits 0. This step is the long one: ~25 minutes, and it is why the job carries a timeout.
      - name: Full frozen NR UI roster
        run: pwsh scripts/dotnet-test-step.ps1 -TestProfile nr-ui-frozen tests/BattleScribeSpec.Tests.csproj --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
        env:
          NR_HEADLESS: true
          NR_UI_ROSTER_FULL: 1
      # `!cancelled()` on the two lanes after the long one: they replay a DIFFERENT snapshot (the NR
      # Editor pin) than the step above (the HAR), so a red NR-UI roster lane says nothing about
      # them — and this job's own history is one flaky NR-UI spec per run, each time a different
      # one. Default `success()` made that flake skip both, so PR #338 (the v35.27 HAR bump) was
      # reported red having never run two of the four lanes it exists to verify, and the only way to
      # learn their verdict was another hour of runner time.
      - name: Full frozen NR Editor GameData
        if: ${{ !cancelled() }}
        run: pwsh scripts/dotnet-test-step.ps1 -TestProfile nr-editor-frozen tests/BattleScribeSpec.Tests.csproj --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
        env:
          NR_HEADLESS: true
      - name: Full frozen NR Editor GameData UI (parallelized)
        if: ${{ !cancelled() }}
        run: pwsh scripts/dotnet-test-step.ps1 -TestProfile nr-editor-ui-frozen tests/BattleScribeSpec.Tests.csproj --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
        env:
          NR_HEADLESS: true
      # The NR UI drivers write a screenshot, DOM snapshot, Pinia dump and console log for every
      # failed action — and this job, the only one that runs either of them over the full spec set,
      # was throwing all of it away. A `Timeout 20000ms exceeded.` in the log was the whole record
      # of the failure. `nr-ui-diagnostics*` matches the per-worker suffixes the drivers append.
      - name: Upload NR UI diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: thorough-conformance-nr-ui-diagnostics
          path: |
            artifacts/nr-ui-diagnostics*/
            artifacts/nr-gamedata-ui-diagnostics*/
          # A lane can fail without any driver reaching its capture path (a lint or fixture failure),
          # so an empty upload here is a fact about the failure, not a broken step.
          if-no-files-found: ignore
      - name: Upload telemetry
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telemetry-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: artifacts/telemetry/
          if-no-files-found: ignore

  # ── THOROUGH: the BS desktop UI, BOTH halves of it (opt-in). Warm start + sharded across N jobs.
  #
  #    The `suite` axis exists because this job used to run one half. `BsGameDataUiConformanceTests`
  #    covered the Data Editor; `BsRosterUiConformanceTests` covered the Roster Editor and ran
  #    nowhere — so every change to BsUiRosterEngine and RosterActions.java reached main having been
  #    exercised by unit tests and one teardown test. That class was written to be sharded on the
  #    same trait for exactly this, and then not wired up (#355): the lane was held back until its
  #    failures were each fixed or declared, which #354 completed at 367/367.
  #
  #    A matrix axis and not a second job: the two halves need identical artifacts, JDK, agent build
  #    and xvfb, and a copy of fifty lines of setup is a copy that drifts. Only the filter and the
  #    artifact names differ.
  #
  #    The shard axis MUST match ConformanceTestBase.ShardCount and
  #    GameDataConformanceTestBase.ShardCount, which are equal for this reason.
  thorough-ui-bs:
    needs: [gate]
    if: needs.gate.outputs.thorough == 'true'
    runs-on: ubuntu-latest
    # A ceiling, not a target: the roster lane measures ~13m unsharded and the gamedata lane less,
    # so anything approaching this is a hang. Without it both inherit GitHub's 6-hour default, and a
    # wedged JavaFX app is the failure this suite has most often had.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: gamedata, engine: BsGameDataUi, diagnostics: artifacts/bs-gamedata-ui-diagnostics/ }
          - { name: roster, engine: BsRosterUi, diagnostics: artifacts/bs-ui-diagnostics/ }
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WARHUB_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.WARHUB_BOT_APP_PRIVATE_KEY }}
          owner: WarHub
          repositories: newrecruit-har,battlescribe-archive
      - uses: actions/cache@v6
        with:
          path: lib/battlescribe
          key: bsapp-${{ hashFiles('testdata.json') }}
      - uses: actions/cache@v6
        with:
          path: src/bs-ui-java-agent/bs-ui-java-agent.jar
          key: bsjar-${{ hashFiles('src/bs-ui-java-agent/**', 'testdata.json') }}
      - name: Setup dependencies
        run: pwsh ./setup.ps1 -SkipPlaywright -SkipWh40k
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Setup Liberica JDK (with JavaFX)
        uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: '11'
          java-package: 'jdk+fx'
      - name: Build bs-ui-java-agent
        run: pwsh -File src/bs-ui-java-agent/build.ps1
      - name: Build
        run: dotnet build
      # "warm start" is ConcurrencyPolicy.For(machine, battlescribe-ui).ReuseGameData — the fixture
      # asks the policy. It used to be BS_UI_KEEP_ALIVE, set here and nowhere else, so this suite ran
      # warm in CI and cold on every developer's machine. Both now run warm, from one decision.
      - name: BS ${{ matrix.suite.name }} UI (shard ${{ matrix.shard }}, warm start)
        run: xvfb-run -a pwsh scripts/dotnet-test-step.ps1 tests/BattleScribeSpec.Tests.csproj --no-build --filter "Engine=${{ matrix.suite.engine }}&Shard=${{ matrix.shard }}" --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: thorough-ui-bs-diagnostics-${{ matrix.suite.name }}-${{ matrix.shard }}
          path: |
            ${{ matrix.suite.diagnostics }}
          # The gamedata half writes none today — BsGameDataUiDiagnostics has no caller — so an empty
          # upload there is a fact about that driver, not a broken step.
          if-no-files-found: ignore
      - name: Upload telemetry
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telemetry-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: artifacts/telemetry/
          if-no-files-found: ignore

  # ── LIVE NR conformance (opt-in). ──
  nr-conformance:
    needs: [gate]
    if: needs.gate.outputs.thorough == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WARHUB_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.WARHUB_BOT_APP_PRIVATE_KEY }}
          owner: WarHub
          repositories: newrecruit-har,battlescribe-archive
      # nr-conformance still needs the BS app: the BattleScribe project IKVM-compiles
      # lib/battlescribe/lib/*.jar at build time.
      - uses: actions/cache@v6
        with:
          path: lib/battlescribe
          key: bsapp-${{ hashFiles('testdata.json') }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-linux-${{ hashFiles('Directory.Packages.props') }}
      # The .NET build IKVM-compiles a PATCHED copy of the engine jar (src/bs-engine-patch, #401);
      # its patch step runs `java PatchJarMain`. This lane skips the agent build, so provide a JDK.
      - name: Setup Java (engine-jar patch tool)
        uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: '11'
      - name: Setup dependencies
        run: pwsh ./setup.ps1 -SkipJavaAgent -SkipWh40k
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Build
        run: dotnet build
      - name: Run NR smoke tests
        run: pwsh scripts/dotnet-test-step.ps1 -TestProfile nr-live-smoke tests/BattleScribeSpec.Tests.csproj --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
        env:
          NR_HEADLESS: true
      - name: Run NR conformance tests
        run: pwsh scripts/dotnet-test-step.ps1 -TestProfile nr-live-conformance tests/BattleScribeSpec.Tests.csproj --no-build --logger "console;verbosity=minimal" --logger "GitHubActions;summary-include-passed=false"
        env:
          NR_HEADLESS: true
      # --engine-endpoint local: same declaration as the `checks` job's reference-adapter step — this
      # adapter's service is this machine. Without it the endpoint is undeclared and the fail-safe holds
      # the run to the third-party live load limit. See that step for why it is declared and not inferred.
      - name: Generate BattleScribe conformance report
        run: |
          dotnet artifacts/bin/BattleScribeSpec.Cli/debug/bs-spec.dll run --all \
            --engine "battlescribe=dotnet:artifacts/bin/BattleScribeSpec.ReferenceAdapter/debug/bs-reference-adapter.dll" \
            --engine-endpoint local \
            --specs specs/roster \
            --roster \
            --expected-failures battlescribe \
            --output github-actions \
            --report artifacts/battlescribe-conformance-report.json
      - name: Upload BattleScribe conformance report
        uses: actions/upload-artifact@v7
        with:
          name: battlescribe-conformance-report
          path: artifacts/battlescribe-conformance-report.json
      # `if: always()` — this is the ONE lane that drives a third party's live site, so it is the one
      # lane whose diagnostics matter most on a FAILING run, and it was the only lane in this workflow
      # without this step. When it crashed (#318) the traces died with the runner: no pool size, no
      # span timings, nothing to distinguish a resource exhaustion from a network blip. Telemetry is
      # cheap; a crash you cannot read twice is not.
      - name: Upload telemetry
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telemetry-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: artifacts/telemetry/
          if-no-files-found: ignore

  ci-gate:
    if: always()
    needs: [gate, checks, docker, smoke, thorough-conformance, thorough-ui-bs, nr-conformance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check job results
        id: gate
        shell: pwsh
        run: |
          $results = @{
            # `gate` decides whether the thorough lanes run at all. It was absent from this table,
            # so a failed gate skipped those lanes and the aggregate still read green — the one
            # failure that silently disables the deepest suites was the one nobody was told about.
            'gate'                 = '${{ needs.gate.result }}'
            'checks'               = '${{ needs.checks.result }}'
            'docker'               = '${{ needs.docker.result }}'
            'smoke'                = '${{ needs.smoke.result }}'
            'thorough-conformance' = '${{ needs.thorough-conformance.result }}'
            'thorough-ui-bs'       = '${{ needs.thorough-ui-bs.result }}'
            'nr-conformance'       = '${{ needs.nr-conformance.result }}'
          }
          $failed = $results.GetEnumerator() | Where-Object { $_.Value -notin @('success', 'skipped') }
          if ($failed) {
            Write-Host "##[error]The following jobs did not succeed:"
            $failed | ForEach-Object { Write-Host "  - $($_.Key): $($_.Value)" }
            "failed=true" >> $env:GITHUB_OUTPUT
            exit 1
          }
          Write-Host "All required jobs passed or were skipped."
          $results.GetEnumerator() | ForEach-Object { Write-Host "  $($_.Key): $($_.Value)" }
          "failed=false" >> $env:GITHUB_OUTPUT

      - name: Check for existing open issue
        if: >-
          always()
          && github.event_name == 'schedule'
          && steps.gate.outputs.failed == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          gh label create scheduled-ci-failure --color D93F0B --description "Auto-created by scheduled CI on failure" --force --repo $env:GH_REPO
          $count = (gh issue list --label scheduled-ci-failure --state open --json number --repo $env:GH_REPO | ConvertFrom-Json).Count
          "count=$count" >> $env:GITHUB_OUTPUT

      - name: Find last non-bot committer
        if: >-
          always()
          && github.event_name == 'schedule'
          && steps.gate.outputs.failed == 'true'
          && steps.existing.outputs.count == '0'
        id: assignee
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $commits = gh api "repos/${{ github.repository }}/commits?per_page=20" | ConvertFrom-Json
          $username = $commits |
            Where-Object { $_.author -and $_.author.login -and $_.author.type -ne 'Bot' } |
            Select-Object -First 1 -ExpandProperty author |
            Select-Object -ExpandProperty login
          "username=$username" >> $env:GITHUB_OUTPUT
          Write-Host "Found assignee: $username"

      - name: Create issue
        if: >-
          always()
          && github.event_name == 'schedule'
          && steps.gate.outputs.failed == 'true'
          && steps.existing.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: pwsh
        run: |
          $failed = @()
          if ('${{ needs.gate.result }}' -eq 'failure') { $failed += 'gate' }
          if ('${{ needs.checks.result }}' -eq 'failure') { $failed += 'checks' }
          if ('${{ needs.smoke.result }}' -eq 'failure') { $failed += 'smoke' }
          if ('${{ needs.thorough-conformance.result }}' -eq 'failure') { $failed += 'thorough-conformance' }
          if ('${{ needs.thorough-ui-bs.result }}' -eq 'failure') { $failed += 'thorough-ui-bs' }
          if ('${{ needs.nr-conformance.result }}' -eq 'failure') { $failed += 'nr-conformance' }
          $failedList = ($failed | ForEach-Object { "- $_" }) -join "`n"
          $body = @"
          ## Scheduled CI failure

          The weekly scheduled CI run had failures.

          **Failed jobs:**
          $failedList

          **Workflow run:** $env:RUN_URL

          ---
          _This issue was auto-created by the scheduled CI workflow.
          Close it once the failures are resolved._
          "@
          $body = ($body -split "`n" | ForEach-Object { $_.TrimStart() }) -join "`n"
          $title = "Scheduled CI failure — $(Get-Date -Format 'yyyy-MM-dd')"
          $assignee = '${{ steps.assignee.outputs.username }}'
          $ghArgs = @('issue', 'create', '--title', $title, '--body', $body, '--label', 'scheduled-ci-failure', '--repo', $env:GH_REPO)
          if ($assignee) { $ghArgs += '--assignee'; $ghArgs += $assignee }
          & gh @ghArgs
