version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-nuget:
        patterns:
          - "*"

  # `directories`, not `directory: "/"`: the root entry reads .github/workflows and a root
  # action.yml, nothing under .github/actions — and the composite action there pins actions of its
  # own (setup-dotnet, setup-java, cache, the app token) that it would never offer to bump, the same
  # blind spot a central-only NuGet pin is. The glob covers every action directory, a new one included.
  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "weekly"
    groups:
      all-actions:
        patterns:
          - "*"

  # THIS ENTRY IS WHAT MAKES global.json's PIN AFFORDABLE. `rollForward: latestPatch` holds the SDK
  # to one feature band, which is the point — `AnalysisLevel=latest-recommended` +
  # `TreatWarningsAsErrors=true` mean the enabled CA rule set is a function of the installed SDK, so
  # an unpinned band lets a toolchain we never chose turn untouched code into build errors. It has
  # already happened once without anyone deciding it: 10.0.400 shipped 2026-08-11 and CI built on it
  # from the next run onward, because every setup-dotnet step asked for a floating '10.0.x'. That run
  # was green. Nothing about the repo made it so, and nothing recorded that the band had moved.
  #
  # A pin with no bump path is just a slower version of the same problem, so the band has to keep
  # moving — as a PR, tested, with a diff. That is this entry. Dependabot's dotnet-sdk updater
  # rewrites `sdk.version` in global.json and does cross feature bands (dependabot-core#11668:
  # 9.0.102 -> 9.0.200), which is the case that matters; it reads `version` and ignores
  # `rollForward`, so `latestPatch` narrows what the SDK resolver accepts without narrowing what
  # Dependabot offers.
  #
  # Ungrouped deliberately. The nuget and actions groups exist to collapse a dozen routine bumps into
  # one PR; this ecosystem has exactly one dependency, and it is the one whose PR most needs to be
  # read on its own — a red build here is the analyzer band tightening, which is a decision, not
  # noise to be batched with a JSON serializer bump.
  #
  # global.json is the ONLY record of the SDK, so this entry's PR is the whole bump. The docker image
  # reads it too: docker/bs-spec.Dockerfile's build stage starts from runtime-deps and installs
  # global.json's `sdk.version` itself, and the `docker` CI job builds it on every bump PR. Until
  # 2026-10 the image named an SDK tag of its own that had to follow by hand, guarded by a check that
  # compared feature bands only — #559 (10.0.400 -> 10.0.402) stayed in the band, passed the check, and
  # failed the image build.
  # `ToolchainPinDriftTests.DockerImages_TakeTheSdkFromGlobalJson_AndTheRuntimeFromTheTargetFramework`
  # now refuses any `dotnet/sdk` image under docker/.
  #
  # There is deliberately no `package-ecosystem: docker` entry, because nothing under docker/ is a
  # version for it to move. The SDK comes from global.json, above. The runtime images name the channel
  # of the app's TargetFramework (`aspnet:X.Y` for netX.Y), a floating tag that takes each runtime
  # patch on the next build by itself; the only bump a docker updater could offer is a new major, and
  # a netX.Y app does not start on it. The channel moves with the TargetFramework, in the PR that
  # moves that, and the same test says so if it does not.
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
