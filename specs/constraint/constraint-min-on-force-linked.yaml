id: constraint-min-on-force-linked
category: constraint
description: Min selection constraint scoped to force produces structured error
tags:
  - validation-errors
  - structured-errors

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    categoryEntries:
      - id: cat-troops
        name: Troops
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-fe-troops
            targetId: cat-troops
            name: Troops
            primary: false
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          categoryLinks:
            - id: cl-sea-troops
              targetId: cat-troops
              name: Troops
              primary: true
          constraints:
            - id: con-min-force
              type: min
              value: 2
              field: selections
              scope: force

steps:
  - action: addForce
    forceEntryIndex: 0

  # Auto-select creates 2 Unit A (min=2, scope=force), constraint satisfied
  - expectedState:
      forces:
        - selectionCount: 2
          selections:
            - name: Unit A
            - name: Unit A

  # Remove one auto-selected entry (need 2, have 1 → violation)
  - action: deselectSelection
    forceIndex: 0
    selectionIndex: 0

  - expectedState:
      forces:
        - selectionCount: 1
      errors:
        - on: force
          from: se-unit-a/con-min-force
      engines:
        newrecruit:
          errors:
            - on: force fe-patrol
              from: se-unit-a/con-min-force
            - on: selection se-unit-a
              from: se-unit-a/con-min-force
