id: constraint-cost-field
category: constraint
description: Constraint on costs field limits based on point cost rather than count

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
        defaultCostLimit: -1
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Expensive Unit
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 200
          constraints:
            - id: c1
              type: max
              value: 500
              field: costs
              scope: parent

steps:
  - action: addForce
    forceEntryIndex: 0

  - expectedState:
      forces:
        - selectionCount: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  # 200 pts < max 500 pts — cost constraint satisfied
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Expensive Unit
