id: constraint-min-satisfied
category: constraint
description: A minimum constraint of 1 is satisfied when a selection is present

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogue:
    id: cat-1
    name: Test Catalogue
    gameSystemId: test-gs
    selectionEntries:
      - id: se-unit-a
        name: Unit A
        type: unit
        constraints:
          - id: con-min-1
            type: min
            value: 1
            field: selections
            scope: parent

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - assert: noValidationErrors
