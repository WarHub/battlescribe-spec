id: constraint-modified-by-modifier
category: constraint
description: A modifier can target a constraint's value field, changing the effective min/max
tags: []

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit
          name: Unit A
          type: unit
          constraints:
            - id: con-max
              type: max
              value: 1
              field: selections
              scope: parent
          modifiers:
            - type: increment
              field: con-max
              value: "2"
              conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: parent
                  childId: se-unit

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - expectedState:
      forces:
        - selectionCount: 0

  # First selection: triggers the modifier condition (atLeast 1 selection)
  # which increments max from 1 to 3
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit

  - expectedState:
      forces:
        - selectionCount: 1

  # Second selection: allowed because modifier changed max to 3
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit

  - expectedState:
      forces:
        - selectionCount: 2
