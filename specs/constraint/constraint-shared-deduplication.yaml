id: constraint-shared-deduplication
category: constraint
description: Shared entry validation errors are deduplicated (same error not reported twice)
tags: []

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Squad
          type: unit
          constraints:
            - id: con-1
              type: min
              value: 2
              field: selections
              scope: parent
              shared: true

steps:
  - action: addForce
    forceEntryIndex: 0

  # Auto-select creates 2 Squad (min=2, shared), constraint satisfied
  - expectedState:
      forces:
        - selectionCount: 2
          selections:
            - name: Squad
            - name: Squad

  # Add one more — still above min=2, no violation
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  # Shared constraint: min 2 selections satisfied with 3. The shared flag means
  # the error ID is tracked to prevent duplicates — even if multiple entry links
  # reference this shared entry, the error should only appear once.
  - expectedState:
      forces:
        - selectionCount: 3
      hasValidationErrors: false
