id: constraint-shared
category: constraint
description: Shared constraint is evaluated across multiple entries

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Unit A
          type: unit
          constraints:
            - id: c1
              type: max
              value: 5
              field: selections
              scope: parent
              shared: true
        - id: se-2
          name: Unit B
          type: unit
          constraints:
            - id: c2
              type: max
              value: 5
              field: selections
              scope: parent
              shared: true

steps:
  - action: addForce
    forceEntryIndex: 0

  - expectedState:
      forces:
        - selectionCount: 0

  # Select one of each — shared max=5 counts across both entries
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 1

  - expectedState:
      forces:
        - selectionCount: 2
          selections:
            - name: Unit A
            - name: Unit B
