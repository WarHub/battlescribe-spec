id: constraint-hidden-enforcement
category: constraint
engines:
  newrecruit: fail
description: Hidden entries are not shown to users but constraints still apply to them
tags: []

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-visible
          name: Visible Unit
          type: unit
        - id: se-hidden
          name: Hidden Unit
          type: unit
          hidden: true
          constraints:
            - id: con-min
              type: min
              value: 1
              field: selections
              scope: parent

steps:
  - action: addForce
    forceEntryIndex: 0

  # Hidden Unit auto-selected (min=1 constraint) — hidden from user but enforced by engine
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Hidden Unit

  # Manually add Visible Unit
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      forces:
        - selectionCount: 2
          selections:
            - name: Hidden Unit
            - name: Visible Unit
