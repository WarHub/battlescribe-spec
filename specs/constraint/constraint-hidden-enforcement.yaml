id: constraint-hidden-enforcement
category: constraint
description: Hidden entries are not shown to users but constraints still apply to them
tags: [design-difference]

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    categoryEntries:
      - id: ce-troops
        name: Troops
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-fe-troops
            targetId: ce-troops
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-visible
          name: Visible Unit
          type: unit
          categoryLinks:
            - id: cl-vis-troops
              targetId: ce-troops
              primary: true
        - id: se-hidden
          name: Hidden Unit
          type: unit
          hidden: true
          categoryLinks:
            - id: cl-hid-troops
              targetId: ce-troops
              primary: true
          constraints:
            - id: con-min
              type: min
              value: 1
              field: selections
              scope: parent

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  # Hidden Unit auto-selected (min=1 constraint) — hidden from user but enforced by engine
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Hidden Unit
              hidden: true
      engines:
        # NR doesn't auto-select hidden entries
        newrecruit:
          forces:
            - selectionCount: 0

  # Manually add Visible Unit
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-visible

  - expectedState:
      forces:
        - selectionCount: 2
          selections:
            - name: Hidden Unit
              hidden: true
            - name: Visible Unit
      errors:
        - on: selection se-hidden
          from: se-hidden/hidden
      engines:
        # NR only has the manually-selected Visible Unit
        newrecruit:
          forces:
            - selectionCount: 1
              selections:
                - name: Visible Unit
          errors: []
