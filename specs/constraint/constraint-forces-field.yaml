id: constraint-forces-field
category: constraint
description: Constraint with field=forces applies to force count instead of selection count
tags: []

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit
          name: Unit A
          type: unit
          constraints:
            - id: con-force-field
              type: atLeast
              value: 1
              field: forces
              scope: roster

steps:
  - action: addForce
    forceEntryIndex: 0

  - expectedState:
      forces:
        - selectionCount: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  # field=forces constraint counts forces, not selections — no validation triggered
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Unit A
