id: constraint-percent-value
category: constraint
description: >
  Constraint with percentValue is ignored by BS — uses raw value as flat limit.
  The threshold calculation code exists (c.java:1372 → h.java:260) and computes
  (parentCount / 100) * value, but BS never applies it. Instead, the raw value
  (50) is used as a flat max. So "max 50% of parent selections" is treated as
  "max 50 selections" in BS. NR correctly computes the percentage.
  See constraint-percent-value-raw-threshold for proof that BS uses the raw value.
tags: [battlescribe-bug]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
        defaultCostLimit: 2000
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Elite
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 300
          constraints:
            - id: c1
              type: max
              value: 50
              field: selections
              scope: parent
              percentValue: true

steps:
  - action: addForce
    forceEntryIndex: 0

  - expectedState:
      forces:
        - selectionCount: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  # percentValue=true: max = 50% of parent selections.
  # With 1 total selection: threshold should be 1/100*50 = 0.5.
  # 1 selection > 0.5 → should produce an error.
  # BS bug: ignores percentValue, treats raw value (50) as flat max.
  # 1 <= 50 → no error in BS.
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Elite
      engines:
        newrecruit:
          errors:
            - on: selection se-1
              from: se-1/c1
