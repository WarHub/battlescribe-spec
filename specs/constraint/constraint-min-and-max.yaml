id: constraint-min-and-max
category: constraint
description: Both min and max constraints on the same entry are evaluated

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          constraints:
            - id: con-min-1
              type: min
              value: 1
              field: selections
              scope: parent
            - id: con-max-2
              type: max
              value: 2
              field: selections
              scope: parent

steps:
  # Empty force
  - action: addForce
    forceEntryIndex: 0

  - assert: forceCount
    expected: 1

  # One selection
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - assert: selectionCount
    forceIndex: 0
    expected: 1

  # Two selections
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - assert: selectionCount
    forceIndex: 0
    expected: 2

  # Three selections
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - assert: selectionCount
    forceIndex: 0
    expected: 3
