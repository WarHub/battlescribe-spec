id: constraint-min-and-max
category: constraint
description: Both min and max constraints on the same entry are evaluated
tags:
  - validation-errors
  - structured-errors

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    categoryEntries:
      - id: cat-troops
        name: Troops
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-fe-troops
            targetId: cat-troops
            name: Troops
            primary: false
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          categoryLinks:
            - id: cl-sea-troops
              targetId: cat-troops
              name: Troops
              primary: true
          constraints:
            - id: con-min-1
              type: min
              value: 1
              field: selections
              scope: parent
            - id: con-max-2
              type: max
              value: 2
              field: selections
              scope: parent

steps:
  - action: addForce
    forceEntryIndex: 0

  # Auto-select creates 1 Unit A (min=1), min satisfied, below max=2
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Unit A

  # 2 total (at max=2 limit), both constraints satisfied
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      forces:
        - selectionCount: 2

  # 3 total (exceeds max=2), max constraint violated
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      forces:
        - selectionCount: 3
      errors:
        - on: selection se-unit-a
          from: se-unit-a/con-max-2
