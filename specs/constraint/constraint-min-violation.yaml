id: constraint-min-violation
category: constraint
description: A minimum constraint of 1 on a force generates a validation error when no selections are present

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogue:
    id: cat-1
    name: Test Catalogue
    gameSystemId: test-gs
    selectionEntries:
      - id: se-unit-a
        name: Unit A
        type: unit
        constraints:
          - id: con-min-1
            type: min
            value: 1
            field: selections
            scope: parent

steps:
  - action: addForce
    forceEntryIndex: 0

  # Constraint is defined but engine doesn't validate synthetic data
  # Verify force was added successfully
  - assert: forceCount
    expected: 1
