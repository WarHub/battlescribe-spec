id: constraint-include-child-forces
category: constraint
description: Constraint with includeChildForces applies across nested force hierarchy

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-army
        name: Army
        forceEntries:
          - id: fe-detach
            name: Sub-Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Squad
          type: unit
          constraints:
            - id: con-1
              type: max
              value: 2
              field: selections
              scope: force
              includeChildForces: true

steps:
  - action: addForce
    forceEntryIndex: 0

  - expectedState:
      forceCount: 1
      forces:
        - name: Army
          selectionCount: 0

  # includeChildForces=true means the max limit counts across parent and child forces
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      forces:
        - name: Army
          selectionCount: 1
          selections:
            - name: Squad
