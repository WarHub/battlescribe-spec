id: constraint-min-uncategorised-skipped
category: constraint
description: Parent-scope min constraint on an uncategorised entry is expected to remain non-validating

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          constraints:
            - id: con-min-1
              type: min
              value: 1
              field: selections
              scope: parent

steps:
  - action: addForce
    forceEntryIndex: 0

  # Expected current behavior: with no category wiring, entry resolves to "(No Category)"
  # and that category is skipped by validation traversal in the reference engine path.
  - assert: hasValidationErrors
    expected: false
