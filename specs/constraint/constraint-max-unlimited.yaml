id: constraint-max-unlimited
category: constraint
description: A max constraint with value -1 means unlimited (no error regardless of count)

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          constraints:
            - id: con-max-unlimited
              type: max
              value: -1
              field: selections
              scope: parent

steps:
  - action: addForce
    forceEntryIndex: 0

  - expectedState:
      forces:
        - selectionCount: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  # max=-1 means unlimited — 3 selections, no error
  - expectedState:
      forces:
        - selectionCount: 3
      hasValidationErrors: false
