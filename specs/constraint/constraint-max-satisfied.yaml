id: constraint-max-satisfied
category: constraint
description: A maximum constraint of 3 is satisfied when 2 selections are present

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          constraints:
            - id: con-max-3
              type: max
              value: 3
              field: selections
              scope: parent

steps:
  - action: addForce
    forceEntryIndex: 0

  - expectedState:
      forces:
        - selectionCount: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  # 2 selections < max=3 — satisfied, no error
  - expectedState:
      forces:
        - selectionCount: 2
