id: constraint-max-violation
category: constraint
description: Selecting more than max constraint still creates selections (engine tracks count)

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogue:
    id: cat-1
    name: Test Catalogue
    gameSystemId: test-gs
    selectionEntries:
      - id: se-unit-a
        name: Unit A
        type: unit
        constraints:
          - id: con-max-1
            type: max
            value: 1
            field: selections
            scope: parent

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - assert: selectionCount
    forceIndex: 0
    expected: 1

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - assert: selectionCount
    forceIndex: 0
    expected: 2
