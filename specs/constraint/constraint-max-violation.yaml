id: constraint-max-violation
category: constraint
description: Selecting more than max constraint still creates selections (engine tracks count)
tags: [battlescribe-bug]

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          constraints:
            - id: con-max-1
              type: max
              value: 1
              field: selections
              scope: parent

steps:
  - action: addForce
    forceEntryIndex: 0

  - expectedState:
      forces:
        - selectionCount: 0

  # 1 selection — at max=1 limit
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      forces:
        - selectionCount: 1

  # Engine allows selection beyond max — tracks count for validation
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      forces:
        - selectionCount: 2
      engines:
        newrecruit:
          errors:
            - on: selection se-unit-a
              from: se-unit-a/con-max-1
