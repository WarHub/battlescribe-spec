id: constraint-include-child-selections
category: constraint
description: Constraint with includeChildSelections counts child selections too

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-parent
          name: Squad
          type: unit
          constraints:
            - id: c1
              type: max
              value: 3
              field: selections
              scope: parent
              includeChildSelections: true
          selectionEntries:
            - id: se-child
              name: Trooper
              type: model

steps:
  - action: addForce
    forceEntryIndex: 0

  - expectedState:
      forces:
        - selectionCount: 0

  # includeChildSelections=true means the max counts parent + child selections
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Squad
