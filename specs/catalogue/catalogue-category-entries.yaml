id: catalogue-category-entries
category: catalogue
tags: [catalogue, categoryEntry]
description: Catalogue defines own categoryEntries used in force categories

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      categoryEntries:
        - id: cat-custom
          name: Custom Category
      selectionEntries:
        - id: se-1
          name: Marine
          type: unit
          categoryLinks:
            - id: cl-custom
              targetId: cat-custom
              name: Custom Category
              primary: true

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      forces:
        - selections:
            - name: Marine
              categories:
                - name: Custom Category
                  primary: true
