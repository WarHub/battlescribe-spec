id: catalogue-force-entries
category: catalogue
tags: [catalogue, forceEntry]
description: Catalogue defines own forceEntries that can be used to add forces

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-gs
        name: GS Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      forceEntries:
        - id: fe-cat
          name: Catalogue Detachment
      selectionEntries:
        - id: se-1
          name: Marine
          type: unit

steps:
  - action: addForce
    forceEntryIndex: 1

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      forces:
        - name: Catalogue Detachment
          selections:
            - name: Marine
