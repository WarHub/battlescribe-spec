id: rule-with-modifier
category: rule
description: >
  Add a rule to a catalogue and nest a modifier inside it that sets the rule's
  description. Verifies that modifiers can be created on a rule.

setup:
  gameSystem:
    id: gs-1
    name: Test System
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1

steps:
  - action: addEntry
    id: add-rule
    parentId: cat-1
    entryType: rule
    name: Adaptive Tactics

  - action: addEntry
    id: add-mod
    parentId: ${{ steps.add-rule.entryId }}
    entryType: modifier

  - action: setFields
    entryId: ${{ steps.add-mod.entryId }}
    fields:
      field: description
      type: set
      value: Updated rule text.

  - expectedState:
      catalogues:
        - id: cat-1
          rules:
            - name: Adaptive Tactics
              entryType: rule
              children:
                - entryType: modifier
                  fields:
                    field: description
                    type: set
                    value: Updated rule text.
