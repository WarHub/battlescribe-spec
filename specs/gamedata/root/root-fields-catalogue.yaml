id: root-fields-catalogue
category: root
description: >
  Set catalogue root metadata fields (authorName, authorContact, authorUrl, readme)
  and toggle the library flag. Verifies the catalogue root field surface.

engines:
  newrecruit: skip
  newrecruit-ui: skip

setup:
  gameSystem:
    id: gs-1
    name: Test System
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1

steps:
  - action: setField
    entryId: cat-1
    field: authorName
    value: Jane Designer

  - action: setField
    entryId: cat-1
    field: authorContact
    value: jane@example.com

  - action: setField
    entryId: cat-1
    field: authorUrl
    value: https://jane.example.com

  - action: setField
    entryId: cat-1
    field: readme
    value: Catalogue notes.

  - action: setField
    entryId: cat-1
    field: library
    value: "true"

  - expectedState:
      catalogues:
        - id: cat-1
          fields:
            authorName: Jane Designer
            authorContact: jane@example.com
            authorUrl: https://jane.example.com
            readme: Catalogue notes.
            library: "true"
