id: root-fields-catalogue
category: root
description: >
  Set catalogue root metadata fields (authorName, authorContact, authorUrl, readme)
  and toggle the library flag. Verifies the catalogue root field surface.

setup:
  edit: cat-1
  gameSystem:
    id: gs-1
    name: Test System
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1

steps:
  - action: setFields
    entryId: cat-1
    fields:
      authorName: Jane Designer
      authorContact: jane@example.com
      authorUrl: https://jane.example.com
      readme: Catalogue notes.
      library: "true"

  - expectedState:
      catalogues:
        - id: cat-1
          fields:
            authorName: Jane Designer
            authorContact: jane@example.com
            authorUrl: https://jane.example.com
            readme: Catalogue notes.
            library: "true"
