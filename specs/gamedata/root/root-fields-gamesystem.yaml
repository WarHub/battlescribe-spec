id: root-fields-gamesystem
category: root
description: >
  Set game-system root metadata fields (authorName, authorUrl, readme, revision)
  and verify they round-trip. These are BaseRootEntry fields on the game system.

# newrecruit-ui: bespoke NR Editor panel/query widgets for this entity family are not
# yet driven by the pure-UI driver (no store writes allowed); tracked for follow-up.
engines:
  newrecruit-ui: skip

setup:
  gameSystem:
    id: gs-1
    name: Test System

steps:
  - action: setFields
    entryId: gs-1
    fields:
      authorName: Jane Designer
      authorUrl: https://jane.example.com
      readme: System design notes.
      revision: "7"
      battleScribeVersion: "2.03"

  - expectedState:
      gameSystem:
        id: gs-1
        fields:
          authorName: Jane Designer
          authorUrl: https://jane.example.com
          readme: System design notes.
          revision: "7"
          battleScribeVersion: "2.03"
