id: root-fields-gamesystem
category: root
description: >
  Set game-system root metadata fields (authorName, authorUrl, readme, revision)
  and verify they round-trip. These are BaseRootEntry fields on the game system.

engines:
  newrecruit: skip
  newrecruit-ui: skip

setup:
  gameSystem:
    id: gs-1
    name: Test System

steps:
  - action: setField
    entryId: gs-1
    field: authorName
    value: Jane Designer

  - action: setField
    entryId: gs-1
    field: authorUrl
    value: https://jane.example.com

  - action: setField
    entryId: gs-1
    field: readme
    value: System design notes.

  - action: setField
    entryId: gs-1
    field: revision
    value: "7"

  - expectedState:
      gameSystem:
        id: gs-1
        fields:
          authorName: Jane Designer
          authorUrl: https://jane.example.com
          readme: System design notes.
          revision: "7"
