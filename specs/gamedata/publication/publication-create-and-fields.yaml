id: publication-create-and-fields
category: publication
description: >
  Add a publication to a catalogue and set its metadata fields (shortName, publisher,
  publicationDate). Verifies publication creation and its field surface.

# The NewRecruit Data Editor UI does not expose these fields the same way and times out
# there. NR is not a gate; skip the NR editor UI.
engines:
  newrecruit-ui: skip

setup:
  gameSystem:
    id: gs-1
    name: Test System
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1

steps:
  - action: addEntry
    id: add-pub
    parentId: cat-1
    entryType: publication
    name: Codex

  - action: setField
    entryId: ${{ steps.add-pub.entryId }}
    field: shortName
    value: Cdx

  - action: setField
    entryId: ${{ steps.add-pub.entryId }}
    field: publisher
    value: Games Workshop

  - action: setField
    entryId: ${{ steps.add-pub.entryId }}
    field: publicationDate
    value: "2023"

  - action: setField
    entryId: ${{ steps.add-pub.entryId }}
    field: publisherUrl
    value: https://example.com

  - expectedState:
      catalogues:
        - id: cat-1
          publications:
            - name: Codex
              fields:
                shortName: Cdx
                publisher: Games Workshop
                publicationDate: "2023"
                publisherUrl: https://example.com
