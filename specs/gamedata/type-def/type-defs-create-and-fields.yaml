id: type-defs-create-and-fields
category: type-def
description: >
  Create the game-system data-type definitions: a cost type (with default cost limit),
  and a profile type with a nested characteristic type. Verifies creation and fields for
  the root type-definition entities.

engines:
  newrecruit: skip
  newrecruit-ui: skip

setup:
  gameSystem:
    id: gs-1
    name: Test System

steps:
  - action: addEntry
    id: add-cost-type
    parentId: gs-1
    entryType: costType
    name: Points

  - action: setField
    entryId: ${{ steps.add-cost-type.entryId }}
    field: defaultCostLimit
    value: "2000"

  - action: setField
    entryId: ${{ steps.add-cost-type.entryId }}
    field: hidden
    value: "true"

  - action: addEntry
    id: add-profile-type
    parentId: gs-1
    entryType: profileType
    name: Weapon

  - action: addEntry
    id: add-char-type
    parentId: ${{ steps.add-profile-type.entryId }}
    entryType: characteristicType
    name: Range

  - expectedState:
      gameSystem:
        id: gs-1
        costTypes:
          - name: Points
            hidden: true
            fields:
              defaultCostLimit: "2000"
        profileTypes:
          - name: Weapon
            children:
              - name: Range
                entryType: characteristicType
