id: nr-shared-collections
category: nr
description: >
  NewRecruit adds catalogue-root shared collections beyond the BattleScribe set: `sharedForceEntries`
  and `sharedAssociations`. Original BattleScribe has neither, so it is skipped; both NewRecruit
  engines must round-trip them.
tags: [newrecruit-addition, sharedForceEntries, sharedAssociations]

engines:
  battlescribe: skip
  battlescribe-ui: skip

setup:
  gameSystem:
    id: gs-1
    name: Test System
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1
      sharedForceEntries:
        - id: sfe-1
          name: Detachment
      sharedAssociations:
        - id: sa-1
          name: Warlord
          min: 1
          max: 1
          scope: roster
          childId: any

steps:
  - expectedState:
      catalogues:
        - id: cat-1
          sharedForceEntries:
            - id: sfe-1
              name: Detachment
          sharedAssociations:
            - id: sa-1
              name: Warlord
              fields:
                min: "1"
                max: "1"
