id: error-broken-entry-link
category: validation
description: >
  An entry link whose target does not exist produces a validation error in the data
  editor. Verifies that the editor's error list is extracted and matched. The error is
  asserted on battlescribe-ui (the Data Editor); the in-process reference engine does
  not surface data-model validation, so it checks structure only.

engines:
  newrecruit: skip
  newrecruit-ui: skip

setup:
  gameSystem:
    id: gs-1
    name: Test System
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1
      entryLinks:
        - id: el-broken
          name: Broken Link
          targetId: does-not-exist
          type: selectionEntry

steps:
  - expectedState:
      catalogues:
        - id: cat-1
          entryLinks:
            - id: el-broken
              entryType: entryLink
      engines:
        battlescribe-ui:
          errors:
            - message: EntryLink must have a target that exists
