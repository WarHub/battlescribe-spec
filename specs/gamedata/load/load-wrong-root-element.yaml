id: load-wrong-root-element
category: load
description: >
  The root element has to be the one the file type says it is. A document whose root is <roster> is
  refused as "Invalid data XML" even when it carries a complete, valid catalogue attribute set — so
  the second payload below is wrong in exactly one way, its name, and that is enough.

  This is the "missing required element" end of #268's schema-violation scope, and the check turns
  out to sit somewhere unexpected: not in the model binder, which never asks what a root is called
  and would happily bind this one as a catalogue, but in the shallow read the editor takes first to
  build the file-list index entry. Which is why the refusal arrives before any attribute is
  complained about — the first payload here is missing 'revision' too, and never gets told so.

  The spec is also the reason the reference adapter now takes that shallow read at all. It went
  straight to the binder, so it loaded the second payload as a catalogue while the Data Editor
  refused it; running the UI lane found that, and it was fixed rather than recorded as a per-engine
  override (AGENTS.md: the app is normative, and the divergence was our artefact).

# newrecruit-ui runs this spec: NR's own importer refuses the payload, and says so in the one place
# it says anything — a console.error from the single catch in its upload handler. newrecruit (store
# direct) stays out, because its LoadFile parses the payload with a DOMParser call inside our own
# adapter, so what it accepts or refuses would be our parser's answer and not NewRecruit's.
engines:
  newrecruit: skip

setup:
  edit: cat-1
  gameSystem:
    id: gs-1
    name: Seed System
  catalogues:
    - id: cat-1
      name: Seed Catalogue
      gameSystemId: gs-1
      selectionEntries:
        - id: se-seed
          name: Seed Unit
          type: unit

steps:
  # A roster, with a roster's attributes — so it is both mislabelled and missing what a catalogue
  # needs. The complaint is about the label, because that is what gets looked at first.
  - action: openFile
    content: |
      <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <roster id="ros-1" name="An Actual Roster" battleScribeVersion="2.03" gameSystemId="gs-1"/>
    expectFailure:
      messageContains: "Invalid data XML"
      engines:
        # NR reaches the same verdict from the other end: it parses the document happily and then
        # finds no catalogue or gameSystem in what came back.
        newrecruit-ui:
          messageContains: "not a valid system or catalogue"

  # The same root element, now carrying a full and valid catalogue attribute set. Still refused, and
  # with the same sentence: nothing about this file is wrong except what its root element is called.
  - action: openFile
    content: |
      <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <roster id="cat-disguised" name="Disguised" revision="1" battleScribeVersion="2.03" library="false" gameSystemId="gs-1" gameSystemRevision="1" xmlns="http://www.battlescribe.net/schema/catalogueSchema"/>
    expectFailure:
      messageContains: "Invalid data XML"
      engines:
        # NR reaches the same verdict from the other end: it parses the document happily and then
        # finds no catalogue or gameSystem in what came back.
        newrecruit-ui:
          messageContains: "not a valid system or catalogue"

  # Two refusals, nothing loaded: the file that was open is still the only one there.
  - expectedState:
      catalogues:
        - id: cat-1
          name: Seed Catalogue
          selectionEntries:
            - id: se-seed
              name: Seed Unit
