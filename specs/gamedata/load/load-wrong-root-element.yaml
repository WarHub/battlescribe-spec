id: load-wrong-root-element
category: load
description: >
  A document whose root element is <roster> is refused by the Data Editor and accepted by the
  in-process reader, which binds it as a catalogue on the strength of its attributes alone. The
  same payload, twice, with the second one wearing a complete catalogue attribute set: the app
  says "Invalid data XML" to both, and the reference engine takes the second.

  This is the "missing required element" end of #268's schema-violation scope, and the answer
  turned out to depend on which BattleScribe you ask. The app checks what the root element is
  called. The in-process adapter reaches DataUtils' catalogue reader directly, so nothing ever
  asks — a spec written against it alone would have recorded "the root element is not checked" as
  BattleScribe's behaviour, and that is exactly what running the UI lane was for.

  Recorded as a divergence rather than smoothed over, but it should not stay one: by the rule in
  AGENTS.md the app is normative and the reference adapter has the gap, so the fix is for
  BattleScribeGameDataEngine.LoadFile to make the same check and for this spec to lose its
  override — the shape #450 ended in for the roster reader's unknown-game-system check.

# newrecruit is skipped for a reason unrelated to the above: its store-direct gamedata LoadFile
# picks the root with a DOMParser query inside our own adapter, so what it makes of a mislabelled
# root is our parser's answer and not NewRecruit's. newrecruit-ui uploads through NR's own file
# input, but reports a rejected file only as a navigation timeout in our words, and mid-spec load
# through the SPA file list is the flake that already opts export/openfile-inline out.
engines:
  newrecruit: skip
  newrecruit-ui: skip

setup:
  edit: cat-1
  gameSystem:
    id: gs-1
    name: Seed System
  catalogues:
    - id: cat-1
      name: Seed Catalogue
      gameSystemId: gs-1
      selectionEntries:
        - id: se-seed
          name: Seed Unit
          type: unit

steps:
  # A roster, with a roster's attributes. Both refuse — and the two reasons are the whole finding:
  # the app refuses it for being a roster, the reference reader for being an incomplete catalogue.
  - action: openFile
    content: |
      <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <roster id="ros-1" name="An Actual Roster" battleScribeVersion="2.03" gameSystemId="gs-1"/>
    expectFailure:
      messageContains: "on field 'revision'"
      engines:
        battlescribe-ui:
          messageContains: "Invalid data XML"

  # The same root element, now carrying a full catalogue attribute set — so the only thing still
  # wrong with it is its name. The app still refuses. The reference reader loads it as a catalogue.
  - action: openFile
    content: |
      <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <roster id="cat-disguised" name="Disguised" revision="1" battleScribeVersion="2.03" library="false" gameSystemId="gs-1" gameSystemRevision="1" xmlns="http://www.battlescribe.net/schema/catalogueSchema"/>
    expectFailure:
      expected: false
      engines:
        battlescribe-ui:
          messageContains: "Invalid data XML"

  # Where that leaves each: a catalogue the reference engine did not know it should refuse, and for
  # the app the file it had open all along, untouched by two refusals.
  - expectedState:
      catalogues:
        - id: cat-1
          name: Seed Catalogue
          selectionEntries:
            - id: se-seed
              name: Seed Unit
        - id: cat-disguised
          name: Disguised
      engines:
        battlescribe-ui:
          catalogues:
            - id: cat-1
              name: Seed Catalogue
              selectionEntries:
                - id: se-seed
                  name: Seed Unit
