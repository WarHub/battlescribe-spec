id: load-wrong-root-element
category: load
description: >
  The root element's name is not checked. A document whose root is <roster> loads as a catalogue,
  provided it carries the attributes a catalogue requires — and is refused when it does not, with
  a message naming the missing attribute and never the element.

  This is the "missing required element" end of #268's schema-violation scope, and the answer is
  that there is no such check to violate. What decides whether a file is a catalogue is the set of
  attributes on its root, so the two steps below are the same wrong document twice: the first is
  refused for a reason that has nothing to do with it being a roster, and the second, wrong in
  exactly the same way and merely better dressed, is accepted as a catalogue.

  Which reader is even asked is decided one level further out, by the adapter, from the presence
  of a <gameSystem> element — so this file never had a chance to be read as the roster it says it
  is. That is worth pinning: a spec that assumed the root element identified the file would be
  asserting a check that does not exist.

# Opted out for two measured reasons rather than an untested assumption. The UI lanes are #268's
# open question: the BS Data Editor does refuse a file whose attributes do not bind, through a
# modal dialog ("File was corrupted and has been deleted"), and this payload's root tag is
# complete, so BsGameDataUiEngine can read the id it stages the file under. What is missing is only
# a DataEditorActions handler that reports the dialog as a refusal instead of as an unhandled
# modal. The NR store-direct lane picks its root with a DOMParser query inside our own adapter, so
# what it makes of a mislabelled root is our parser's answer and not NewRecruit's.
engines:
  battlescribe-ui: skip
  newrecruit: skip
  newrecruit-ui: skip

setup:
  edit: cat-1
  gameSystem:
    id: gs-1
    name: Seed System
  catalogues:
    - id: cat-1
      name: Seed Catalogue
      gameSystemId: gs-1
      selectionEntries:
        - id: se-seed
          name: Seed Unit
          type: unit

steps:
  # A roster, with a roster's attributes. Refused — but for the missing catalogue attribute, which
  # is the point: the complaint is that this catalogue is incomplete, not that it is a roster.
  - action: openFile
    content: |
      <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <roster id="ros-1" name="An Actual Roster" battleScribeVersion="2.03" gameSystemId="gs-1"/>
    expectFailure:
      messageContains: "on field 'revision'"

  # The same root element, now carrying a full catalogue attribute set. It loads.
  - action: openFile
    content: |
      <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <roster id="cat-disguised" name="Disguised" revision="1" battleScribeVersion="2.03" library="false" gameSystemId="gs-1" gameSystemRevision="1" xmlns="http://www.battlescribe.net/schema/catalogueSchema"/>
    expectFailure: false

  # And it is a catalogue, sitting in the catalogue list beside the one that was already open.
  - expectedState:
      catalogues:
        - id: cat-1
          name: Seed Catalogue
          selectionEntries:
            - id: se-seed
              name: Seed Unit
        - id: cat-disguised
          name: Disguised
