id: load-malformed-catalogue
category: load
description: >
  A .cat payload that is not well-formed XML is refused by the editor, and the file that was open
  stays open. This is the path #268 was carved out of #173 to own: the editor never produces a
  validation list for a file it will not parse, so expectedState.errors has nothing to match and
  the refusal itself has to be the assertion.

  The state assertion afterwards is the other half — a refused load must leave the previously
  opened catalogue untouched, not a partially replaced one.

# Opted out for two measured reasons rather than an untested assumption. The UI lanes are #268's
# open question, and half of it is now answered: the Data Editor does refuse this class of file, and
# it does so with a modal dialog rather than a silent rejection, so the lane is not structurally
# mute — what it lacks is a handler in DataEditorActions that reports the dialog as a refusal
# instead of as an unhandled modal. A truncated payload needs more than that, because
# BsGameDataUiEngine.LoadFile stages the file under an id read from a root tag this payload never
# finishes writing. The NR store-direct lane parses the payload with a DOMParser call inside our own
# adapter, so what it accepts or refuses there is our parser's answer and not NewRecruit's.
engines:
  battlescribe-ui: skip
  newrecruit: skip
  newrecruit-ui: skip

setup:
  edit: cat-1
  gameSystem:
    id: gs-1
    name: Test System
  catalogues:
    - id: cat-1
      name: Seed Catalogue
      gameSystemId: gs-1
      selectionEntries:
        - id: se-seed
          name: Seed Unit
          type: unit

steps:
  # Truncated mid-element: the <catalogue> tag never closes and no element is terminated.
  - action: openFile
    content: |
      <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <catalogue id="cat-broken" name="Broken" revision="1" battleScribeVersion="2.03"
    expectFailure:
      messageContains: "ParseError"

  # The refusal changed nothing: the seed catalogue is still loaded and still holds its entry.
  - expectedState:
      catalogues:
        - id: cat-1
          name: Seed Catalogue
          selectionEntries:
            - id: se-seed
              name: Seed Unit
