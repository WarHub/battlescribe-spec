id: load-malformed-catalogue
category: load
description: >
  A .cat payload that is not well-formed XML is refused by the editor, and the file that was open
  stays open. This is the path #268 was carved out of #173 to own: the editor never produces a
  validation list for a file it will not parse, so expectedState.errors has nothing to match and
  the refusal itself has to be the assertion.

  The state assertion afterwards is the other half — a refused load must leave the previously
  opened catalogue untouched, not a partially replaced one.

# newrecruit-ui runs this spec: NR's own importer refuses the payload, and says so in the one place
# it says anything — a console.error from the single catch in its upload handler. newrecruit (store
# direct) stays out, because its LoadFile parses the payload with a DOMParser call inside our own
# adapter, so what it accepts or refuses would be our parser's answer and not NewRecruit's.
engines:
  newrecruit: skip

setup:
  edit: cat-1
  gameSystem:
    id: gs-1
    name: Test System
  catalogues:
    - id: cat-1
      name: Seed Catalogue
      gameSystemId: gs-1
      selectionEntries:
        - id: se-seed
          name: Seed Unit
          type: unit

steps:
  # Truncated mid-element: the <catalogue> tag never closes and no element is terminated.
  - action: openFile
    content: |
      <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <catalogue id="cat-broken" name="Broken" revision="1" battleScribeVersion="2.03"
    expectFailure:
      # The parser's own sentence, which both BattleScribe lanes emit — the in-process reader wraps
      # it in "ParseError at [row,col]" and the Data Editor in a SAXParseException, and pinning
      # either framing would assert the wrapper rather than the complaint.
      messageContains: "must start and end within the same entity"
      engines:
        # NewRecruit has no designed message for this. Its XML parser walks off the end of the
        # truncated document and throws a TypeError, which its upload handler catches and writes to
        # console.error — the whole of what NR tells anyone. Pinned as-is rather than smoothed into a
        # sentence NR never said.
        newrecruit-ui:
          messageContains: "reading 'tagName'"

  # The refusal changed nothing: the seed catalogue is still loaded and still holds its entry.
  - expectedState:
      catalogues:
        - id: cat-1
          name: Seed Catalogue
          selectionEntries:
            - id: se-seed
              name: Seed Unit
