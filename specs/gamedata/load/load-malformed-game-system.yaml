id: load-malformed-game-system
category: load
description: >
  A .gst payload that is not well-formed XML is refused by the editor, and the game system that
  was open stays open. The .gst twin of load-malformed-catalogue, and not a restatement of it:
  the reader is chosen from the root element, so a catalogue and a game system are read by two
  different deserializer entry points and a refusal on one is no evidence about the other.

  The state assertion afterwards is the other half — a refused load must leave the game system
  that was open untouched, not a partially replaced one.

# newrecruit-ui runs this spec: NR's own importer refuses the payload, and says so in the one place
# it says anything — a console.error from the single catch in its upload handler. newrecruit (store
# direct) stays out, because its LoadFile parses the payload with a DOMParser call inside our own
# adapter, so what it accepts or refuses would be our parser's answer and not NewRecruit's.
engines:
  newrecruit: skip

setup:
  edit: gs-1
  gameSystem:
    id: gs-1
    name: Seed System
    categoryEntries:
      - id: ce-troops
        name: Troops
      - id: ce-elites
        name: Elites

steps:
  # Truncated mid-element: the <gameSystem> tag never closes and no element is terminated.
  - action: openFile
    content: |
      <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <gameSystem id="gs-broken" name="Broken System" revision="1" battleScribeVersion="2.03"
    expectFailure:
      # The parser's own sentence, which both BattleScribe lanes emit — the in-process reader wraps
      # it in "ParseError at [row,col]" and the Data Editor in a SAXParseException, and pinning
      # either framing would assert the wrapper rather than the complaint.
      messageContains: "must start and end within the same entity"
      engines:
        # NewRecruit has no designed message for this. Its XML parser walks off the end of the
        # truncated document and throws a TypeError, which its upload handler catches and writes to
        # console.error — the whole of what NR tells anyone. Pinned as-is rather than smoothed into a
        # sentence NR never said.
        newrecruit-ui:
          messageContains: "reading 'tagName'"

  # The refusal changed nothing: the seed system is still loaded and still holds its categories.
  - expectedState:
      gameSystem:
        id: gs-1
        name: Seed System
        categoryEntries:
          - id: ce-troops
            name: Troops
          - id: ce-elites
            name: Elites
