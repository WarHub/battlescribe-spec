id: profile-fields
category: profile
description: >
  Set the metadata fields of a profile: typeName, page, publicationId and hidden.
  Verifies the profile field surface beyond typeId and characteristics.

# The NewRecruit Data Editor UI does not expose these fields the same way and times out
# there. NR is not a gate; skip the NR editor UI.
engines:
  newrecruit-ui: skip

setup:
  gameSystem:
    id: gs-1
    name: Test System
    profileTypes:
      - id: pt-1
        name: Unit
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1
      publications:
        - id: pub-1
          name: Core Book
      selectionEntries:
        - id: se-1
          name: Tactical Squad
          type: unit

steps:
  - action: addEntry
    id: add-profile
    parentId: se-1
    entryType: profile
    name: Marine

  - action: setField
    entryId: ${{ steps.add-profile.entryId }}
    field: page
    value: "27"

  - action: setField
    entryId: ${{ steps.add-profile.entryId }}
    field: publicationId
    value: pub-1

  - action: setField
    entryId: ${{ steps.add-profile.entryId }}
    field: hidden
    value: "true"

  - action: setField
    entryId: ${{ steps.add-profile.entryId }}
    field: typeName
    value: Infantry

  - expectedState:
      catalogues:
        - id: cat-1
          selectionEntries:
            - id: se-1
              children:
                - name: Marine
                  entryType: profile
                  hidden: true
                  fields:
                    page: "27"
                    publicationId: pub-1
                    typeName: Infantry
