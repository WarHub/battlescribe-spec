id: modifier-list-types
category: modifier
description: >
  Create modifiers of the list/category modifier types (add, remove, set-primary,
  unset-primary) and verify each type is persisted. Completes the modifier-type enum
  alongside the string modifier types.

# Each modifier targets a category (`field: category`, `value: <categoryId>`): the
# add/remove/set-primary/unset-primary types belong to the CategoryModifierType enum, which is only
# valid on a category-typed field. NR's editor (correctly) only offers those types once the field is
# `category`, and the real-life modifier always carries the target category — a type-only modifier
# with no field is a degenerate form. The expectedState asserts `type` (the enum under test) and
# `field`.

setup:
  edit: cat-1
  gameSystem:
    id: gs-1
    name: Test System
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1
      categoryEntries:
        - id: ce-troops
          name: Troops
      selectionEntries:
        - id: se-1
          name: Tactical Squad
          type: unit

steps:
  - action: addEntry
    id: m-add
    parentId: se-1
    entryType: modifier

  - action: setFields
    entryId: ${{ steps.m-add.entryId }}
    fields:
      field: category
      value: ce-troops
      type: add

  - action: addEntry
    id: m-rem
    parentId: se-1
    entryType: modifier

  - action: setFields
    entryId: ${{ steps.m-rem.entryId }}
    fields:
      field: category
      value: ce-troops
      type: remove

  - action: addEntry
    id: m-setp
    parentId: se-1
    entryType: modifier

  - action: setFields
    entryId: ${{ steps.m-setp.entryId }}
    fields:
      field: category
      value: ce-troops
      type: set-primary

  - action: addEntry
    id: m-unsetp
    parentId: se-1
    entryType: modifier

  - action: setFields
    entryId: ${{ steps.m-unsetp.entryId }}
    fields:
      field: category
      value: ce-troops
      type: unset-primary

  - expectedState:
      catalogues:
        - id: cat-1
          selectionEntries:
            - id: se-1
              children:
                - entryType: modifier
                  fields:
                    type: add
                    field: category
                - entryType: modifier
                  fields:
                    type: remove
                    field: category
                - entryType: modifier
                  fields:
                    type: set-primary
                    field: category
                - entryType: modifier
                  fields:
                    type: unset-primary
                    field: category
