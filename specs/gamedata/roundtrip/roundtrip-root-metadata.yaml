id: roundtrip-root-metadata
category: roundtrip
description: >
  Round-trip fidelity for root metadata: author and revision fields set on the game system (.gst)
  and the catalogue (.cat) survive a save + reload. Exercises both file types' root serialization.

# See roundtrip-add-entry for the engine-gating rationale (#30).
engines:
  newrecruit: skip
  battlescribe-ui: skip
  newrecruit-ui: skip

setup:
  gameSystem:
    id: gs-1
    name: Test System
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1

steps:
  - action: setFields
    entryId: gs-1
    fields:
      authorName: Ada Lovelace

  - action: setFields
    entryId: cat-1
    fields:
      authorName: Grace Hopper
      revision: "7"

  - action: reload

  - expectedState:
      gameSystem:
        fields:
          authorName: Ada Lovelace
      catalogues:
        - id: cat-1
          fields:
            authorName: Grace Hopper
            revision: "7"
