id: roundtrip-add-entry
category: roundtrip
description: >
  Round-trip fidelity: an entry added and named via the editor survives a save + reload. Adds a
  selection entry, asserts it is present, reloads (serialize to .cat/.gst and load back), then
  asserts the same structure — proving persistence preserved the new entry.

# Round-trip is about the XML-based engines: the in-process reference engine, the real BattleScribe
# Data Editor (battlescribe-ui, save-and-reopen via the Java agent), and the real NR Editor
# (newrecruit-ui, export → reupload → reopen) all serialize to .cat/.gst and load back. The
# store-direct `newrecruit` engine is an in-memory structural mirror with no on-disk form, so it skips.
engines:
  newrecruit: skip

setup:
  gameSystem:
    id: gs-1
    name: Test System
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1

steps:
  - action: addEntry
    id: add-unit
    parentId: cat-1
    entryType: selectionEntry
    name: Space Marine

  - expectedState:
      catalogues:
        - id: cat-1
          selectionEntries:
            - name: Space Marine
              entryType: selectionEntry

  - action: reload

  - expectedState:
      catalogues:
        - id: cat-1
          selectionEntries:
            - name: Space Marine
              entryType: selectionEntry
