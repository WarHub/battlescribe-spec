id: link-types
category: links
description: >
  Set the type field of an entry link (to selectionEntryGroup) and an info link
  (to rule). Verifies the link type enums round-trip.

engines:
  newrecruit-ui: skip

setup:
  gameSystem:
    id: gs-1
    name: Test System
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1
      sharedSelectionEntryGroups:
        - id: sseg-1
          name: Wargear Group
      sharedRules:
        - id: sr-1
          name: Shared Rule
      selectionEntries:
        - id: se-1
          name: Tactical Squad
          type: unit

steps:
  - action: addLink
    id: add-entry-link
    parentId: cat-1
    linkType: entryLink
    targetId: sseg-1

  - action: setFields
    entryId: ${{ steps.add-entry-link.entryId }}
    fields:
      type: selectionEntryGroup

  - action: addLink
    id: add-info-link
    parentId: se-1
    linkType: infoLink
    targetId: sr-1

  - action: setFields
    entryId: ${{ steps.add-info-link.entryId }}
    fields:
      type: rule

  - expectedState:
      catalogues:
        - id: cat-1
          entryLinks:
            - entryType: entryLink
              fields:
                targetId: sseg-1
                type: selectionEntryGroup
          selectionEntries:
            - id: se-1
              children:
                - entryType: infoLink
                  fields:
                    targetId: sr-1
                    type: rule
