id: ce-set-field-publication
category: entry
description: >
  Set the publicationId field of a category entry and verify it is stored
  in the fields dictionary.
setup:
  gameSystem:
    id: gs-1
    name: Test System
    publications:
      - id: pub-index
        name: Index Book
    categoryEntries:
      - id: ce-1
        name: Dedicated Transport

steps:
  - action: setField
    entryId: ce-1
    field: publicationId
    value: pub-index

  - expectedState:
      gameSystem:
        id: gs-1
        categoryEntries:
          - id: ce-1
            fields:
              publicationId: pub-index
