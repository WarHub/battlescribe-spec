id: seg-set-field-hidden
category: entry
description: >
  Set the hidden field of a selection entry group and verify the state
  reflects it.

setup:
  edit: cat-1
  gameSystem:
    id: gs-1
    name: Test System
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1
      sharedSelectionEntryGroups:
        - id: seg-1
          name: Hidden Options

steps:
  - action: setFields
    entryId: seg-1
    fields:
      hidden: "true"

  - expectedState:
      catalogues:
        - id: cat-1
          sharedSelectionEntryGroups:
            - id: seg-1
              name: Hidden Options
              hidden: true
