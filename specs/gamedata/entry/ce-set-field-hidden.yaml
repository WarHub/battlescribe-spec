id: ce-set-field-hidden
category: entry
description: >
  Set the hidden field of a category entry and verify the state reflects it.

setup:
  edit: gs-1
  gameSystem:
    id: gs-1
    name: Test System
    categoryEntries:
      - id: ce-1
        name: Hidden Category

steps:
  - action: setFields
    entryId: ce-1
    fields:
      hidden: "true"

  - expectedState:
      gameSystem:
        id: gs-1
        categoryEntries:
          - id: ce-1
            name: Hidden Category
            hidden: true
