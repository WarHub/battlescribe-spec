id: kitchen-sink
category: entry
description: >
  Kitchen-sink GameData spec: chains add (root and nested), setField across
  control types, addLink, and remove operations in a single catalogue
  and verifies the cumulative state — exercising the full driver surface the
  way the roster protocol-kitchen-sink does. Uses only operations supported
  across all engines (no per-engine skips).

setup:
  edit: cat-1
  gameSystem:
    id: gs-1
    name: Test System
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1
      sharedSelectionEntries:
        - id: sse-bolter
          name: Bolter Template
          type: upgrade

steps:
  - action: addEntry
    id: add-squad
    parentId: cat-1
    entryType: selectionEntry
    name: Tactical Squad

  - action: addEntry
    id: add-wargear
    parentId: ${{ steps.add-squad.entryId }}
    entryType: selectionEntryGroup
    name: Wargear

  - action: addEntry
    id: add-bolter
    parentId: ${{ steps.add-wargear.entryId }}
    entryType: selectionEntry
    name: Bolter

  - action: addEntry
    id: add-plasma
    parentId: ${{ steps.add-wargear.entryId }}
    entryType: selectionEntry
    name: Plasma Gun

  - action: addEntry
    id: add-sgt
    parentId: ${{ steps.add-squad.entryId }}
    entryType: selectionEntry
    name: Sergeant

  - action: setFields
    entryId: ${{ steps.add-wargear.entryId }}
    fields:
      defaultSelectionEntryId: ${{ steps.add-bolter.entryId }}

  - action: setFields
    entryId: ${{ steps.add-sgt.entryId }}
    fields:
      hidden: "true"

  - action: addEntry
    id: add-rule
    parentId: cat-1
    entryType: rule
    name: Combat Doctrine

  - action: addLink
    id: add-link
    parentId: cat-1
    linkType: entryLink
    targetId: sse-bolter

  - action: removeEntry
    entryId: ${{ steps.add-plasma.entryId }}

  - expectedState:
      catalogues:
        - id: cat-1
          selectionEntries:
            - name: Tactical Squad
              children:
                - name: Wargear
                  entryType: selectionEntryGroup
                  children:
                    - name: Bolter
                - name: Sergeant
                  hidden: true
          rules:
            - name: Combat Doctrine
              entryType: rule
          entryLinks:
            - entryType: entryLink
              fields:
                targetId: sse-bolter
