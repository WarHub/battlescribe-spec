id: fe-set-field-name
category: entry
description: >
  Set the name field of a force entry and verify it is updated.

setup:
  edit: gs-1
  gameSystem:
    id: gs-1
    name: Test System
    forceEntries:
      - id: fe-1
        name: Old Detachment

steps:
  - action: setFields
    entryId: fe-1
    fields:
      name: Strike Force

  - expectedState:
      gameSystem:
        id: gs-1
        forceEntries:
          - id: fe-1
            name: Strike Force
