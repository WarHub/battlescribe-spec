id: se-set-field-collective
category: entry
description: >
  Set the collective field of a nested selection entry to true and verify
  the state reflects it in the fields dictionary. The entry is nested under a
  parent because the NR Editor UI only enables the collective checkbox for
  non-root entries.

setup:
  edit: cat-1
  gameSystem:
    id: gs-1
    name: Test System
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          selectionEntries:
            - id: se-1
              name: Squad Member
              type: model

steps:
  - action: setFields
    entryId: se-1
    fields:
      collective: "true"

  - expectedState:
      catalogues:
        - id: cat-1
          selectionEntries:
            - id: se-squad
              children:
                - id: se-1
                  fields:
                    collective: "true"
