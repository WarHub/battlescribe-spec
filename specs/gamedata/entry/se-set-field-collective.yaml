id: se-set-field-collective
category: entry
description: >
  Set the collective field of a selection entry to true and verify
  the state reflects it in the fields dictionary.
engines:
  nr-editor-ui: skip # collective checkbox is disabled in the NR Editor UI for model-type entries

setup:
  gameSystem:
    id: gs-1
    name: Test System
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1
      selectionEntries:
        - id: se-1
          name: Squad Member
          type: model

steps:
  - action: setField
    entryId: se-1
    field: collective
    value: "true"

  - expectedState:
      catalogues:
        - id: cat-1
          selectionEntries:
            - id: se-1
              fields:
                collective: "true"
