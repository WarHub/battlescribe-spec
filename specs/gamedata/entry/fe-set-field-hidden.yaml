id: fe-set-field-hidden
category: entry
description: >
  Set the hidden field of a force entry and verify the state reflects it.
engines:
  nr-editor: skip

setup:
  gameSystem:
    id: gs-1
    name: Test System
    forceEntries:
      - id: fe-1
        name: Secret Force

steps:
  - action: setField
    entryId: fe-1
    field: hidden
    value: "true"

  - expectedState:
      gameSystem:
        id: gs-1
        forceEntries:
          - id: fe-1
            name: Secret Force
            hidden: true
