id: add-entry-rule
category: entry
description: >
  Add a rule entry to a catalogue and verify it appears in the rules container.

setup:
  edit: cat-1
  gameSystem:
    id: gs-1
    name: Test System
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1

steps:
  - action: addEntry
    id: add-rule
    parentId: cat-1
    entryType: rule
    name: Feel No Pain

  - expectedState:
      catalogues:
        - id: cat-1
          rules:
            - name: Feel No Pain
              entryType: rule
