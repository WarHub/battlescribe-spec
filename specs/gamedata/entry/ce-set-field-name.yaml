id: ce-set-field-name
category: entry
description: >
  Set the name field of a category entry and verify it is updated.

setup:
  gameSystem:
    id: gs-1
    name: Test System
    categoryEntries:
      - id: ce-1
        name: Old Category

steps:
  - action: setFields
    entryId: ce-1
    fields:
      name: Heavy Support

  - expectedState:
      gameSystem:
        id: gs-1
        categoryEntries:
          - id: ce-1
            name: Heavy Support
