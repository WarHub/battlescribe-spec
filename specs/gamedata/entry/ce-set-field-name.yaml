id: ce-set-field-name
category: entry
description: >
  Set the name field of a category entry and verify it is updated.
engines:
  nr-editor: skip

setup:
  gameSystem:
    id: gs-1
    name: Test System
    categoryEntries:
      - id: ce-1
        name: Old Category

steps:
  - action: setField
    entryId: ce-1
    field: name
    value: Heavy Support

  - expectedState:
      gameSystem:
        id: gs-1
        categoryEntries:
          - id: ce-1
            name: Heavy Support
