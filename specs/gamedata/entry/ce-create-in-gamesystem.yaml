id: ce-create-in-gamesystem
category: entry
description: >
  Add a category entry to a game system and verify it appears in the
  categoryEntries container.

setup:
  gameSystem:
    id: gs-1
    name: Test System

steps:
  - action: addEntry
    id: add-ce
    parentId: gs-1
    entryType: categoryEntry
    name: Troops

  - expectedState:
      gameSystem:
        id: gs-1
        categoryEntries:
          - name: Troops
            entryType: categoryEntry
