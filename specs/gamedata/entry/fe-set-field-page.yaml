id: fe-set-field-page
category: entry
description: >
  Set the page field of a force entry and verify it is stored
  in the fields dictionary.

setup:
  edit: gs-1
  gameSystem:
    id: gs-1
    name: Test System
    forceEntries:
      - id: fe-1
        name: Patrol Detachment

steps:
  - action: setFields
    entryId: fe-1
    fields:
      page: "7"

  - expectedState:
      gameSystem:
        id: gs-1
        forceEntries:
          - id: fe-1
            fields:
              page: "7"
