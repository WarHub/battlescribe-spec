id: fe-set-field-publication
category: entry
description: >
  Set the publicationId field of a force entry and verify it is stored
  in the fields dictionary.
engines:
  nr-editor: skip # NewRecruit's data model does not support authoring force entries
  nr-editor-ui: skip # NewRecruit's data model does not support authoring force entries

setup:
  gameSystem:
    id: gs-1
    name: Test System
    publications:
      - id: pub-rules
        name: Core Rulebook
    forceEntries:
      - id: fe-1
        name: Vanguard

steps:
  - action: setField
    entryId: fe-1
    field: publicationId
    value: pub-rules

  - expectedState:
      gameSystem:
        id: gs-1
        forceEntries:
          - id: fe-1
            fields:
              publicationId: pub-rules
