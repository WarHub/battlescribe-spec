id: set-field-hidden
category: entry
description: >
  Set the hidden field of an entry and verify the state reflects it.

setup:
  gameSystem:
    id: gs-1
    name: Test System
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1
      selectionEntries:
        - id: se-unit
          name: Stealth Unit
          type: unit

steps:
  - action: setField
    entryId: se-unit
    field: hidden
    value: "true"

  - expectedState:
      catalogues:
        - id: cat-1
          selectionEntries:
            - id: se-unit
              name: Stealth Unit
              hidden: true
