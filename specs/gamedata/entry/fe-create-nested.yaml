id: fe-create-nested
category: entry
description: >
  Add a force entry nested inside another force entry and verify
  the parent-child relationship.

setup:
  edit: gs-1
  gameSystem:
    id: gs-1
    name: Test System
    forceEntries:
      - id: fe-parent
        name: Army

steps:
  - action: addEntry
    id: add-child
    parentId: fe-parent
    entryType: forceEntry
    name: Detachment

  - expectedState:
      gameSystem:
        id: gs-1
        forceEntries:
          - id: fe-parent
            name: Army
            children:
              - name: Detachment
                entryType: forceEntry
