id: se-create-in-gamesystem
category: entry
description: >
  Add a selection entry to a game system's root selectionEntries container
  and verify it appears in the game system state.

setup:
  edit: gs-1
  gameSystem:
    id: gs-1
    name: Test System

steps:
  - action: addEntry
    id: add-se
    parentId: gs-1
    entryType: selectionEntry
    name: Battle Tank

  - expectedState:
      gameSystem:
        id: gs-1
        selectionEntries:
          - name: Battle Tank
            entryType: selectionEntry
