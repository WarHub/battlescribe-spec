id: se-create-in-gamesystem
category: entry
description: >
  Add a selection entry to a game system's root selectionEntries container
  and verify it appears in the game system state.
engines:
  nr-editor: skip # NewRecruit's data model does not support authoring entries directly in a game system
  nr-editor-ui: skip # NewRecruit's data model does not support authoring entries directly in a game system

setup:
  gameSystem:
    id: gs-1
    name: Test System

steps:
  - action: addEntry
    id: add-se
    parentId: gs-1
    entryType: selectionEntry
    name: Battle Tank

  - expectedState:
      gameSystem:
        id: gs-1
        selectionEntries:
          - name: Battle Tank
            entryType: selectionEntry
