id: add-entry-basic
category: entry
description: >
  Add a basic selection entry to a catalogue and verify it appears
  in the catalogue's selection entries list.

setup:
  edit: cat-1
  gameSystem:
    id: gs-1
    name: Test System
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1

steps:
  - action: addEntry
    id: add-unit
    parentId: cat-1
    entryType: selectionEntry
    name: Space Marine

  - expectedState:
      catalogues:
        - id: cat-1
          selectionEntries:
            - name: Space Marine
              entryType: selectionEntry
