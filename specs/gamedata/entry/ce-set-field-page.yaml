id: ce-set-field-page
category: entry
description: >
  Set the page field of a category entry and verify it is stored
  in the fields dictionary.

setup:
  gameSystem:
    id: gs-1
    name: Test System
    categoryEntries:
      - id: ce-1
        name: Fast Attack

steps:
  - action: setFields
    entryId: ce-1
    fields:
      page: "23"

  - expectedState:
      gameSystem:
        id: gs-1
        categoryEntries:
          - id: ce-1
            fields:
              page: "23"
