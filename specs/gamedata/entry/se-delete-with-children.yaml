id: se-delete-with-children
category: entry
description: >
  Delete a selection entry that has nested children and verify
  the entire subtree is removed.

setup:
  gameSystem:
    id: gs-1
    name: Test System
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1
      selectionEntries:
        - id: se-squad
          name: Tactical Squad
          type: unit
          selectionEntries:
            - id: se-weapon
              name: Bolter
              type: upgrade
            - id: se-gear
              name: Frag Grenade
              type: upgrade

steps:
  - action: removeEntry
    entryId: se-squad

  - expectedState:
      catalogues:
        - id: cat-1
          selectionEntryCount: 0
