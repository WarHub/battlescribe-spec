id: cost-set-values
category: cost
description: >
  Set cost values on a selection entry for multiple cost types via setCost,
  creating the cost where absent and updating it where present. Verifies the
  values are persisted and keyed by cost type.

# battlescribe-ui skip is W3 debt (setCost not yet in the Java agent).
# newrecruit engines lack setCost support.
engines:
  battlescribe-ui: skip
  newrecruit: skip
  newrecruit-ui: skip

setup:
  gameSystem:
    id: gs-1
    name: Test System
    costTypes:
      - id: pts
        name: pts
      - id: pl
        name: Power Level
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1
      selectionEntries:
        - id: se-1
          name: Tactical Squad
          type: unit

steps:
  - action: setCost
    entryId: se-1
    field: pts
    value: "90"

  - action: setCost
    entryId: se-1
    field: pl
    value: "5"

  - action: setCost
    entryId: se-1
    field: pts
    value: "100"

  - expectedState:
      catalogues:
        - id: cat-1
          selectionEntries:
            - id: se-1
              fields:
                cost:pts: "100"
                cost:pl: "5"
