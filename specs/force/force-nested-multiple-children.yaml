id: force-nested-multiple-children
category: force
description: A parent force can contain multiple child forces, each with independent selections
tags: [childForce]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-army
        name: Army
        forceEntries:
          - id: fe-patrol
            name: Patrol
          - id: fe-vanguard
            name: Vanguard
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Scout
          type: unit
        - id: se-2
          name: Veteran
          type: unit

steps:
  - action: addForce
    id: add-army
    forceEntryId: fe-army

  - action: addChildForce
    forceId: ${{ steps.add-army.forceId }}
    forceEntryId: fe-army

  - action: addChildForce
    forceId: ${{ steps.add-army.forceId }}
    forceEntryId: UNKNOWN_FE_1

  - expectedState:
      forceCount: 1
      forces:
        - name: Army
          childForceCount: 2
          childForces:
            - name: Patrol
            - name: Vanguard

  # Select into first child force
  - action: selectEntry
    forceId: ${{ steps.add-army.forceId }}
    entryId: se-1

  # Select into second child force
  - action: selectEntry
    forceId: ${{ steps.add-army.forceId }}
    entryId: se-2

  - expectedState:
      forces:
        - name: Army
          selectionCount: 0
          childForceCount: 2
          childForces:
            - name: Patrol
              selectionCount: 1
              selections:
                - name: Scout
            - name: Vanguard
              selectionCount: 1
              selections:
                - name: Veteran
