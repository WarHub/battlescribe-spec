id: force-selections-independent
category: force
description: Selections in different forces are independent

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    costTypes:
      - id: pts
        name: Points
        defaultCostLimit: -1.0
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogue:
    id: cat-1
    name: Test Catalogue
    gameSystemId: test-gs
    selectionEntries:
      - id: se-unit-a
        name: Unit A
        type: unit
        costs:
          - name: Points
            typeId: pts
            value: 100

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - action: selectEntry
    forceIndex: 1
    entryIndex: 0

  - expectedState:
      forceCount: 2
      forces:
        - selectionCount: 1
          selections:
            - name: Unit A
        - selectionCount: 1
          selections:
            - name: Unit A
      costs:
        - typeId: pts
          value: 200
