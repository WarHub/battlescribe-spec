id: force-multiple-catalogues
category: force
description: Multiple forces can be created from the same force entry independently

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-patrol
        name: Patrol
      - id: fe-battalion
        name: Battalion
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit
          name: Unit A
          type: unit

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: addForce
    forceEntryIndex: 1
  - assert: forceCount
    expected: 2
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  - action: selectEntry
    forceIndex: 1
    entryIndex: 0
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Unit A
        - selectionCount: 1
          selections:
            - name: Unit A
