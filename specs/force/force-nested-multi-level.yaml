id: force-nested-multi-level
category: force
description: Force entries can be nested multiple levels deep (grandchild forces via forcePath)
tags: [childForce, nested]
engines:
  newrecruit: fail

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-army
        name: Army
        forceEntries:
          - id: fe-division
            name: Division
            forceEntries:
              - id: fe-platoon
                name: Platoon
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Soldier
          type: unit

steps:
  - action: addForce
    forceEntryIndex: 0

  # Add Division as child of Army
  - action: addForce
    forcePath: [0]
    forceEntryIndex: 0

  - expectedState:
      forces:
        - name: Army
          childForceCount: 1
          childForces:
            - name: Division
              childForceCount: 0

  # Add Platoon as grandchild: child of Division (which is child 0 of force 0)
  - action: addForce
    forcePath: [0, 0]
    forceEntryIndex: 0

  - expectedState:
      forces:
        - name: Army
          childForceCount: 1
          childForces:
            - name: Division
              childForceCount: 1
              childForces:
                - name: Platoon

  # Select a unit into the grandchild force
  - action: selectEntry
    forcePath: [0, 0, 0]
    entryIndex: 0

  - expectedState:
      forces:
        - name: Army
          selectionCount: 0
          childForces:
            - name: Division
              selectionCount: 0
              childForces:
                - name: Platoon
                  selectionCount: 1
                  selections:
                    - name: Soldier
