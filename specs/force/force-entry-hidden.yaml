id: force-entry-hidden
category: force
description: >
  ForceEntry with hidden=true can be added but is reported as hidden in state.

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
      - id: fe-hidden
        name: Hidden Detachment
        hidden: true

  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit
          name: Unit A
          type: unit

steps:
  - action: addForce
    forceEntryId: fe-patrol

  - action: addForce
    forceEntryId: fe-hidden

  - expectedState:
      forceCount: 2
      forces:
        - name: Patrol
          hidden: false
        - name: Hidden Detachment
          hidden: true
      engines:
        newrecruit:
          forces:
            - name: Hidden Detachment
              hidden: true
            - name: Patrol
              hidden: false
