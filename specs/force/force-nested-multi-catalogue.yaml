id: force-nested-multi-catalogue
category: force
description: >
  Child forces can use different catalogues than their parent.
  Each force gets selections from its own catalogue.
tags: [childForce, catalogue]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-army
        name: Army
        forceEntries:
          - id: fe-detach
            name: Detachment
  catalogues:
    - id: cat-a
      name: Faction A
      gameSystemId: test-gs
      selectionEntries:
        - id: se-a1
          name: Alpha Unit
          type: unit
    - id: cat-b
      name: Faction B
      gameSystemId: test-gs
      selectionEntries:
        - id: se-b1
          name: Beta Unit
          type: unit

steps:
  - action: addForce
    id: add-army
    forceEntryId: fe-army
    catalogueId: cat-a

  - action: addChildForce
    id: add-detachment
    forceId: ${{ steps.add-army.forceId }}
    forceEntryId: fe-detach
    catalogueId: cat-b

  - expectedState:
      forceCount: 1
      forces:
        - name: Army
          childForceCount: 1
          childForces:
            - name: Detachment

  - action: selectEntry
    forceId: ${{ steps.add-army.forceId }}
    entryId: se-a1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-b1

  - expectedState:
      forces:
        - name: Army
          selections:
            - name: Alpha Unit
          childForces:
            - name: Detachment
              selections:
                - name: Beta Unit
