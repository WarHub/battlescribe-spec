id: force-multi-catalogue-two-forces
category: force
description: Forces from different catalogues get entries from their respective catalogue

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-a
      name: Faction A
      gameSystemId: test-gs
      selectionEntries:
        - id: se-a1
          name: Alpha Unit
          type: unit
    - id: cat-b
      name: Faction B
      gameSystemId: test-gs
      selectionEntries:
        - id: se-b1
          name: Beta Unit
          type: unit

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: addForce
    id: add-patrol-2
    forceEntryId: fe-patrol
    catalogueId: cat-b

  - expectedState:
      forceCount: 2
      forces:
        - name: Patrol
        - name: Patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-a1

  - expectedState:
      forces:
        - name: Patrol
          selections:
            - name: Alpha Unit

  - action: selectEntry
    forceId: ${{ steps.add-patrol-2.forceId }}
    entryId: se-b1

  - expectedState:
      forces:
        - name: Patrol
          selections:
            - name: Alpha Unit
        - name: Patrol
          selections:
            - name: Beta Unit
