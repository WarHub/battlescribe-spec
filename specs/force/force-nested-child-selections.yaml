id: force-nested-child-selections
category: force
description: Selections can be added to a child force independently
tags: [childForce]
engines:
  battlescribe: fail
  newrecruit: fail

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-army
        name: Army
        forceEntries:
          - id: fe-detach
            name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Squad
          type: unit

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: addChildForce
    forceIndex: 0
    childForceEntryIndex: 0

  # Select a unit into the child force (forceIndex 0 refers to the parent,
  # child force index 0 within it is the Detachment).
  # Child forces have their own selection list.
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      forceCount: 1
      forces:
        - name: Army
          selectionCount: 1
          childForceCount: 1
          childForces:
            - name: Detachment
              selectionCount: 0
