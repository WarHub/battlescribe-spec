id: force-nested-child-selections
category: force
description: Selections can be added to a child force independently using forcePath
tags: [childForce]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-army
        name: Army
        forceEntries:
          - id: fe-detach
            name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Squad
          type: unit

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: addForce
    forcePath: [0]
    forceEntryIndex: 0

  # Select a unit INTO the child force using forcePath
  - action: selectEntry
    forcePath: [0, 0]
    entryIndex: 0

  - expectedState:
      forceCount: 1
      forces:
        - name: Army
          selectionCount: 0
          childForceCount: 1
          childForces:
            - name: Detachment
              selectionCount: 1
              selections:
                - name: Squad
