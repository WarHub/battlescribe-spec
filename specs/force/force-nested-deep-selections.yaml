id: force-nested-deep-selections
category: force
description: >-
  Triple-nested forces (Army > Division > Platoon) each containing
  triple-nested selections (Squad > Weapon > Scope), verifying that
  deep path navigation works for both forces and selections combined.
tags: [childForce, nested, selection]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-army
        name: Army
        forceEntries:
          - id: fe-division
            name: Division
            forceEntries:
              - id: fe-platoon
                name: Platoon
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          selectionEntries:
            - id: se-weapon
              name: Weapon
              type: upgrade
              selectionEntries:
                - id: se-scope
                  name: Scope
                  type: upgrade

steps:
  # Build force hierarchy: Army > Division > Platoon
  - action: addForce
    id: add-army
    forceEntryId: fe-army

  - action: addChildForce
    id: add-division
    forceId: ${{ steps.add-army.forceId }}
    forceEntryId: fe-division

  - action: addChildForce
    id: add-platoon
    forceId: ${{ steps.add-division.forceId }}
    forceEntryId: fe-platoon

  - expectedState:
      forces:
        - name: Army
          childForces:
            - name: Division
              childForces:
                - name: Platoon

  # Add Squad into each force level
  - action: selectEntry
    id: select-army-squad
    forceId: ${{ steps.add-army.forceId }}
    entryId: se-squad

  - action: selectEntry
    id: select-div-squad
    forceId: ${{ steps.add-division.forceId }}
    entryId: se-squad

  - action: selectEntry
    id: select-plt-squad
    forceId: ${{ steps.add-platoon.forceId }}
    entryId: se-squad

  # Build selection hierarchy in Army's Squad: Squad > Weapon > Scope
  - action: selectChildEntry
    id: select-army-weapon
    forceId: ${{ steps.add-army.forceId }}
    selectionId: ${{ steps.select-army-squad.selectionId }}
    entryId: se-weapon

  - action: selectChildEntry
    forceId: ${{ steps.add-army.forceId }}
    selectionId: ${{ steps.select-army-weapon.selectionId }}
    entryId: se-scope

  # Build selection hierarchy in Division's Squad
  - action: selectChildEntry
    id: select-div-weapon
    forceId: ${{ steps.add-division.forceId }}
    selectionId: ${{ steps.select-div-squad.selectionId }}
    entryId: se-weapon

  - action: selectChildEntry
    forceId: ${{ steps.add-division.forceId }}
    selectionId: ${{ steps.select-div-weapon.selectionId }}
    entryId: se-scope

  # Build selection hierarchy in Platoon's Squad
  - action: selectChildEntry
    id: select-plt-weapon
    forceId: ${{ steps.add-platoon.forceId }}
    selectionId: ${{ steps.select-plt-squad.selectionId }}
    entryId: se-weapon

  - action: selectChildEntry
    forceId: ${{ steps.add-platoon.forceId }}
    selectionId: ${{ steps.select-plt-weapon.selectionId }}
    entryId: se-scope

  # Verify the full tree
  - expectedState:
      forces:
        - name: Army
          selections:
            - name: Squad
              children:
                - name: Weapon
                  children:
                    - name: Scope
          childForces:
            - name: Division
              selections:
                - name: Squad
                  children:
                    - name: Weapon
                      children:
                        - name: Scope
              childForces:
                - name: Platoon
                  selections:
                    - name: Squad
                      children:
                        - name: Weapon
                          children:
                            - name: Scope
