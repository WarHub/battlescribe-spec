id: force-nested-remove-child
category: force
description: A child force can be removed from its parent force using forcePath
tags: [childForce]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-army
        name: Army
        forceEntries:
          - id: fe-detach
            name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Squad
          type: unit

steps:
  - action: addForce
    id: add-army
    forceEntryId: fe-army

  - action: addChildForce
    id: add-detachment
    forceId: ${{ steps.add-army.forceId }}
    forceEntryId: fe-detach

  - expectedState:
      forces:
        - name: Army
          childForceCount: 1
          childForces:
            - name: Detachment


  # Remove the child force using its forceId
  - action: removeForce
    forceId: ${{ steps.add-detachment.forceId }}

  - expectedState:
      forceCount: 1
      forces:
        - name: Army
          childForceCount: 0
