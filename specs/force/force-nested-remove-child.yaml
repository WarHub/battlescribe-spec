id: force-nested-remove-child
category: force
description: A child force can be removed from its parent force using forcePath
tags: [childForce]
engines:
  newrecruit: fail

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-army
        name: Army
        forceEntries:
          - id: fe-detach
            name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Squad
          type: unit

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: addForce
    forcePath: [0]
    forceEntryIndex: 0

  - expectedState:
      forces:
        - name: Army
          childForceCount: 1
          childForces:
            - name: Detachment

  # Remove the child force using forcePath targeting it directly
  - action: removeForce
    forcePath: [0, 0]

  - expectedState:
      forceCount: 1
      forces:
        - name: Army
          childForceCount: 0
