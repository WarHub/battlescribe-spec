id: force-nested-remove-child
category: force
description: A child force can be removed from its parent force
tags: [childForce]
engines:
  battlescribe: fail
  newrecruit: fail

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-army
        name: Army
        forceEntries:
          - id: fe-detach
            name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Squad
          type: unit

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: addChildForce
    forceIndex: 0
    childForceEntryIndex: 0

  - expectedState:
      forces:
        - name: Army
          childForceCount: 1
          childForces:
            - name: Detachment

  - action: removeChildForce
    forceIndex: 0
    childForceIndex: 0

  - expectedState:
      forceCount: 1
      forces:
        - name: Army
          childForceCount: 0
