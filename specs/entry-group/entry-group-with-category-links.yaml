id: entry-group-with-category-links
category: entry-group
description: >
  SelectionEntryGroup with categoryLinks causes selections within the group
  to inherit those categories.
tags: [newrecruit-bug]

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    categoryEntries:
      - id: cat-infantry
        name: Infantry
      - id: cat-elites
        name: Elites
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-infantry
            targetId: cat-infantry
            name: Infantry
          - id: cl-elites
            targetId: cat-elites
            name: Elites

  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          selectionEntryGroups:
            - id: seg-weapons
              name: Weapons
              categoryLinks:
                - id: cl-seg-elites
                  targetId: cat-elites
                  name: Elites
              selectionEntries:
                - id: se-sword
                  name: Sword
                  type: upgrade

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    id: select-squad
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-squad

  - action: selectChildEntry
    forceId: ${{ steps.add-patrol.forceId }}
    selectionId: ${{ steps.select-squad.selectionId }}
    entryId: CHILD_0

  - expectedState:
      forces:
        - selections:
            - name: Squad
              children:
                - name: Sword
                  categories:
                    - name: Elites
      engines:
        # NR doesn't propagate group-level categoryLinks to child selections
        newrecruit:
          forces:
            - selections:
                - name: Squad
                  children:
                    - name: Sword
                      categories: []
