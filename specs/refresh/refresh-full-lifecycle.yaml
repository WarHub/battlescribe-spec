id: refresh-full-lifecycle
category: refresh
description: Full roster lifecycle - add, select, modify, deselect, remove verifying state at each step

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
        defaultCostLimit: -1
    forceEntries:
      - id: fe-1
        name: Patrol
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Scout
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 30
        - id: se-2
          name: Heavy
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 90

steps:
  # Start empty
  - assert: forceCount
    expected: 0
  # Add force
  - action: addForce
    forceEntryIndex: 0
  - assert: forceCount
    expected: 1
  # Select first unit
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  - assert: totalCost
    costTypeId: pts
    expected: 30
  # Select second unit
  - action: selectEntry
    forceIndex: 0
    entryIndex: 1
  - assert: totalCost
    costTypeId: pts
    expected: 120
  # Duplicate first
  - action: duplicateSelection
    forceIndex: 0
    selectionIndex: 0
  - assert: totalCost
    costTypeId: pts
    expected: 150
  - assert: selectionCount
    forceIndex: 0
    expected: 3
  # Deselect the heavy
  - action: deselectSelection
    forceIndex: 0
    selectionIndex: 1
  - assert: totalCost
    costTypeId: pts
    expected: 60
  - assert: selectionCount
    forceIndex: 0
    expected: 2
  # Remove force
  - action: removeForce
    forceIndex: 0
  - assert: forceCount
    expected: 0
