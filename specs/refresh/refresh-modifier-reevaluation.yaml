id: refresh-modifier-reevaluation
category: refresh
description: Modifiers are re-evaluated after each mutation (conditional modifier toggle)

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-trigger
          name: Trigger
          type: unit
        - id: se-target
          name: Original
          type: unit
          modifiers:
            - type: set
              field: name
              value: Modified
              conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: force
                  childId: se-trigger

steps:
  - action: addForce
    forceEntryIndex: 0

  # Add target first (no trigger yet → original name)
  - action: selectEntry
    forceIndex: 0
    entryIndex: 1

  - assert: selectionName
    forceIndex: 0
    selectionIndex: 0
    expected: Original

  # Add trigger → modifier condition now true → refresh re-evaluates
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - assert: selectionName
    forceIndex: 0
    selectionIndex: 0
    expected: Modified

  # Remove trigger → modifier condition now false → original name
  - action: deselectSelection
    forceIndex: 0
    selectionIndex: 1

  - assert: selectionName
    forceIndex: 0
    selectionIndex: 0
    expected: Original
