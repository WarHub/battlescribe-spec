id: refresh-after-child-select
category: refresh
description: Refresh cycle runs after selecting a child entry

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
        defaultCostLimit: -1
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-parent
          name: Squad
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 50
          selectionEntries:
            - id: se-child
              name: Heavy Weapon
              type: upgrade
              costs:
                - name: pts
                  typeId: pts
                  value: 30

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  - expectedState:
      costs:
        - typeId: pts
          value: 50
  - action: selectChildEntry
    forceIndex: 0
    selectionIndex: 0
    childEntryIndex: 0
  - expectedState:
      costs:
        - typeId: pts
          value: 80
