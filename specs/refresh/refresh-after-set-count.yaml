id: refresh-after-set-count
category: refresh
description: SetSelectionCount triggers engine refresh
tags: []

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
        defaultCostLimit: -1
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Trooper
          type: model
          costs:
            - name: pts
              typeId: pts
              value: 10

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  - assert: totalCost
    costTypeId: pts
    expected: 10
  # setSelectionCount is a no-op for root/force-level entries in the BattleScribe engine.
  # Root entries always create new selections via selectEntry, not via count.
  - action: setSelectionCount
    forceIndex: 0
    entryIndex: 0
    count: 5
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Trooper
