id: refresh-validation-update
category: refresh
description: Validation errors are updated after each mutation

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          constraints:
            - id: con-min-1
              type: min
              value: 1
              field: selections
              scope: parent
            - id: con-max-2
              type: max
              value: 2
              field: selections
              scope: parent

steps:
  - action: addForce
    forceEntryIndex: 0

  # Auto-selected 1 (min=1)
  - assert: selectionCount
    forceIndex: 0
    expected: 1

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  # 2 selections (1 auto + 1 manual)
  - assert: selectionCount
    forceIndex: 0
    expected: 2

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  # 3 selections
  - assert: selectionCount
    forceIndex: 0
    expected: 3

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  # 4 selections
  - assert: selectionCount
    forceIndex: 0
    expected: 4

  - action: deselectSelection
    forceIndex: 0
    selectionIndex: 3

  # Back to 3
  - assert: selectionCount
    forceIndex: 0
    expected: 3
