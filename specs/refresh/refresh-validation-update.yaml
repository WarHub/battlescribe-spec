id: refresh-validation-update
category: refresh
description: Validation errors are updated after each mutation

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogue:
    id: cat-1
    name: Test Catalogue
    gameSystemId: test-gs
    selectionEntries:
      - id: se-unit-a
        name: Unit A
        type: unit
        constraints:
          - id: con-min-1
            type: min
            value: 1
            field: selections
            scope: parent
          - id: con-max-2
            type: max
            value: 2
            field: selections
            scope: parent

steps:
  - action: addForce
    forceEntryIndex: 0

  # Empty force
  - assert: selectionCount
    forceIndex: 0
    expected: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  # 1 selection
  - assert: selectionCount
    forceIndex: 0
    expected: 1

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  # 2 selections
  - assert: selectionCount
    forceIndex: 0
    expected: 2

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  # 3 selections
  - assert: selectionCount
    forceIndex: 0
    expected: 3

  - action: deselectSelection
    forceIndex: 0
    selectionIndex: 2

  # Back to 2
  - assert: selectionCount
    forceIndex: 0
    expected: 2
