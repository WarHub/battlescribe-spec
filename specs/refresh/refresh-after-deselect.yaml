id: refresh-after-deselect
category: refresh
description: Refresh cycle runs after deselecting, recalculating costs and validation

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    costTypes:
      - id: pts
        name: Points
        defaultCostLimit: -1.0
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          costs:
            - name: Points
              typeId: pts
              value: 100

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - assert: totalCost
    costTypeId: pts
    expected: 100

  - action: deselectSelection
    forceIndex: 0
    selectionIndex: 0

  # After deselect: cost should be recalculated to 0
  - assert: totalCost
    costTypeId: pts
    expected: 0

  - expectedState:
      forces:
        - selectionCount: 0
