id: refresh-after-duplicate
category: refresh
description: Refresh cycle runs after duplicating a selection

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
        defaultCostLimit: -1
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Soldier
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 25

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  - expectedState:
      costs:
        - typeId: pts
          value: 25
  - action: duplicateSelection
    forceIndex: 0
    selectionIndex: 0
  - expectedState:
      costs:
        - typeId: pts
          value: 50
  - expectedState:
      forces:
        - selectionCount: 2
