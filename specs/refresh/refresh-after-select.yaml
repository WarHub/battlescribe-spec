id: refresh-after-select
category: refresh
description: Refresh cycle runs after selecting an entry, updating costs and validation

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    costTypes:
      - id: pts
        name: Points
        defaultCostLimit: -1.0
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogue:
    id: cat-1
    name: Test Catalogue
    gameSystemId: test-gs
    selectionEntries:
      - id: se-unit-a
        name: Unit A
        type: unit
        costs:
          - name: Points
            typeId: pts
            value: 100
        constraints:
          - id: con-min-1
            type: min
            value: 1
            field: selections
            scope: parent

steps:
  - action: addForce
    forceEntryIndex: 0

  - expectedState:
      forces:
        - selectionCount: 0

  # After selection: cost updated
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      forces:
        - selectionCount: 1

  - assert: totalCost
    costTypeId: pts
    expected: 100
