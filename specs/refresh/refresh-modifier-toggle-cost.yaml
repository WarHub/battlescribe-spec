id: refresh-modifier-toggle-cost
category: refresh
description: Conditional cost modifier toggles when trigger is added/removed

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    costTypes:
      - id: pts
        name: Points
        defaultCostLimit: -1.0
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogue:
    id: cat-1
    name: Test Catalogue
    gameSystemId: test-gs
    selectionEntries:
      - id: se-trigger
        name: Trigger
        type: unit
        costs:
          - name: Points
            typeId: pts
            value: 0
      - id: se-target
        name: Target
        type: unit
        costs:
          - name: Points
            typeId: pts
            value: 100
        modifiers:
          - type: set
            field: pts
            value: "50"
            conditions:
              - type: atLeast
                value: 1
                field: selections
                scope: force
                childId: se-trigger

steps:
  - action: addForce
    forceEntryIndex: 0

  # Select target (no trigger) → base cost 100
  - action: selectEntry
    forceIndex: 0
    entryIndex: 1

  - assert: totalCost
    costTypeId: pts
    expected: 100

  # Add trigger → modifier sets cost to 50
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - assert: totalCost
    costTypeId: pts
    expected: 50

  # Remove trigger → back to base cost 100
  - action: deselectSelection
    forceIndex: 0
    selectionIndex: 1

  - assert: totalCost
    costTypeId: pts
    expected: 100
