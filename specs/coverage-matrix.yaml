    representative_specs: [roster-create-empty, roster-with-cost-types, roster-no-cost-types, roster-game-system-id]
  AddForce:
    status: covered
    total_usage: 176
    representative_specs: [force-add-single, force-add-multiple, force-multiple-types, force-nested-basic]
  RemoveForce:
    status: covered
    total_usage: 4
    specs: [force-remove, force-remove-second, force-add-and-remove-all, refresh-full-lifecycle]
  SelectEntry:
    status: covered
    total_usage: 164
    representative_specs: [selection-add-unit, selection-with-cost, selection-multiple-entries, selection-same-entry-twice]
