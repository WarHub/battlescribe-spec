  modifier_type:
    covered: 8
    total: 8
    note: >
      BattleScribe has 8 modifier types. "set", "increment", "decrement", "append" operate on
      field values (string/number/boolean depending on field). "remove", "set-primary",
      "unset-primary" are category-specific. The matrix below groups by the raw type attribute.
    values:
      set:
        status: covered
        total_usage: 62
        representative_specs: [modifier-set-name, modifier-set-cost, modifier-set-boolean, modifier-set-hidden-true, modifier-characteristic-value, modifier-entry-page, modifier-rule-description, modifier-field-hidden]
        note: Most widely used type — used by condition/scope specs to set name as observable effect
      increment:
        status: covered
        total_usage: 16
        representative_specs: [modifier-increment-cost, modifier-increment-name, modifier-string-increment-numeric, modifier-conditional-increment-cost, modifier-repeat-basic, modifier-on-profile]
      decrement:
        status: covered
        total_usage: 5
        specs: [modifier-decrement-cost, modifier-decrement-name, modifier-decrement-below-zero, modifier-number-decrement, modifier-string-decrement-non-numeric]
      append:
        status: covered
        total_usage: 3
        specs: [modifier-append-name, modifier-append-with-space, modifier-on-profile]
      remove:
        status: covered
        total_usage: 1
        specs: [modifier-category-remove]
        note: Category modifier — removes a category from a selection
      set-primary:
        status: covered
        total_usage: 1
        specs: [modifier-category-set-primary]
        note: Category modifier — sets a category as primary
      unset-primary:
        status: covered
        total_usage: 1
        specs: [modifier-category-unset-primary]
        note: Category modifier — unsets primary from a category
      # "add" category modifier is tested indirectly via modifier-category-add
      # but that spec uses categoryLinks on the entry rather than a modifier with type=add

  field_targets:
    covered: 8
    total: 8
    note: >
      These are the distinct values of the "field" attribute on modifiers.
      Cost type IDs (e.g. "pts") and characteristic type IDs (e.g. "char-wounds")
      are dynamic identifiers, not fixed enum values.
    values:
      name:
        status: covered
        total_usage: 55
        representative_specs: [modifier-set-name, modifier-append-name, modifier-increment-name, modifier-decrement-name, modifier-conditional-set-name, entry-link-with-modifier]
        note: Most common target — used by many condition/scope specs as observable effect
      hidden:
        status: covered
        total_usage: 4
        specs: [modifier-set-hidden-true, modifier-set-boolean, modifier-field-hidden, modifier-conditional-boolean-toggle]
      cost_type_id:
        status: covered
