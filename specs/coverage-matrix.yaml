        total_usage: 2
        field_values: [char-wounds, char-attacks]
        specs: [modifier-characteristic-value, modifier-on-profile]
        note: Characteristic type IDs are dynamic — defined in profileTypes
      con-max:
        status: covered
        total_usage: 2
        specs: [constraint-modified-by-modifier, modifier-field-constraint-value]
        note: Constraint field — modifies max constraint value
      con-max-1:
        status: covered
