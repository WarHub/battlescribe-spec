        representative_specs: [modifier-set-cost, modifier-increment-cost, modifier-decrement-cost, modifier-decrement-below-zero, modifier-number-set, modifier-number-decrement, modifier-repeat-basic, modifier-conditional-increment-cost, refresh-modifier-toggle-cost]
        note: '"pts" is the cost type ID used across 19 specs; any cost type ID can be a field target'
      description:
