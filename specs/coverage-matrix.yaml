  # Constraint types (min/max) used in constraint definitions
  constraint_type:
    covered: 2
    total: 2
    values:
      min:
        status: covered
        total_usage: 8
        representative_specs: [constraint-min-violation, constraint-min-satisfied, constraint-min-zero-no-error, constraint-min-and-max, constraint-hidden-enforcement, constraint-shared-deduplication]
