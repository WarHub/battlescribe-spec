id: entry-link-with-cost
category: selection
description: EntryLink with costs selects the target entry which uses its own base cost

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-base
          name: Plasma Rifle
          type: upgrade
          costs:
            - name: pts
              typeId: pts
              value: 15
      entryLinks:
        - id: el-cost-1
          name: Plasma Rifle
          targetId: se-base
          type: selectionEntry
          costs:
            - name: pts
              typeId: pts
              value: 25

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-base
  # Selecting entryIndex 0 picks the direct selectionEntry (se-base at 15 pts).
  # The entryLink is listed after direct entries.
  - expectedState:
      costs:
        - typeId: pts
          value: 15
      forces:
        - selections:
            - name: Plasma Rifle
              costs:
                - typeId: pts
                  value: 15
