id: selection-with-children
category: selection
description: Selection entry with child entries creates nested selection

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          selectionEntries:
            - id: se-model
              name: Soldier
              type: model
              constraints:
                - id: min-1
                  type: min
                  value: 1

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-squad

  - expectedState:
      forces:
        - selections:
            - name: Squad
              type: unit
              children:
                - name: Soldier
                  type: model
