id: collective-with-constraint
category: selection
description: Collective child entry with constraint on parent enforces selection limits

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-squad
          name: Squad
          constraints:
            - id: con-max-2
              type: max
              value: 2
              field: selections
              scope: parent
          selectionEntries:
            - id: se-weapon
              name: Weapon
              collective: true

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad
  # Two Squad selections, each with collective Weapon child.
  # Constraint max=2 is satisfied with exactly 2.
  - expectedState:
      forces:
        - selectionCount: 2
