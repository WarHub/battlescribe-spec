id: selection-upgrade-type
category: selection
description: Selection type is preserved as defined in the entry (upgrade)

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-upgrade-a
          name: Upgrade A
          type: upgrade

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-upgrade-a

  - expectedState:
      forces:
        - selections:
            - name: Upgrade A
              type: upgrade
