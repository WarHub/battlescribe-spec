id: collective-sibling-replication
category: selection
description: >
  When a parent entry is a "duplicate type" (has non-collective non-hidden
  children, d2.f()=true), BS creates separate nodes per selection and replicates
  collective children across all siblings. NR uses a single node with number=N
  (no separate siblings). Selecting a collective child on a sibling node
  in BS replicates to all; in NR the child is shared on the single node.
  Non-collective children do not replicate in either engine.
tags:
  - collective
  - number
engines: {}

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          selectionEntries:
            # Sergeant has a non-collective child (Badge) → d2.f(Sergeant)=true
            # → separate node per selection (duplicate type) in BS
            - id: se-sergeant
              name: Sergeant
              type: model
              selectionEntries:
                - id: se-badge
                  name: Badge
                  type: upgrade
                  costs:
                    - name: pts
                      typeId: pts
                      value: 2
                - id: se-special-weapon
                  name: Special Weapon
                  type: upgrade
                  collective: true
                  costs:
                    - name: pts
                      typeId: pts
                      value: 10

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    id: select-squad
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad

  # Select Sergeant 3 times
  # BS: creates 3 separate nodes (duplicate type)
  # NR: increments single node to number=3
  - action: selectChildEntry
    id: select-sgt-1
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-squad.selectionId }}
    entryId: se-sergeant

  - action: selectChildEntry
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-squad.selectionId }}
    entryId: se-sergeant

  - action: selectChildEntry
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-squad.selectionId }}
    entryId: se-sergeant

  # BS: 3 separate Sergeant nodes, each with number=1, no children
  # NR: 1 Sergeant node with number=3
  - expectedState:
      forces:
        - selections:
            - name: Squad
              children:
                - name: Sergeant
                  number: 1
                - name: Sergeant
                  number: 1
                - name: Sergeant
                  number: 1
      engines:
        newrecruit:
          forces:
            - selections:
                - name: Squad
                  children:
                    - name: Sergeant
                      number: 3

  # Select non-collective Badge on first Sergeant — does NOT replicate in BS
  # In NR: Badge on single Sergeant×3 node shows number=3 (multiplied through parent)
  - action: selectChildEntry
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-sgt-1.selectionId }}
    entryId: se-badge

  - expectedState:
      forces:
        - selections:
            - name: Squad
              children:
                - name: Sergeant
                  number: 1
                  children:
                    - name: Badge
                      number: 1
                - name: Sergeant
                  number: 1
                  children: []
                - name: Sergeant
                  number: 1
                  children: []
      engines:
        newrecruit:
          forces:
            - selections:
                - name: Squad
                  children:
                    - name: Sergeant
                      number: 3
                      children:
                        - name: Badge
                          number: 3
                          costs:
                            - name: pts
                              typeId: pts
                              value: 6

  # Select collective Special Weapon on first Sergeant
  # BS: replicates to all 3 sibling nodes (1 per node)
  # NR: added to single node, shows number=3 (multiplied through parent)
  - action: selectChildEntry
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-sgt-1.selectionId }}
    entryId: se-special-weapon

  - expectedState:
      forces:
        - selections:
            - name: Squad
              children:
                - name: Sergeant
                  number: 1
                  children:
                    - name: Badge
                      number: 1
                    - name: Special Weapon
                      number: 1
                - name: Sergeant
                  number: 1
                  children:
                    - name: Special Weapon
                      number: 1
                - name: Sergeant
                  number: 1
                  children:
                    - name: Special Weapon
                      number: 1
      engines:
        newrecruit:
          forces:
            - selections:
                - name: Squad
                  children:
                    - name: Sergeant
                      number: 3
                      children:
                        - name: Badge
                          number: 3
                          costs:
                            - name: pts
                              typeId: pts
                              value: 6
                        - name: Special Weapon
                          number: 3
                          costs:
                            - name: pts
                              typeId: pts
                              value: 30
          costs:
            - typeId: pts
              value: 36
      costs:
        - typeId: pts
          value: 32
