id: force-entry-publication
category: selection
tags: [forceEntry, publication]
description: >
  ForceEntry with publicationId carries publication metadata on force.

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    publications:
      - id: pub-1
        name: Core Rulebook
    forceEntries:
      - id: fe-1
        name: Battalion
        publicationId: pub-1
        page: "42"
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Marine
          type: unit

steps:
  - action: addForce
    id: add-battalion
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-battalion.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - name: Battalion
          publicationId: pub-1
          page: "42"
          selections:
            - name: Marine
