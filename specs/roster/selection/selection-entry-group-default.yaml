id: selection-entry-group-default
category: selection
description: SelectionEntryGroup with defaultSelectionEntryId auto-selects the default entry

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-parent
          name: Parent Unit
          type: unit
          selectionEntryGroups:
            - id: seg-weapons
              name: Weapon Options
              defaultSelectionEntryId: se-sword
              constraints:
                - id: con-min-1
                  type: min
                  value: 1
                  field: selections
                  scope: parent
              selectionEntries:
                - id: se-sword
                  name: Sword
                  type: upgrade
                - id: se-axe
                  name: Axe
                  type: upgrade

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-parent

  # With defaultSelectionEntryId and min=1, the engine auto-selects Sword.
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Parent Unit
              children:
                - name: Sword
