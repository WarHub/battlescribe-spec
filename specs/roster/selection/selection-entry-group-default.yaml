id: selection-entry-group-default
category: selection
description: SelectionEntryGroup with defaultSelectionEntryId auto-selects the default entry
tags: []

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-parent
          name: Parent Unit
          type: unit
          selectionEntryGroups:
            - id: seg-weapons
              name: Weapon Options
              defaultSelectionEntryId: se-sword
              selectionEntries:
                - id: se-sword
                  name: Sword
                  type: upgrade
                - id: se-axe
                  name: Axe
                  type: upgrade

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-parent
  # With defaultSelectionEntryId, the engine auto-selects se-sword
  # when the parent unit is selected. Parent unit appears with child.
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Parent Unit
