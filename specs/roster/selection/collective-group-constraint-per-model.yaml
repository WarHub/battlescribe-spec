id: collective-group-constraint-per-model
category: selection
description: >
  Constraint on a SelectionEntryGroup where all entries are collective uses
  per-model validation: actual count is divided by parent.number before
  comparing against the limit. The group itself is not collective.
tags:
  - collective
  - constraint
  - validation
  - entry-group

setup:
  gameSystem:
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-squad
          name: Squad
          selectionEntries:
            - id: se-trooper
              name: Trooper
              selectionEntryGroups:
                - id: seg-weapons
                  name: Weapons
                  constraints:
                    - id: con-max-2
                      type: max
                      value: 2
                      field: selections
                      scope: parent
                  selectionEntries:
                    - id: se-rifle
                      name: Rifle
                      collective: true
                      costs:
                        - name: pts
                          typeId: pts
                          value: 5
                    - id: se-sword
                      name: Sword
                      collective: true
                      costs:
                        - name: pts
                          typeId: pts
                          value: 3

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    id: select-squad
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad

  - action: selectChildEntry
    id: select-trooper
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-squad.selectionId }}
    entryId: se-trooper

  # Set Trooper to 3
  - action: setSelectionCount
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-trooper.selectionId }}
    count: 3

  # Select Rifle — adds at number=3 (1 per model). Group total: 1 per model. No error.
  - action: selectChildEntry
    id: select-rifle
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-trooper.selectionId }}
    entryId: se-rifle

  # Select Sword — adds at number=3 (1 per model). Group total: 2 per model. No error.
  - action: selectChildEntry
    id: select-sword
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-trooper.selectionId }}
    entryId: se-sword

  - expectedState:
      errors: []
      forces:
        - selections:
            - name: Squad
              children:
                - name: Trooper
                  number: 3
                  children:
                    - name: Rifle
                      number: 3
                    - name: Sword
                      number: 3

  # Select Sword again — Sword goes to 6 (2 per model). Group total: 3 per model > max 2.
  - action: selectChildEntry
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-trooper.selectionId }}
    entryId: se-sword

  # Two engines, two kinds of node, both recorded. BattleScribe has no group in its
  # error model, so a group constraint is raised on the parent that owns the
  # per-model count — the Trooper. NewRecruit materialises the selectionEntryGroup
  # as a real node and raises it there; `on: group` is bare because no engine's
  # state model carries that node and no step output can mint it (same shape as
  # selection-entry-group-constraint).
  - expectedState:
      errors:
        - on: selection ${{ steps.select-trooper.selectionId }}
          from: seg-weapons/con-max-2
      forces:
        - selections:
            - name: Squad
              children:
                - name: Trooper
                  number: 3
                  children:
                    - name: Rifle
                      number: 3
                    - name: Sword
                      number: 6
      engines:
        newrecruit:
          errors:
            - on: group
              from: seg-weapons/con-max-2
