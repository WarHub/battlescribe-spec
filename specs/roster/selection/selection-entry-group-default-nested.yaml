id: selection-entry-group-default-nested
category: selection
description: Nested groups with defaultSelectionEntryId — each level auto-selects its default
tags: [defaultSelectionEntryId, nested]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-parent
          name: Parent Unit
          type: unit
          selectionEntryGroups:
            - id: seg-outer
              name: Equipment
              defaultSelectionEntryId: se-armor
              constraints:
                - id: con-min-outer
                  type: min
                  value: 1
                  field: selections
                  scope: parent
              selectionEntries:
                - id: se-armor
                  name: Armor
                  type: upgrade
                  selectionEntryGroups:
                    - id: seg-inner
                      name: Armor Type
                      defaultSelectionEntryId: se-light
                      constraints:
                        - id: con-min-inner
                          type: min
                          value: 1
                          field: selections
                          scope: parent
                      selectionEntries:
                        - id: se-light
                          name: Light Armor
                          type: upgrade
                        - id: se-heavy
                          name: Heavy Armor
                          type: upgrade
                - id: se-shield
                  name: Shield
                  type: upgrade

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-parent

  # Parent Unit selected → Armor auto-selected (outer default) →
  # Light Armor auto-selected (inner default).
  - expectedState:
      forces:
        - selections:
            - name: Parent Unit
              children:
                - name: Armor
                  children:
                    - name: Light Armor
