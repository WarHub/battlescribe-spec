id: selection-deselect-last
category: selection
description: Deselecting the last selection leaves force empty

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Lone Unit
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 50

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    id: select-lone-unit
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      costs:
        - typeId: pts
          value: 50
      forces:
        - selectionCount: 1

  - action: deselectSelection
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-lone-unit.selectionId }}

  - expectedState:
      forces:
        - selectionCount: 0
