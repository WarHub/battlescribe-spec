id: collective-set-count-per-model
category: selection
description: >
  setSelectionCount on a collective child uses per-model semantics: the count
  parameter represents the desired number per parent instance, and the actual
  selection number equals count × parent.number.
tags:
  - collective
  - number
  - cost
  - newrecruit-missing-feature
engines:
  newrecruit: skip

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          selectionEntries:
            - id: se-trooper
              name: Trooper
              type: model
              selectionEntries:
                - id: se-weapon
                  name: Weapon
                  type: upgrade
                  collective: true
                  costs:
                    - name: pts
                      typeId: pts
                      value: 5

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    id: select-squad
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad

  - action: selectChildEntry
    id: select-trooper
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-squad.selectionId }}
    entryId: se-trooper

  - action: selectChildEntry
    id: select-weapon
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-trooper.selectionId }}
    entryId: se-weapon

  # Set Trooper to 3 — Weapon propagates to number=3 (1 per model)
  - action: setSelectionCount
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-trooper.selectionId }}
    count: 3

  - expectedState:
      forces:
        - selections:
            - name: Squad
              children:
                - name: Trooper
                  number: 3
                  children:
                    - name: Weapon
                      number: 3
                      costs:
                        - name: pts
                          typeId: pts
                          value: 15

  # setSelectionCount on collective Weapon to 2 (per model)
  # Actual number should become 2 × 3 = 6
  - action: setSelectionCount
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-weapon.selectionId }}
    count: 2

  - expectedState:
      forces:
        - selections:
            - name: Squad
              children:
                - name: Trooper
                  number: 3
                  children:
                    - name: Weapon
                      number: 6
                      costs:
                        - name: pts
                          typeId: pts
                          value: 30
      costs:
        - typeId: pts
          value: 30
