id: catalogue-link-shared-entry
category: selection
description: CatalogueLink allows entry links to target shared entries from linked catalogue

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Patrol
  catalogues:
    - id: cat-base
      name: Base Catalogue
      sharedSelectionEntries:
        - id: shared-se-1
          name: Generic Weapon
          type: upgrade
    - id: cat-faction
      name: Faction Catalogue
      catalogueLinks:
        - id: cl-1
          name: Base Catalogue
          targetId: cat-base
      selectionEntries:
        - id: se-1
          name: Marine
          type: unit

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-1
    catalogueId: cat-faction

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - selections:
            - name: Marine
