id: entry-link-with-modifier
category: selection
description: EntryLink can have its own modifiers that override the target entry

setup:
  gameSystem:
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-shared
          name: Base Weapon
          type: upgrade
          costs:
            - name: pts
              typeId: pts
              value: 10
      entryLinks:
        - id: el-1
          name: Enhanced Weapon
          targetId: se-shared
          type: selectionEntry
          modifiers:
            - type: set
              field: name
              value: Enhanced Weapon

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-shared
  # The entry link has its own modifier that sets the name.
  # The engine deep-copies the target and applies the link's modifiers.
  # Selecting entryIndex 0 selects the base entry directly.
  - expectedState:
      forces:
        - selectionCount: 1
