id: selection-ordering-numeric
category: selection
tags: [design-difference]
description: >
  NewRecruit sorts embedded numbers numerically, so "Unit 2" sorts before
  "Unit 10". BattleScribe sorts lexicographically, so "Unit 10" sorts
  before "Unit 2".

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol

  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-2
          name: Unit 2
          type: unit
        - id: se-unit-10
          name: Unit 10
          type: unit
        - id: se-unit-1
          name: Unit 1
          type: unit

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-2

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-10

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-1

  # NR: numeric-aware sort → Unit 1, Unit 2, Unit 10
  # BS: lexicographic sort → Unit 1, Unit 10, Unit 2
  - expectedState:
      forces:
        - selections:
            - name: Unit 1
            - name: Unit 2
            - name: Unit 10
      engines:
        battlescribe:
          forces:
            - selections:
                - name: Unit 1
                - name: Unit 10
                - name: Unit 2
