id: category-link-publication
category: selection
tags: [categoryLink, publication, engine-limitation]
description: >
  CategoryLink with publicationId and page is accepted in XML.
  Engine limitation: category roster elements do not expose publicationId/page
  from the link definition.

setup:
  gameSystem:
    categoryEntries:
      - id: cat-elites
        name: Elites
    forceEntries:
      - id: fe-1
        name: Detachment
        categoryLinks:
          - id: cl-elites
            targetId: cat-elites
            name: Elites
  catalogues:
    - id: cat-1
      publications:
        - id: pub-1
          name: Core Rulebook
      selectionEntries:
        - id: se-1
          name: Veteran
          type: unit
          categoryLinks:
            - id: cl-sel-elites
              targetId: cat-elites
              name: Elites
              primary: true
              publicationId: pub-1
              page: "15"

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - selections:
            - name: Veteran
              categories:
                - name: Elites
                  primary: true
