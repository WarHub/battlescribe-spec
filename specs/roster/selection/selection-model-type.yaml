id: selection-model-type
category: selection
description: Selection type is preserved as defined in the entry (model)

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-model-a
          name: Model A
          type: model

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-model-a

  - expectedState:
      forces:
        - selections:
            - name: Model A
              type: model
