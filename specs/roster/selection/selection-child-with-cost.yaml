id: selection-child-with-cost
category: selection
description: Child entry costs contribute to roster total

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-parent
          name: Squad
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 100
          selectionEntries:
            - id: se-child
              name: Weapon Upgrade
              type: upgrade
              costs:
                - name: pts
                  typeId: pts
                  value: 25

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    id: select-squad
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-parent

  - expectedState:
      costs:
        - typeId: pts
          value: 100

  - action: selectChildEntry
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-squad.selectionId }}
    entryId: se-child

  - expectedState:
      costs:
        - typeId: pts
          value: 125
