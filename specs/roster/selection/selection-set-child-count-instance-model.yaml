id: selection-set-child-count-instance-model
category: selection
description: >
  setSelectionCount on a child selection sets number=N on a single selection
  and scales costs accordingly (N × per-unit cost).
tags:
  - selection
  - number
  - cost

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          selectionEntries:
            - id: se-trooper
              name: Trooper
              type: model
              costs:
                - name: pts
                  typeId: pts
                  value: 10

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    id: select-squad
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad

  - action: selectChildEntry
    id: select-trooper
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-squad.selectionId }}
    entryId: se-trooper

  - expectedState:
      costs:
        - typeId: pts
          value: 10
      forces:
        - selections:
            - name: Squad
              children:
                - name: Trooper
                  number: 1
                  costs:
                    - name: pts
                      typeId: pts
                      value: 10

  # setSelectionCount to 3
  - action: setSelectionCount
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-trooper.selectionId }}
    count: 3

  - expectedState:
      costs:
        - typeId: pts
          value: 30
      forces:
        - selections:
            - name: Squad
              children:
                - name: Trooper
                  number: 3
                  costs:
                    - name: pts
                      typeId: pts
                      value: 30
