id: import-false-entry-direct-use
category: selection
description: Entry with import=false is visible when its catalogue is used directly (not through a link)

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Patrol
  catalogues:
    - id: cat-base
      name: Base Catalogue
      selectionEntries:
        - id: se-base-1
          name: Public Unit
          type: unit
        - id: se-base-2
          name: Internal Unit
          type: unit
          import: false

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-base-1

  - expectedState:
      forces:
        - name: Patrol
          selections:
            - name: Public Unit
              type: unit

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-base-2

  - expectedState:
      forces:
        - name: Patrol
          selections:
            - name: Internal Unit
              type: unit
            - name: Public Unit
              type: unit
