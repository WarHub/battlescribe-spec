id: collective-root-ignored
category: selection
description: >
  The collective flag is ignored for root selections (parent is a Force).
  Selecting a root entry with collective=true creates independent nodes, not
  a shared pool. Each selection has number=1.
tags:
  - collective
  - number
  - cost

setup:
  gameSystem:
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit
          name: Support Unit
          collective: true
          costs:
            - name: pts
              typeId: pts
              value: 50

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  # Select the root collective entry twice — each creates a separate node
  - action: selectEntry
    id: select-unit-1
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-unit

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-unit

  # Two independent selections, each with number=1
  - expectedState:
      costs:
        - typeId: pts
          value: 100
      forces:
        - selections:
            - name: Support Unit
              number: 1
              costs:
                - typeId: pts
                  value: 50
            - name: Support Unit
              number: 1
              costs:
                - typeId: pts
                  value: 50
