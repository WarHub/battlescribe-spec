id: entry-link-with-constraint
category: selection
description: EntryLink with a max constraint limits how many times the linked entry can be selected

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-target
          name: Elite Guard
          type: unit
      entryLinks:
        - id: el-constrained
          name: Elite Guard
          targetId: se-target
          type: selectionEntry
          constraints:
            - id: con-max-2
              type: max
              value: 2
              field: selections
              scope: parent

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-target

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-target
  # Two selections of the linked entry — exactly at the max constraint.
  - expectedState:
      forces:
        - selectionCount: 2

  - expectedState: {}
