id: profile-with-multiple-characteristics
category: selection
description: A profile with multiple characteristics produces all values in selection state

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Detachment
    profileTypes:
      - id: pt-unit
        name: Unit Stats
        characteristicTypes:
          - id: char-mv
            name: Move
          - id: char-ws
            name: WS
          - id: char-bs
            name: BS
          - id: char-wounds
            name: Wounds
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-trooper
          name: Heavy Trooper
          type: unit
          profiles:
            - id: prof-trooper
              name: Heavy Trooper Stats
              typeId: pt-unit
              typeName: Unit Stats
              characteristics:
                - name: Move
                  typeId: char-mv
                  value: "5"
                - name: WS
                  typeId: char-ws
                  value: "3"
                - name: BS
                  typeId: char-bs
                  value: "4"
                - name: Wounds
                  typeId: char-wounds
                  value: "2"

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-trooper

  - expectedState:
      forces:
        - selections:
            - name: Heavy Trooper
              profiles:
                - name: Heavy Trooper Stats
                  characteristics:
                    - name: Move
                      value: "5"
                    - name: WS
                      value: "3"
                    - name: BS
                      value: "4"
                    - name: Wounds
                      value: "2"
