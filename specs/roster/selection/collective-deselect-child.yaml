id: collective-deselect-child
category: selection
description: >
  Directly deselecting a collective child selection removes one instance
  per model from the parent's collective pool.
tags:
  - collective
  - deselect
  - newrecruit-missing-feature
engines:
  newrecruit: skip

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          selectionEntries:
            - id: se-trooper
              name: Trooper
              type: model
              selectionEntries:
                - id: se-weapon
                  name: Weapon
                  type: upgrade
                  collective: true
                  costs:
                    - name: pts
                      typeId: pts
                      value: 5

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    id: select-squad
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad

  - action: selectChildEntry
    id: select-trooper
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-squad.selectionId }}
    entryId: se-trooper

  - action: selectChildEntry
    id: select-weapon
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-trooper.selectionId }}
    entryId: se-weapon

  # Set Trooper to 3 — Weapon propagates to number=3
  - action: setSelectionCount
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-trooper.selectionId }}
    count: 3

  - expectedState:
      forces:
        - selections:
            - name: Squad
              children:
                - name: Trooper
                  number: 3
                  children:
                    - name: Weapon
                      number: 3
                      costs:
                        - name: pts
                          typeId: pts
                          value: 15

  # Deselect the collective Weapon directly
  - action: deselectSelection
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-weapon.selectionId }}

  # Collective deselection removes weapon entirely (goes from 3 to 0)
  - expectedState:
      forces:
        - selections:
            - name: Squad
              children:
                - name: Trooper
                  number: 3
                  childCount: 0
