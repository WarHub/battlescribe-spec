id: selection-deselect-then-reselect
category: selection
description: After deselecting a selection, re-selecting the same entry creates a new selection

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Unit A
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 50

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    id: select-unit-a
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - selectionCount: 1

  - action: deselectSelection
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-unit-a.selectionId }}

  - expectedState:
      forces:
        - selectionCount: 0

  - expectedState:
      costs:
        - typeId: pts
          value: 0.0

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      costs:
        - typeId: pts
          value: 50.0
      forces:
        - selectionCount: 1
          selections:
            - name: Unit A
