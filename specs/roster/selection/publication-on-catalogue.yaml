id: publication-on-catalogue
category: selection
description: Publications defined on catalogue appear at force level, entries reference them

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-1
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      publications:
        - id: pub-1
          name: Core Rulebook
          shortName: CRB
          publisher: Games Workshop
      selectionEntries:
        - id: se-1
          name: Marine
          type: unit
          publicationId: pub-1
          page: "42"

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-1

  # Catalogue publications appear on the force; selection references publication by ID.
  - expectedState:
      forces:
        - publications:
            - id: pub-1
              name: Core Rulebook
          selections:
            - name: Marine
              publicationId: pub-1
              publicationName: Core Rulebook
              page: "42"
      engines:
        newrecruit:
          forces:
            - selections:
                - name: Marine
                  publicationId: pub-1
                  publicationName: Core Rulebook
                  page: "42"
