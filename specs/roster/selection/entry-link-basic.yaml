id: entry-link-basic
category: selection
description: EntryLink references a shared SelectionEntry, resolved at runtime by targetId
tags: []

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-shared
          name: Shared Weapon
          type: upgrade
      entryLinks:
        - id: el-1
          name: Weapon Link
          targetId: se-shared
          type: selectionEntry

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-shared
  # EntryLink el-1 references se-shared. The engine resolves the link
  # during expansion and makes the target entry selectable via its targetId.
  - expectedState:
      forces:
        - selectionCount: 1
