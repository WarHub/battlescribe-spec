id: selection-duplicate
category: selection
description: Duplicating a selection creates a copy in the same force

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Squad Alpha
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 50

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    id: select-squad-alpha
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - selectionCount: 1

  - action: duplicateSelection
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-squad-alpha.selectionId }}

  - expectedState:
      forces:
        - selectionCount: 2

  - expectedState:
      costs:
        - typeId: pts
          value: 100
      forces:
        - selectionCount: 2
          selections:
            - name: Squad Alpha
              type: unit
              costs:
                - typeId: pts
                  value: 50
            - name: Squad Alpha
              type: unit
              costs:
                - typeId: pts
                  value: 50
