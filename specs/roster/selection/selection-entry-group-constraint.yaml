id: selection-entry-group-constraint
category: selection
description: SelectionEntryGroup can have constraints limiting how many entries can be selected from it

# NR's UI enforces a selectionEntryGroup's `max` RADIO-STYLE: selecting a second entry in a
# max=1 group swaps the first out rather than reporting a constraint violation, so the error this
# spec expects can never appear through the UI. Measured 2026-08-05. Same category as
# cost/cost-hidden-limit-validation. The store-direct engine reports it correctly.
# BattleScribe's desktop UI does exactly the same thing, and its scene graph says so directly: the
# edit panel renders the GROUP as one control — `'Weapon Options' -> RadioButton` — with its members
# as options inside, so choosing a second REPLACES the first. A max=1 group cannot be made to hold
# two selections through this UI, which makes the violation unreachable rather than unreported.
# Measured 2026-08-08 while implementing grouped-control support, which is what made the mechanism
# visible; before that this failed as a missing control and looked like a driver gap.
engines:
  newrecruit-ui: fail
  battlescribe-ui: fail

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-parent
          name: Parent Unit
          type: unit
          selectionEntryGroups:
            - id: seg-weapons
              name: Weapon Options
              constraints:
                - id: con-max-1
                  type: max
                  value: 1
                  field: selections
                  scope: parent
              selectionEntries:
                - id: se-sword
                  name: Sword
                  type: upgrade
                - id: se-axe
                  name: Axe
                  type: upgrade

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    id: select-parent
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-parent

  - action: selectChildEntry
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-parent.selectionId }}
    entryId: se-sword

  # One selection within max=1 — no errors.
  - expectedState:
      forces:
        - selections:
            - name: Parent Unit
              children:
                - name: Sword

  - action: selectChildEntry
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-parent.selectionId }}
    entryId: se-axe

  # Two selections exceed max=1 constraint — error expected, on two different kinds of node.
  # BattleScribe has no group concept in its error model and raises this on the Parent Unit
  # SELECTION. NewRecruit materialises the selectionEntryGroup as a real node with its own
  # errors and raises it there — a node no engine's state model has, and which reaches the
  # adapter only through the flat `army.getErrors()` merge. `on: group` is therefore written
  # bare: no step output mints a group node, so there is nothing to name it by, and measurement
  # says at most one group-raised error exists per step anywhere in the corpus.
  - expectedState:
      errorsContain:
        - on: selection ${{ steps.select-parent.selectionId }}
          from: seg-weapons/con-max-1
      forces:
        - selections:
            - name: Parent Unit
              children:
                - name: Axe
                - name: Sword
      engines:
        newrecruit:
          errorsContain:
            - on: group
              from: seg-weapons/con-max-1
