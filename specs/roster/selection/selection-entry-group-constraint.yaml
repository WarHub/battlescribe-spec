id: selection-entry-group-constraint
category: selection
description: SelectionEntryGroup can have constraints limiting how many entries can be selected from it

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-parent
          name: Parent Unit
          type: unit
          selectionEntryGroups:
            - id: seg-weapons
              name: Weapon Options
              constraints:
                - id: con-max-1
                  type: max
                  value: 1
                  field: selections
                  scope: parent
              selectionEntries:
                - id: se-sword
                  name: Sword
                  type: upgrade
                - id: se-axe
                  name: Axe
                  type: upgrade

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    id: select-parent
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-parent

  - action: selectChildEntry
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-parent.selectionId }}
    entryId: se-sword

  # One selection within max=1 — no errors.
  - expectedState:
      forces:
        - selections:
            - name: Parent Unit
              children:
                - name: Sword

  - action: selectChildEntry
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-parent.selectionId }}
    entryId: se-axe

  # Two selections exceed max=1 constraint — error expected.
  - expectedState:
      errorsContain:
        - on: selection se-parent
          from: seg-weapons/con-max-1
      forces:
        - selections:
            - name: Parent Unit
              children:
                - name: Axe
                - name: Sword
