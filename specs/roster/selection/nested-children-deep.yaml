id: nested-children-deep
category: selection
description: Nested child entry with cost aggregates to roster total
tags: []

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 50
          selectionEntries:
            - id: se-weapon
              name: Heavy Weapon
              type: upgrade
              costs:
                - name: pts
                  typeId: pts
                  value: 15

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    id: select-squad
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad

  - action: selectChildEntry
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-squad.selectionId }}
    entryId: se-weapon
  # Parent unit costs 50pts, child upgrade costs 15pts, total 65pts
  - expectedState:
      costs:
        - typeId: pts
          value: 65
      forces:
        - selectionCount: 1
          selections:
            - name: Squad
              type: unit
              children:
                - name: Heavy Weapon
                  type: upgrade
