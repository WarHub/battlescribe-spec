id: rule-multiple-on-entry
category: selection
description: An entry with two rules produces both rules in selection state

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-veteran
          name: Veteran Squad
          type: unit
          rules:
            - id: rule-fearless
              name: Fearless
              description: This unit automatically passes morale tests
            - id: rule-scout
              name: Scout Move
              description: This unit may make a normal move before the first turn

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-veteran

  - expectedState:
      forces:
        - selections:
            - name: Veteran Squad
              rules:
                - name: Fearless
                  description: This unit automatically passes morale tests
                - name: Scout Move
                  description: This unit may make a normal move before the first turn
