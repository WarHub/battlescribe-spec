id: profile-inherited-from-link
category: selection
description: Selecting an entry with a profile includes that profile in selection state

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Detachment
    profileTypes:
      - id: pt-weapon
        name: Weapon Stats
        characteristicTypes:
          - id: char-range
            name: Range
          - id: char-dmg
            name: Damage
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-shared
          name: Linked Blade
          type: upgrade
          profiles:
            - id: prof-blade
              name: Blade Profile
              typeId: pt-weapon
              typeName: Weapon Stats
              characteristics:
                - name: Range
                  typeId: char-range
                  value: Melee
                - name: Damage
                  typeId: char-dmg
                  value: "2"
      entryLinks:
        - id: el-blade
          name: Blade Link
          targetId: se-shared
          type: selectionEntry

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-shared
  # Selecting se-shared creates a selection with its profile included.
  - expectedState:
      forces:
        - selections:
            - name: Linked Blade
              profiles:
                - name: Blade Profile
                  characteristics:
                    - name: Range
                      value: Melee
                    - name: Damage
                      value: "2"
