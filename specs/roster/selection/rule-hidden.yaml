id: rule-hidden
category: selection
description: A rule with hidden true is filtered from selection state (not exposed)
tags: []

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-covert
          name: Covert Operative
          type: unit
          rules:
            - id: rule-visible
              name: Rapid Fire
              description: Can fire twice at half range
            - id: rule-hidden-ability
              name: Hidden Deployment
              description: This unit may be placed in reserves during deployment
              hidden: true

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-covert
  # Hidden rules are filtered from state; only non-hidden rule appears
  - expectedState:
      forces:
        - selections:
            - name: Covert Operative
              rules:
                - name: Rapid Fire
                  description: Can fire twice at half range
