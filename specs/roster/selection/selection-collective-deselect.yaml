id: selection-collective-deselect
category: selection
description: Deselecting a collective entry removes it from all sibling instances

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          selectionEntries:
            - id: se-model
              name: Trooper
              type: model
              constraints:
                - id: con-min-2
                  type: min
                  value: 2
                  field: selections
                  scope: parent
            - id: se-weapon
              name: Shared Weapon
              type: upgrade
              collective: true

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    id: select-squad
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad

  - action: selectChildEntry
    id: select-weapon
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-squad.selectionId }}
    entryId: se-weapon

  - expectedState:
      forces:
        - selections:
            - name: Squad
              children:
                - name: Shared Weapon
                - name: Trooper

  # Deselecting the collective weapon removes it from all sibling instances.
  - action: deselectSelection
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-weapon.selectionId }}

  - expectedState:
      forces:
        - selections:
            - name: Squad
              children:
                - name: Trooper
