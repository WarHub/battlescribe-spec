id: selection-collective-deselect
category: selection
description: Deselecting a collective entry removes it from all sibling instances
tags: []

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Squad
          type: unit
          selectionEntries:
            - id: se-child
              name: Shared Weapon
              type: upgrade
              collective: true

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    id: select-squad
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - selectionCount: 1
  # Deselecting the parent removes all collective children too.
  - action: deselectSelection
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-squad.selectionId }}

  - expectedState:
      forces:
        - selectionCount: 0
