id: selection-entry-group-default-with-max
category: selection
description: DefaultSelectionEntryId with min exceeding max causes validation error
tags: [defaultSelectionEntryId, constraint, max]

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-parent
          name: Parent Unit
          type: unit
          selectionEntryGroups:
            - id: seg-weapons
              name: Weapon Options
              defaultSelectionEntryId: se-sword
              constraints:
                - id: con-min
                  type: min
                  value: 2
                  field: selections
                  scope: parent
                - id: con-max
                  type: max
                  value: 1
                  field: selections
                  scope: parent
              selectionEntries:
                - id: se-sword
                  name: Sword
                  type: upgrade
                - id: se-axe
                  name: Axe
                  type: upgrade

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    id: select-parent
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-parent

  # min=2 causes Sword to be auto-selected with number=2.
  # This exceeds max=1, producing a validation error — on two kinds of node.
  # BattleScribe has no group in its error model and raises it on the enclosing
  # Parent Unit SELECTION; NewRecruit materialises the selectionEntryGroup as a
  # real node and raises it there. `on: group` is bare because no engine's state
  # model carries that node and no step output can mint it (same shape as
  # selection-entry-group-constraint).
  - expectedState:
      errorsContain:
        - on: selection ${{ steps.select-parent.selectionId }}
          from: seg-weapons/con-max
      forces:
        - selections:
            - name: Parent Unit
              children:
                - name: Sword
                  number: 2
      engines:
        newrecruit:
          errorsContain:
            - on: group
              from: seg-weapons/con-max
