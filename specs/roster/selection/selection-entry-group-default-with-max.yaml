id: selection-entry-group-default-with-max
category: selection
description: DefaultSelectionEntryId with min exceeding max causes validation error
tags: [defaultSelectionEntryId, constraint, max]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-parent
          name: Parent Unit
          type: unit
          selectionEntryGroups:
            - id: seg-weapons
              name: Weapon Options
              defaultSelectionEntryId: se-sword
              constraints:
                - id: con-min
                  type: min
                  value: 2
                  field: selections
                  scope: parent
                - id: con-max
                  type: max
                  value: 1
                  field: selections
                  scope: parent
              selectionEntries:
                - id: se-sword
                  name: Sword
                  type: upgrade
                - id: se-axe
                  name: Axe
                  type: upgrade

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-parent

  # min=2 causes Sword to be auto-selected with number=2.
  # This exceeds max=1, producing a validation error.
  - expectedState:
      errorsContain:
        - on: selection se-parent
          from: seg-weapons/con-max
      forces:
        - selectionCount: 1
          selections:
            - name: Parent Unit
              children:
                - name: Sword
                  number: 2
