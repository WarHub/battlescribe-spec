id: hidden-cascade-to-children
category: selection
description: Hidden parent entry with visible children can still be selected
tags: [design-difference]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-squad
          name: Hidden Squad
          type: unit
          hidden: true
          selectionEntries:
            - id: se-soldier
              name: Soldier
              type: model

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad

  - expectedState:
      errors:
        - on: selection se-squad
          from: se-squad/hidden
      forces:
        - selections:
            - name: Hidden Squad
              hidden: true
      engines:
        battlescribe:
          errors: []
