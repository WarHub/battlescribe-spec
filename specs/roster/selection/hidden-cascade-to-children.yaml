id: hidden-cascade-to-children
category: selection
description: Hidden parent entry with visible children can still be selected
tags: [design-difference]

engines:
  # Hidden at browse time: real desktop BS never displays this entry, so no
  # UI-gesture driver can select it (see issue #309). The in-process engine
  # and the (currently engine-API-backed) bs-ui driver still cover it.
  battlescribe-ui: skip
  # Same reason for NR's web UI: NR never renders a row for a hidden entry either.
  # `fail` rather than `skip` so the spec still RUNS here — if an NR release starts
  # rendering it, that is reported as an unexpected pass instead of going unnoticed.
  newrecruit-ui: fail

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-squad
          name: Hidden Squad
          type: unit
          hidden: true
          selectionEntries:
            - id: se-soldier
              name: Soldier
              type: model

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad

  - expectedState:
      errors:
        - on: selection se-squad
          from: se-squad/hidden
      forces:
        - selections:
            - name: Hidden Squad
              hidden: true
      engines:
        battlescribe:
          errors: []
