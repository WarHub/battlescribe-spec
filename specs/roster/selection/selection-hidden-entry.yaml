id: selection-hidden-entry
category: selection
description: Hidden selection entries can still be selected but produce a validation error
tags: [design-difference]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Hidden Unit
          type: unit
          hidden: true

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      errors:
        - on: selection se-1
          from: se-1/hidden
      forces:
        - selectionCount: 1
          selections:
            - name: Hidden Unit
              hidden: true
      engines:
        battlescribe:
          errors: []
