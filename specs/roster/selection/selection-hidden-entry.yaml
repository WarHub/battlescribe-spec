id: selection-hidden-entry
category: selection
description: Hidden selection entries can still be selected but produce a validation error (except BattleScribe)
tags: [design-difference]

engines:
  # Hidden at browse time: real desktop BS never displays this entry, so no
  # UI-gesture driver can select it (see issue #309). The in-process engine
  # and the (currently engine-API-backed) bs-ui driver still cover it.
  battlescribe-ui: skip
  # Same reason for NR's web UI: NR never renders a row for a hidden entry either.
  # `fail` rather than `skip` so the spec still RUNS here — if an NR release starts
  # rendering it, that is reported as an unexpected pass instead of going unnoticed.
  newrecruit-ui: fail

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-1
          name: Hidden Unit
          type: unit
          hidden: true

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    id: select-unit
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  # NewRecruit's node is the base assertion because it is the only engine that
  # raises here — BattleScribe's hidden check runs inside category validation and
  # this entry has no categoryLinks, which is the design difference under test.
  - expectedState:
      errors:
        - on: selection ${{ steps.select-unit.selectionId }}
          from: se-1/hidden
      forces:
        - selections:
            - name: Hidden Unit
              hidden: true
      engines:
        battlescribe:
          errors: []
