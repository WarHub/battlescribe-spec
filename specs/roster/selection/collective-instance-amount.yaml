id: collective-instance-amount
category: selection
description: >
  Increasing the count of an instanced entry scales all children proportionally
  through the parent chain (getSelectionCount multiplies amounts up the tree).
  BS has a bug where setNumSelections on isDuplicate entries is a no-op — the
  number cannot be changed; only selectChildEntry can create new copies.
tags:
  - collective
  - number
  - battlescribe-bug

setup:
  gameSystem:
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-squad
          name: Squad
          selectionEntries:
            # Sergeant has a non-collective child → isDuplicate/isInstanced
            - id: se-sergeant
              name: Sergeant
              selectionEntries:
                - id: se-badge
                  name: Badge
                  costs:
                    - name: pts
                      typeId: pts
                      value: 2
                - id: se-weapon
                  name: Weapon
                  collective: true
                  costs:
                    - name: pts
                      typeId: pts
                      value: 10

steps:
  - action: addForce
    id: add-force
    forceEntryId: fe-1

  - action: selectEntry
    id: select-squad
    forceId: ${{ steps.add-force.forceId }}
    entryId: se-squad

  - action: selectChildEntry
    id: select-sgt
    forceId: ${{ steps.add-force.forceId }}
    selectionId: ${{ steps.select-squad.selectionId }}
    entryId: se-sergeant

  - action: selectChildEntry
    forceId: ${{ steps.add-force.forceId }}
    selectionId: ${{ steps.select-sgt.selectionId }}
    entryId: se-badge

  - action: selectChildEntry
    forceId: ${{ steps.add-force.forceId }}
    selectionId: ${{ steps.select-sgt.selectionId }}
    entryId: se-weapon

  # Before changing count: both engines agree
  - expectedState:
      costs:
        - typeId: pts
          value: 12
      forces:
        - selections:
            - name: Squad
              children:
                - name: Sergeant
                  number: 1
                  children:
                    - name: Badge
                      number: 1
                      costs:
                        - name: pts
                          typeId: pts
                          value: 2
                    - name: Weapon
                      number: 1
                      costs:
                        - name: pts
                          typeId: pts
                          value: 10

  # Set Sergeant count to 3
  # Children scale via parent chain multiplication (amount × parent amounts)
  # BS bug: no-op for isDuplicate entries (number stays 1)
  - action: setSelectionCount
    forceId: ${{ steps.add-force.forceId }}
    selectionId: ${{ steps.select-sgt.selectionId }}
    count: 3

  - expectedState:
      costs:
        - typeId: pts
          value: 36
      forces:
        - selections:
            - name: Squad
              children:
                - name: Sergeant
                  number: 3
                  children:
                    - name: Badge
                      number: 3
                      costs:
                        - name: pts
                          typeId: pts
                          value: 6
                    - name: Weapon
                      number: 3
                      costs:
                        - name: pts
                          typeId: pts
                          value: 30
      engines:
        battlescribe:
          costs:
            - typeId: pts
              value: 12
          forces:
            - selections:
                - name: Squad
                  children:
                    - name: Sergeant
                      number: 1
                      children:
                        - name: Badge
                          number: 1
                          costs:
                            - name: pts
                              typeId: pts
                              value: 2
                        - name: Weapon
                          number: 1
                          costs:
                            - name: pts
                              typeId: pts
                              value: 10
        # What the desktop app does when asked for three of an INSTANCED entry, measured
        # 2026-08-09. The store-direct adapter reaches `setNumSelections`, which is a no-op here
        # (the `battlescribe:` block above) — but the app never offers that operation. An instanced
        # entry's edit panel carries a "+" button, not a spinner, so "three Sergeants" is three
        # SIBLING selections of number 1, not one of number 3.
        #
        # And the copies are not copies. Only the COLLECTIVE child rides along: Sergeants 2 and 3
        # get Weapon and not Badge, because a collective child is a property of the entry (one per
        # model) while a non-collective one is a selection made on a particular instance. Hence 32
        # = 12 + 10 + 10 and not 36 — the number the store-direct semantics predict — and the gap
        # is exactly the two Badges the app declines to duplicate.
        #
        # NOT checked: whether a Badge added to Sergeant 2 afterwards behaves the same, and whether
        # removing an instance renumbers the rest. Both are follow-on questions about the "+"
        # control rather than about the count this step sets.
        battlescribe-ui:
          costs:
            - typeId: pts
              value: 32
          forces:
            - selections:
                - name: Squad
                  children:
                    - name: Sergeant
                      number: 1
                      children:
                        - name: Badge
                          number: 1
                          costs:
                            - name: pts
                              typeId: pts
                              value: 2
                        - name: Weapon
                          number: 1
                          costs:
                            - name: pts
                              typeId: pts
                              value: 10
                    - name: Sergeant
                      number: 1
                      children:
                        - name: Weapon
                          number: 1
                          costs:
                            - name: pts
                              typeId: pts
                              value: 10
                    - name: Sergeant
                      number: 1
                      children:
                        - name: Weapon
                          number: 1
                          costs:
                            - name: pts
                              typeId: pts
                              value: 10
