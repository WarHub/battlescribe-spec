id: infolink-page-override
category: selection
description: InfoLink page does NOT override linked rule's page - target's own page is preserved
tags: [newrecruit-missing-feature]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      sharedRules:
        - id: shared-rule-1
          name: Fearless
          description: Immune to morale
          page: "10"
      selectionEntries:
        - id: se-1
          name: Marine
          type: unit
          infoLinks:
            - id: il-1
              name: Fearless
              targetId: shared-rule-1
              type: rule
              page: "99"

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - selections:
            - name: Marine
              rules:
                - name: Fearless
                  description: Immune to morale
                  page: "10"
      engines:
        newrecruit:
          forces:
            - selections:
                - name: Marine
                  rules:
                    - name: Fearless
                      description: Immune to morale
                      page: "99"
