id: selection-model-with-cost
category: selection
description: Model type child with cost contributes to roster total

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          selectionEntries:
            - id: se-trooper
              name: Trooper
              type: model
              costs:
                - name: pts
                  typeId: pts
                  value: 10

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    id: select-squad
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad

  - action: selectChildEntry
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-squad.selectionId }}
    entryId: se-trooper

  - expectedState:
      costs:
        - typeId: pts
          value: 10
      forces:
        - selectionCount: 1
          selections:
            - name: Squad
              type: unit
              children:
                - name: Trooper
                  type: model
                  costs:
                    - typeId: pts
                      value: 10
