id: info-link-with-modifiers
category: selection
description: InfoLink with modifiers applies modifier to the resolved target info

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Patrol
  catalogues:
    - id: cat-1
      sharedRules:
        - id: shared-rule-1
          name: Duty Eternal
          description: Original
      selectionEntries:
        - id: se-1
          name: Marine
          type: unit
          infoLinks:
            - id: il-1
              name: Duty Eternal
              targetId: shared-rule-1
              type: rule
              modifiers:
                - type: set
                  field: description
                  value: Modified by InfoLink

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - selections:
            - name: Marine
              rules:
                - name: Duty Eternal
                  description: Modified by InfoLink
