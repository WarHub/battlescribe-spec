id: profile-with-page
category: selection
description: Profile on a selection preserves its page field

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Detachment
    profileTypes:
      - id: pt-stats
        name: Unit Stats
        characteristicTypes:
          - id: ct-m
            name: M
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-1
          name: Veteran
          type: unit
          profiles:
            - id: prof-1
              name: Veteran
              typeId: pt-stats
              typeName: Unit Stats
              page: "55"
              characteristics:
                - name: M
                  typeId: ct-m
                  value: "6"

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - selections:
            - name: Veteran
              profiles:
                - name: Veteran
                  typeName: Unit Stats
                  page: "55"
                  characteristics:
                    - name: M
                      value: "6"
