id: entry-group-with-modifiers
category: selection
description: SelectionEntryGroup with modifiers alters child entry properties

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-parent
          name: Warrior
          type: unit
          selectionEntryGroups:
            - id: seg-gear
              name: Gear Options
              modifiers:
                - type: set
                  field: name
                  value: Special Gear
              constraints:
                - id: con-max-1
                  type: max
                  value: 1
                  field: selections
                  scope: parent
              selectionEntries:
                - id: se-shield
                  name: Shield
                  type: upgrade
                - id: se-helm
                  name: Helm
                  type: upgrade

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-parent
  # Group modifier sets the group name to "Special Gear".
  # Group constraint limits selection from the group to max 1.
  - expectedState:
      forces:
        - selections:
            - name: Warrior
