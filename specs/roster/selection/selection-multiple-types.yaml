id: selection-multiple-types
category: selection
description: Selection entries of different types (unit, model, upgrade) coexist in the same force

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit
          name: Infantry Squad
          type: unit
        - id: se-model
          name: Sergeant
          type: model
        - id: se-upgrade
          name: Power Sword
          type: upgrade

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-unit

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-model

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-upgrade

  - expectedState:
      forces:
        - selections:
            - name: Infantry Squad
              type: unit
            - name: Power Sword
              type: upgrade
            - name: Sergeant
              type: model
