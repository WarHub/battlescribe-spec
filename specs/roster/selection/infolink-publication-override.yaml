id: infolink-publication-override
category: selection
description: InfoLink publicationId does NOT override linked target - target's own publicationId is preserved
tags: [newrecruit-missing-feature]

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      publications:
        - id: pub-core
          name: Core Rulebook
        - id: pub-faq
          name: FAQ Update
      sharedRules:
        - id: shared-rule-1
          name: Fearless
          description: Immune to morale
          publicationId: pub-core
      selectionEntries:
        - id: se-1
          name: Marine
          type: unit
          infoLinks:
            - id: il-1
              name: Fearless
              targetId: shared-rule-1
              type: rule
              publicationId: pub-faq

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - selections:
            - name: Marine
              rules:
                - name: Fearless
                  description: Immune to morale
                  publicationId: pub-core
      engines:
        newrecruit:
          forces:
            - selections:
                - name: Marine
                  rules:
                    - name: Fearless
                      description: Immune to morale
                      publicationId: pub-faq
