id: shared-entry-via-entry-link
category: selection
description: An EntryLink targeting a shared selection entry resolves correctly

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      sharedSelectionEntries:
        - id: shared-se-1
          name: Elite Marine
          type: unit
      entryLinks:
        - id: el-1
          name: Elite Marine
          targetId: shared-se-1
          type: selectionEntry

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: el-1

  - expectedState:
      forces:
        - name: Patrol
          selections:
            - name: Elite Marine
