id: selection-entry-group-basic
category: selection
description: SelectionEntryGroup contains multiple child entries that can be selected independently

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-parent
          name: Parent Unit
          type: unit
          selectionEntryGroups:
            - id: seg-weapons
              name: Weapon Options
              selectionEntries:
                - id: se-sword
                  name: Sword
                  type: upgrade
                - id: se-axe
                  name: Axe
                  type: upgrade

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    id: select-parent
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-parent

  - action: selectChildEntry
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-parent.selectionId }}
    entryId: se-sword

  - action: selectChildEntry
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-parent.selectionId }}
    entryId: se-axe

  # Group children can be selected independently as child selections.
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Parent Unit
              children:
                - name: Axe
                - name: Sword
