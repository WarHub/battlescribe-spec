id: selection-collective-create
category: selection
description: Collective entry is replicated across sibling selections when selected

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          selectionEntries:
            - id: se-model
              name: Trooper
              type: model
              constraints:
                - id: con-min-2
                  type: min
                  value: 2
                  field: selections
                  scope: parent
            - id: se-weapon
              name: Shared Weapon
              type: upgrade
              collective: true

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    id: select-squad
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad

  - action: selectChildEntry
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-squad.selectionId }}
    entryId: se-weapon

  # Collective child entries are replicated across sibling model selections.
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Squad
              children:
                - name: Shared Weapon
                - name: Trooper
