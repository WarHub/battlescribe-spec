id: selection-collective-create
category: selection
description: Collective entry is replicated across sibling selections when selected
tags: []

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Squad
          type: unit
          selectionEntries:
            - id: se-child
              name: Weapon
              type: upgrade
              collective: true

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1
  # Collective child entries are automatically created for all instances.
  # The selection appears with its children.
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Squad
