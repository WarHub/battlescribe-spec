id: collective-group-default-scaling
category: selection
description: >
  A collective SelectionEntryGroup's default entry (also collective) is
  auto-selected scaled by parent.number. On parent increase, both the group's
  collective scaling and the entry's collective propagation multiply, producing
  a number² effect (parent=3 → child=9).
tags:
  - collective
  - number
  - cost
  - entry-group
  - newrecruit-missing-feature
engines:
  newrecruit: skip

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          selectionEntries:
            - id: se-trooper
              name: Trooper
              type: model
              selectionEntryGroups:
                - id: seg-weapons
                  name: Weapons
                  collective: true
                  defaultSelectionEntryId: se-rifle
                  constraints:
                    - id: con-min-1
                      type: min
                      value: 1
                      field: selections
                      scope: parent
                  selectionEntries:
                    - id: se-rifle
                      name: Rifle
                      type: upgrade
                      collective: true
                      costs:
                        - name: pts
                          typeId: pts
                          value: 5
                    - id: se-sword
                      name: Sword
                      type: upgrade
                      collective: true
                      costs:
                        - name: pts
                          typeId: pts
                          value: 3

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    id: select-squad
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad

  - action: selectChildEntry
    id: select-trooper
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-squad.selectionId }}
    entryId: se-trooper

  # Trooper at number=1 — Rifle auto-selected with number=1
  - expectedState:
      forces:
        - selections:
            - name: Squad
              children:
                - name: Trooper
                  number: 1
                  children:
                    - name: Rifle
                      number: 1
                      costs:
                        - name: pts
                          typeId: pts
                          value: 5
      costs:
        - typeId: pts
          value: 5

  # Increase Trooper to 3 — Rifle scales to 9 (group collective × entry collective)
  - action: setSelectionCount
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-trooper.selectionId }}
    count: 3

  - expectedState:
      forces:
        - selections:
            - name: Squad
              children:
                - name: Trooper
                  number: 3
                  children:
                    - name: Rifle
                      number: 9
                      costs:
                        - name: pts
                          typeId: pts
                          value: 45
      costs:
        - typeId: pts
          value: 45
