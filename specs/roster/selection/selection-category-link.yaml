id: selection-category-link
category: selection
description: Selection entry with category link assigns the selection to a category

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    categoryEntries:
      - id: cat-entry-hq
        name: HQ
    forceEntries:
      - id: fe-1
        name: Detachment
        categoryLinks:
          - id: cl-fe-hq
            targetId: cat-entry-hq
            name: HQ
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Commander
          type: unit
          categoryLinks:
            - id: cl-1
              targetId: cat-entry-hq
              name: HQ
              primary: true

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Commander
              type: unit
