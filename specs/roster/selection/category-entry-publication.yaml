id: category-entry-publication
category: selection
tags: [categoryEntry, publication, engine-limitation]
description: >
  CategoryEntry with publicationId and page is accepted in XML.
  Engine limitation: category roster elements do not expose publicationId/page
  from the entry definition.

setup:
  gameSystem:
    categoryEntries:
      - id: cat-troops
        name: Troops
        publicationId: pub-1
        page: "10"
    forceEntries:
      - id: fe-1
        name: Detachment
        categoryLinks:
          - id: cl-troops
            targetId: cat-troops
            name: Troops
  catalogues:
    - id: cat-1
      publications:
        - id: pub-1
          name: Core Rulebook
      selectionEntries:
        - id: se-1
          name: Marine
          type: unit

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - selections:
            - name: Marine
