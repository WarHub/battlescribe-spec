id: profile-multiple-on-entry
category: selection
description: An entry with two profiles of the same type produces both profiles in selection state

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Detachment
    profileTypes:
      - id: pt-weapon
        name: Weapon Stats
        characteristicTypes:
          - id: char-range
            name: Range
          - id: char-str
            name: Strength
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-dual
          name: Dual Wielder
          type: unit
          profiles:
            - id: prof-axe
              name: Power Axe
              typeId: pt-weapon
              typeName: Weapon Stats
              characteristics:
                - name: Range
                  typeId: char-range
                  value: Melee
                - name: Strength
                  typeId: char-str
                  value: "6"
            - id: prof-sword
              name: Chain Sword
              typeId: pt-weapon
              typeName: Weapon Stats
              characteristics:
                - name: Range
                  typeId: char-range
                  value: Melee
                - name: Strength
                  typeId: char-str
                  value: "4"

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-dual

  - expectedState:
      forces:
        - selections:
            - name: Dual Wielder
              profiles:
                - name: Power Axe
                  characteristics:
                    - name: Range
                      value: Melee
                    - name: Strength
                      value: "6"
                - name: Chain Sword
                  characteristics:
                    - name: Range
                      value: Melee
                    - name: Strength
                      value: "4"
