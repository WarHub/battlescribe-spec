id: modifier-conditional-set-name
category: modifier
description: Conditional modifier only applies when condition is met (using atLeast)

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit-a
          name: Base Name
          type: unit
          modifiers:
            - type: set
              field: name
              value: Conditioned Name
              conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: parent
                  childId: se-unit-a

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - expectedState:
      forces:
        - selections:
            - name: Conditioned Name
