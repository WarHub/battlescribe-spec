id: modifier-repeat-not-shared-per-link
category: modifier
description: >
  Repeat with shared=false does NOT count selections of a shared entry
  accessed via entry links. When childId references a shared entry and
  shared=false, the engine matches by composite entry-link ID (not the base
  shared ID), so no selections contribute to the repeat multiplier.
  Contrast: modifier-repeat-shared-counting shows shared=true counts across
  links. This proves shared=false effectively disables cross-link repeat
  counting.
engines:
  newrecruit: skip

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Patrol
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      sharedSelectionEntries:
        - id: shared-model
          name: Trooper
          type: model
      entryLinks:
        - id: link-alpha
          name: Alpha Trooper
          targetId: shared-model
          type: selectionEntry
        - id: link-beta
          name: Beta Trooper
          targetId: shared-model
          type: selectionEntry
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 50
          modifiers:
            - type: increment
              field: pts
              value: "10"
              repeats:
                - value: 1
                  repeats: 1
                  field: selections
                  scope: force
                  childId: shared-model
                  shared: false

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-squad

  # No troopers yet — Squad costs 50pts base
  - expectedState:
      forces:
        - selections:
            - name: Squad
              costs:
                - typeId: pts
                  value: 50

  # 1 selection via link-alpha — shared=false: no repeat increment
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: link-alpha

  # Squad still 50pts — shared=false means childId can't match composite IDs
  - expectedState:
      forces:
        - selections:
            - name: Squad
              costs:
                - typeId: pts
                  value: 50
            - name: Trooper

  # 1 selection via link-beta — still no increment
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: link-beta

  - expectedState:
      forces:
        - selections:
            - name: Squad
              costs:
                - typeId: pts
                  value: 50
            - name: Trooper
            - name: Trooper
