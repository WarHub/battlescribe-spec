id: modifier-repeat-include-child-selections
category: modifier
description: Repeat with includeChildSelections counts parent and child selections

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-parent
          name: Leader
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 0
          modifiers:
            - type: increment
              field: pts
              value: "5"
              repeats:
                - value: 1
                  repeats: 2
                  field: selections
                  scope: force
                  childId: se-trooper
                  includeChildSelections: true
          selectionEntries:
            - id: se-trooper
              name: Trooper
              type: model
            - id: se-sergeant
              name: Sergeant
              type: model

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    id: select-leader
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-parent

  - action: selectChildEntry
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-leader.selectionId }}
    entryId: se-trooper

  - action: selectChildEntry
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-leader.selectionId }}
    entryId: se-trooper

  - action: selectChildEntry
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-leader.selectionId }}
    entryId: se-trooper

  # includeChildSelections traverses into Leader's children for se-trooper matches.
  # 3 Troopers found, value=1, repeats=2: floor(3/1) × 2 = 6 repetitions → 0 + 5×6 = 30
  - expectedState:
      forces:
        - selections:
            - name: Leader
              costs:
                - typeId: pts
                  value: 30
