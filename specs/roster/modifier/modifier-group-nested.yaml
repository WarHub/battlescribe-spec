id: modifier-group-nested
category: modifier
description: Nested modifier groups (ModifierGroup containing ModifierGroups) form hierarchical modifier structures

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Marine
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 100
          modifierGroups:
            - conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: parent
                  childId: se-1
              modifierGroups:
                - modifiers:
                    - type: increment
                      field: pts
                      value: "10"

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1
  # Nested ModifierGroup: outer group condition met (1 selection ≥ 1),
  # inner group unconditional → increment pts by 10 → 100 + 10 = 110
  - expectedState:
      forces:
        - selections:
            - name: Marine
              costs:
                - typeId: pts
                  value: 110
