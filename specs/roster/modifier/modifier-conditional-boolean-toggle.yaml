id: modifier-conditional-boolean-toggle
category: modifier
description: Boolean modifier with condition toggles hidden based on selection state

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-trigger
          name: Trigger Unit
          type: unit
        - id: se-target
          name: Target Unit
          type: unit
          hidden: true
          modifiers:
            - type: set
              field: hidden
              value: "false"
              conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: force
                  childId: se-trigger

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1
  # Select trigger unit - should cause target to become visible
  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-trigger

  - expectedState:
      forces:
        - selections:
            - name: Trigger Unit

  # Now select target — it was hidden but trigger's modifier set hidden=false
  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-target

  - expectedState:
      forces:
        - selections:
            - name: Target Unit
            - name: Trigger Unit
