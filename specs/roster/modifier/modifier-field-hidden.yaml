id: modifier-field-hidden
category: modifier
description: Modifier targeting 'hidden' field changes entry visibility and produces validation error

setup:
  gameSystem:
    categoryEntries:
      - id: ce-troops
        name: Troops
    forceEntries:
      - id: fe-1
        name: Detachment
        categoryLinks:
          - id: cl-fe-troops
            targetId: ce-troops
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-1
          name: Stealth Unit
          type: unit
          categoryLinks:
            - id: cl-se-troops
              targetId: ce-troops
              primary: true
          modifiers:
            - type: set
              field: hidden
              value: "true"

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      errors:
        - on: selection se-1
          from: se-1/hidden
      forces:
        - selections:
            - name: Stealth Unit
              hidden: true
