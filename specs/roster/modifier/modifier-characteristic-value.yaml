id: modifier-characteristic-value
category: modifier
description: Modifier can set a Profile Characteristic value (STRING modifier on CharacteristicType ID field)

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Detachment
    profileTypes:
      - id: stat-type
        name: Unit Stats
        characteristicTypes:
          - id: char-wounds
            name: Wounds
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-1
          name: Marine
          type: unit
          profiles:
            - id: prof-1
              name: Marine Stats
              typeId: stat-type
              typeName: Unit Stats
              characteristics:
                - name: Wounds
                  typeId: char-wounds
                  value: "2"
              modifiers:
                - type: set
                  field: char-wounds
                  value: "3"

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - selections:
            - name: Marine
              profiles:
                - name: Marine Stats
                  characteristics:
                    - name: Wounds
                      value: "3"
