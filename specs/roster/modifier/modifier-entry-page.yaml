id: modifier-entry-page
category: modifier
description: Modifier can set an entry's page field (STRING modifier on BaseBookData.page)
tags: [newrecruit-missing-feature]

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-1
          name: Marine
          type: unit
          page: "42"
          modifiers:
            - type: set
              field: page
              value: "99"

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - selections:
            - name: Marine
              page: "99"
      engines:
        newrecruit:
          forces:
            - selections:
                - name: Marine
                  page: "42"
