id: modifier-repeat-zero-threshold
category: modifier
description: Repeat with value=0 leaves the increment unapplied

setup:
  gameSystem:
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-model
          name: Model
          type: model
        - id: se-squad
          name: Squad
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 50
          modifiers:
            - type: increment
              field: pts
              value: "100"
              repeats:
                - value: 0
                  repeats: 2
                  field: selections
                  scope: force
                  childId: se-model

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-model

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-model

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-model

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad

  # value=0 means division by zero is guarded — no repetitions applied despite
  # 3 Models in scope and repeats=2. Cost stays at 50.
  - expectedState:
      costs:
        - typeId: pts
          value: 50.0
      forces:
        - selections:
            - name: Model
            - name: Model
            - name: Model
            - name: Squad
