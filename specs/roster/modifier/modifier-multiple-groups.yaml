id: modifier-multiple-groups
category: modifier
description: Multiple modifier groups on an entry all apply when their conditions match

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Agent
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 100
          modifierGroups:
            - conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: parent
                  childId: se-1
              modifiers:
                - type: set
                  field: name
                  value: Active Agent
            - conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: parent
                  childId: se-1
              modifiers:
                - type: increment
                  field: pts
                  value: "25"

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1
  # Both modifier groups' conditions met (1 selection ≥ 1).
  # Group 1: set name to "Active Agent". Group 2: increment pts by 25 → 125.
  - expectedState:
      forces:
        - selections:
            - name: Active Agent
              costs:
                - typeId: pts
                  value: 125
