id: modifier-set-hidden-no-category
category: modifier
tags: [design-difference]
description: >
  A hidden selection without categoryLinks gets no validation error in BattleScribe.
  The hidden error generator only runs inside category validation (f.java L444),
  so selections not assigned to any category are never checked.
  NR checks hidden independently of categories and produces an error.
  See docs/hidden-validation-analysis.md for decompiled source analysis.

engines:
  # Hidden at browse time: real desktop BS never displays this entry, so no
  # UI-gesture driver can select it (see issue #309). The in-process engine
  # and the (currently engine-API-backed) bs-ui driver still cover it.
  battlescribe-ui: skip
  # Same reason for NR's web UI: NR never renders a row for a hidden entry either.
  # `fail` rather than `skip` so the spec still RUNS here — if an NR release starts
  # rendering it, that is reported as an unexpected pass instead of going unnoticed.
  newrecruit-ui: fail

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-hidden
          name: Hidden Unit
          type: unit
          modifiers:
            - type: set
              field: hidden
              value: "true"

steps:
  - action: addForce
    id: add-force
    forceEntryId: fe-patrol

  - action: selectEntry
    id: select-hidden
    forceId: ${{ steps.add-force.forceId }}
    entryId: se-hidden

  # NewRecruit's node, because it is the only engine that raises here: BattleScribe's
  # hidden check runs inside category validation and this selection has no category,
  # which is the design difference the spec exists for.
  - expectedState:
      errors:
        - on: selection ${{ steps.select-hidden.selectionId }}
          from: se-hidden/hidden
      forces:
        - selections:
            - name: Hidden Unit
              hidden: true
      engines:
        battlescribe:
          errors: []
