id: entry-link-cascading-modifiers
category: modifier
description: EntryLink with set-name modifier overrides the target entry name

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-base-unit
          name: Warrior
          type: unit
      entryLinks:
        - id: el-cascade
          name: Elite Warrior
          targetId: se-base-unit
          type: selectionEntry
          modifiers:
            - type: set
              field: name
              value: Elite Warrior

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-base-unit
  # Selecting entryIndex 0 picks the selectionEntry "Warrior" directly.
  # The entryLink's modifier applies only when selecting through the link.
  - expectedState:
      forces:
        - selections:
            - name: Warrior
