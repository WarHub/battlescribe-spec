id: modifier-category-set-primary
category: modifier
description: Category set-primary modifier sets a category as primary on the selection

setup:
  gameSystem:
    categoryEntries:
      - id: cat-hq
        name: HQ
      - id: cat-elite
        name: Elites
    forceEntries:
      - id: fe-1
        name: Detachment
        categoryLinks:
          - id: cl-fe-hq
            targetId: cat-hq
            name: HQ
          - id: cl-fe-elite
            targetId: cat-elite
            name: Elites
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-1
          name: Commander
          type: unit
          categoryLinks:
            - id: cl-1
              targetId: cat-hq
              name: HQ
              primary: true
          modifiers:
            - type: set-primary
              field: category
              value: cat-elite

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - selections:
            - name: Commander
              categories:
                - name: Elites
                  primary: true
                - name: HQ
