id: modifier-rule-description
category: modifier
description: Modifier can set a Rule's description field (STRING modifier on rule description)

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Marine
          type: unit
          rules:
            - id: rule-1
              name: Combat Doctrine
              description: Original description
              modifiers:
                - type: set
                  field: description
                  value: Modified description

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - selections:
            - name: Marine
              rules:
                - name: Combat Doctrine
                  description: Modified description
