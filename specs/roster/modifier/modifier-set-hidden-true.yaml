id: modifier-set-hidden-true
category: modifier
description: >
  A boolean SET modifier on hidden field hides the entry.
  The entry can be selected but reports as hidden, and engines should show an error.

engines:
  # Hidden at browse time: real desktop BS never displays this entry, so no
  # UI-gesture driver can select it (see issue #309). The in-process engine
  # and the (currently engine-API-backed) bs-ui driver still cover it.
  battlescribe-ui: skip
  # Same reason for NR's web UI: NR never renders a row for a hidden entry either.
  # `fail` rather than `skip` so the spec still RUNS here — if an NR release starts
  # rendering it, that is reported as an unexpected pass instead of going unnoticed.
  # Two causes here, not one: even if NR started rendering hidden entries, step 2 would
  # still fail. `ce-troops` is declared in the CATALOGUE, and a force categoryLink to a
  # catalogue-declared category produces no rendered group — so NR files se-normal under
  # its `Illegal Units` bucket (built hidden:true, never rendered) and offers no row for
  # the VISIBLE entry either. Measured against the same spec with ce-troops moved to the
  # gameSystem, which passes.
  newrecruit-ui: fail

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-troops
            targetId: ce-troops
  catalogues:
    - id: cat-1
      categoryEntries:
        - id: ce-troops
          name: Troops
      selectionEntries:
        - id: se-hidden
          name: Hidden Unit
          type: unit
          categoryLinks:
            - id: cl-hidden-troops
              targetId: ce-troops
              primary: true
          modifiers:
            - type: set
              field: hidden
              value: "true"
        - id: se-normal
          name: Normal Unit
          type: unit
          categoryLinks:
            - id: cl-normal-troops
              targetId: ce-troops
              primary: true

steps:
  - action: addForce
    id: add-force
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-force.forceId }}
    entryId: se-hidden

  - action: selectEntry
    forceId: ${{ steps.add-force.forceId }}
    entryId: se-normal

  - expectedState:
      errors:
        - on: selection se-hidden
          from: se-hidden/hidden
      forces:
        - selections:
            - name: Hidden Unit
              hidden: true
            - name: Normal Unit
