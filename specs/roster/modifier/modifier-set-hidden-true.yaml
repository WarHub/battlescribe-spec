id: modifier-set-hidden-true
category: modifier
description: >
  A boolean SET modifier on hidden field hides the entry.
  The entry can be selected but reports as hidden, and engines should show an error.

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-troops
            targetId: ce-troops
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      categoryEntries:
        - id: ce-troops
          name: Troops
      selectionEntries:
        - id: se-hidden
          name: Hidden Unit
          type: unit
          categoryLinks:
            - id: cl-hidden-troops
              targetId: ce-troops
              primary: true
          modifiers:
            - type: set
              field: hidden
              value: "true"
        - id: se-normal
          name: Normal Unit
          type: unit
          categoryLinks:
            - id: cl-normal-troops
              targetId: ce-troops
              primary: true

steps:
  - action: addForce
    id: add-force
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-force.forceId }}
    entryId: se-hidden

  - action: selectEntry
    forceId: ${{ steps.add-force.forceId }}
    entryId: se-normal

  - expectedState:
      errors:
        - on: selection se-hidden
          from: se-hidden/hidden
      forces:
        - selectionCount: 2
          selections:
            - name: Hidden Unit
              hidden: true
            - name: Normal Unit
