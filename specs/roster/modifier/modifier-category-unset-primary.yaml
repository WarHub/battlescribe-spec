id: modifier-category-unset-primary
category: modifier
description: Category unset-primary modifier removes primary status from a category on the selection
tags: [newrecruit-bug]

engines:
  # Hidden at browse time, but by NR's own bug rather than by the spec. `se-1` declares no
  # `hidden` and no hidden modifier; NR mis-applies the `unset-primary`/`field: category`
  # modifier as hiding the entry — which is exactly what this spec's per-step `newrecruit`
  # override already records. NR applies it while BROWSING, so the catalogue panel never
  # renders a row and no UI gesture can reach it. Measured: the identical spec with the
  # modifier removed passes on newrecruit-ui.
  # `fail` rather than `skip` so the spec still RUNS — if NR fixes the modifier, that is
  # reported as an unexpected pass instead of going unnoticed.
  newrecruit-ui: fail

setup:
  gameSystem:
    categoryEntries:
      - id: cat-hq
        name: HQ
    forceEntries:
      - id: fe-1
        name: Detachment
        categoryLinks:
          - id: cl-fe-hq
            targetId: cat-hq
            name: HQ
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-1
          name: Commander
          type: unit
          categoryLinks:
            - id: cl-1
              targetId: cat-hq
              name: HQ
              primary: true
          modifiers:
            - type: unset-primary
              field: category
              value: cat-hq

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - selections:
            - name: Commander
              categories:
                - name: HQ
                  primary: false
      engines:
        newrecruit:
          forces:
            - selections:
                - name: Commander
                  hidden: true
                  categories:
                    - name: HQ
                      primary: true
          errors:
            - on: selection se-1
              from: se-1/hidden
