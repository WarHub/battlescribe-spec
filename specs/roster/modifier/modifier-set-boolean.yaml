id: modifier-set-boolean
category: modifier
description: >
  Set modifier on boolean field (hidden=true) hides the entry and produces a validation error.

engines:
  # Hidden at browse time: real desktop BS never displays this entry, so no
  # UI-gesture driver can select it (see issue #309). The in-process engine
  # and the (currently engine-API-backed) bs-ui driver still cover it.
  battlescribe-ui: skip
  # Same reason for NR's web UI: NR never renders a row for a hidden entry either.
  # `fail` rather than `skip` so the spec still RUNS here — if an NR release starts
  # rendering it, that is reported as an unexpected pass instead of going unnoticed.
  newrecruit-ui: fail

setup:
  gameSystem:
    categoryEntries:
      - id: ce-troops
        name: Troops
    forceEntries:
      - id: fe-1
        name: Detachment
        categoryLinks:
          - id: cl-fe-troops
            targetId: ce-troops
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-1
          name: Secret Agent
          type: unit
          categoryLinks:
            - id: cl-se-troops
              targetId: ce-troops
              primary: true
          modifiers:
            - type: set
              field: hidden
              value: "true"

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    id: select-agent
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  # Both engines' raising nodes are recorded. BattleScribe generates hidden errors
  # only inside category validation, so it raises this on the force's Troops
  # CATEGORY; NewRecruit checks hidden per selection and raises it on the Secret
  # Agent selection.
  - expectedState:
      errors:
        - on: category ${{ steps.add-detachment.categories.ce-troops }}
          from: se-1/hidden
      forces:
        - selections:
            - name: Secret Agent
              hidden: true
      engines:
        newrecruit:
          errors:
            - on: selection ${{ steps.select-agent.selectionId }}
              from: se-1/hidden
