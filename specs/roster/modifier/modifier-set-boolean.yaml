id: modifier-set-boolean
category: modifier
description: >
  Set modifier on boolean field (hidden=true) hides the entry and produces a validation error.

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    categoryEntries:
      - id: ce-troops
        name: Troops
    forceEntries:
      - id: fe-1
        name: Detachment
        categoryLinks:
          - id: cl-fe-troops
            targetId: ce-troops
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Secret Agent
          type: unit
          categoryLinks:
            - id: cl-se-troops
              targetId: ce-troops
              primary: true
          modifiers:
            - type: set
              field: hidden
              value: "true"

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      errors:
        - on: selection se-1
          from: se-1/hidden
      forces:
        - selectionCount: 1
          selections:
            - name: Secret Agent
              hidden: true
