id: modifier-set-boolean
category: modifier
description: >
  Set modifier on boolean field (hidden=true) hides the entry and produces a validation error.

engines:
  # Hidden at browse time: real desktop BS never displays this entry, so no
  # UI-gesture driver can select it (see issue #309). The in-process engine
  # and the (currently engine-API-backed) bs-ui driver still cover it.
  battlescribe-ui: skip

setup:
  gameSystem:
    categoryEntries:
      - id: ce-troops
        name: Troops
    forceEntries:
      - id: fe-1
        name: Detachment
        categoryLinks:
          - id: cl-fe-troops
            targetId: ce-troops
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-1
          name: Secret Agent
          type: unit
          categoryLinks:
            - id: cl-se-troops
              targetId: ce-troops
              primary: true
          modifiers:
            - type: set
              field: hidden
              value: "true"

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      errors:
        - on: selection se-1
          from: se-1/hidden
      forces:
        - selections:
            - name: Secret Agent
              hidden: true
