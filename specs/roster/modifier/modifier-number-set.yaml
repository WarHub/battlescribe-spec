id: modifier-number-set
category: modifier
description: Number set modifier replaces a numeric (cost) field value entirely

setup:
  gameSystem:
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-1
          name: Unit A
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 100
          modifiers:
            - type: set
              field: pts
              value: "50"

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1
  # Number set: cost becomes 50 regardless of original value
  - expectedState:
      costs:
        - typeId: pts
          value: 50.0
      forces:
        - selections:
            - name: Unit A
