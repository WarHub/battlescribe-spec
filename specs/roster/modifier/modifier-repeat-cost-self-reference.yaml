id: modifier-repeat-cost-self-reference
category: modifier
tags: [newrecruit-bug, battlescribe-bug]
description: >
  Repeat counting cost of same entry type creates a self-referencing loop.
  Engines should detect the cycle and report a validation error without
  applying the looping modifier. Both engines instead resolve the loop:
  BS single-pass excludes self (converges trivially), NR reactive fixed-point
  counts self and iterates to convergence.

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit
          name: Unit
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 100
          modifiers:
            # For each 50 pts of se-unit in force, increment pts by 10.
            # This references the same entry type — self-referencing loop.
            - type: increment
              field: pts
              value: "10"
              repeats:
                - value: 50
                  repeats: 1
                  field: pts
                  scope: force
                  childId: se-unit

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  # Single instance: self-referencing loop should be detected
  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-unit

  # Ideal: engine detects the self-referencing loop, reports error,
  # does not apply the modifier → base cost preserved.
  - expectedState:
      errorCount: 1
      costs:
        - typeId: pts
          value: 100
      engines:
        # BS: excludes self from count → 0 reps → base cost. No error reported.
        battlescribe:
          errorCount: 0
          costs:
            - typeId: pts
              value: 100
        # NR: counts self, iterates to convergence: 120/50=2 reps → 100+20=120. No error.
        newrecruit:
          errorCount: 0
          costs:
            - typeId: pts
              value: 120

  # Two instances: loop amplifies — each counts other's modified cost
  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-unit

  # Ideal: loop detected, modifier not applied, base costs preserved.
  - expectedState:
      errorCount: 1
      costs:
        - typeId: pts
          value: 200
      forces:
        - selections:
            - name: Unit
              costs:
                - typeId: pts
                  value: 100
            - name: Unit
              costs:
                - typeId: pts
                  value: 100
      engines:
        # BS: single-pass, each sees other's modified cost (100) → 2 reps → 120 each
        battlescribe:
          errorCount: 0
          costs:
            - typeId: pts
              value: 240
          forces:
            - selections:
                - name: Unit
                  costs:
                    - typeId: pts
                      value: 120
                - name: Unit
                  costs:
                    - typeId: pts
                      value: 120
        # NR: reactive fixed-point converges at 160 each (total 320/50=6 reps)
        newrecruit:
          errorCount: 0
          costs:
            - typeId: pts
              value: 320
          forces:
            - selections:
                - name: Unit
                  costs:
                    - typeId: pts
                      value: 160
                - name: Unit
                  costs:
                    - typeId: pts
                      value: 160

  # Three instances: demonstrates insertion-order asymmetry in BS's single-pass algorithm.
  # Each entry's modifier queries LIVE costs of other entries at the moment it's processed.
  # Earlier-inserted entries see fewer updated values → lower cost.
  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-unit

  # Ideal: loop detected, modifier not applied, base costs preserved.
  - expectedState:
      errorCount: 1
      costs:
        - typeId: pts
          value: 300
      forces:
        - selections:
            - name: Unit
              costs:
                - typeId: pts
                  value: 100
            - name: Unit
              costs:
                - typeId: pts
                  value: 100
            - name: Unit
              costs:
                - typeId: pts
                  value: 100
      engines:
        # BS single-pass live-value algorithm (insertion order):
        #   Unit[0]: query = Unit[0](120,old) + Unit[1](120,old) + Unit[2](0,new) = 240
        #            floor(240/50)=4 reps → 100+40=140
        #   Unit[1]: query = Unit[0](140,updated) + Unit[1](120,old) + Unit[2](0,new) = 260
        #            floor(260/50)=5 reps → 100+50=150
        #   Unit[2]: query = Unit[0](140) + Unit[1](150,updated) + Unit[2](0,self) = 290
        #            floor(290/50)=5 reps → 100+50=150
        # Asymmetry: first-inserted entry gets lower cost because it's processed first
        # and sees other entries at their OLD (lower) values.
        battlescribe:
          errorCount: 0
          costs:
            - typeId: pts
              value: 440
          forces:
            - selections:
                - name: Unit
                  costs:
                    - typeId: pts
                      value: 140
                - name: Unit
                  costs:
                    - typeId: pts
                      value: 150
                - name: Unit
                  costs:
                    - typeId: pts
                      value: 150
        # NR: reactive fixed-point converges symmetrically.
        # cost = 100 + 10×floor(3×cost/50). Solution: cost=230, floor(690/50)=13 → 100+130=230.
        newrecruit:
          errorCount: 0
          costs:
            - typeId: pts
              value: 690
          forces:
            - selections:
                - name: Unit
                  costs:
                    - typeId: pts
                      value: 230
                - name: Unit
                  costs:
                    - typeId: pts
                      value: 230
                - name: Unit
                  costs:
                    - typeId: pts
                      value: 230
