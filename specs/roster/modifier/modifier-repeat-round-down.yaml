id: modifier-repeat-round-down
category: modifier
description: Repeat with roundUp=false (default) rounds fractional repeat count down (Math.floor)

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-model
          name: Model
          type: model
        - id: se-squad
          name: Squad
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 50
          modifiers:
            - type: increment
              field: pts
              value: "10"
              repeats:
                - value: 2
                  repeats: 2
                  field: selections
                  scope: force
                  childId: se-model
                  roundUp: false

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-model

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-model

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-model

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad

  # 3 Models, value=2, roundUp=false: floor(3/2) × 2 = 1 × 2 = 2 repetitions → 50 + 10×2 = 70
  - expectedState:
      forces:
        - selections:
            - name: Model
            - name: Model
            - name: Model
            - name: Squad
              costs:
                - typeId: pts
                  value: 70
