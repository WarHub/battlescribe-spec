id: modifier-group-false-condition
category: modifier
description: Modifier group with unsatisfied condition does not apply its modifiers

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-1
          name: Trooper
          type: unit
          modifierGroups:
            - conditions:
                - type: atLeast
                  value: 5
                  field: selections
                  scope: parent
                  childId: se-1
              modifiers:
                - type: set
                  field: name
                  value: Veteran Trooper

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1
  # Modifier group condition not met (need 5 selections of se-1, have 1).
  - expectedState:
      forces:
        - selections:
            - name: Trooper
