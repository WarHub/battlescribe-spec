id: modifier-increment-name
category: modifier
description: String INCREMENT modifier increments numeric string name

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: "5"
          type: unit
          modifiers:
            - type: increment
              field: name
              value: "3"

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - expectedState:
      forces:
        - selections:
            - name: "8"
