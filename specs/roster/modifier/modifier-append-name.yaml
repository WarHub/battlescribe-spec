id: modifier-append-name
category: modifier
description: String APPEND modifier adds text to the name (with space prefix)

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit-a
          name: Unit
          type: unit
          modifiers:
            - type: append
              field: name
              value: Alpha

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - expectedState:
      forces:
        - selections:
            - name: "Unit Alpha"
