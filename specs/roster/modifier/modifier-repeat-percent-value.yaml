id: modifier-repeat-percent-value
category: modifier
description: Repeat with percentValue=true counts percentage of matching selections in scope

setup:
  gameSystem:
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-model
          name: Model
          type: model
        - id: se-squad
          name: Squad
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 100
          modifiers:
            - type: increment
              field: pts
              value: "10"
              repeats:
                - value: 25
                  repeats: 2
                  field: selections
                  scope: force
                  childId: se-model
                  percentValue: true

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-model

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-model

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-model

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-model

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad

  # percentValue=true: "for each 25% of se-model selections in the force, apply modifier."
  # 4 Models out of 5 total selections = 80%. floor(80/25) = 3, × repeats=2 = 6 repetitions.
  # Squad cost: 100 + 10×6 = 160.
  - expectedState:
      forces:
        - selections:
            - name: Model
            - name: Model
            - name: Model
            - name: Model
            - name: Squad
              costs:
                - typeId: pts
                  value: 160
