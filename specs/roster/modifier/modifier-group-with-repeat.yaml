id: modifier-group-with-repeat
category: modifier
description: ModifierGroup repeat applies all contained modifiers according to repeat count

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
      - id: cp
        name: cp
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-model
          name: Model
          type: model
        - id: se-squad
          name: Squad
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 50
            - name: cp
              typeId: cp
              value: 20
          modifierGroups:
            - repeats:
                - value: 1
                  repeats: 2
                  field: selections
                  scope: parent
                  childId: se-model
              modifiers:
                - type: increment
                  field: pts
                  value: "5"
                - type: append
                  field: name
                  value: "+"
                - type: decrement
                  field: cp
                  value: "2"

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-model

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-model

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-model

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad

  # ModifierGroup repeat: 3 Models in parent (force), value=1, repeats=2
  # → floor(3/1) × 2 = 6 repetitions. All three modifiers apply 6 times each:
  # pts: 50 + 5×6 = 80. cp: 20 - 2×6 = 8. Name: "Squad" + "+"×6 = "Squad + + + + + +".
  - expectedState:
      forces:
        - selections:
            - name: Model
            - name: Model
            - name: Model
            - name: Squad + + + + + +
              costs:
                - typeId: pts
                  value: 80
                - typeId: cp
                  value: 8
      engines:
        newrecruit:
          forces:
            - selections:
                - name: Model
                - name: Model
                - name: Model
                - name: "Squad +"
                  costs:
                    - typeId: pts
                      value: 80
                    - typeId: cp
                      value: 8
