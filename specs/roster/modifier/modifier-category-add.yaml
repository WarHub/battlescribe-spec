id: modifier-category-add
category: modifier
description: Category add modifier adds a category to a selection

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    categoryEntries:
      - id: cat-hq
        name: HQ
      - id: cat-elite
        name: Elites
    forceEntries:
      - id: fe-1
        name: Detachment
        categoryLinks:
          - id: cl-fe-hq
            targetId: cat-hq
            name: HQ
          - id: cl-fe-elite
            targetId: cat-elite
            name: Elites
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Veteran Squad
          type: unit
          categoryLinks:
            - id: cl-1
              targetId: cat-hq
              name: HQ
              primary: true
          modifiers:
            - type: add
              field: category
              value: cat-elite

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - selections:
            - name: Veteran Squad
              categories:
                - name: Elites
                - name: HQ
                  primary: true
