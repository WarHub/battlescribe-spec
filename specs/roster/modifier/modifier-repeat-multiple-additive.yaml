id: modifier-repeat-multiple-additive
category: modifier
description: Multiple repeat elements on a modifier are additive (total repeats = sum of each repeat calculation)

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-model
          name: Model
          type: model
        - id: se-squad
          name: Squad
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 50
          modifiers:
            - type: increment
              field: pts
              value: "5"
              repeats:
                # First: floor(3/1) × 2 = 6
                - value: 1
                  repeats: 2
                  field: selections
                  scope: force
                  childId: se-model
                # Second: floor(3/1) × 3 = 9
                # Total = 6 + 9 = 15 repetitions
                - value: 1
                  repeats: 3
                  field: selections
                  scope: force
                  childId: se-model

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-model

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-model

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-model

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad

  # Two repeat elements: (3×2) + (3×3) = 15 total, increment 5×15 = 75 → 50 + 75 = 125
  - expectedState:
      forces:
        - selections:
            - name: Model
            - name: Model
            - name: Model
            - name: Squad
              costs:
                - typeId: pts
                  value: 125
