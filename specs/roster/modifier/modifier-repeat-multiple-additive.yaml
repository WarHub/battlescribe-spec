id: modifier-repeat-multiple-additive
category: modifier
description: Multiple repeat elements on a modifier are additive (total repeats = sum of each repeat calculation)

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Squad
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 50
          modifiers:
            - type: increment
              field: pts
              value: "5"
              repeats:
                # First repeat: 1 selection in self → 1 repeat
                - value: 1
                  repeats: 1
                  field: selections
                  scope: self
                # Second repeat: 1 selection in self → 1 more repeat
                # Total = 1 + 1 = 2 repeats → increment by 5 × 2 = 10
                - value: 1
                  repeats: 1
                  field: selections
                  scope: self

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1
  # Multiple repeats are additive: n=1+1=2, increment 5×2=10 → 50+10=60
  - expectedState:
      forces:
        - selections:
            - name: Squad
