id: modifier-group-basic
category: modifier
description: Modifier group with condition applies when condition is met (tests modifierGroup structure)

setup:
  gameSystem:
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-1
          name: Marine
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 100
          modifierGroups:
            - conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: parent
                  childId: se-1
              modifiers:
                - type: set
                  field: name
                  value: Elite Marine

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1
  # ModifierGroup condition: atLeast 1 selection in parent matching se-1 → true
  - expectedState:
      forces:
        - selections:
            - name: Elite Marine
