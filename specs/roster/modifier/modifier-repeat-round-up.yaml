id: modifier-repeat-round-up
category: modifier
description: Repeat with roundUp=true rounds fractional repeat count up (Math.ceil)

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Squad
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 50
          modifiers:
            - type: increment
              field: pts
              value: "10"
              repeats:
                - value: 3
                  repeats: 1
                  field: selections
                  scope: self
                  roundUp: true

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1
  # self scope, 1 selection, repeat value 3 → repeats = ceil(1/3) = 1
  # So increment by 10 once → 50 + 10 = 60
  - expectedState:
      forces:
        - selections:
            - name: Squad
