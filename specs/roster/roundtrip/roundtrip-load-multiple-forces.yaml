id: roundtrip-load-multiple-forces
category: roundtrip
description: >
  A load carrying two sibling forces, each naming a different force entry AND a different
  catalogue. Two catalogues rather than one because a force's catalogueId is what its selections'
  entryIds are resolved against, so a pair of forces sharing a catalogue would still pass if the
  engine resolved everything against whichever catalogue it happened to look at first. Here it
  cannot: se-reserve exists only in cat-2 and se-squad only in cat-1, so each force has to be
  linked against the catalogue its own attribute names.

  The roster total spans both forces (10 + 8), which is the other half of the claim — a second
  force is part of the roster, not a second roster.

  Detachment and Reserve are named so that payload order, force-entry definition order and
  alphabetical order all coincide. That is deliberate: an earlier draft named the second force
  Auxiliary, and BattleScribe returned the pair in neither the payload's order nor the force
  entries' — which is a real question about loaded forces, and one for the ordering category
  rather than for a spec about catalogue linking.
tags: [forceEntry, catalogue]

setup:
  gameSystem:
    id: gs-1
    name: Test System
    costTypes:
      - id: ct-pts
        name: pts
    forceEntries:
      - id: fe-detachment
        name: Detachment
      - id: fe-reserve
        name: Reserve
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          costs:
            - name: pts
              typeId: ct-pts
              value: 10
    - id: cat-2
      name: Allied Catalogue
      gameSystemId: gs-1
      selectionEntries:
        - id: se-reserve
          name: Reserve Squad
          type: unit
          costs:
            - name: pts
              typeId: ct-pts
              value: 8

steps:
  # A force before the load, so the payload replaces a roster rather than arriving into an empty
  # one — and because battlescribe-ui reads back an empty roster when a load is a spec's first
  # step, which roundtrip-load-simple-roster records rather than works around. catalogueId is
  # required here because the setup holds two catalogues.
  - action: addForce
    forceEntryId: fe-detachment
    catalogueId: cat-1

  - action: loadRoster
    content: |
      <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <roster id="ros-two-forces" name="Two Forces" battleScribeVersion="2.03" gameSystemId="gs-1" gameSystemName="Test System" gameSystemRevision="1" xmlns="http://www.battlescribe.net/schema/rosterSchema">
        <costs/>
        <forces>
          <force id="f-detachment" name="Detachment" entryId="fe-detachment" catalogueId="cat-1" catalogueRevision="1" catalogueName="Test Catalogue">
            <selections>
              <selection id="s-squad" name="Squad" entryId="se-squad" number="1" type="unit">
                <categories>
                  <category id="c-squad" name="Uncategorized" entryId="(No Category)" primary="true"/>
                </categories>
              </selection>
            </selections>
          </force>
          <force id="f-reserve" name="Reserve" entryId="fe-reserve" catalogueId="cat-2" catalogueRevision="1" catalogueName="Allied Catalogue">
            <selections>
              <selection id="s-reserve" name="Reserve Squad" entryId="se-reserve" number="1" type="unit">
                <categories>
                  <category id="c-reserve" name="Uncategorized" entryId="(No Category)" primary="true"/>
                </categories>
              </selection>
            </selections>
          </force>
        </forces>
      </roster>

  # Both forces present, each holding the selection only its own catalogue defines — and one
  # roster total across the two.
  - expectedState:
      name: Two Forces
      gameSystemId: gs-1
      costs:
        - name: pts
          typeId: ct-pts
          value: 18
      forces:
        - name: Detachment
          entryId: fe-detachment
          catalogueId: cat-1
          catalogueName: Test Catalogue
          selections:
            - name: Squad
              entryId: se-squad
              type: unit
              number: 1
              costs:
                - name: pts
                  typeId: ct-pts
                  value: 10
              childCount: 0
        - name: Reserve
          entryId: fe-reserve
          catalogueId: cat-2
          catalogueName: Allied Catalogue
          selections:
            - name: Reserve Squad
              entryId: se-reserve
              type: unit
              number: 1
              costs:
                - name: pts
                  typeId: ct-pts
                  value: 8
              childCount: 0
