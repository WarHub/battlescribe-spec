id: roundtrip-load-number-on-parent-selection
category: roundtrip
description: >
  A .ros in which one quantified selection is instanced by NewRecruit and another is not, so the
  payload carries its own control — its Grenade is non-collective, which is what makes the Veteran
  instanced (docs/collective-flag.md); merely owning a child would not. Five Troopers, childless,
  arrive as one node of number 5; three Veterans, each holding a Grenade, arrive as one node of
  number 3 whose Grenade is at number 3.
  All four lanes agree on both, which is the point: carrying a quantity through a load does not
  stop working when the quantified selection is one NewRecruit materialises as instances.

  The roster costs 78 whichever shape the tree takes, and that is why the assertion goes node by
  node. A load checked only on totals would report agreement while the tree underneath differed,
  and "how many Veterans are there" has a different answer depending on whether a caller counts
  nodes or reads numbers.

  It is the only spec covering a quantified parent through a load, and it earned the slot by
  catching a real split: the store-direct `newrecruit` adapter used to report three Veterans of
  number 1 with a Grenade of number 1 each. That was the adapter reading the wrong tree — the one
  NewRecruit's BattleScribe converter builds during an import, which materialises an instanced
  selection once per unit — instead of the list NR stores and re-opens, which is the one node at
  number 3 its own editor shows. The adapter opens the imported list the way the app does now, so
  no lane needs an override here.
tags: [number, nested]

setup:
  gameSystem:
    id: gs-1
    name: Test System
    costTypes:
      - id: ct-pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          costs:
            - name: pts
              typeId: ct-pts
              value: 10
          selectionEntries:
            - id: se-trooper
              name: Trooper
              type: model
              costs:
                - name: pts
                  typeId: ct-pts
                  value: 7
            - id: se-veteran
              name: Veteran
              type: model
              costs:
                - name: pts
                  typeId: ct-pts
                  value: 9
              selectionEntries:
                - id: se-grenade
                  name: Grenade
                  type: upgrade
                  costs:
                    - name: pts
                      typeId: ct-pts
                      value: 2

steps:
  # Step 1. The roster arrives whole, as a file — see roundtrip-load-simple-roster.
  - action: loadRoster
    content: |
      <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <roster id="ros-parent-number" name="Quantified Parent" battleScribeVersion="2.03" gameSystemId="gs-1" gameSystemName="Test System" gameSystemRevision="1" xmlns="http://www.battlescribe.net/schema/rosterSchema">
        <costs/>
        <forces>
          <force id="f-1" name="Detachment" entryId="fe-1" catalogueId="cat-1" catalogueRevision="1" catalogueName="Test Catalogue">
            <selections>
              <selection id="s-squad" name="Squad" entryId="se-squad" number="1" type="unit">
                <categories>
                  <category id="c-squad" name="Uncategorized" entryId="(No Category)" primary="true"/>
                </categories>
                <selections>
                  <selection id="s-trooper" name="Trooper" entryId="se-trooper" number="5" type="model"/>
                  <selection id="s-veteran" name="Veteran" entryId="se-veteran" number="3" type="model">
                    <selections>
                      <selection id="s-grenade" name="Grenade" entryId="se-grenade" number="3" type="upgrade"/>
                    </selections>
                  </selection>
                </selections>
              </selection>
            </selections>
          </force>
        </forces>
      </roster>

  # One Veteran node at number 3, its Grenade at number 3. 10 + 35 + 27 + 6 = 78.
  - expectedState:
      name: Quantified Parent
      gameSystemId: gs-1
      costs:
        - name: pts
          typeId: ct-pts
          value: 78
      forces:
        - name: Detachment
          entryId: fe-1
          catalogueId: cat-1
          selections:
            - name: Squad
              entryId: se-squad
              type: unit
              number: 1
              costs:
                - name: pts
                  typeId: ct-pts
                  value: 10
              children:
                - name: Trooper
                  entryId: se-trooper
                  type: model
                  number: 5
                  costs:
                    - name: pts
                      typeId: ct-pts
                      value: 35
                  childCount: 0
                - name: Veteran
                  entryId: se-veteran
                  type: model
                  number: 3
                  costs:
                    - name: pts
                      typeId: ct-pts
                      value: 27
                  children:
                    - name: Grenade
                      entryId: se-grenade
                      type: upgrade
                      number: 3
                      costs:
                        - name: pts
                          typeId: ct-pts
                          value: 6
                      childCount: 0
