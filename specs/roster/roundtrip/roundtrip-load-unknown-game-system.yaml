id: roundtrip-load-unknown-game-system
category: roundtrip
description: >
  A well-formed .ros naming a gameSystemId that is not loaded. Semantically invalid rather than
  unparseable, and every engine refuses it: a roster is edited against a game system, and a
  reference to one the engine does not hold cannot be resolved into the one it does.

  This spec used to say the opposite — "BattleScribe accepts it, keeping the dangling id verbatim"
  — recorded from the in-process adapter, which was the only engine that could load anything at
  the time. It was the adapter that accepted, not BattleScribe: the desktop app's own loader
  answers "you do not have the right data files to be able to edit this roster" and stops, and the
  battlescribe-ui lane driving that path refuses like the other two. The adapter now makes the same
  check the app makes, and the override this spec carried is gone rather than doubled.

  Which is the point of running the UI lanes at all: an expectation written against a store-direct
  adapter alone has never been checked against the app.

setup:
  gameSystem:
    id: gs-1
    name: Test System
    costTypes:
      - id: ct-pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          costs:
            - name: pts
              typeId: ct-pts
              value: 10

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad

  - action: loadRoster
    content: |
      <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <roster id="ros-orphan" name="Orphan" battleScribeVersion="2.03" gameSystemId="gs-does-not-exist" gameSystemName="Missing System" gameSystemRevision="1" xmlns="http://www.battlescribe.net/schema/rosterSchema">
        <costs/>
        <forces>
          <force id="f-orphan" name="Detachment" entryId="fe-1" catalogueId="cat-1" catalogueRevision="1" catalogueName="Test Catalogue">
            <selections>
              <selection id="s-squad" name="Squad" entryId="se-squad" number="1" type="unit"/>
            </selections>
          </force>
        </forces>
      </roster>
    # No messageContains: three engines refuse in three sentences — the app's "you do not have the
    # right data files", NewRecruit's report from its own library lookup, and the adapter's. The
    # conformance claim is the refusal, and pinning one wording would make every other engine
    # reproduce one adapter's prose.
    expectFailure: true

  # The half of a refusal worth asserting: what it left behind. The roster still in hand is the one
  # the editor built — its own name, its own game system — and not a half-loaded "Orphan".
  - expectedState:
      name: roundtrip-load-unknown-game-system
      gameSystemId: gs-1
      gameSystemName: Test System
      costs:
        - typeId: ct-pts
          value: 10
      forces:
        - name: Detachment
          entryId: fe-1
          catalogueId: cat-1
          selections:
            - name: Squad
              entryId: se-squad
              costs:
                - typeId: ct-pts
                  value: 10
      engines:
        # Except in the app, which closes the open roster before it discovers it cannot load the
        # replacement — the same order roundtrip-load-unknown-catalogue records, and the reason a
        # refusal is not free for a battlescribe-ui user. Three engines refuse and keep what they
        # had; this one refuses and keeps nothing.
        battlescribe-ui:
          costs: []
          forces: []
