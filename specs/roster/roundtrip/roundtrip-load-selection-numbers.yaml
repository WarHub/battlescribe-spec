id: roundtrip-load-selection-numbers
category: roundtrip
description: >
  A load whose selections are taken in quantity: five Troopers in the Squad, beside a single
  Banner. No selection in the payload carries a <costs> element, so every figure in the assertion
  is number × the catalogue's unit price and nothing else could have produced it — 35 for the
  Troopers, 3 for the Banner, 48 for the roster.

  The Banner is the control. It sits under the same parent as the Troopers at number 1, so an
  engine that applied one node's quantity to its siblings, or to the level, prices it at 15 and
  fails; only per-node multiplication reaches 3.

  Two quantities the payload deliberately does NOT carry, because both are places where the
  engines part company and neither is a happy path: number > 1 on a root selection, covered by
  roundtrip-load-root-selection-number, and number > 1 on a selection that owns children, covered
  by roundtrip-load-number-on-parent-selection. The Trooper is childless for that second reason.
tags: [number, nested]

setup:
  gameSystem:
    id: gs-1
    name: Test System
    costTypes:
      - id: ct-pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          costs:
            - name: pts
              typeId: ct-pts
              value: 10
          selectionEntries:
            - id: se-banner
              name: Banner
              type: upgrade
              costs:
                - name: pts
                  typeId: ct-pts
                  value: 3
            - id: se-trooper
              name: Trooper
              type: model
              costs:
                - name: pts
                  typeId: ct-pts
                  value: 7

steps:
  # A force before the load, so the payload replaces a roster rather than arriving into an empty
  # one — and because battlescribe-ui's load path needs the editor engaged once first
  # (roundtrip-load-simple-roster is where that is recorded).
  - action: addForce
    forceEntryId: fe-1

  - action: loadRoster
    content: |
      <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <roster id="ros-numbers" name="Numbered Roster" battleScribeVersion="2.03" gameSystemId="gs-1" gameSystemName="Test System" gameSystemRevision="1" xmlns="http://www.battlescribe.net/schema/rosterSchema">
        <costs/>
        <forces>
          <force id="f-1" name="Detachment" entryId="fe-1" catalogueId="cat-1" catalogueRevision="1" catalogueName="Test Catalogue">
            <selections>
              <selection id="s-squad" name="Squad" entryId="se-squad" number="1" type="unit">
                <categories>
                  <category id="c-squad" name="Uncategorized" entryId="(No Category)" primary="true"/>
                </categories>
                <selections>
                  <selection id="s-banner" name="Banner" entryId="se-banner" number="1" type="upgrade"/>
                  <selection id="s-trooper" name="Trooper" entryId="se-trooper" number="5" type="model"/>
                </selections>
              </selection>
            </selections>
          </force>
        </forces>
      </roster>

  # 10 + 3 + 5×7 = 48.
  - expectedState:
      name: Numbered Roster
      gameSystemId: gs-1
      costs:
        - name: pts
          typeId: ct-pts
          value: 48
      forces:
        - name: Detachment
          entryId: fe-1
          catalogueId: cat-1
          selections:
            - name: Squad
              entryId: se-squad
              type: unit
              number: 1
              costs:
                - name: pts
                  typeId: ct-pts
                  value: 10
              children:
                - name: Banner
                  entryId: se-banner
                  type: upgrade
                  number: 1
                  costs:
                    - name: pts
                      typeId: ct-pts
                      value: 3
                  childCount: 0
                - name: Trooper
                  entryId: se-trooper
                  type: model
                  number: 5
                  costs:
                    - name: pts
                      typeId: ct-pts
                      value: 35
                  childCount: 0
