id: roundtrip-load-simple-roster
category: roundtrip
description: >
  The smallest happy-path load: one force, two flat selections, one cost type, and loadRoster as
  the FIRST step. Nothing is built through the editor beforehand, so what the assertion describes
  came out of the payload and the setup data alone.

  That ordering is the point, not an accident of brevity. Every load spec written before this
  batch adds a force first and loads over it, so the suite had only ever exercised loadRoster as a
  replacement. Opening with it is legal — the engine's Setup runs from the `setup:` block before
  the step loop begins, so the game system and catalogue are already there when step 1 executes,
  and nothing constrains what the first step may be. Legal and exercised are different things, and
  until this batch only the first was true.

  Exercising it is what found the `battlescribe-ui` bug fixed alongside this spec: three engines
  loaded the file and the fourth reported an empty roster, with no error anywhere. The app had
  loaded it correctly all along and the driver's bookkeeping had not caught up — the diagnosis is
  in docs/bs-ui-roster-coverage.md, and it is deliberately not repeated here, because what a spec
  can attest to is the reading, not the reason. All seven specs in this batch now open this way, so
  the path has seven regression tests rather than the one that found it.

  The payload's roster-level <costs> is empty and no selection carries one at all, so 35 = 25 + 10
  is the engine's answer rather than the file's. The force's <categories> are absent too, and the
  assertion pins them — HQ and Troops come from fe-1's categoryLinks and nothing in the payload
  mentions them, so that list can only have been derived. The per-selection categories, by
  contrast, are exactly what the payload states and an engine that echoed them back would pass;
  they are asserted because a load that dropped them would not, not as evidence of derivation.

  No error assertion appears anywhere in the spec: a step's expectedState without one asserts zero
  validation errors, which is exactly the claim a happy-path load wants to make.

setup:
  gameSystem:
    id: gs-1
    name: Test System
    costTypes:
      - id: ct-pts
        name: pts
    categoryEntries:
      - id: cat-hq
        name: HQ
      - id: cat-troops
        name: Troops
    forceEntries:
      - id: fe-1
        name: Detachment
        categoryLinks:
          - id: cl-fe-hq
            targetId: cat-hq
            name: HQ
          - id: cl-fe-troops
            targetId: cat-troops
            name: Troops
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1
      selectionEntries:
        - id: se-captain
          name: Captain
          type: unit
          costs:
            - name: pts
              typeId: ct-pts
              value: 25
          categoryLinks:
            - id: cl-captain-hq
              targetId: cat-hq
              name: HQ
              primary: true
        - id: se-squad
          name: Squad
          type: unit
          costs:
            - name: pts
              typeId: ct-pts
              value: 10
          categoryLinks:
            - id: cl-squad-troops
              targetId: cat-troops
              name: Troops
              primary: true

steps:
  # Step 1. No addForce, no selectEntry — the roster arrives whole, as a file.
  - action: loadRoster
    content: |
      <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <roster id="ros-simple" name="Simple Roster" battleScribeVersion="2.03" gameSystemId="gs-1" gameSystemName="Test System" gameSystemRevision="1" xmlns="http://www.battlescribe.net/schema/rosterSchema">
        <costs/>
        <forces>
          <force id="f-1" name="Detachment" entryId="fe-1" catalogueId="cat-1" catalogueRevision="1" catalogueName="Test Catalogue">
            <selections>
              <selection id="s-captain" name="Captain" entryId="se-captain" number="1" type="unit">
                <categories>
                  <category id="c-captain" name="HQ" entryId="cat-hq" primary="true"/>
                </categories>
              </selection>
              <selection id="s-squad" name="Squad" entryId="se-squad" number="1" type="unit">
                <categories>
                  <category id="c-squad" name="Troops" entryId="cat-troops" primary="true"/>
                </categories>
              </selection>
            </selections>
          </force>
        </forces>
      </roster>

  - expectedState:
      name: Simple Roster
      gameSystemId: gs-1
      gameSystemName: Test System
      costs:
        - name: pts
          typeId: ct-pts
          value: 35
      forces:
        - name: Detachment
          entryId: fe-1
          catalogueId: cat-1
          catalogueName: Test Catalogue
          categories:
            - name: Uncategorised
            - name: HQ
              entryId: cat-hq
            - name: Troops
              entryId: cat-troops
          selections:
            - name: Captain
              entryId: se-captain
              type: unit
              number: 1
              costs:
                - name: pts
                  typeId: ct-pts
                  value: 25
              categories:
                - name: HQ
                  entryId: cat-hq
                  primary: true
              childCount: 0
            - name: Squad
              entryId: se-squad
              type: unit
              number: 1
              costs:
                - name: pts
                  typeId: ct-pts
                  value: 10
              categories:
                - name: Troops
                  entryId: cat-troops
                  primary: true
              childCount: 0
      engines:
        # NewRecruit synthesizes no "no category" fallback on a force whose entry links real
        # categories, so its list is the two linked ones and nothing else. The same one-word/one-row
        # family of differences roundtrip-load-roster records — not a fact about this load path.
        newrecruit:
          forces:
            - name: Detachment
              entryId: fe-1
              catalogueId: cat-1
              catalogueName: Test Catalogue
              categories:
                - name: HQ
                  entryId: cat-hq
                - name: Troops
                  entryId: cat-troops
              selections:
                - name: Captain
                  entryId: se-captain
                  type: unit
                  number: 1
                  costs:
                    - name: pts
                      typeId: ct-pts
                      value: 25
                  categories:
                    - name: HQ
                      entryId: cat-hq
                      primary: true
                  childCount: 0
                - name: Squad
                  entryId: se-squad
                  type: unit
                  number: 1
                  costs:
                    - name: pts
                      typeId: ct-pts
                      value: 10
                  categories:
                    - name: Troops
                      entryId: cat-troops
                      primary: true
                  childCount: 0
