id: roundtrip-load-selection-no-primary-category
category: roundtrip
description: >
  A .ros whose unit selection carries no <categories> at all. BattleScribe restores it and
  re-derives the categorisation from the catalogue. NewRecruit drops the selection — and drops it
  SILENTLY: the load succeeds, the force arrives, and the unit that was in the file simply is not
  in the roster afterwards, with no error and no refusal.

  Every exporter writes the primary <category>, BattleScribe's and NewRecruit's both, so no file
  in the wild reaches this path — which is precisely why it is worth a spec. A silent drop found
  by accident while writing another test is a silent drop that would have been found by a user
  instead, and the roundtrip-load-roster payload was one attribute away from measuring this
  instead of the re-linking it is about.

setup:
  gameSystem:
    id: gs-1
    name: Test System
    costTypes:
      - id: ct-pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          costs:
            - name: pts
              typeId: ct-pts
              value: 10

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  # The load is accepted by both engines; what differs is what survives it.
  - action: loadRoster
    content: |
      <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <roster id="ros-nocat" name="Uncategorised Payload" battleScribeVersion="2.03" gameSystemId="gs-1" gameSystemName="Test System" gameSystemRevision="1" xmlns="http://www.battlescribe.net/schema/rosterSchema">
        <costs/>
        <forces>
          <force id="f-nocat" name="Detachment" entryId="fe-1" catalogueId="cat-1" catalogueRevision="1" catalogueName="Test Catalogue">
            <selections>
              <selection id="s-squad" name="Squad" entryId="se-squad" number="1" type="unit"/>
            </selections>
          </force>
        </forces>
      </roster>
    expectFailure: false

  # BattleScribe: the Squad is there and costed. NewRecruit: the force is there and empty.
  - expectedState:
      name: Uncategorised Payload
      costs:
        - typeId: ct-pts
          value: 10
      forces:
        - name: Detachment
          entryId: fe-1
          selections:
            - name: Squad
              entryId: se-squad
              costs:
                - typeId: ct-pts
                  value: 10
      engines:
        newrecruit:
          costs:
            - typeId: ct-pts
              value: 0
          forces:
            - name: Detachment
              entryId: fe-1
              selectionCount: 0
