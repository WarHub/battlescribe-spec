id: roundtrip-load-root-selection-number
category: roundtrip
description: >
  A .ros whose FORCE-LEVEL selections carry number > 1 — three Characters and two Squads. This is
  a file neither editor writes: taking a root entry twice makes two nodes rather than one node at
  number 2 (selection-same-entry-twice, and collective-root-ignored for the number 1 on each), and
  NewRecruit's UI has no count control on a root selection at all. It is legal XML all the same,
  and the two applications read it differently.

  BattleScribe restores the numbers and costs them: 3×25 + 2×10 + 5×7 = 130. NewRecruit clamps
  every root selection to 1 and the same file becomes a 70-point army — two Characters and a
  Squad gone, no error, no refusal, the load reported as successful.

  This one is an application difference and not an adapter's: both BattleScribe lanes give 130 and
  both NewRecruit lanes give 70, so the store-direct engine and the app driven through its own
  import control agree with each other. Worth stating because the sibling spec
  roundtrip-load-number-on-parent-selection looks similar and is not — there the two NR lanes
  disagree, and the divergence turned out to belong to our adapter rather than to NewRecruit.

  Tagged as a bug rather than a design difference because the loss is the importer's and not the
  model's. NR's model has no root selection with number=3, but it does have three root selections,
  which is exactly how NR itself represents the same army when a user builds it; the faithful
  import was available and was not taken. What is lost is silent and arithmetic, which is the
  worst combination — a roster that still looks like a roster and no longer costs what it did.

  The nested Trooper is the control. It keeps its number 5 and its 35 points on all four lanes, so
  what the assertion measures is the clamp on the root level specifically, not a general inability
  to carry a quantity through a load (roundtrip-load-selection-numbers is that, and passes).
tags: [number, newrecruit-bug]

setup:
  gameSystem:
    id: gs-1
    name: Test System
    costTypes:
      - id: ct-pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1
      selectionEntries:
        - id: se-character
          name: Character
          type: unit
          costs:
            - name: pts
              typeId: ct-pts
              value: 25
        - id: se-squad
          name: Squad
          type: unit
          costs:
            - name: pts
              typeId: ct-pts
              value: 10
          selectionEntries:
            - id: se-trooper
              name: Trooper
              type: model
              costs:
                - name: pts
                  typeId: ct-pts
                  value: 7

steps:
  # A force before the load, so the payload replaces a roster rather than arriving into an empty
  # one — and because battlescribe-ui's load path needs the editor engaged once first
  # (roundtrip-load-simple-roster is where that is recorded).
  - action: addForce
    forceEntryId: fe-1

  - action: loadRoster
    content: |
      <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <roster id="ros-root-numbers" name="Root Numbers" battleScribeVersion="2.03" gameSystemId="gs-1" gameSystemName="Test System" gameSystemRevision="1" xmlns="http://www.battlescribe.net/schema/rosterSchema">
        <costs/>
        <forces>
          <force id="f-1" name="Detachment" entryId="fe-1" catalogueId="cat-1" catalogueRevision="1" catalogueName="Test Catalogue">
            <selections>
              <selection id="s-character" name="Character" entryId="se-character" number="3" type="unit">
                <categories>
                  <category id="c-character" name="Uncategorized" entryId="(No Category)" primary="true"/>
                </categories>
              </selection>
              <selection id="s-squad" name="Squad" entryId="se-squad" number="2" type="unit">
                <categories>
                  <category id="c-squad" name="Uncategorized" entryId="(No Category)" primary="true"/>
                </categories>
                <selections>
                  <selection id="s-trooper" name="Trooper" entryId="se-trooper" number="5" type="model"/>
                </selections>
              </selection>
            </selections>
          </force>
        </forces>
      </roster>

  - expectedState:
      name: Root Numbers
      gameSystemId: gs-1
      costs:
        - name: pts
          typeId: ct-pts
          value: 130
      forces:
        - name: Detachment
          entryId: fe-1
          catalogueId: cat-1
          selections:
            - name: Character
              entryId: se-character
              type: unit
              number: 3
              costs:
                - name: pts
                  typeId: ct-pts
                  value: 75
              childCount: 0
            - name: Squad
              entryId: se-squad
              type: unit
              number: 2
              costs:
                - name: pts
                  typeId: ct-pts
                  value: 20
              children:
                - name: Trooper
                  entryId: se-trooper
                  type: model
                  number: 5
                  costs:
                    - name: pts
                      typeId: ct-pts
                      value: 35
                  childCount: 0
      engines:
        # Every root number is 1 and the roster is 60 points lighter. `forces` replaces wholesale,
        # so the whole block is restated to change two numbers and the two costs that follow from
        # them — the Trooper subtree below is identical to the base on purpose, and is the control.
        newrecruit:
          costs:
            - name: pts
              typeId: ct-pts
              value: 70
          forces:
            - name: Detachment
              entryId: fe-1
              catalogueId: cat-1
              selections:
                - name: Character
                  entryId: se-character
                  type: unit
                  number: 1
                  costs:
                    - name: pts
                      typeId: ct-pts
                      value: 25
                  childCount: 0
                - name: Squad
                  entryId: se-squad
                  type: unit
                  number: 1
                  costs:
                    - name: pts
                      typeId: ct-pts
                      value: 10
                  children:
                    - name: Trooper
                      entryId: se-trooper
                      type: model
                      number: 5
                      costs:
                        - name: pts
                          typeId: ct-pts
                          value: 35
                      childCount: 0
