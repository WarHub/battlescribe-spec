id: roundtrip-load-unknown-catalogue
category: roundtrip
description: >
  A well-formed .ros whose force names a catalogueId that is not loaded. The catalogue is what a
  selection's entryId is resolved against, so a force pointing at an absent one cannot be linked,
  and the load is refused.

  No messageContains here, deliberately. On the battlescribe lane the refusal comes from the
  adapter's own pre-flight force-to-catalogue map in BattleScribeEngine.LoadRosterXml, not from
  BattleScribe's reader — so the wording is the harness's, and pinning it would make every other
  engine reproduce our sentence. The conformance claim is the one every engine must satisfy: a
  roster naming a catalogue the engine does not hold is not loadable.

setup:
  gameSystem:
    id: gs-1
    name: Test System
    costTypes:
      - id: ct-pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          costs:
            - name: pts
              typeId: ct-pts
              value: 10

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad

  - action: loadRoster
    content: |
      <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <roster id="ros-nocat" name="No Catalogue" battleScribeVersion="2.03" gameSystemId="gs-1" gameSystemName="Test System" gameSystemRevision="1" xmlns="http://www.battlescribe.net/schema/rosterSchema">
        <costs/>
        <forces>
          <force id="f-nocat" name="Detachment" entryId="fe-1" catalogueId="cat-does-not-exist" catalogueRevision="1" catalogueName="Absent Catalogue">
            <selections>
              <selection id="s-squad" name="Squad" entryId="se-squad" number="1" type="unit"/>
            </selections>
          </force>
        </forces>
      </roster>
    expectFailure: true

  # Three engines of the four keep the roster they had: the refusal cost nothing.
  - expectedState:
      name: roundtrip-load-unknown-catalogue
      costs:
        - typeId: ct-pts
          value: 10
      engines:
        # The desktop app is the exception, and this is the finding. Its File → Open closes the
        # open roster BEFORE it knows the replacement will load — actLoadRoster clears the trees and
        # the engine state, then discovers it has no catalogue to link the new file against, shows
        # its error and stops. So a refused open leaves the editor empty, and battlescribe-ui, which
        # drives that same path, ends the step with no roster rather than the one it started with.
        #
        # Recorded rather than smoothed over: the in-process adapter refuses in its own pre-flight
        # check, before touching the roster, which is kinder than the app and therefore not what the
        # app does. Only the UI lane can say what a user gets.
        battlescribe-ui:
          forceCount: 0
          costs: []
