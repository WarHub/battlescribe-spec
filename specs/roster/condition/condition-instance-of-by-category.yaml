id: condition-instance-of-by-category
category: condition
tags: [battlescribe-bug, newrecruit-bug]
description: >
  instanceOf with scope=force and childId=CategoryEntry ID should detect
  selections with the given category in the force and rename Detector to
  "HQ Found". Both engines fail: scope=force resolves to the Force element
  which is not a Selection, so instanceOf returns false. See
  condition-instance-of-self-category for the working version using scope=self.

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    categoryEntries:
      - id: cat-hq
        name: HQ
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-fe-hq
            targetId: cat-hq
            name: HQ
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-detector
          name: Detector
          type: unit
          modifiers:
            - type: set
              field: name
              value: HQ Found
              conditions:
                - type: instanceOf
                  value: 1
                  field: selections
                  scope: force
                  childId: cat-hq
        - id: se-commander
          name: Commander
          type: unit
          categoryLinks:
            - id: cl-cmd-hq
              targetId: cat-hq
              name: HQ
              primary: true

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-detector

  # Only detector selected, no HQ-category selection yet → instanceOf false
  - expectedState:
      forces:
        - selections:
            - name: Detector

  # Select Commander (has HQ category link) — should trigger instanceOf, renaming Detector to "HQ Found"
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-commander

  - expectedState:
      forces:
        - selections:
            - name: HQ Found
            - name: Commander
              categories:
                - name: HQ
                  primary: true
      engines:
        # Both engines fail: scope=force resolves to the Force, not its selections,
        # so instanceOf returns false and the rename modifier never fires.
        # BS alphabetical: Commander < Detector.
        battlescribe:
          forces:
            - selections:
                - name: Commander
                  categories:
                    - name: HQ
                      primary: true
                - name: Detector
        # NR uncategorised before categorised: Detector < Commander.
        newrecruit:
          forces:
            - selections:
                - name: Detector
                - name: Commander
                  categories:
                    - name: HQ
                      primary: true
