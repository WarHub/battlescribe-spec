id: condition-null-childid-parent-scope
category: condition
description: >
  Condition without childId on parent scope — BattleScribe: condition false (NaN).
  NR: defaults to counting "self", so atLeast 1 fires when entry is selected.
tags: [undefined-behavior]

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit
          name: Unit
          type: unit
          modifiers:
            - type: set
              field: name
              value: Self Counted
              conditions:
                # No childId — NR defaults to "self" on parent scope
                - type: atLeast
                  value: 1
                  field: selections
                  scope: parent

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit

  # BattleScribe: missing childId → condition false → modifier doesn't fire → name unchanged
  # NR: missing childId on parent scope → counts "self" → atLeast 1 → true → modifier fires
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Unit
      engines:
        newrecruit:
          forces:
            - selectionCount: 1
              selections:
                - name: Self Counted
