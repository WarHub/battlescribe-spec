id: condition-childid-group
category: condition
description: childId filter can reference a SelectionEntryGroup ID to count selections from that group

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-watcher
          name: Watcher
          type: unit
          modifiers:
            - type: set
              field: name
              value: Group Found
              conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: force
                  childId: seg-weapons
        - id: se-unit
          name: Unit
          type: unit

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-watcher
  # childId references SelectionEntryGroup seg-weapons which does not
  # exist in the catalogue. Condition is false → name stays "Watcher".
  - expectedState:
      forces:
        - selections:
            - name: Watcher
