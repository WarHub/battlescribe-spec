id: condition-equal-to
category: condition
description: Condition type equalTo evaluates true when count == value

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          modifiers:
            - type: set
              field: name
              value: Exactly One
              conditions:
                - type: equalTo
                  value: 1
                  field: selections
                  scope: force
                  childId: se-unit-a

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  # With exactly 1 selection, equalTo(1) is true
  - expectedState:
      forces:
        - selections:
            - name: Exactly One

  # Add second selection → equalTo(1) is now false → modifier not applied
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - expectedState:
      forces:
        - selections:
            - name: Unit A
            - name: Unit A
