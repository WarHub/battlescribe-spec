id: condition-group-triple-nested
category: condition
description: 3 levels of condition group nesting (AND → OR → conditions) form deep boolean logic

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-1
          name: Trooper
          type: unit
          modifiers:
            - type: set
              field: name
              value: Elite Trooper
              conditionGroups:
                - type: and
                  conditionGroups:
                    - type: or
                      conditionGroups:
                        - type: and
                          conditions:
                            - type: atLeast
                              value: 1
                              field: selections
                              scope: parent
                              childId: se-1
                            - type: lessThan
                              value: 5
                              field: selections
                              scope: parent
                              childId: se-1

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1
  # Triple nesting: AND( OR( AND(atLeast 1, lessThan 5) ) )
  # With 1 selection: atLeast 1=true, lessThan 5=true → inner AND=true → OR=true → outer AND=true
  - expectedState:
      forces:
        - selections:
            - name: Elite Trooper

  # Add 4 more to reach 5: lessThan 5 = false → inner AND=false → OR=false → outer AND=false
  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - selections:
            - name: Trooper
            - name: Trooper
            - name: Trooper
            - name: Trooper
            - name: Trooper
