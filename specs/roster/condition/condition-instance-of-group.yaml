id: condition-instance-of-group
category: condition
description: >
  instanceOf with scope=force and childId=SelectionEntryGroup ID. scope=force
  resolves to the Force element, and the group seg-weapons doesn't exist in the
  data — condition returns false.

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-detector
          name: Detector
          type: unit
          modifiers:
            - type: set
              field: name
              value: Group Instance Found
              conditions:
                - type: instanceOf
                  value: 1
                  field: selections
                  scope: force
                  childId: seg-weapons
        - id: se-unit
          name: Unit
          type: unit

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-detector
  # instanceOf childId=seg-weapons: no SelectionEntryGroup with that ID
  # exists, so condition is false → name stays "Detector".
  - expectedState:
      forces:
        - selections:
            - name: Detector
