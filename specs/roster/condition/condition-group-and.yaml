id: condition-group-and
category: condition
description: Condition group with AND logic on modifier (tests structure)

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Soldier
          type: unit
          modifiers:
            - type: set
              field: name
              value: Renamed Soldier
              conditionGroups:
                - type: and
                  conditions:
                    - type: atLeast
                      value: 1
                      field: selections
                      scope: parent
                      childId: se-1
                    - type: atMost
                      value: 10
                      field: selections
                      scope: parent
                      childId: se-1

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1
  # AND(atLeast 1, atMost 10): with 1 selection, both true → modifier applies
  - expectedState:
      forces:
        - selections:
            - name: Renamed Soldier
