id: condition-not-instance-of
category: condition
description: notInstanceOf condition checks that NO child element of matching type exists (AND semantics - all ancestors must NOT match)

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          modifiers:
            - type: set
              field: name
              value: No B Exists
              conditions:
                - type: notInstanceOf
                  value: 1
                  field: selections
                  scope: force
                  childId: se-unit-b
        - id: se-unit-b
          name: Unit B
          type: unit

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  # Select Unit A - notInstanceOf should be true (Unit B not present)
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - expectedState:
      forces:
        - selections:
            - name: No B Exists

  # Select Unit B. The notInstanceOf condition checks the Force element itself
  # (scope=force resolves to the Force), not its child selections. Since a Force
  # is never an instance of se-unit-b, the condition remains true regardless of
  # what selections exist — name stays "No B Exists".
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-b

  - expectedState:
      forces:
        - selections:
            - name: No B Exists
            - name: Unit B
