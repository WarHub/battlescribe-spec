id: condition-greater-than
category: condition
description: Condition type greaterThan evaluates true when count > value

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-trigger
          name: Trigger
          type: unit
        - id: se-target
          name: Target
          type: unit
          modifiers:
            - type: set
              field: name
              value: More Than One Trigger
              conditions:
                - type: greaterThan
                  value: 1
                  field: selections
                  scope: force
                  childId: se-trigger

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-target

  # With 0 triggers, greaterThan(1) is false
  - expectedState:
      forces:
        - selections:
            - name: Target

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-trigger

  - expectedState:
      forces:
        - selections:
            - name: Target
            - name: Trigger

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-trigger

  - expectedState:
      forces:
        - selections:
            - name: More Than One Trigger
            - name: Trigger
            - name: Trigger
