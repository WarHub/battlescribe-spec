id: condition-scope-roster
category: condition
description: Condition with scope=roster counts across all forces

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-trigger
          name: Trigger
          type: unit
        - id: se-target
          name: Target
          type: unit
          modifiers:
            - type: set
              field: name
              value: Roster Triggered
              conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: roster
                  childId: se-trigger

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: addForce
    id: add-patrol-2
    forceEntryId: fe-patrol

  # Select target in force 1
  - action: selectEntry
    forceId: ${{ steps.add-patrol-2.forceId }}
    entryId: se-target

  - expectedState:
      forces:
        - {}
        - selections:
            - name: Target

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-trigger

  - expectedState:
      forces:
        - {}
        - selections:
            - name: Roster Triggered
