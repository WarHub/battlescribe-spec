id: condition-childid-force-entry
category: condition
description: childId filter can reference a ForceEntry ID to count forces of that type

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-army
        name: Army
      - id: fe-detach
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-watcher
          name: Watcher
          type: unit
          modifiers:
            - type: set
              field: name
              value: Detach Found
              conditions:
                - type: atLeast
                  value: 1
                  field: forces
                  scope: roster
                  childId: fe-detach

steps:
  - action: addForce
    id: add-army
    forceEntryId: fe-army

  - action: selectEntry
    forceId: ${{ steps.add-army.forceId }}
    entryId: se-watcher
  # childId references ForceEntry fe-detach but we only added fe-army.
  # Condition is false → name stays "Watcher".
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Watcher
