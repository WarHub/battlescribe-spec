id: condition-false-prevents-modifier
category: condition
description: When condition evaluates to false, modifier is not applied

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit-a
          name: Original Name
          type: unit
          modifiers:
            - type: set
              field: name
              value: Should Not Appear
              conditions:
                - type: atLeast
                  value: 99
                  field: selections
                  scope: force
                  childId: se-unit-a

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  # Condition requires 99 selections — false, so modifier not applied
  - expectedState:
      forces:
        - selections:
            - name: Original Name
