id: condition-at-least
category: condition
description: Condition type atLeast evaluates true when count >= value

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-trigger
          name: Trigger Unit
          type: unit
        - id: se-target
          name: Target Unit
          type: unit
          modifiers:
            - type: set
              field: name
              value: Activated
              conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: force
                  childId: se-trigger

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  # Before trigger: target keeps original name
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-target

  - expectedState:
      forces:
        - selections:
            - name: Target Unit

  # Add trigger
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-trigger

  # After trigger: condition met, modifier applied
  - expectedState:
      forces:
        - selections:
            - name: Activated
            - name: Trigger Unit
