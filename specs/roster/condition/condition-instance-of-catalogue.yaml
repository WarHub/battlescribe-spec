id: condition-instance-of-catalogue
category: condition
description: >
  instanceOf with scope=roster and childId=Catalogue ID. scope=roster is
  hardcoded to return false for instanceOf in BS (c.java:1196-1197).
  See condition-instance-of-self for the working version using scope=self.
tags: [undefined-behavior]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-detector
          name: Detector
          type: unit
          modifiers:
            - type: set
              field: name
              value: Catalogue Matched
              conditions:
                - type: instanceOf
                  value: 1
                  field: selections
                  scope: roster
                  childId: cat-1
        - id: se-unit
          name: Unit
          type: unit

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-detector
  # instanceOf with scope=roster always returns false in BS engine
  # (c.java:1196-1197 hardcodes return false for roster scope on instanceOf).
  # Both engines agree — condition never fires regardless of catalogue matching.
  - expectedState:
      forces:
        - selections:
            - name: Detector
