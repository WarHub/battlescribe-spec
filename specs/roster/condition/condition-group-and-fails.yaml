id: condition-group-and-fails
category: condition
description: AND condition group fails when one condition is not met

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-1
          name: Guard
          type: unit
          modifiers:
            - type: set
              field: name
              value: Should Not Apply
              conditionGroups:
                - type: and
                  conditions:
                    - type: atLeast
                      value: 1
                      field: selections
                      scope: self
                    - type: atLeast
                      value: 100
                      field: selections
                      scope: self

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - selections:
            - name: Guard
