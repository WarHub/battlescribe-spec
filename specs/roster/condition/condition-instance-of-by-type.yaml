id: condition-instance-of-by-type
category: condition
description: >
  instanceOf with scope=force and childId=type name. scope=force resolves
  to the Force element which is not a Selection — instanceOf returns false.
  See condition-instance-of-self-type for the working version using scope=self.
tags: [undefined-behavior]

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-detector
          name: Detector
          type: unit
          modifiers:
            - type: set
              field: name
              value: Model Found
              conditions:
                - type: instanceOf
                  value: 1
                  field: selections
                  scope: force
                  childId: model
        - id: se-model
          name: Basic Model
          type: model

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  # Select detector only - no model selected yet, condition false
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-detector

  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Detector

  # Add a model-type entry - instanceOf checks for type 'model' in force
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-model

  # instanceOf with scope=force resolves to the Force element itself, not its
  # child selections (c.java:1206-1210). The Force object is not a Selection
  # of type "model", so the condition returns false. Both engines agree.
  - expectedState:
      forces:
        - selectionCount: 2
          selections:
            - name: Basic Model
            - name: Detector
