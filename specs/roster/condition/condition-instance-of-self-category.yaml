id: condition-instance-of-self-category
category: condition
description: >
  instanceOf with scope=self and childId set to a CategoryEntry ID checks
  if the current selection has a category link matching that ID. This is
  the working counterpart to condition-instance-of-by-category which uses
  scope=force (undefined behavior — force scope doesn't work for instanceOf).

setup:
  gameSystem:
    categoryEntries:
      - id: cat-hq
        name: HQ
    forceEntries:
      - id: fe-1
        name: Detachment
        categoryLinks:
          - id: cl-fe-hq
            targetId: cat-hq
            name: HQ
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-commander
          name: Commander
          type: unit
          categoryLinks:
            - id: cl-cmd-hq
              targetId: cat-hq
              name: HQ
              primary: true
          modifiers:
            - type: set
              field: name
              value: HQ Confirmed
              conditions:
                - type: instanceOf
                  value: 1
                  field: selections
                  scope: self
                  childId: cat-hq

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-commander

  # scope=self resolves to the current selection. Commander has a category
  # link to cat-hq → instanceOf matches → modifier fires.
  - expectedState:
      forces:
        - selections:
            - name: HQ Confirmed
