id: condition-instance-of-force-entry
category: condition
description: >
  instanceOf with scope=roster and childId=ForceEntry ID. scope=roster is
  hardcoded to return false for instanceOf in BS (c.java:1196-1197).
  See condition-instance-of-self for the working version using scope=self.
tags: [undefined-behavior]

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol
      - id: fe-battalion
        name: Battalion
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-detector
          name: Detector
          type: unit
          modifiers:
            - type: set
              field: name
              value: Force Entry Matched
              conditions:
                - type: instanceOf
                  value: 1
                  field: forces
                  scope: roster
                  childId: fe-patrol
        - id: se-unit
          name: Unit
          type: unit

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-detector
  # instanceOf with scope=roster always returns false in BS engine
  # (c.java:1196-1197 hardcodes return false for roster scope on instanceOf).
  # Both engines agree — condition never fires.
  - expectedState:
      forces:
        - selections:
            - name: Detector
