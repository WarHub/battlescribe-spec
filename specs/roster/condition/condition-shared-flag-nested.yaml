id: condition-shared-flag-nested
category: condition
description: >
  Tests shared=false condition behavior when the condition-holder is nested
  inside a parent unit selection (Container), contrasting with the top-level
  force-child case in condition-shared-flag.yaml.

  Observed behavior: both engines agree — the nested shared=false condition
  never fires — but for different reasons.

  BattleScribe: childId ("shared-trigger") can never match composite
  entry-link IDs ("link-alpha::shared-trigger"), so the count is always 0.

  NewRecruit: the condition fires at force level (see condition-shared-flag
  for that case), but NOT when nested. The mechanism (inferred from JS source
  analysis in docs/shared-flag-semantics.md): NR's find("force", shared=false)
  returns this.parent rather than traversing to the force node. For nested
  entries this.parent is the Container, not the force. NR's reactive counters
  for the base shared-entry ID ("shared-trigger") are only maintained at force
  scope; Container-level counters track composite IDs only. So the count seen
  by the condition is 0 regardless of how many triggers are inside Container.

  The spec uses 1 trigger outside Container (beta, at force level) and
  2 triggers inside Container (alpha, alpha-2) to establish that: the
  cross-link total (3) alone is insufficient to fire in either engine when
  nested, but the within-container total (2) is also insufficient for NR
  due to scope/counter reasons.

  See docs/shared-flag-semantics.md for a full behavioral table across all
  combinations of engine × nesting × shared flag.

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Patrol
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      sharedSelectionEntries:
        - id: shared-trigger
          name: Trigger
          type: unit
      entryLinks:
        - id: link-beta
          name: Beta Trigger
          targetId: shared-trigger
          type: selectionEntry
      selectionEntries:
        - id: se-container
          name: Container
          type: unit
          selectionEntries:
            - id: se-target
              name: Target
              type: upgrade
              modifiers:
                - type: set
                  field: name
                  value: Activated
                  conditions:
                    - type: atLeast
                      value: 2
                      field: selections
                      scope: force
                      childId: shared-trigger
                      shared: false
          entryLinks:
            - id: link-alpha
              name: Alpha Trigger
              targetId: shared-trigger
              type: selectionEntry
            - id: link-alpha-2
              name: Alpha Trigger 2
              targetId: shared-trigger
              type: selectionEntry

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-1

  - action: selectEntry
    id: select-container
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-container

  - action: selectChildEntry
    id: select-target
    forceId: ${{ steps.add-patrol.forceId }}
    selectionId: ${{ steps.select-container.selectionId }}
    entryId: se-target

  # 1 Beta Trigger at force level (OUTSIDE container)
  # NR: container count = 0 (Beta is outside), condition does NOT fire
  # BS: shared=false → composite ID never matches → count = 0 → does NOT fire
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: link-beta

  - expectedState:
      forces:
        - selections:
            - name: Container
              children:
                - name: Target
            - name: Trigger

  # 1 Alpha Trigger INSIDE container — cross-link total = 2, container count = 1
  # NR nested: find("force", false) → Container; Container base-ID counter = 0 → does NOT fire
  # Contrast: top-level (condition-shared-flag.yaml) has scope = force → force base-ID counter
  #   = 2 → NR fires. Here, the Container scope has no base-ID counter → doesn't fire.
  # BS: shared=false → composite ID → count = 0 → does NOT fire
  # Both engines agree: condition not met
  - action: selectChildEntry
    id: select-alpha-1
    forceId: ${{ steps.add-patrol.forceId }}
    selectionId: ${{ steps.select-container.selectionId }}
    entryId: link-alpha

  - expectedState:
      forces:
        - selections:
            - name: Container
              children:
                - name: Target
                - name: Trigger
            - name: Trigger

  # 2nd Alpha Trigger INSIDE container — container total = 2 triggers, force total = 3
  # NR: Container base-ID counter stays 0 → still does NOT fire
  #   (NR propagates base-ID counters only to force, not to intermediate unit selections)
  # BS: shared=false → composite ID → count = 0 → does NOT fire
  # Both engines agree: condition never fires for nested shared=false
  - action: selectChildEntry
    forceId: ${{ steps.add-patrol.forceId }}
    selectionId: ${{ steps.select-container.selectionId }}
    entryId: link-alpha-2

  - expectedState:
      forces:
        - selections:
            - name: Container
              children:
                - name: Target
                - name: Trigger
                - name: Trigger
            - name: Trigger
