id: force-remove-first-multi-catalogue
category: force
description: >
  Removing the first force correctly shifts catalogue tracking for subsequent
  forces. After removal, selections on the remaining force use the correct
  catalogue (not the removed one).
tags: [forceEntry, catalogue]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-a
      name: Faction A
      gameSystemId: test-gs
      selectionEntries:
        - id: se-alpha
          name: Alpha
          type: unit
    - id: cat-b
      name: Faction B
      gameSystemId: test-gs
      selectionEntries:
        - id: se-beta
          name: Beta
          type: unit

steps:
  - action: addForce
    id: add-patrol-a
    forceEntryId: fe-patrol
    catalogueId: cat-a

  - action: addForce
    id: add-patrol-b
    forceEntryId: fe-patrol
    catalogueId: cat-b

  - expectedState:
      forceCount: 2

  # Remove first force (catalogue A)
  - action: removeForce
    forceId: ${{ steps.add-patrol-a.forceId }}

  - expectedState:
      forces:
        - name: Patrol

  # Select on remaining force — should use catalogue B (Beta), not A (Alpha)
  - action: selectEntry
    forceId: ${{ steps.add-patrol-b.forceId }}
    entryId: se-beta

  - expectedState:
      forces:
        - name: Patrol
          selections:
            - name: Beta
