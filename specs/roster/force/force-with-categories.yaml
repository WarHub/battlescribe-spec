id: force-with-categories
category: force
description: Force can be added when the game system defines category entries

# NR's Create List dialog refuses a catalogue with no loadable content, so this roster cannot be
# built through the UI at all. The store-direct `newrecruit` engine builds it fine — the limit is the
# dialog, not the data. Declared `fail` rather than `skip` so an NR release that lifts it is reported
# as an unexpected pass instead of going unnoticed. See docs/nr-ui-roster-coverage.md.
engines:
  newrecruit-ui: fail

setup:
  gameSystem:
    categoryEntries:
      - id: cat-hq
        name: HQ
      - id: cat-troops
        name: Troops
      - id: cat-elites
        name: Elites
    forceEntries:
      - id: fe-1
        name: Patrol
  catalogues:
    - id: cat-1

steps:
  - action: addForce
    forceEntryId: fe-1

  - expectedState:
      forceCount: 1

  - expectedState:
      forces:
        - name: Patrol
          selectionCount: 0
