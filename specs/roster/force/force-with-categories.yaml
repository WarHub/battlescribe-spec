id: force-with-categories
category: force
description: Force can be added when the game system defines category entries

setup:
  gameSystem:
    categoryEntries:
      - id: cat-hq
        name: HQ
      - id: cat-troops
        name: Troops
      - id: cat-elites
        name: Elites
    forceEntries:
      - id: fe-1
        name: Patrol
  catalogues:
    - id: cat-1

steps:
  - action: addForce
    forceEntryId: fe-1

  - expectedState:
      forceCount: 1

  - expectedState:
      forces:
        - name: Patrol
          selectionCount: 0
