id: force-nested-multiple-children
category: force
description: A parent force can contain multiple child forces, each with independent selections
tags: [childForce]

setup:
  gameSystem:
    forceEntries:
      - id: fe-army
        name: Army
        forceEntries:
          - id: fe-patrol
            name: Patrol
          - id: fe-vanguard
            name: Vanguard
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-1
          name: Scout
          type: unit
        - id: se-2
          name: Veteran
          type: unit

steps:
  - action: addForce
    id: add-army
    forceEntryId: fe-army

  - action: addChildForce
    id: add-patrol
    forceId: ${{ steps.add-army.forceId }}
    forceEntryId: fe-patrol

  - action: addChildForce
    id: add-vanguard
    forceId: ${{ steps.add-army.forceId }}
    forceEntryId: fe-vanguard

  - expectedState:
      forces:
        - name: Army
          childForces:
            - name: Patrol
            - name: Vanguard


  # Select into first child force
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-1

  # Select into second child force
  - action: selectEntry
    forceId: ${{ steps.add-vanguard.forceId }}
    entryId: se-2

  - expectedState:
      forces:
        - name: Army
          selectionCount: 0
          childForces:
            - name: Patrol
              selections:
                - name: Scout
            - name: Vanguard
              selections:
                - name: Veteran
