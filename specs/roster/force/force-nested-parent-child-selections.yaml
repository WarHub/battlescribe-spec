id: force-nested-parent-child-selections
category: force
description: Parent and child forces each maintain independent selection lists
tags: [childForce]

setup:
  gameSystem:
    forceEntries:
      - id: fe-army
        name: Army
        forceEntries:
          - id: fe-detach
            name: Detachment
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-1
          name: Infantry
          type: unit
        - id: se-2
          name: Tank
          type: unit

steps:
  - action: addForce
    id: add-army
    forceEntryId: fe-army

  - action: addChildForce
    id: add-detachment
    forceId: ${{ steps.add-army.forceId }}
    forceEntryId: fe-detach

  # Add a unit to the parent force
  - action: selectEntry
    forceId: ${{ steps.add-army.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - name: Army
          selections:
            - name: Infantry
          childForces:
            - name: Detachment
              selectionCount: 0


  # Add a unit to the child force
  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-2

  - expectedState:
      forces:
        - name: Army
          selections:
            - name: Infantry
          childForces:
            - name: Detachment
              selections:
                - name: Tank
