id: force-entry-hidden
category: force
tags: [battlescribe-bug]
description: >
  ForceEntry with hidden=true can be added but is reported as hidden in state.
  BattleScribe bug: the engine never validates hidden ForceEntries — no "(hidden)"
  error is produced, unlike for hidden SelectionEntries/CategoryEntries.
  See docs/hidden-validation-analysis.md for decompiled source analysis.

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
      - id: fe-hidden
        name: Hidden Detachment
        hidden: true

  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit
          name: Unit A
          type: unit

steps:
  - action: addForce
    forceEntryId: fe-patrol

  - action: addForce
    forceEntryId: fe-hidden

  - expectedState:
      forces:
        - name: Hidden Detachment
          hidden: true
        - name: Patrol
