id: force-entry-hidden
category: force
tags: [battlescribe-bug]
description: >
  ForceEntry with hidden=true can be added but is reported as hidden in state.
  BattleScribe bug: the engine never validates hidden ForceEntries — no "(hidden)"
  error is produced, unlike for hidden SelectionEntries/CategoryEntries.
  See docs/hidden-validation-analysis.md for decompiled source analysis.

# A hidden force is not rendered in NR's forces panel, so a user cannot add it and neither can a
# UI driver. The store-direct engine can, which is the difference this records.
engines:
  newrecruit-ui: fail

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol
      - id: fe-hidden
        name: Hidden Detachment
        hidden: true

  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit
          name: Unit A
          type: unit

steps:
  - action: addForce
    forceEntryId: fe-patrol

  - action: addForce
    forceEntryId: fe-hidden

  - expectedState:
      forces:
        - name: Hidden Detachment
          hidden: true
        - name: Patrol
