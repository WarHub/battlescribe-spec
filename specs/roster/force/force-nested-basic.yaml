id: force-nested-basic
category: force
description: Force entries can contain nested sub-force entries for hierarchical army structures
tags: [childForce]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-army
        name: Army
        forceEntries:
          - id: fe-detach
            name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Squad
          type: unit

steps:
  - action: addForce
    id: add-army
    forceEntryId: fe-army
  # Adding the top-level "Army" force. It has a nested "Detachment" force entry.
  - expectedState:
      forceCount: 1
      forces:
        - name: Army
          childForceCount: 0

  # Add a child force under force 0 using forcePath
  - action: addChildForce
    forceId: ${{ steps.add-army.forceId }}
    forceEntryId: fe-detach

  - expectedState:
      forceCount: 1
      forces:
        - name: Army
          childForceCount: 1
          childForces:
            - name: Detachment
