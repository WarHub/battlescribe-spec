id: force-remove
category: force
description: Removing a force reduces force count to zero

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - expectedState:
      forceCount: 1

  - action: removeForce
    forceId: ${{ steps.add-patrol.forceId }}

  - expectedState:
      forceCount: 0
