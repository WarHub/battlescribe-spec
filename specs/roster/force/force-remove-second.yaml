id: force-remove-second
category: force
description: Removing a specific force leaves others intact

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: addForce
    id: add-patrol-2
    forceEntryId: fe-patrol

  - expectedState:
      forceCount: 2

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  # Remove second (empty) force
  - action: removeForce
    forceId: ${{ steps.add-patrol-2.forceId }}

  - expectedState:
      forces:
        - name: Patrol
          selectionCount: 1
