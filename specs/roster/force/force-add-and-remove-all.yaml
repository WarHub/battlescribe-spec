id: force-add-and-remove-all
category: force
description: Adding and removing all forces returns roster to empty state

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Patrol
      - id: fe-2
        name: Battalion
  catalogues:
    - id: cat-1

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-1

  - action: addForce
    id: add-battalion
    forceEntryId: fe-2

  - expectedState:
      forces:
        - name: Battalion
        - name: Patrol

  - action: removeForce
    forceId: ${{ steps.add-patrol.forceId }}

  - expectedState:
      forces:
        - name: Battalion

  - action: removeForce
    forceId: ${{ steps.add-battalion.forceId }}

  - expectedState:
      forceCount: 0
