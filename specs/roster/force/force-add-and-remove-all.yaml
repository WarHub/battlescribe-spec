id: force-add-and-remove-all
category: force
description: Adding and removing all forces returns roster to empty state

# NR's Create List dialog refuses a catalogue with no loadable content, so this roster cannot be
# built through the UI at all. The store-direct `newrecruit` engine builds it fine — the limit is the
# dialog, not the data. Declared `fail` rather than `skip` so an NR release that lifts it is reported
# as an unexpected pass instead of going unnoticed. See docs/nr-ui-roster-coverage.md.
engines:
  newrecruit-ui: fail

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Patrol
      - id: fe-2
        name: Battalion
  catalogues:
    - id: cat-1

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-1

  - action: addForce
    id: add-battalion
    forceEntryId: fe-2

  - expectedState:
      forces:
        - name: Battalion
        - name: Patrol

  - action: removeForce
    forceId: ${{ steps.add-patrol.forceId }}

  - expectedState:
      forces:
        - name: Battalion

  - action: removeForce
    forceId: ${{ steps.add-battalion.forceId }}

  - expectedState:
      forceCount: 0
