id: force-entry-with-modifier
category: force
description: >
  ForceEntry with a modifier that sets hidden=true based on a condition.
  When the condition is met, the force entry becomes hidden.

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    sharedSelectionEntries:
      - id: se-blocker
        name: Blocker Unit
        type: unit
    forceEntries:
      - id: fe-patrol
        name: Patrol
      - id: fe-special
        name: Special Detachment
        modifiers:
          - type: set
            field: hidden
            value: "true"
            conditions:
              - type: atLeast
                value: 1
                field: selections
                scope: roster
                childId: se-blocker
                shared: true

  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      entryLinks:
        - id: el-blocker
          name: Blocker Unit
          targetId: se-blocker
          type: selectionEntry
      selectionEntries:
        - id: se-unit
          name: Unit A
          type: unit

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: addForce
    id: add-special
    forceEntryId: fe-special

  # Before selecting blocker: both forces visible
  - expectedState:
      forces:
        - name: Patrol
        - name: Special Detachment

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: el-blocker

  # After selecting blocker: Special Detachment becomes hidden
  - expectedState:
      forces:
        - name: Patrol
        - name: Special Detachment
          hidden: true
