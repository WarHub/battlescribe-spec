id: force-add-single
category: force
description: Adding a force creates one force in the roster

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1

steps:
  - action: addForce
    forceEntryId: fe-patrol

  - expectedState:
      forces:
        - name: Patrol
