id: force-empty-has-no-selections
category: force
description: A freshly added force has zero selections

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit

steps:
  - action: addForce
    forceEntryId: fe-patrol

  - expectedState:
      forces:
        - selectionCount: 0
