id: force-nested-multi-level
category: force
description: Force entries can be nested multiple levels deep (grandchild forces via forcePath)
tags: [childForce, nested]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-army
        name: Army
        forceEntries:
          - id: fe-division
            name: Division
            forceEntries:
              - id: fe-platoon
                name: Platoon
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Soldier
          type: unit

steps:
  - action: addForce
    id: add-army
    forceEntryId: fe-army

  # Add Division as child of Army
  - action: addChildForce
    id: add-division
    forceId: ${{ steps.add-army.forceId }}
    forceEntryId: fe-division

  - expectedState:
      forces:
        - name: Army
          childForces:
            - name: Division
              childForceCount: 0


  # Add Platoon as grandchild: child of Division (which is child 0 of force 0)
  - action: addChildForce
    id: add-platoon
    forceId: ${{ steps.add-division.forceId }}
    forceEntryId: fe-platoon

  - expectedState:
      forces:
        - name: Army
          childForces:
            - name: Division
              childForces:
                - name: Platoon


  # Select a unit into the grandchild force
  - action: selectEntry
    forceId: ${{ steps.add-platoon.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - name: Army
          selectionCount: 0
          childForces:
            - name: Division
              selectionCount: 0
              childForces:
                - name: Platoon
                  selections:
                    - name: Soldier
