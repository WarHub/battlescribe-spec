id: force-multiple-types
category: force
description: Multiple forces can be created from the same force entry independently

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-patrol
        name: Patrol
      - id: fe-battalion
        name: Battalion
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit
          name: Unit A
          type: unit

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: addForce
    id: add-battalion
    forceEntryId: fe-battalion

  - expectedState:
      forceCount: 2

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit

  - action: selectEntry
    forceId: ${{ steps.add-battalion.forceId }}
    entryId: se-unit

  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Unit A
        - selectionCount: 1
          selections:
            - name: Unit A
