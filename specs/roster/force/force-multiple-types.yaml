id: force-multiple-types
category: force
description: Multiple forces of different types can be created and selected into independently

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol
      - id: fe-battalion
        name: Battalion
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit
          name: Unit A
          type: unit

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: addForce
    id: add-battalion
    forceEntryId: fe-battalion

  - expectedState:
      forceCount: 2

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit

  - action: selectEntry
    forceId: ${{ steps.add-battalion.forceId }}
    entryId: se-unit

  - expectedState:
      forces:
        - selections:
            - name: Unit A
        - selections:
            - name: Unit A
