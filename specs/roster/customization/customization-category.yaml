id: customization-category
category: customization
description: Setting customName and customNotes on a category
engines:
  newrecruit: skip
  # Same engine, same three misses, byte-identical output. Category-level customName/customNotes
  # do not exist in NR's data model — force categories are derived groupings, not instance nodes
  # carrying those properties — and NR emits no "Uncategorised" bucket either. Both NR drivers
  # return early on categoryEntryId by design (NewRecruitActions.cs, NrUiActions.cs).
  # `skip` rather than `fail`: no NR release can flip a call the drivers no-op on purpose.
  newrecruit-ui: skip

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-hq
            targetId: cat-hq
            name: HQ
    categoryEntries:
      - id: cat-hq
        name: HQ
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit
          name: Unit A
          type: unit
          categoryLinks:
            - id: cl-unit-hq
              targetId: cat-hq
              name: HQ
              primary: true

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit

  - action: setCustomization
    forceId: ${{ steps.add-patrol.forceId }}
    categoryEntryId: cat-hq
    customName: Command HQ
    customNotes: Deployment zone alpha

  - expectedState:
      forces:
        - categories:
            - name: Uncategorised
            - name: HQ
              entryId: cat-hq
              customName: Command HQ
              customNotes: Deployment zone alpha
