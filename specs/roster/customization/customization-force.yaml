id: customization-force
category: customization
description: Setting customName and customNotes on a force

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: setCustomization
    forceId: ${{ steps.add-patrol.forceId }}
    customName: Alpha Strike
    customNotes: Main battle group

  - expectedState:
      forces:
        - customName: Alpha Strike
          customNotes: Main battle group
