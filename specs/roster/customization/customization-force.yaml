id: customization-force
category: customization
description: Setting customName and customNotes on a force

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit
          name: Unit A
          type: unit

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit

  - action: setCustomization
    forceId: ${{ steps.add-patrol.forceId }}
    customName: Alpha Strike
    customNotes: Main battle group

  - expectedState:
      forces:
        - customName: Alpha Strike
          customNotes: Main battle group
      engines:
        newrecruit:
          forces:
            - customName: Alpha Strike
              customNotes: ""
