id: entry-link-with-child-group
category: entry-link
description: >
  EntryLink can reference a shared selectionEntryGroup, bringing its children
  as options on the parent entry.

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol

  catalogues:
    - id: cat-1
      sharedSelectionEntryGroups:
        - id: seg-shared
          name: Shared Wargear
          selectionEntries:
            - id: se-pistol
              name: Bolt Pistol
              type: upgrade
            - id: se-chainsword
              name: Chainsword
              type: upgrade
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          entryLinks:
            - id: el-wargear
              targetId: seg-shared
              type: selectionEntryGroup

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    id: select-squad
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-squad

  - action: selectChildEntry
    forceId: ${{ steps.add-patrol.forceId }}
    selectionId: ${{ steps.select-squad.selectionId }}
    entryId: se-pistol

  # The shared group's children are available on Squad via entry link.
  - expectedState:
      forces:
        - selections:
            - name: Squad
              children:
                - name: Bolt Pistol
