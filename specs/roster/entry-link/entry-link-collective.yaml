id: entry-link-collective
category: entry-link
description: >
  EntryLink with collective=true can still be selected normally, and the
  linked entry appears as a child of its parent selection.

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol

  catalogues:
    - id: cat-1
      sharedSelectionEntries:
        - id: se-shared-weapon
          name: Shared Weapon
          type: upgrade
      selectionEntries:
        - id: se-unit
          name: Unit A
          type: unit
          entryLinks:
            - id: el-weapon
              name: Shared Weapon
              targetId: se-shared-weapon
              type: selectionEntry
              collective: true

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    id: select-unit-a
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit

  - action: selectChildEntry
    forceId: ${{ steps.add-patrol.forceId }}
    selectionId: ${{ steps.select-unit-a.selectionId }}
    entryId: se-shared-weapon

  - expectedState:
      forces:
        - selections:
            - name: Unit A
              children:
                - name: Shared Weapon
