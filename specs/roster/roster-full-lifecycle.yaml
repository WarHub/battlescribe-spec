id: roster-full-lifecycle
category: roster
description: Full roster lifecycle - add, select, modify, deselect, remove verifying state at each step

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Patrol
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Scout
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 30
        - id: se-2
          name: Heavy
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 90

steps:
  # Start empty
  - expectedState:
      forceCount: 0

  - action: addForce
    forceEntryIndex: 0

  - expectedState:
      forceCount: 1

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      costs:
        - typeId: pts
          value: 30

  - action: selectEntry
    forceIndex: 0
    entryIndex: 1

  - expectedState:
      costs:
        - typeId: pts
          value: 120

  - action: duplicateSelection
    forceIndex: 0
    selectionIndex: 0

  - expectedState:
      forces:
        - selectionCount: 3
      costs:
        - typeId: pts
          value: 150

  - action: deselectSelection
    forceIndex: 0
    selectionIndex: 1

  - expectedState:
      forces:
        - selectionCount: 2
      costs:
        - typeId: pts
          value: 60

  - action: removeForce
    forceIndex: 0

  - expectedState:
      forceCount: 0
