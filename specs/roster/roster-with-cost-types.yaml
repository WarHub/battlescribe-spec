id: roster-with-cost-types
category: roster
description: Roster tracks cost types from selections

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    costTypes:
      - id: pts
        name: Points
      - id: pl
        name: Power Level
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          costs:
            - name: Points
              typeId: pts
              value: 50
            - name: Power Level
              typeId: pl
              value: 3

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      costs:
        - typeId: pts
          value: 50
        - typeId: pl
          value: 3
