id: roster-multiple-selections
category: roster
description: Selecting multiple entries accumulates selections and costs

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    costTypes:
      - id: pts
        name: Points
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          costs:
            - name: Points
              typeId: pts
              value: 50
        - id: se-unit-b
          name: Unit B
          type: unit
          costs:
            - name: Points
              typeId: pts
              value: 75

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 1

  - expectedState:
      forceCount: 1
      forces:
        - selectionCount: 2
          selections:
            - name: Unit A
              costs:
                - typeId: pts
                  value: 50
            - name: Unit B
              costs:
                - typeId: pts
                  value: 75
      costs:
        - typeId: pts
          value: 125
