id: entry-group-with-entry-links
category: entry-group
description: >
  SelectionEntryGroup can contain entryLinks that reference shared entries.
  These linked entries appear as options in the group.

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol

  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      sharedSelectionEntries:
        - id: se-shared-weapon
          name: Linked Weapon
          type: upgrade
      selectionEntries:
        - id: se-unit
          name: Unit A
          type: unit
          selectionEntryGroups:
            - id: seg-weapons
              name: Weapons
              entryLinks:
                - id: el-weapon
                  name: Linked Weapon
                  targetId: se-shared-weapon
                  type: selectionEntry

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    id: select-unit-a
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit

  - action: selectChildEntry
    forceId: ${{ steps.add-patrol.forceId }}
    selectionId: ${{ steps.select-unit-a.selectionId }}
    entryId: el-weapon

  - expectedState:
      forces:
        - selections:
            - name: Unit A
              children:
                - name: Linked Weapon
