id: roster-add-force-and-select
category: roster
description: After adding a force and selecting an entry, roster has one force with one selection

setup:
  gameSystem:
    costTypes:
      - id: pts
        name: Points
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          costs:
            - name: Points
              typeId: pts
              value: 100

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - expectedState:
      forceCount: 1

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - expectedState:
      costs:
        - typeId: pts
          value: 100
      forces:
        - name: Patrol
          selections:
            - name: Unit A
              type: unit
