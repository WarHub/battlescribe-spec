id: roster-full-lifecycle
category: roster
description: Full roster lifecycle - add, select, modify, deselect, remove verifying state at each step

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Patrol
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Scout
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 30
        - id: se-2
          name: Heavy
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 90

steps:
  # Start empty
  - expectedState:
      forceCount: 0

  - action: addForce
    id: add-patrol
    forceEntryId: fe-1

  - expectedState:
      forceCount: 1

  - action: selectEntry
    id: select-scout
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-1

  - expectedState:
      costs:
        - typeId: pts
          value: 30

  - action: selectEntry
    id: select-heavy
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-2

  - expectedState:
      costs:
        - typeId: pts
          value: 120

  - action: duplicateSelection
    forceId: ${{ steps.add-patrol.forceId }}
    selectionId: ${{ steps.select-scout.selectionId }}

  - expectedState:
      costs:
        - typeId: pts
          value: 150
      forces:
        - selectionCount: 3

  - action: deselectSelection
    forceId: ${{ steps.add-patrol.forceId }}
    selectionId: ${{ steps.select-heavy.selectionId }}

  - expectedState:
      costs:
        - typeId: pts
          value: 60
      forces:
        - selectionCount: 2

  - action: removeForce
    forceId: ${{ steps.add-patrol.forceId }}

  - expectedState:
      forceCount: 0
