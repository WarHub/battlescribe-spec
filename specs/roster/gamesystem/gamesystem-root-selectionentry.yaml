id: gamesystem-root-selectionentry
category: gamesystem
description: >
  SelectionEntry defined at GameSystem level is available in a force created
  from a catalogue that uses that GameSystem.

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
    selectionEntries:
      - id: se-gs-unit
        name: GS Unit
        type: unit

  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    id: select-gs-unit
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-gs-unit

  - expectedState:
      forces:
        - selections:
            - name: GS Unit
