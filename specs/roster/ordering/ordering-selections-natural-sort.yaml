id: ordering-selections-natural-sort
category: ordering
tags: [selection, number, design-difference]
description: Selections with numeric names use natural sort ordering

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-20
          name: Unit 20
          type: unit
        - id: se-unit-2
          name: Unit 2
          type: unit
        - id: se-unit-10
          name: Unit 10
          type: unit
        - id: se-unit-1
          name: Unit 1
          type: unit

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-unit-20

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-unit-2

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-unit-10

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-unit-1

  # NR uses numeric-aware ordering; BS compares names lexicographically.
  - expectedState:
      forces:
        - selections:
            - name: Unit 1
            - name: Unit 2
            - name: Unit 10
            - name: Unit 20
      engines:
        battlescribe:
          forces:
            - selections:
                - name: Unit 1
                - name: Unit 10
                - name: Unit 2
                - name: Unit 20
