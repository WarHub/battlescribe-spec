id: roster-multi-cost-types
category: roster
description: Roster tracks multiple cost types independently

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: Points
      - id: pl
        name: Power Level
      - id: cp
        name: Command Points
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: HQ Choice
          type: unit
          costs:
            - name: Points
              typeId: pts
              value: 100
            - name: Power Level
              typeId: pl
              value: 5
            - name: Command Points
              typeId: cp
              value: -1

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      costs:
        - typeId: pts
          value: 100
        - typeId: pl
          value: 5
        - typeId: cp
          value: -1
