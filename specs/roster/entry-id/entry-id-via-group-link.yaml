id: entry-id-via-group-link
category: entry-id
description: >
  Entry via an entryLink with type=selectionEntryGroup (group link) gets
  composite IDs on both fields: entryId="linkId::entryId" and
  entryGroupId="linkId::targetGroupId".
tags: [entry-id, entryLink, entryGroup]

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      sharedSelectionEntryGroups:
        - id: sseg-options
          name: Shared Options
          selectionEntries:
            - id: se-opt-a
              name: Option A
              type: upgrade
              constraints:
                - id: con-min
                  type: min
                  value: 1
                  field: selections
                  scope: parent
      selectionEntries:
        - id: se-unit
          name: Test Unit
          type: unit
          entryLinks:
            - id: el-group
              targetId: sseg-options
              type: selectionEntryGroup
              name: Options Link

steps:
  - action: addForce
    id: add-f
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-f.forceId }}
    entryId: se-unit

  - expectedState:
      forces:
        - selections:
            - name: Test Unit
              entryId: se-unit
              children:
                - name: Option A
                  entryId: el-group::se-opt-a
                  entryGroupId: el-group::sseg-options
