id: entry-id-group-in-link-target
category: entry-id
description: >
  A selectionEntryGroup inside a link target: the outer link id prefixes both
  the entryId ("linkId::childId") and the entryGroupId ("linkId::groupId").
tags: [entry-id, entryLink, entryGroup]
engines:
  newrecruit: skip

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      sharedSelectionEntries:
        - id: sse-warrior
          name: Shared Warrior
          type: upgrade
          selectionEntryGroups:
            - id: seg-weapons
              name: Weapons
              selectionEntries:
                - id: se-blade
                  name: Blade
                  type: upgrade
                  constraints:
                    - id: con-blade-min
                      type: min
                      value: 1
                      field: selections
                      scope: parent
      selectionEntries:
        - id: se-unit
          name: Test Unit
          type: unit
          entryLinks:
            - id: el-warrior
              targetId: sse-warrior
              type: selectionEntry
              constraints:
                - id: con-warrior-min
                  type: min
                  value: 1
                  field: selections
                  scope: parent

steps:
  - action: addForce
    id: add-f
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-f.forceId }}
    entryId: se-unit

  - expectedState:
      forces:
        - selections:
            - name: Test Unit
              entryId: se-unit
              children:
                - name: Shared Warrior
                  entryId: el-warrior::sse-warrior
                  children:
                    - name: Blade
                      entryId: el-warrior::se-blade
                      entryGroupId: el-warrior::seg-weapons
