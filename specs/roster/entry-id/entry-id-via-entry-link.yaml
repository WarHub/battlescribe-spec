id: entry-id-via-entry-link
category: entry-id
description: >
  Entry selected via an entry link gets a composite entryId of the form
  "linkId::targetId". The link's own id is prepended with :: separator.
tags: [entry-id, entryLink]

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      sharedSelectionEntries:
        - id: sse-weapon
          name: Shared Weapon
          type: upgrade
      selectionEntries:
        - id: se-unit
          name: Test Unit
          type: unit
          entryLinks:
            - id: el-weapon
              targetId: sse-weapon
              type: selectionEntry
              constraints:
                - id: con-min
                  type: min
                  value: 1
                  field: selections
                  scope: parent

steps:
  - action: addForce
    id: add-f
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-f.forceId }}
    entryId: se-unit

  - expectedState:
      forces:
        - selections:
            - name: Test Unit
              entryId: se-unit
              children:
                - name: Shared Weapon
                  entryId: el-weapon::sse-weapon
