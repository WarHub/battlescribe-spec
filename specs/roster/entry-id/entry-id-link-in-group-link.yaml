id: entry-id-link-in-group-link
category: entry-id
description: >
  Entry link inside a group link target: the group link id prefixes both
  the entry link composite ("groupLink::entryLink::targetId") and the
  entryGroupId ("groupLink::sharedGroupId").
tags: [entry-id, entryLink, entryGroup, deep-nesting]

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      sharedSelectionEntries:
        - id: sse-power
          name: Shared Power
          type: upgrade
      sharedSelectionEntryGroups:
        - id: sseg-abilities
          name: Shared Abilities
          entryLinks:
            - id: el-power
              targetId: sse-power
              type: selectionEntry
              constraints:
                - id: con-power-min
                  type: min
                  value: 1
                  field: selections
                  scope: parent
      selectionEntries:
        - id: se-unit
          name: Test Unit
          type: unit
          entryLinks:
            - id: el-group
              targetId: sseg-abilities
              type: selectionEntryGroup
              name: Abilities Link

steps:
  - action: addForce
    id: add-f
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-f.forceId }}
    entryId: se-unit

  - expectedState:
      forces:
        - selections:
            - name: Test Unit
              entryId: se-unit
              children:
                - name: Shared Power
                  entryId: el-group::el-power::sse-power
                  entryGroupId: el-group::sseg-abilities
