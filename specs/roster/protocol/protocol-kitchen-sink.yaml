            - name: Battle-forged
              description: This army is battle-forged
              page: "5"
              publicationId: pub-core
          categoryCount: 4
          categories:
            - name: Uncategorised
              entryId: "(No Category)"
              primary: false
              profiles: []
              rules: []
            - name: HQ
              entryId: cat-hq
              primary: false
              customNotes: HQ deployment notes
              profiles: []
              rules: []
            - name: Troops
              entryId: cat-troops
              primary: false
              profiles: []
              rules: []
            - name: Elites
              entryId: cat-elites
              primary: false
              profiles: []
              rules: []
          publications:
            - id: pub-supplement
              name: Supplement
            - id: pub-core
              name: Core Rulebook
          selections:
            # ── Commander ──
            - name: Commander
              entryId: se-commander
              type: unit
              number: 1
              customName: The General
              customNotes: Veteran commander
              costs:
                - name: pts
                  typeId: ct-pts
                  value: 100
                - name: power
                  typeId: ct-power
                  value: 4
              profiles:
                - name: Power Armor
                  typeId: pt-unit
                  typeName: Unit Stats
                  characteristics:
                    - name: WS
                      typeId: char-ws
                      value: "3+"
                    - name: BS
                      typeId: char-bs
