steps:
  # Step 1: addForce — auto-selects Required Unit (min=1)
  - action: addForce
    id: add-battalion
    forceEntryId: fe-battalion
    catalogueId: cat-1

  - expectedState:
      gameSystemName: Kitchen Sink GS
      forceCount: 1
      forces:
        - name: Battalion
          entryId: fe-battalion
          catalogueId: cat-1
          catalogueName: Test Catalogue
          categoryCount: 4
          categories:
            - name: Uncategorised
              entryId: "(No Category)"
            - name: HQ
              entryId: cat-hq
            - name: Troops
              entryId: cat-troops
            - name: Elites
              entryId: cat-elites
          publications:
            - id: pub-supplement
              name: Supplement
            - id: pub-core
              name: Core Rulebook
          selectionCount: 1
          selections:
            - name: Required Unit
              type: unit
              number: 1
              categories:
                - name: Elites
                  entryId: cat-elites
                  primary: true
      engines:
        newrecruit:
          forces:
            - name: Battalion
              entryId: fe-battalion
              catalogueId: cat-1
              selectionCount: 1
              selections:
                - name: Required Unit
                  type: unit
                  number: 1
                  categories:
                    - name: Elites
                      entryId: cat-elites
                      primary: true

  # Step 2: selectEntry Infantry Squad — assert ALL selection fields
  - action: selectEntry
    id: select-infantry
    forceId: ${{ steps.add-battalion.forceId }}
    entryId: se-infantry

  - expectedState:
      forces:
        - selectionCount: 2
          selections:
            - name: Infantry Squad
              entryId: se-infantry
              type: unit
              number: 1
              costs:
                - name: pts
                  typeId: ct-pts
                  value: 100
                - name: power
                  typeId: ct-power
                  value: 5
              profiles:
                - name: Infantry
                  typeId: pt-unit
                  typeName: Unit Stats
                  characteristics:
                    - name: WS
                      typeId: char-ws
                      value: "4+"
                    - name: BS
                      typeId: char-bs
                      value: "4+"
                    - name: S
                      typeId: char-s
                      value: "3"
                    - name: T
                      typeId: char-t
                      value: "3"
                    - name: W
                      typeId: char-w
                      value: "1"
              rules:
                - name: Orders
                  description: Can receive orders from officers
                  page: "43"
                  publicationId: pub-core
              categories:
                - name: Troops
                  entryId: cat-troops
                  primary: true
              page: "42"
              publicationId: pub-core
              publicationName: Core Rulebook
            - name: Required Unit

  # Step 3: selectChildEntry — add Trooper model to Infantry Squad
  - action: selectChildEntry
    id: select-trooper
    forceId: ${{ steps.add-battalion.forceId }}
    selectionId: ${{ steps.select-infantry.selectionId }}
    entryId: se-inf-trooper

  - expectedState:
      forces:
        - selections:
            - name: Infantry Squad
              children:
                - name: Trooper
                  type: model
                  number: 1
                  costs:
                    - name: pts
                      typeId: ct-pts
                      value: 10
            - name: Required Unit

  # Step 4: selectEntry Commander — assert infoGroup profiles/rules, infoLink data
  - action: selectEntry
    id: select-commander
    forceId: ${{ steps.add-battalion.forceId }}
    entryId: se-commander

  - expectedState:
      forces:
        - selectionCount: 3
          selections:
            - name: Commander
              entryId: se-commander
              type: unit
              number: 1
              costs:
                - name: pts
                  typeId: ct-pts
                  value: 75
                - name: power
                  typeId: ct-power
                  value: 4
              profiles:
                - name: Power Sword
                  typeName: Weapon
                  characteristics:
                    - name: Range
                      value: Melee
                    - name: Str
                      value: "5"
                    - name: AP
                      value: "-3"
                    - name: D
                      value: "1"
                - name: Power Armor
                  typeName: Unit Stats
                  characteristics:
                    - name: WS
                      value: "3+"
                    - name: BS
                      value: "3+"
                    - name: S
                      value: "4"
                    - name: T
                      value: "4"
                    - name: W
                      value: "2"
              rules:
                - name: Inspiring Leader
                  description: Friendly units within 6 inches re-roll morale
                - name: Fearless
                  description: This unit automatically passes morale tests
              categories:
                - name: HQ
                  entryId: cat-hq
                  primary: true
            - name: Infantry Squad
            - name: Required Unit

  # Step 4b: selectChildEntry — add Bold trait to Commander (exercises entryGroupId)
  - action: selectChildEntry
    id: select-bold
    forceId: ${{ steps.add-battalion.forceId }}
    selectionId: ${{ steps.select-commander.selectionId }}
    entryId: se-cmd-trait-bold

  - expectedState:
      forces:
        - selections:
            - name: Commander
              children:
                - name: Bold
                  type: upgrade
                  number: 1
                  entryId: se-cmd-trait-bold
                  entryGroupId: seg-cmd-traits

            - name: Infantry Squad
            - name: Required Unit
      engines:
        newrecruit:
          forces:
            - selections:
                - name: Commander
                  children:
                    - name: Bold
                      type: upgrade
                      number: 1
                      entryId: se-cmd-trait-bold

                - name: Infantry Squad
                - name: Required Unit

  # Step 4c: setCustomization — set custom name/notes on Commander
  - action: setCustomization
    forceId: ${{ steps.add-battalion.forceId }}
    selectionId: ${{ steps.select-commander.selectionId }}
    customName: The General
    customNotes: Veteran commander

  - expectedState:
      forces:
        - selections:
            - name: Commander
              customName: The General
              customNotes: Veteran commander
            - name: Infantry Squad
            - name: Required Unit

  # Step 4d: setCustomization — set custom name/notes on force
  - action: setCustomization
    forceId: ${{ steps.add-battalion.forceId }}
    customName: Alpha Strike Force
    customNotes: Main battle group

  - expectedState:
      forces:
        - customName: Alpha Strike Force
          customNotes: Main battle group

  # Step 4e: setCustomization — set custom notes on force HQ category
  #   NR silently ignores category-level customNotes (not supported)
  - action: setCustomization
    forceId: ${{ steps.add-battalion.forceId }}
    categoryEntryId: cat-hq
    customNotes: HQ deployment notes

  - expectedState:
      forces:
        - categories:
            - name: Uncategorised
            - name: HQ
              entryId: cat-hq
              customNotes: HQ deployment notes
            - name: Troops
            - name: Elites
      engines:
        newrecruit:
          forces:
            - categories:
                - name: Uncategorized
                - name: HQ
                  entryId: cat-hq
                - name: Troops
                - name: Elites

  # Step 5: setSelectionCount— set Trooper child count to 2 via selectionId
  - action: setSelectionCount
    forceId: ${{ steps.add-battalion.forceId }}
    selectionId: ${{ steps.select-trooper.selectionId }}
    count: 2

  - expectedState:
      forces:
        - selections:
            - name: Commander
            - name: Infantry Squad
              children:
                - name: Trooper
                  number: 2
                  costs:
                    - name: pts
                      typeId: ct-pts
                      value: 20
            - name: Required Unit

  # Step 6: selectEntry Infantry Squad again (trigger) — 2nd Infantry triggers
  #   Commander's conditional modifier (atLeast 2 Infantry → +25 pts)
  - action: selectEntry
    id: select-infantry-2
    forceId: ${{ steps.add-battalion.forceId }}
    entryId: se-infantry

  - expectedState:
      forces:
        - selectionCount: 4
          selections:
            - name: Commander
              costs:
                - name: pts
                  typeId: ct-pts
                  value: 100
                - name: power
                  typeId: ct-power
                  value: 4
            - name: Infantry Squad
            - name: Infantry Squad
            - name: Required Unit

  # Step 7: duplicateSelection — duplicate Infantry Squad #1 (has Trooper x2 children)
  #   Verifies deep duplication preserves child selections and their state.
  - action: duplicateSelection
    id: duplicate-infantry
    forceId: ${{ steps.add-battalion.forceId }}
    selectionId: ${{ steps.select-infantry.selectionId }}

  - expectedState:
      forces:
        - selectionCount: 5
          selections:
            - name: Commander
            - name: Infantry Squad
              children:
                - name: Trooper
                  number: 2
            - name: Infantry Squad
            - name: Infantry Squad
              children:
                - name: Trooper
                  number: 2
            - name: Required Unit

  # Step 8: deselectSelection — remove the ORIGINAL Infantry Squad #1
  #   Keeps the duplicate while removing the original.
  - action: deselectSelection
    forceId: ${{ steps.add-battalion.forceId }}
    selectionId: ${{ steps.select-infantry.selectionId }}

  - expectedState:
      forces:
        - selectionCount: 4

  # Step 8b: selectChildEntry hidden upgrade — exercises ExpectedSelectionDef.Hidden + childCount
  - action: selectChildEntry
    id: select-hidden-upgrade
    forceId: ${{ steps.add-battalion.forceId }}
    selectionId: ${{ steps.select-infantry-2.selectionId }}
    entryId: se-inf-hidden-upgrade

  - expectedState:
      errorsContain:
        - on: selection se-infantry
          from: se-infantry/hidden
      forces:
        - selections:
            - name: Commander
            - name: Infantry Squad
              childCount: 1
              children:
                - name: Hidden Upgrade
                  hidden: true
            - name: Infantry Squad
              children:
                - name: Trooper
                  number: 2
            - name: Required Unit

  # Step 8c: deselectSelection — remove hidden upgrade (clean up before setCostLimit)
  - action: deselectSelection
    forceId: ${{ steps.add-battalion.forceId }}
    selectionId: ${{ steps.select-hidden-upgrade.selectionId }}

  - expectedState:
      forces:
        - selectionCount: 4

  # Step 9: setCostLimit — set pts limit low to generate cost limit error
  - action: setCostLimit
    costTypeId: ct-pts
    value: 200

  # Step 9a: verify errorsContain (cost limit error present as a subset)
  - expectedState:
      errorsContain:
        - on: roster
          from: costLimits/ct-pts

  # Step 9b: addForce hidden detachment — exercises ExpectedForceDef.Hidden
  - action: addForce
    id: add-hidden-detachment
    forceEntryId: fe-hidden-detachment
    catalogueId: cat-1

  - expectedState:
      errorCount: 1
      forceCount: 2
      forces:
        - name: Battalion
          selectionCount: 4
        - name: Hidden Detachment
          hidden: true
          selectionCount: 0

  # Step 9c: removeForce — exercises removeForce action, restores single-force state
  - action: removeForce
    forceId: ${{ steps.add-hidden-detachment.forceId }}

  - expectedState:
      errorCount: 1
      forceCount: 1

  # Step 9d: addChildForce — exercises addChildForce + ExpectedForceDef.ChildForces

  - action: addChildForce
    id: add-platoon
    forceEntryId: fe-platoon
    forceId: ${{ steps.add-battalion.forceId }}
    catalogueId: cat-1

  - expectedState:
      errorCount: 1
      forceCount: 1
      forces:
        - childForceCount: 1
          childForces:
            - name: Platoon
              entryId: fe-platoon

  # Step 9e: removeForce — remove the child platoon force (clean up)
  - action: removeForce
    forceId: ${{ steps.add-platoon.forceId }}

  - expectedState:
      errorCount: 1
      forces:
        - childForceCount: 0

  # Step 9f: duplicateForce — exercises duplicateForce action
  - action: duplicateForce
    id: duplicate-battalion
    forceId: ${{ steps.add-battalion.forceId }}

  - expectedState:
      errorCount: 1
      forceCount: 2

  # Step 9g: removeForce — clean up duplicate (restore single-force state)
  - action: removeForce
    forceId: ${{ steps.duplicate-battalion.forceId }}

  - expectedState:
      errorCount: 1
      forceCount: 1

  # Step 10: comprehensive final assertion — full roster state
  #   After steps above, the roster has:
  #   - Battalion force with: Commander (100pts+4pw), Infantry Squad #2 (100pts+5pw),
  #     Infantry Squad (duplicated from #1, 120pts+5pw with Trooper x2 at 20pts), Required Unit
  #   - Commander still has +25pts from conditional (2+ Infantry: #2 + dupe = 2)
  #   - Total pts: 100 + 100 + 120 + 0 = 320 (Commander=100, Inf#2=100, Inf-dupe=120, Required=0)
  #   - Total power: 4 + 5 + 5 + 0 = 14
  #   - Cost limit at 200pts → cost limit error
  #   - New assertions: errorCount, gameSystemId, costCount, childCount
  # ── Airgapped final assertion ──
