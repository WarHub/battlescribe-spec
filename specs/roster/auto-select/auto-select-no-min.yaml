id: auto-select-no-min
category: auto-select
description: Entry without min constraint is not auto-selected after addForce
tags: [auto-select, constraint]

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-1
          name: Unit A
          type: unit
        - id: se-2
          name: Unit B
          type: unit

steps:
  - action: addForce
    forceEntryId: fe-1

  # No entries have min constraints, so nothing is auto-selected
  - expectedState:
      forces:
        - selectionCount: 0
