id: costs-and-constraints-at-depth
category: deep-nesting
description: >
  Costs on entries that are multiple link-hops deep roll up to the
  roster total. Uses min=1 constraints for auto-selection at depth:
  unit → weapon (via entry link) → ammo (via nested entry link).
  Adding a second unit doubles the total cost, confirming each
  deep link chain contributes independently.
tags: [deep-nesting, entryLink, cost]

setup:
  gameSystem:
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      sharedSelectionEntries:
        - id: sse-ammo
          name: Ammo Pack
          type: upgrade
          costs:
            - name: pts
              typeId: pts
              value: 3
        - id: sse-weapon
          name: Heavy Bolter
          type: upgrade
          costs:
            - name: pts
              typeId: pts
              value: 15
          entryLinks:
            - id: el-ammo
              targetId: sse-ammo
              type: selectionEntry
              constraints:
                - id: con-ammo-min
                  type: min
                  value: 1
                  field: selections
                  scope: parent
      selectionEntries:
        - id: se-squad
          name: Devastator Squad
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 80
          entryLinks:
            - id: el-weapon
              targetId: sse-weapon
              type: selectionEntry
              constraints:
                - id: con-weapon-min
                  type: min
                  value: 1
                  field: selections
                  scope: parent

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad

  # First Devastator Squad selected →
  # Heavy Bolter auto-selects (min=1 on link) →
  # Ammo Pack auto-selects (min=1 on inner link).
  # Costs: Squad 80 + Bolter 15 + Ammo 3 = 98
  - expectedState:
      costs:
        - typeId: pts
          value: 98
      forces:
        - selections:
            - name: Devastator Squad
              type: unit
              children:
                - name: Heavy Bolter
                  type: upgrade
                  children:
                    - name: Ammo Pack
                      type: upgrade

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad

  # Second Devastator Squad → second Heavy Bolter + Ammo auto-select.
  # Costs: 2 × (80 + 15 + 3) = 196
  - expectedState:
      costs:
        - typeId: pts
          value: 196
      forces:
        - selectionCount: 2
