id: default-selection-via-deep-link
category: deep-nesting
description: >
  An entry link targets a shared entry via a group with defaultSelectionEntryId
  and min=1. The shared entry itself has a nested group (also with
  defaultSelectionEntryId and min=1) containing a further entry. Both levels
  cascade through the entry link, creating a deep hierarchy through group
  auto-selection.
tags: [deep-nesting, entryLink]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      sharedSelectionEntries:
        - id: sse-standard-config
          name: Standard Config
          type: upgrade
          costs:
            - name: pts
              typeId: pts
              value: 10
          selectionEntryGroups:
            - id: seg-power-level
              name: Power Level
              defaultSelectionEntryId: se-low-power
              constraints:
                - id: con-power-min
                  type: min
                  value: 1
                  field: selections
                  scope: parent
              selectionEntries:
                - id: se-low-power
                  name: Low Power
                  type: upgrade
                  costs:
                    - name: pts
                      typeId: pts
                      value: 2
      selectionEntries:
        - id: se-mech
          name: Battle Mech
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 40
          selectionEntryGroups:
            - id: seg-config
              name: Configuration
              defaultSelectionEntryId: el-standard
              constraints:
                - id: con-config-min
                  type: min
                  value: 1
                  field: selections
                  scope: parent
              entryLinks:
                - id: el-standard
                  targetId: sse-standard-config
                  type: selectionEntry

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-mech

  # Battle Mech selected →
  # Configuration group (min=1, single option) → Standard Config auto-selects →
  # Power Level group (min=1, single option) → Low Power auto-selects.
  # Both levels cascade through the entry link.
  # Costs: Mech 40 + Standard Config 10 + Low Power 2 = 52
  - expectedState:
      costs:
        - typeId: pts
          value: 52
      forces:
        - selectionCount: 1
          selections:
            - name: Battle Mech
              type: unit
              children:
                - name: Standard Config
                  type: upgrade
                  children:
                    - name: Low Power
                      type: upgrade
