id: scope-forces-field
category: scope
description: Condition with field=forces counts forces in scope instead of selections
tags: []

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit
          name: Unit A
          type: unit
          modifiers:
            - type: set
              field: name
              value: Force Counted
              conditions:
                - type: atLeast
                  value: 1
                  field: forces
                  scope: roster
                  childId: fe-patrol

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit

  - expectedState:
      forceCount: 1
      forces:
        - selectionCount: 1
          selections:
            - name: Force Counted
