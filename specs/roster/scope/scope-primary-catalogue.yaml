id: scope-primary-catalogue
category: scope
description: Primary catalogue scope tests condition at the catalogue level

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-trigger
          name: Catalogue Trigger
          type: unit
        - id: se-1
          name: Basic Unit
          type: unit
          modifiers:
            - type: set
              field: name
              value: Modified
              conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: primary-catalogue
                  childId: se-trigger

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - selections:
            - name: Basic Unit

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-trigger

  - expectedState:
      forces:
        - selections:
            - name: Catalogue Trigger
            - name: Modified
      engines:
        newrecruit:
          forces:
            - selections:
                - name: Modified
                - name: Catalogue Trigger
