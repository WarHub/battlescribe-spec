id: scope-force
category: scope
description: Condition with scope=force counts selections in the current force

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-trigger
          name: Trigger
          type: unit
        - id: se-target
          name: Target
          type: unit
          modifiers:
            - type: set
              field: name
              value: Force Has Trigger
              conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: force
                  childId: se-trigger

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-target

  # No trigger yet
  - expectedState:
      forces:
        - selections:
            - name: Target

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-trigger

  # Trigger added to force → condition met
  - expectedState:
      forces:
        - selections:
            - name: Force Has Trigger
            - name: Trigger
