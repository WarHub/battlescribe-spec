id: scope-primary-category
category: scope
description: Condition with scope primary-category evaluates against the primary category of the element

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    categoryEntries:
      - id: cat-hq
        name: HQ
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-fe-hq
            targetId: cat-hq
            name: HQ
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-cmd
          name: Commander
          type: unit
          categoryLinks:
            - id: cl-cmd-hq
              targetId: cat-hq
              name: HQ
              primary: true
          modifiers:
            - type: set
              field: name
              value: Primary HQ
              conditions:
                - type: instanceOf
                  value: 1
                  field: selections
                  scope: primary-category
                  childId: se-cmd

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-cmd

  - expectedState:
      forces:
        - selections:
            - name: Commander
