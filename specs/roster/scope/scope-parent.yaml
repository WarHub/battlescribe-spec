id: scope-parent
category: scope
description: Condition with scope=parent evaluates on the parent element
tags: [design-difference]

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          constraints:
            - id: con-max-3
              type: max
              value: 3
              field: selections
              scope: parent

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  # Named because NewRecruit raises the over-limit on the FIRST of the four Unit A
  # selections; nothing else distinguishes them.
  - action: selectEntry
    id: select-first
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  # 3 selections at max scope
  - expectedState:
      forces:
        - selectionCount: 3

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  # 4 selections exceeds max=3 — constraint violation. NewRecruit names one
  # violator out of four identical Unit A selections and it is the first of them;
  # the old entry-addressed form was true whichever of the four had raised it.
  - expectedState:
      errors:
        - on: selection ${{ steps.select-first.selectionId }}
          from: se-unit-a/con-max-3
      forces:
        - selectionCount: 4
      engines:
        # BattleScribe doesn't enforce scope=parent constraints on
        # entries without categoryLinks (uncategorised root entries).
        battlescribe:
          errors: []
