id: scope-roster-cross-force
category: scope
description: Roster scope condition triggers from a selection in a different force

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-trigger
          name: Trigger
          type: unit
        - id: se-target
          name: Target
          type: unit
          modifiers:
            - type: set
              field: name
              value: Cross Force Activated
              conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: roster
                  childId: se-trigger

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: addForce
    id: add-patrol-2
    forceEntryId: fe-patrol

  # Target in force 0
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-target

  - expectedState:
      forces:
        - selections:
            - name: Target
        - selections: []

  - action: selectEntry
    forceId: ${{ steps.add-patrol-2.forceId }}
    entryId: se-trigger

  - expectedState:
      forces:
        - selections:
            - name: Cross Force Activated
        - selections:
            - name: Trigger
