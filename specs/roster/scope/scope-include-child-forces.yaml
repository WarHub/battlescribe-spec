id: scope-include-child-forces
category: scope
description: Condition with includeChildForces flag includes child forces in query scope
tags: [newrecruit-bug]

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
        forceEntries:
          - id: fe-child
            name: Child Force
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-trigger
          name: Child Trigger
          type: unit
        - id: se-unit
          name: Unit A
          type: unit
          modifiers:
            - type: set
              field: name
              value: Child Forces Included
              conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: force
                  childId: se-trigger
                  includeChildForces: true

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: addChildForce
    id: add-child-force
    forceId: ${{ steps.add-patrol.forceId }}
    forceEntryId: fe-child

  - action: selectEntry
    forceId: ${{ steps.add-child-force.forceId }}
    entryId: se-trigger

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit

  - expectedState:
      forces:
        - selections:
            - name: Child Forces Included
          childForces:
            - selections:
                - name: Child Trigger
