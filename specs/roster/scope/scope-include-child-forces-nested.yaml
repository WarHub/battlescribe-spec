id: scope-include-child-forces-nested
category: scope
description: includeChildForces flag traverses into nested forces for query resolution
tags: [newrecruit-bug]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-army
        name: Army
        forceEntries:
          - id: fe-detach
            name: Detachment
            forceEntries:
              - id: fe-spearhead
                name: Spearhead
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-trigger
          name: Deep Trigger
          type: unit
        - id: se-1
          name: Squad
          type: unit
          modifiers:
            - type: set
              field: name
              value: Veteran Squad
              conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: force
                  childId: se-trigger
                  includeChildForces: true

steps:
  - action: addForce
    id: add-army
    forceEntryId: fe-army

  - action: addChildForce
    id: add-detachment
    forceId: ${{ steps.add-army.forceId }}
    forceEntryId: fe-detach

  - action: addChildForce
    id: add-spearhead
    forceId: ${{ steps.add-detachment.forceId }}
    forceEntryId: fe-spearhead

  - action: selectEntry
    forceId: ${{ steps.add-spearhead.forceId }}
    entryId: se-trigger

  - action: selectEntry
    forceId: ${{ steps.add-army.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Veteran Squad
          childForceCount: 1
          childForces:
            - selectionCount: 0
              childForceCount: 1
              childForces:
                - selectionCount: 1
                  selections:
                    - name: Deep Trigger
