id: scope-self
category: scope
description: Condition with scope=self evaluates on the current element

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit-a
          name: Self Check
          type: unit
          modifiers:
            - type: set
              field: name
              value: Self Found
              conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: self
                  childId: se-unit-a

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  # Self scope evaluates on the element itself — childId=se-unit-a with scope=self
  # returns 0 (doesn't count self), so modifier doesn't fire
  - expectedState:
      forces:
        - selections:
            - name: Self Check
