id: scope-roster
category: scope
description: Condition with scope=roster counts selections across all forces

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-trigger
          name: Trigger
          type: unit
        - id: se-target
          name: Target
          type: unit
          modifiers:
            - type: set
              field: name
              value: Roster Has Trigger
              conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: roster
                  childId: se-trigger

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-target

  - expectedState:
      forces:
        - selections:
            - name: Target

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-trigger

  - expectedState:
      forces:
        - selections:
            - name: Roster Has Trigger
            - name: Trigger
