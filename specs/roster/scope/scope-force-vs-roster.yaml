id: scope-force-vs-roster
category: scope
description: Force scope only counts within the same force, not across forces

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-trigger
          name: Trigger
          type: unit
        - id: se-target
          name: Target
          type: unit
          modifiers:
            - type: set
              field: name
              value: Force Triggered
              conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: force
                  childId: se-trigger

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: addForce
    id: add-patrol-2
    forceEntryId: fe-patrol

  # Select target in force 1
  - action: selectEntry
    forceId: ${{ steps.add-patrol-2.forceId }}
    entryId: se-target

  # Select trigger in force 0 — different force, so force scope doesn't see it
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-trigger

  - expectedState:
      forces:
        - {}
        - selections:
            - name: Target
