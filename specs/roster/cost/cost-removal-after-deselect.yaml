id: cost-removal-after-deselect
category: cost
description: Deselecting a selection removes its cost from roster total

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    costTypes:
      - id: pts
        name: Points
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          costs:
            - name: Points
              typeId: pts
              value: 200
        - id: se-unit-b
          name: Unit B
          type: unit
          costs:
            - name: Points
              typeId: pts
              value: 50

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    id: select-unit-a
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-b

  - expectedState:
      costs:
        - typeId: pts
          value: 250

  - action: deselectSelection
    forceId: ${{ steps.add-patrol.forceId }}
    selectionId: ${{ steps.select-unit-a.selectionId }}

  - expectedState:
      costs:
        - typeId: pts
          value: 50
