id: cost-empty-roster
category: cost
description: Empty roster before any selections has no cost entries

setup:
  gameSystem:
    costTypes:
      - id: pts
        name: Points
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit

steps:
  - action: addForce
    forceEntryId: fe-patrol

  # Before any selections, force has zero selections
  - expectedState:
      forces:
        - selectionCount: 0
