id: cost-type-hidden
category: cost
description: Hidden cost types are omitted from roster cost aggregation

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
      - id: cp
        name: CP
        hidden: true
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Squad
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 100
            - name: CP
              typeId: cp
              value: 1

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1
  # Hidden cost types (cp) are omitted from the roster-level cost list.
  # Only the visible pts cost should appear in roster state costs.
  - expectedState:
      costs:
        - typeId: pts
          value: 100.0
