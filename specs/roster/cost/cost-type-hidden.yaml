id: cost-type-hidden
category: cost
description: Hidden cost types appear in roster cost aggregation alongside visible ones; the hidden flag affects display only

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
      - id: cp
        name: CP
        hidden: true
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Squad
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 100
            - name: CP
              typeId: cp
              value: 1

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1
  # Both visible and hidden cost types appear in roster costs;
  # the hidden flag affects only display, not aggregation.
  - expectedState:
      costs:
        - typeId: pts
          value: 100.0
        - typeId: cp
          value: 1
