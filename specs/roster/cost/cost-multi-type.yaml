id: cost-multi-type
category: cost
description: Multiple cost types tracked independently

setup:
  gameSystem:
    costTypes:
      - id: pts
        name: Points
      - id: pl
        name: Power Level
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          costs:
            - name: Points
              typeId: pts
              value: 100
            - name: Power Level
              typeId: pl
              value: 5

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - expectedState:
      costs:
        - typeId: pts
          value: 100
        - typeId: pl
          value: 5
