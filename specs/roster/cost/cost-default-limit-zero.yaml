id: cost-default-limit-zero
category: cost
description: DefaultCostLimit of 0 — any entry with cost > 0 triggers validation error
tags: [cost, defaultCostLimit]

setup:
  gameSystem:
    costTypes:
      - id: pts
        name: pts
        defaultCostLimit: 0
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-1
          name: Cheap Unit
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 10

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  # Cost 10 exceeds defaultCostLimit of 0 → validation error
  - expectedState:
      errors:
        - on: roster
          from: costLimits/pts
      costs:
        - typeId: pts
          value: 10
