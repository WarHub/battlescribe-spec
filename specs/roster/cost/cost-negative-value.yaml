id: cost-negative-value
category: cost
description: Selection with negative cost reduces the roster cost total

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-expensive
          name: Expensive Unit
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 100
        - id: se-discount
          name: Discount
          type: upgrade
          costs:
            - name: pts
              typeId: pts
              value: -25

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-expensive

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-discount

  - expectedState:
      costs:
        - typeId: pts
          value: 75.0
      forces:
        - selectionCount: 2
