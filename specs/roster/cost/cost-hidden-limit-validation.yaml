id: cost-hidden-limit-validation
category: cost
description: Hidden cost type with a limit still produces validation error when exceeded
tags: [cost, costType, validation-errors]

# NR's UI does not surface a violation of a HIDDEN cost limit, so the expected validation error never
# appears. The store-direct engine reports it.
# Same shape on BattleScribe's desktop UI, for a different reason: its New Roster dialog carries ONE
# integer spinner, and the limit this spec needs is on the HIDDEN `cp` cost type while `pts` is the
# visible one. A roster built through that dialog gets no `cp` limit, so there is no violation to
# surface. BattleScribe applies a costType default only to a roster created through its ENGINE, not
# through this dialog (measured: the roster reads back `costLimits: []`).
# `fail` rather than `skip` so the spec still RUNS — the Edit Roster dialog has not been examined
# for per-cost-type limit fields, and if a driver ever sets them there this is reported as a pass.
engines:
  newrecruit-ui: fail
  battlescribe-ui: fail

setup:
  gameSystem:
    costTypes:
      - id: pts
        name: pts
      - id: cp
        name: CP
        hidden: true
        defaultCostLimit: 1
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-1
          name: HQ
          type: unit
          costs:
            - name: CP
              typeId: cp
              value: 2

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  # HQ costs 2 CP, limit is 1 — should produce a validation error
  - expectedState:
      errors:
        - on: roster
          from: costLimits/cp
      costs:
        - typeId: cp
          value: 2
