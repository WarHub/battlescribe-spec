id: cost-default-limit-positive
category: cost
description: Positive defaultCostLimit enforced — only cost exceeding the limit triggers error
tags: [cost, defaultCostLimit]

# BattleScribe's New Roster dialog carries ONE integer spinner, so it can express exactly one
# integral cost limit — and this game system declares three cost types each with a default of 100.
# A roster built through that dialog gets no limit for the other two, and BattleScribe applies a
# costType default only to a roster created through its ENGINE, not through this dialog (measured:
# the roster reads back `costLimits: []`). The store-direct engine gets all three.
# `fail` rather than `skip` so the spec still RUNS: the Edit Roster dialog has not been examined for
# per-cost-type limit fields, and if a driver ever sets them there this is reported as a pass.
engines:
  battlescribe-ui: fail

setup:
  gameSystem:
    costTypes:
      - id: ct-over
        name: over
        defaultCostLimit: 100
      - id: ct-at
        name: at
        defaultCostLimit: 100
      - id: ct-under
        name: under
        defaultCostLimit: 100
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-1
          name: Unit
          type: unit
          costs:
            - name: over
              typeId: ct-over
              value: 120
            - name: at
              typeId: ct-at
              value: 100
            - name: under
              typeId: ct-under
              value: 50

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  # Cost 120 exceeds limit 100 → error; cost 100 at limit → no error; cost 50 under → no error
  - expectedState:
      errors:
        - on: roster
          from: costLimits/ct-over
      costs:
        - typeId: ct-over
          value: 120
        - typeId: ct-at
          value: 100
        - typeId: ct-under
          value: 50
