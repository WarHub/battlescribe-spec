id: cost-duplicate-increases
category: cost
description: Duplicating a selection doubles its cost contribution

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Marine
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 75

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    id: select-marine
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      costs:
        - typeId: pts
          value: 75

  - action: duplicateSelection
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-marine.selectionId }}

  - expectedState:
      costs:
        - typeId: pts
          value: 150

  - action: duplicateSelection
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-marine.selectionId }}

  - expectedState:
      costs:
        - typeId: pts
          value: 225
