id: cost-three-types
category: cost
description: Three cost types tracked simultaneously on a single selection

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: Points
      - id: pl
        name: Power Level
      - id: cp
        name: Command Points
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Command Unit
          type: unit
          costs:
            - name: Points
              typeId: pts
              value: 100
            - name: Power Level
              typeId: pl
              value: 5
            - name: Command Points
              typeId: cp
              value: 1

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      costs:
        - typeId: pts
          value: 100
        - typeId: pl
          value: 5
        - typeId: cp
          value: 1
      forces:
        - selections:
            - name: Command Unit
              costs:
                - typeId: pts
                  value: 100
                - typeId: pl
                  value: 5
                - typeId: cp
                  value: 1
