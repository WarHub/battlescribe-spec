id: wh40k-10e-space-marines-army
category: real-world
description: Build a Space Marines army — verify auto-selections, unit types, and points costs
tags: [wh40k-10e, real-world, space-marines, cost, profile, design-difference]

# Same unimplemented path as wh40k-10e-create-army: newrecruit-ui's SetupFromFilesAsync records
# no spec data, so the first addForce throws before the UI is touched at all. Driver gap, not an
# NR limitation — store-direct `newrecruit` passes. See docs/nr-ui-roster-coverage.md.
# BattleScribe 2.03.21 cannot PARSE this dataset. `Warhammer 40,000.gst` carries four modifiers
# written `<modifier type="replace" field="…" arg="+0">` with no `value` attribute, and `value` is
# `use="required"` on Modifier in BattleScribe's own schema — v2_03 and latest alike. Its parser
# agrees: `ValueRequiredException: Unable to satisfy @Attribute(name="", required=true) on field
# 'value' … at line 1197`. It then discards the game system and reports it missing, so the New
# Roster dialog has nothing to build from.
#
# This is NOT the driver gap it looks like. SetupFromFiles is implemented here: the files stage,
# the index.bsi builds from them, the app launches and parses all 200+ catalogues. Only the game
# system is refused, by the app, over data BattleScribe itself calls invalid.
# `fail` rather than `skip` so a data release that drops that modifier form — or a spec repinned to
# one — is reported as an unexpected pass.
engines:
  newrecruit-ui: fail
  battlescribe-ui: fail

setup:
  dataSource: "github:BSData/wh40k-10e@v10.6.0"

steps:
  - id: add-force
    action: addForce
    forceEntryId: bb9d-299a-ed60-2d8a
    catalogueId: e0af-67df-9d63-8fb7

  # After force creation, mandatory entries are auto-selected
  - expectedState:
      forces:
        - name: "Army Roster"
          selections:
            - name: "Battle Size"
              type: upgrade
            - name: "Detachment"
              type: upgrade
            - name: "Show/Hide Options"
              type: upgrade

  - action: selectEntry
    forceId: ${{ steps.add-force.forceId }}
    entryId: 6c10-5b51-5bc0-8d2c

  - expectedState:
      costs:
        - name: "pts"
          value: 80
      forces:
        - name: "Army Roster"
          selections:
            - name: "Battle Size"
              type: upgrade
            - name: "Detachment"
              type: upgrade
            - name: "Show/Hide Options"
              type: upgrade
            - name: "Captain"
              type: model
      engines:
        # BS render layer sorts purely alphabetically: Captain before Detachment.
        # NR groups by primary category (forceEntry categoryLink order):
        # Configuration entries before Character entries.
        battlescribe:
          forces:
            - selections:
                - name: "Battle Size"
                  type: upgrade
                - name: "Captain"
                  type: model
                - name: "Detachment"
                  type: upgrade
                - name: "Show/Hide Options"
                  type: upgrade
        # NR tracks all cost types, including unused ones at value=0.
        newrecruit:
          costs:
            - name: "pts"
              value: 80
            - name: "c5fb-5b9b-89f6-86c"
              value: 0

  - action: selectEntry
    forceId: ${{ steps.add-force.forceId }}
    entryId: 8da0-4570-c3c-819f

  - expectedState:
      costs:
        - name: "pts"
          value: 160
      forces:
        - name: "Army Roster"
          selections:
            - name: "Battle Size"
              type: upgrade
            - name: "Detachment"
              type: upgrade
            - name: "Show/Hide Options"
              type: upgrade
            - name: "Captain"
              type: model
            - name: "Intercessor Squad"
              type: unit
      engines:
        battlescribe:
          forces:
            - selections:
                - name: "Battle Size"
                  type: upgrade
                - name: "Captain"
                  type: model
                - name: "Detachment"
                  type: upgrade
                - name: "Intercessor Squad"
                  type: unit
                - name: "Show/Hide Options"
                  type: upgrade
        # NR tracks all cost types, including unused ones at value=0.
        newrecruit:
          costs:
            - name: "pts"
              value: 160
            - name: "c5fb-5b9b-89f6-86c"
              value: 0

  - action: selectEntry
    forceId: ${{ steps.add-force.forceId }}
    entryId: 8da0-4570-c3c-819f

  # Final state: 3 auto + 3 user = 6 selections, 80+80+80 = 240 pts
  - expectedState:
      costs:
        - name: "pts"
          value: 240
      forces:
        - name: "Army Roster"
          selectionCount: 6
      engines:
        # NR tracks all cost types, including unused ones at value=0.
        newrecruit:
          costs:
            - name: "pts"
              value: 240
            - name: "c5fb-5b9b-89f6-86c"
              value: 0
