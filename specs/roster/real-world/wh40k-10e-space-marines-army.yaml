id: wh40k-10e-space-marines-army
category: real-world
description: Build a Space Marines army — verify auto-selections, unit types, and points costs
tags: [wh40k-10e, real-world, space-marines, cost, profile, design-difference]

setup:
  dataSource: "github:BSData/wh40k-10e@v10.6.0"

steps:
  - id: add-force
    action: addForce
    forceEntryId: bb9d-299a-ed60-2d8a
    catalogueId: e0af-67df-9d63-8fb7

  # After force creation, mandatory entries are auto-selected
  - expectedState:
      forces:
        - name: "Army Roster"
          selections:
            - name: "Battle Size"
              type: upgrade
            - name: "Detachment"
              type: upgrade
            - name: "Show/Hide Options"
              type: upgrade

  - action: selectEntry
    forceId: ${{ steps.add-force.forceId }}
    entryId: 6c10-5b51-5bc0-8d2c

  - expectedState:
      costs:
        - name: "pts"
          value: 80
      forces:
        - name: "Army Roster"
          selections:
            - name: "Battle Size"
              type: upgrade
            - name: "Detachment"
              type: upgrade
            - name: "Show/Hide Options"
              type: upgrade
            - name: "Captain"
              type: model
      engines:
        # BS render layer sorts purely alphabetically: Captain before Detachment.
        # NR groups by primary category (forceEntry categoryLink order):
        # Configuration entries before Character entries.
        battlescribe:
          forces:
            - selections:
                - name: "Battle Size"
                  type: upgrade
                - name: "Captain"
                  type: model
                - name: "Detachment"
                  type: upgrade
                - name: "Show/Hide Options"
                  type: upgrade

  - action: selectEntry
    forceId: ${{ steps.add-force.forceId }}
    entryId: 8da0-4570-c3c-819f

  - expectedState:
      costs:
        - name: "pts"
          value: 160
      forces:
        - name: "Army Roster"
          selections:
            - name: "Battle Size"
              type: upgrade
            - name: "Detachment"
              type: upgrade
            - name: "Show/Hide Options"
              type: upgrade
            - name: "Captain"
              type: model
            - name: "Intercessor Squad"
              type: unit
      engines:
        battlescribe:
          forces:
            - selections:
                - name: "Battle Size"
                  type: upgrade
                - name: "Captain"
                  type: model
                - name: "Detachment"
                  type: upgrade
                - name: "Intercessor Squad"
                  type: unit
                - name: "Show/Hide Options"
                  type: upgrade

  - action: selectEntry
    forceId: ${{ steps.add-force.forceId }}
    entryId: 8da0-4570-c3c-819f

  # Final state: 3 auto + 3 user = 6 selections, 80+80+80 = 240 pts
  - expectedState:
      costs:
        - name: "pts"
          value: 240
      forces:
        - name: "Army Roster"
          selectionCount: 6
