id: catalogue-cost-types
category: catalogue
tags: [catalogue, costType]
description: Catalogue defines its own costTypes that are used for cost resolution

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      costTypes:
        - id: cat-pts
          name: cat pts
      selectionEntries:
        - id: se-1
          name: Marine
          type: unit
          costs:
            - name: cat pts
              typeId: cat-pts
              value: 50

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - selections:
            - name: Marine
              costs:
                - name: cat pts
                  typeId: cat-pts
                  value: 50
      engines:
        # Accepted conformant divergence: BS tracks all game system cost types on each
        # selection (including zero-value ones); NR omits zero-value costs from selection state.
        # Both behaviors are valid — the engines:override mechanism is the correct way to
        # express this difference in specs.
        battlescribe:
          forces:
            - selections:
                - name: Marine
                  costs:
                    - name: cat pts
                      typeId: cat-pts
                      value: 50
                    - typeId: pts
                      value: 0
