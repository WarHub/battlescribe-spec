id: catalogue-category-entries
category: catalogue
tags: [catalogue, categoryEntry]
description: Catalogue defines own categoryEntries used in force categories

engines:
  # NOT a hidden entry, despite what the driver's message used to say. `se-1` carries no
  # `hidden` and no modifiers. NR's catalogue panel groups a force's selectable entries under
  # the FORCE's own categories; anything whose primary category is not one of them goes into
  # NR's `(Illegal Units)` bucket, which NR builds with hidden:true and never renders. `fe-1`
  # declares no categoryLinks, so `Custom Category` is not a force category and NR offers no
  # row for Marine.
  # Measured two ways: the identical spec with a force categoryLink to a GAME-SYSTEM category
  # passes; and NR's own "Search Units, Categories, Costs..." box returns zero rows for it, so
  # the bucket is unreachable by search either. The store-direct `newrecruit` engine selects it
  # fine — the limit is the panel, not the data.
  # `fail` rather than `skip` so the spec still RUNS — an NR release that starts offering these
  # is reported as an unexpected pass. See docs/nr-ui-roster-coverage.md.
  newrecruit-ui: fail
  # BattleScribe's desktop UI reaches the same place by the same route: its catalogue tree groups a
  # force's entries under that force's categories, and `fe-1` declares no categoryLinks, so there is
  # no branch for `Custom Category` to hang under and no item for Marine anywhere in the tree.
  # Measured 2026-08-08 against the WHOLE tree, not just the force's subtree — the first run of this
  # lane, before catalogue-tree lookups were scoped per force, failed identically with "never
  # offered an item for id 'se-1'". So this is not an artifact of that scoping.
  # `fail` rather than `skip` for the same reason as NR: the spec still RUNS, and a BattleScribe
  # build that starts offering these is reported as an unexpected pass.
  battlescribe-ui: fail

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      categoryEntries:
        - id: cat-custom
          name: Custom Category
      selectionEntries:
        - id: se-1
          name: Marine
          type: unit
          categoryLinks:
            - id: cl-custom
              targetId: cat-custom
              name: Custom Category
              primary: true

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - selections:
            - name: Marine
              categories:
                - name: Custom Category
                  primary: true
