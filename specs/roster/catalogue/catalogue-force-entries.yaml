id: catalogue-force-entries
category: catalogue
tags: [catalogue, forceEntry]
description: Catalogue defines own forceEntries that can be used to add forces

setup:
  gameSystem:
    forceEntries:
      - id: fe-gs
        name: GS Detachment
  catalogues:
    - id: cat-1
      forceEntries:
        - id: fe-cat
          name: Catalogue Detachment
      selectionEntries:
        - id: se-1
          name: Marine
          type: unit

steps:
  - action: addForce
    id: add-catalogue-detachment
    forceEntryId: fe-cat

  - action: selectEntry
    forceId: ${{ steps.add-catalogue-detachment.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - name: Catalogue Detachment
          selections:
            - name: Marine
