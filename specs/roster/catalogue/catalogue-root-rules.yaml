id: catalogue-root-rules
category: catalogue
description: >
  Rules defined at the catalogue root level (non-shared) are available
  to entries in that catalogue via infoLinks.

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol

  catalogues:
    - id: cat-1
      rules:
        - id: rule-cat
          name: Catalogue Rule
          description: A rule defined at catalogue root
      selectionEntries:
        - id: se-unit
          name: Unit A
          type: unit
          infoLinks:
            - id: il-rule
              name: Catalogue Rule
              targetId: rule-cat
              type: rule

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit

  - expectedState:
      forces:
        - selections:
            - name: Unit A
              rules:
                - name: Catalogue Rule
                  description: A rule defined at catalogue root
