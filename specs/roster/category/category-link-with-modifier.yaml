id: category-link-with-modifier
category: category
description: >
  CategoryLink with a modifier that sets the primary flag to true.
  Modifiers on category links are processed by the engine during
  roster evaluation.

setup:
  gameSystem:
    categoryEntries:
      - id: cat-troops
        name: Troops
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-troops
            targetId: cat-troops
            name: Troops

  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit
          name: Unit A
          type: unit
          categoryLinks:
            - id: cl-unit-troops
              targetId: cat-troops
              name: Troops
              primary: true

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit

  - expectedState:
      forces:
        - selections:
            - name: Unit A
              categories:
                - name: Troops
                  primary: true
