id: category-entry-hidden
category: category
description: >
  CategoryEntry with hidden=true is not visible on selections.
  Selections assigned to a hidden category still function but the
  category is not displayed.

setup:
  gameSystem:
    categoryEntries:
      - id: cat-troops
        name: Troops
      - id: cat-hidden
        name: Hidden Category
        hidden: true
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-troops
            targetId: cat-troops
            name: Troops
          - id: cl-hidden
            targetId: cat-hidden
            name: Hidden Category

  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit
          name: Unit A
          type: unit
          categoryLinks:
            - id: cl-unit-troops
              targetId: cat-troops
              name: Troops
              primary: true

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit

  - expectedState:
      forces:
        - selections:
            - name: Unit A
              categories:
                - name: Troops
                  primary: true
