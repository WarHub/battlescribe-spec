id: constraint-cost-field
category: constraint
description: Constraint on costs field limits based on point cost rather than count

setup:
  gameSystem:
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-1
          name: Expensive Unit
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 200
          constraints:
            - id: c1
              type: max
              value: 500
              field: costs
              scope: parent

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - expectedState:
      forces:
        - selectionCount: 0

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  # 200 pts < max 500 pts — cost constraint satisfied
  - expectedState:
      forces:
        - selections:
            - name: Expensive Unit
