id: constraint-shared-linked
category: constraint
description: >
  Two separate selection entries each with their own min=1 constraint
  produce independent validation errors when deselected. Auto-select
  satisfies both initially; removing them triggers one error per entry
  on the parent category.
tags:
  - validation-errors
  - structured-errors

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    categoryEntries:
      - id: cat-troops
        name: Troops
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-fe-troops
            targetId: cat-troops
            name: Troops
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          categoryLinks:
            - id: cl-sea-troops
              targetId: cat-troops
              name: Troops
              primary: true
          constraints:
            - id: con-min-a
              type: min
              value: 1
              field: selections
              scope: parent
        - id: se-unit-b
          name: Unit B
          type: unit
          categoryLinks:
            - id: cl-seb-troops
              targetId: cat-troops
              name: Troops
              primary: true
          constraints:
            - id: con-min-b
              type: min
              value: 1
              field: selections
              scope: parent

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  # Auto-select creates Unit A and Unit B (each has min=1), satisfied
  - expectedState:
      forces:
        - selectionCount: 2
          selections:
            - name: Unit A
            - name: Unit B

  # Remove both auto-selected entries to trigger constraint violations
  - action: deselectSelection
    forceId: ${{ steps.add-patrol.forceId }}
    selectionId: ${{ steps.add-patrol.selections.se-unit-a }}

  - action: deselectSelection
    forceId: ${{ steps.add-patrol.forceId }}
    selectionId: ${{ steps.add-patrol.selections.se-unit-b }}

  - expectedState:
      errors:
        - on: category cat-troops
          from: se-unit-a/con-min-a
        - on: category cat-troops
          from: se-unit-b/con-min-b
      forces:
        - selectionCount: 0
