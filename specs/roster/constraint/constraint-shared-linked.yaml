id: constraint-shared-linked
category: constraint
description: >
  Same-constraint-ID side effect: two separate entries with matching
  constraint IDs and shared=true produce independent validation errors
  per entry, not a merged/deduplicated error. This is a side effect of
  ID reuse — each entry's constraint is evaluated independently.
  BattleScribe reports separate errors for each entry that violates its
  own min=1 requirement. The shared flag and matching IDs do NOT cause
  cross-entry counting for separate (non-shared) entries.
tags:
  - duplicate-ids
  - validation-errors
  - structured-errors
  - design-difference
  - same-constraint-id

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    categoryEntries:
      - id: cat-troops
        name: Troops
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-fe-troops
            targetId: cat-troops
            name: Troops
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          categoryLinks:
            - id: cl-sea-troops
              targetId: cat-troops
              name: Troops
              primary: true
          constraints:
            - id: con-min-shared
              type: min
              value: 1
              field: selections
              scope: parent
              shared: true
        - id: se-unit-b
          name: Unit B
          type: unit
          categoryLinks:
            - id: cl-seb-troops
              targetId: cat-troops
              name: Troops
              primary: true
          constraints:
            - id: con-min-shared
              type: min
              value: 1
              field: selections
              scope: parent
              shared: true

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  # Auto-select creates Unit A and Unit B (each has shared min=1), satisfied
  - expectedState:
      forces:
        - selectionCount: 2
          selections:
            - name: Unit A
            - name: Unit B

  # Remove both auto-selected entries to trigger shared constraint violation
  - action: deselectSelection
    forceId: ${{ steps.add-patrol.forceId }}
    selectionId: ${{ steps.add-patrol.selections.se-unit-a }}

  - action: deselectSelection
    forceId: ${{ steps.add-patrol.forceId }}
    selectionId: ${{ steps.add-patrol.selections.se-unit-b }}

  - expectedState:
      errors:
        - on: category cat-troops
          from: se-unit-a/con-min-shared
        - on: category cat-troops
          from: se-unit-b/con-min-shared
      forces:
        - selectionCount: 0
      engines:
        newrecruit:
          # NR deduplicates shared constraints and only reports one category-level error.
          errors:
            - on: category cat-troops
              from: se-unit-a/con-min-shared
