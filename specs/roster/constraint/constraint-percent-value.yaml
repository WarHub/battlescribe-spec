id: constraint-percent-value
category: constraint
description: >
  Constraint with percentValue=true calculates threshold as a percentage
  of the total count in the given scope. For max=50 and field=selections,
  the threshold is 50% of total parent selections.
  Both engines handle this correctly.

setup:
  gameSystem:
    categoryEntries:
      - id: cat-troops
        name: Troops
    costTypes:
      - id: pts
        name: pts
        defaultCostLimit: 2000
    forceEntries:
      - id: fe-1
        name: Detachment
        categoryLinks:
          - id: cl-fe-troops
            targetId: cat-troops
            name: Troops
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-1
          name: Elite
          type: unit
          categoryLinks:
            - id: cl-se1-troops
              targetId: cat-troops
              name: Troops
              primary: true
          costs:
            - name: pts
              typeId: pts
              value: 300
          constraints:
            - id: c1
              type: max
              value: 50
              field: selections
              scope: parent
              percentValue: true

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - expectedState:
      forces:
        - selectionCount: 0

  - action: selectEntry
    id: select-elite
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  # percentValue=true: max = 50% of parent selections.
  # With 1 total selection: threshold = 1/100*50 = 0.5.
  # 1 selection > 0.5 → both engines produce an error, and they hang it on
  # different nodes: BattleScribe on the Troops category that counted, NewRecruit
  # on the Elite selection that violated. Both are recorded.
  - expectedState:
      errors:
        - on: category ${{ steps.add-detachment.categories.cat-troops }}
          from: se-1/c1
      forces:
        - selections:
            - name: Elite
      engines:
        newrecruit:
          errors:
            - on: selection ${{ steps.select-elite.selectionId }}
              from: se-1/c1
