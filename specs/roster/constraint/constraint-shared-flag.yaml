id: constraint-shared-flag
category: constraint
description: >
  Contrasts shared=true vs shared=false on constraints of the same shared
  entry accessed via two entry links. Two constraints on one
  sharedSelectionEntry: con-max-per-link (shared=false, max=2) counts each
  link independently; con-max-shared (shared=true, max=3) counts ALL
  selections across links. Steps prove each fires at the correct threshold
  with the correct constraintId.
tags:
  - validation-errors

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Patrol
  catalogues:
    - id: cat-1
      sharedSelectionEntries:
        - id: shared-unit
          name: Squad
          type: unit
          constraints:
            - id: con-max-per-link
              type: max
              value: 2
              field: selections
              scope: force
              shared: false
            - id: con-max-shared
              type: max
              value: 3
              field: selections
              scope: force
              shared: true
      entryLinks:
        - id: link-alpha
          name: Alpha Squad
          targetId: shared-unit
          type: selectionEntry
        - id: link-beta
          name: Beta Squad
          targetId: shared-unit
          type: selectionEntry

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-1

  # Select 2 from link-alpha: per-link alpha=2/2 at limit, shared=2/3.
  # The first Alpha Squad is named: NewRecruit raises every error in this spec on
  # it, the per-link one and the shared one alike, even after Beta Squads join
  # the shared count.
  - action: selectEntry
    id: select-alpha-1
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: link-alpha

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: link-alpha

  # No constraint violation yet
  - expectedState:
      forces:
        - selectionCount: 2

  # Select 1 more from link-alpha: per-link alpha=3 exceeds max=2 → fires
  # shared total=3 at limit but not exceeded → no shared error yet
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: link-alpha

  # Only per-link constraint fires (3 > max 2). Both constraints are scope=force,
  # so BattleScribe raises everything here on the FORCE that counted; NewRecruit
  # names the first Alpha Squad instead.
  - expectedState:
      errors:
        - on: force ${{ steps.add-patrol.forceId }}
          from: shared-unit/con-max-per-link
      forces:
        - selectionCount: 3
      engines:
        newrecruit:
          errors:
            - on: selection ${{ steps.select-alpha-1.selectionId }}
              from: shared-unit/con-max-per-link

  # Select 1 from link-beta: per-link beta=1/2 OK
  # shared total=4 exceeds max=3 → shared constraint fires too
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: link-beta

  # Both constraints now fire: per-link (max 2) and shared (max 3).
  # The shared one counts the Beta Squad too, but neither engine raises it on a
  # Beta node: BattleScribe hangs both on the force, NewRecruit hangs both on the
  # first Alpha Squad.
  - expectedState:
      errors:
        - on: force ${{ steps.add-patrol.forceId }}
          from: shared-unit/con-max-per-link
        - on: force ${{ steps.add-patrol.forceId }}
          from: shared-unit/con-max-shared
      forces:
        - selectionCount: 4
      engines:
        newrecruit:
          errors:
            - on: selection ${{ steps.select-alpha-1.selectionId }}
              from: shared-unit/con-max-per-link
            - on: selection ${{ steps.select-alpha-1.selectionId }}
              from: shared-unit/con-max-shared

  # Select 1 more from link-beta: per-link beta=2/2, shared=5
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: link-beta

  # Per-link alpha still exceeds (3 > max 2), shared exceeds (5 > max 3)
  # Per-link beta now at limit (2/2), no additional per-link error for beta
  - expectedState:
      errors:
        - on: force ${{ steps.add-patrol.forceId }}
          from: shared-unit/con-max-per-link
        - on: force ${{ steps.add-patrol.forceId }}
          from: shared-unit/con-max-shared
      forces:
        - selectionCount: 5
      engines:
        newrecruit:
          errors:
            - on: selection ${{ steps.select-alpha-1.selectionId }}
              from: shared-unit/con-max-per-link
            - on: selection ${{ steps.select-alpha-1.selectionId }}
              from: shared-unit/con-max-shared
