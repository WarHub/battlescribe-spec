id: constraint-min-on-force-linked
category: constraint
description: Min selection constraint scoped to force produces structured error
tags:
  - validation-errors
  - structured-errors
  - design-difference

setup:
  gameSystem:
    categoryEntries:
      - id: cat-troops
        name: Troops
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-fe-troops
            targetId: cat-troops
            name: Troops
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          categoryLinks:
            - id: cl-sea-troops
              targetId: cat-troops
              name: Troops
              primary: true
          constraints:
            - id: con-min-force
              type: min
              value: 2
              field: selections
              scope: force

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  # Auto-select creates 2 Unit A (min=2, scope=force), constraint satisfied
  - expectedState:
      forces:
        - selections:
            - name: Unit A
            - name: Unit A

  # Remove one auto-selected entry (need 2, have 1 → violation)
  - action: deselectSelection
    forceId: ${{ steps.add-patrol.forceId }}
    selectionId: ${{ steps.add-patrol.selections.se-unit-a }}

  # BattleScribe raises the force-scoped min on the force that counted, and so
  # does NewRecruit — but NewRecruit also raises it a second time on the Unit A
  # that is left, which BattleScribe does not. The override exists for that extra
  # error, not for a disagreement about the first one.
  #
  # That second assertion is entry-addressed, and cannot yet be anything else:
  # the surviving Unit A is one of two the force auto-added, and
  # ActionOutputs.Selections holds one node per entry id (last one wins) — the
  # very id this spec then deselects. So the node that remains is the one no step
  # output names. Same shape as the caveat on ActionOutputs.Categories: a map
  # keyed by catalogue entry id cannot address two nodes that share one.
  - expectedState:
      errors:
        - on: force ${{ steps.add-patrol.forceId }}
          from: se-unit-a/con-min-force
      forces:
        - selectionCount: 1
      engines:
        newrecruit:
          errors:
            - on: force ${{ steps.add-patrol.forceId }}
              from: se-unit-a/con-min-force
            - on: selection se-unit-a
              from: se-unit-a/con-min-force
