id: constraint-min-on-force-linked
category: constraint
description: Min selection constraint scoped to force produces structured error
tags:
  - validation-errors
  - structured-errors
  - design-difference

setup:
  gameSystem:
    categoryEntries:
      - id: cat-troops
        name: Troops
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-fe-troops
            targetId: cat-troops
            name: Troops
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          categoryLinks:
            - id: cl-sea-troops
              targetId: cat-troops
              name: Troops
              primary: true
          constraints:
            - id: con-min-force
              type: min
              value: 2
              field: selections
              scope: force

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  # Auto-select creates 2 Unit A (min=2, scope=force), constraint satisfied
  - expectedState:
      forces:
        - selections:
            - name: Unit A
            - name: Unit A

  # Remove one auto-selected entry (need 2, have 1 → violation). Both Unit A
  # nodes came from ONE entry in ONE step, so [0] and [1] are the only things
  # that tell them apart — written out here rather than left bare, because which
  # of the two this removes is exactly what the assertion below depends on.
  - action: deselectSelection
    forceId: ${{ steps.add-patrol.forceId }}
    selectionId: ${{ steps.add-patrol.selections.se-unit-a[0] }}

  # BattleScribe raises the force-scoped min on the force that counted, and so
  # does NewRecruit — but NewRecruit also raises it a second time on the Unit A
  # that is left, which BattleScribe does not. The override exists for that extra
  # error, not for a disagreement about the first one.
  #
  # That surviving Unit A is [1]: the step auto-added two, the step above removed
  # [0]. Naming it was impossible until #428 — the outputs map held one node per
  # entry id, and the one it held was the one this spec deselects, so the node
  # that remains was the one no step output could name.
  - expectedState:
      errors:
        - on: force ${{ steps.add-patrol.forceId }}
          from: se-unit-a/con-min-force
      forces:
        - selectionCount: 1
      engines:
        newrecruit:
          errors:
            - on: force ${{ steps.add-patrol.forceId }}
              from: se-unit-a/con-min-force
            - on: selection ${{ steps.add-patrol.selections.se-unit-a[1] }}
              from: se-unit-a/con-min-force
