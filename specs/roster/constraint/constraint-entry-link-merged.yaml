id: constraint-entry-link-merged
category: constraint
description: >
  Both the shared selection entry and the entry link define constraints.
  During catalogue expansion, constraints from both sources are merged
  into the expanded copy. Both constraints are evaluated independently —
  the more restrictive one effectively limits selection count.
tags: [design-difference]

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Patrol
  catalogues:
    - id: cat-1
      sharedSelectionEntries:
        - id: shared-unit
          name: Heavy Support
          type: unit
          constraints:
            - id: con-shared-max
              type: max
              value: 4
              field: selections
              scope: roster
              shared: true
      entryLinks:
        - id: link-1
          name: Heavy Support
          targetId: shared-unit
          type: selectionEntry
          constraints:
            - id: con-link-max
              type: max
              value: 2
              field: selections
              scope: force

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: link-1

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: link-1

  # At entry link max=2, below shared max=4 — no errors
  - expectedState:
      forces:
        - selections:
            - name: Heavy Support
            - name: Heavy Support

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: link-1

  # Exceeds entry link max=2 (scope=force) — link's constraint fires
  # even though the shared entry's max=4 is not yet reached.
  #
  # BattleScribe's own message is "(maximum 2)", and 2 is the LINK's limit; the shared entry's
  # max=4 is not reached by 3 selections and cannot be what fired. All three engines now say so.
  # This spec previously expected `shared-unit/con-shared-max` because the in-process adapter
  # answered that, and it was a resolution artefact rather than a behaviour: its message-matching
  # kept the target's kind-matching constraint as a fallback and returned it without ever asking
  # the link, so it named a limit the message rules out. Fixed 2026-08-09 alongside the same
  # defect in the UI driver; `newrecruit` had always reported the link and needed the override
  # that is now gone.
  - expectedState:
      errors:
        - on: selection shared-unit
          from: link-1/con-link-max
      forces:
        - selectionCount: 3
