id: constraint-hidden-violation-linked
category: constraint
description: Hidden entry selection produces structured validation error
tags:
  - validation-errors
  - structured-errors

engines:
  # Hidden at browse time: real desktop BS never displays this entry, so no
  # UI-gesture driver can select it (see issue #309). The in-process engine
  # and the (currently engine-API-backed) bs-ui driver still cover it.
  battlescribe-ui: skip

setup:
  gameSystem:
    categoryEntries:
      - id: cat-troops
        name: Troops
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-fe-troops
            targetId: cat-troops
            name: Troops
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          hidden: true
          categoryLinks:
            - id: cl-sea-troops
              targetId: cat-troops
              name: Troops
              primary: true

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - expectedState:
      forces:
        - selectionCount: 0

  # Selecting a hidden entry — engine allows it but produces validation error
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - expectedState:
      errors:
        - on: selection se-unit-a
          from: se-unit-a/hidden
      forces:
        - selections:
            - name: Unit A
              hidden: true
