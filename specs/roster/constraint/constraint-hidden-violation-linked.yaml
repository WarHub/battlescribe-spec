id: constraint-hidden-violation-linked
category: constraint
description: Hidden entry selection produces structured validation error
tags:
  - validation-errors
  - structured-errors

engines:
  # Hidden at browse time: real desktop BS never displays this entry, so no
  # UI-gesture driver can select it (see issue #309). The in-process engine
  # and the (currently engine-API-backed) bs-ui driver still cover it.
  battlescribe-ui: skip
  # Same reason for NR's web UI: NR never renders a row for a hidden entry either.
  # `fail` rather than `skip` so the spec still RUNS here — if an NR release starts
  # rendering it, that is reported as an unexpected pass instead of going unnoticed.
  newrecruit-ui: fail

setup:
  gameSystem:
    categoryEntries:
      - id: cat-troops
        name: Troops
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-fe-troops
            targetId: cat-troops
            name: Troops
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          hidden: true
          categoryLinks:
            - id: cl-sea-troops
              targetId: cat-troops
              name: Troops
              primary: true

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - expectedState:
      forces:
        - selectionCount: 0

  # Selecting a hidden entry — engine allows it but produces validation error
  - action: selectEntry
    id: select-unit
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  # A hidden violation is placed like an over-limit one, and the engines split
  # the same way: BattleScribe raises it on the force's Troops category — the
  # container that counted a selection it may not have — and NewRecruit on the
  # hidden selection itself ("Unit A cannot be selected while hidden"). Both are
  # recorded rather than one reconstructed into the other.
  - expectedState:
      errors:
        - on: category ${{ steps.add-patrol.categories.cat-troops }}
          from: se-unit-a/hidden
      forces:
        - selections:
            - name: Unit A
              hidden: true
      engines:
        newrecruit:
          errors:
            - on: selection ${{ steps.select-unit.selectionId }}
              from: se-unit-a/hidden
