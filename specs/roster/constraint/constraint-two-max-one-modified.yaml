id: constraint-two-max-one-modified
category: constraint
description: >
  Two max constraints of the same field and scope on one entry, one of them
  moved by a modifier. con-max-plain (max=9) is never violated; con-max-boosted
  is authored max=5 and set to 2, so 3 selections exceed the MODIFIED limit and
  neither authored limit. The violation can therefore only be con-max-boosted's,
  and the error must name it. NewRecruit does; BattleScribe names con-max-plain.
tags:
  - validation-errors
  - structured-errors

setup:
  gameSystem:
    categoryEntries:
      - id: cat-troops
        name: Troops
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-fe-troops
            targetId: cat-troops
            name: Troops
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          categoryLinks:
            - id: cl-sea-troops
              targetId: cat-troops
              name: Troops
              primary: true
          constraints:
            # Declaration order is load-bearing: the UNMODIFIED constraint is first, so a
            # resolver that falls back to iteration order answers with this one. Swapping the
            # two would let the wrong rule return the right id by luck.
            - id: con-max-plain
              type: max
              value: 9
              field: selections
              scope: parent
            - id: con-max-boosted
              type: max
              value: 5
              field: selections
              scope: parent
          modifiers:
            - type: set
              field: con-max-boosted
              value: "2"

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - expectedState:
      forces:
        - selectionCount: 0

  # 2 selections — at the modified limit of con-max-boosted, far under con-max-plain.
  # The first one is named because NewRecruit raises the violation on it; see the last step.
  - action: selectEntry
    id: select-first
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - expectedState:
      forces:
        - selectionCount: 2

  # 3 selections — exceeds the modified max=2 and nothing else. At the authored values
  # (9 and 5) there would be no error at all, so con-max-boosted is the only possible source.
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  # The two engines raise this on different nodes, and the spec says so instead of
  # normalizing one into the other. BattleScribe raises a collective over-limit violation
  # on the container that counted it — the force's Troops CATEGORY node. NewRecruit names
  # a violator — the FIRST of the three Unit A selections. Neither is a reconstruction of
  # the other, and the entry-addressed `on: selection se-unit-a` this used to carry was
  # true of neither: it named a catalogue entry that all three selections share.
  - expectedState:
      errors:
        - on: category ${{ steps.add-patrol.categories.cat-troops }}
          from: se-unit-a/con-max-boosted
      forces:
        - selectionCount: 3
      engines:
        newrecruit:
          errors:
            - on: selection ${{ steps.select-first.selectionId }}
              from: se-unit-a/con-max-boosted
