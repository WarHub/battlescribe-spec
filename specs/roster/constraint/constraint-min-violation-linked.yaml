id: constraint-min-violation-linked
category: constraint
description: Min selection constraint produces structured error with entry and constraint links
tags:
  - validation-errors
  - structured-errors

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    categoryEntries:
      - id: cat-troops
        name: Troops
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-fe-troops
            targetId: cat-troops
            name: Troops
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          categoryLinks:
            - id: cl-sea-troops
              targetId: cat-troops
              name: Troops
              primary: true
          constraints:
            - id: con-min-1
              type: min
              value: 1
              field: selections
              scope: parent

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  # Auto-select creates 1 Unit A (min=1), no errors
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Unit A

  # Remove auto-selected entry to trigger structured min violation error
  - action: deselectSelection
    forceId: ${{ steps.add-patrol.forceId }}
    selectionId: ${{ steps.add-patrol.selections.se-unit-a }}

  - expectedState:
      errors:
        - on: category cat-troops
          from: se-unit-a/con-min-1
      forces:
        - selectionCount: 0
