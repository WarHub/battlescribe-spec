id: constraint-error-owner-link-reached
category: constraint
description: >
  Which element owns a validation error raised inside a selection reached
  through an entry link. Gear's min=2 makes BattleScribe auto-add two, its
  max=1 then fires permanently — a violation raised by the Gear selection
  inside the link-reached Elite Guard. The canonical owner is the selection
  that violated (se-gear); today each engine answers with a different element
  or a different spelling of it, and this spec pins all three. See issue #400.
tags:
  - validation-errors
  - structured-errors

setup:
  gameSystem:
    categoryEntries:
      - id: cat-troops
        name: Troops
    forceEntries:
      - id: fe-1
        name: Patrol
        categoryLinks:
          - id: cl-fe-troops
            targetId: cat-troops
            name: Troops
  catalogues:
    - id: cat-1
      sharedSelectionEntries:
        - id: sse-unit
          name: Elite Guard
          type: unit
          categoryLinks:
            - id: cl-sse-troops
              targetId: cat-troops
              name: Troops
              primary: true
          selectionEntries:
            # min=2 forces auto-add to two; max=1 then fires. The deliberate
            # contradiction makes the violation permanent without further steps.
            - id: se-gear
              name: Gear
              type: upgrade
              constraints:
                - id: con-gear-min
                  type: min
                  value: 2
                  field: selections
                  scope: parent
                - id: con-gear-max
                  type: max
                  value: 1
                  field: selections
                  scope: parent
      entryLinks:
        - id: link-unit
          name: Elite Guard
          targetId: sse-unit
          type: selectionEntry

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-1

  - action: selectEntry
    id: select-unit
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: link-unit

  # Where a link-reached child's over-limit hangs. The two engines genuinely
  # disagree (issue #400), and node addressing sharpens that disagreement from a
  # difference of spelling into a difference of NODE — parent versus child:
  #  - BattleScribe raises it on the PARENT selection, consistent with how it
  #    counts every group/child constraint — the element counting the children.
  #    That parent is the link-reached Elite Guard, the node select-unit created.
  #    Measured 2026-08-13.
  #  - NewRecruit raises it on the violating CHILD selection, the auto-added Gear
  #    inside that Elite Guard. Measured 2026-08-13.
  # The `from` — the constraint and its declaring entry — is not in dispute:
  # both answer se-gear/con-gear-max. Only the raising node differs, and it is
  # declared per engine rather than normalised, because the corpus convention
  # (owner = the counting parent, see collective-constraint-per-model) is
  # BattleScribe's, and moving BattleScribe's answer onto the child to match
  # NewRecruit would contradict every other group/child spec.
  #
  # Both sides of that divergence are now node ids, so the spec states it as one
  # fact rather than two spellings: `selectionId` is the Elite Guard this step
  # created, `selections.se-gear` is the Gear node the engine auto-added inside
  # it. They are different nodes of the same subtree, and each engine names its
  # own. Until #428 the NewRecruit side could not be written at all —
  # NewRecruitRosterEngine.SelectEntry returned only SelectionId and never filled
  # the `selections` map its BattleScribe counterpart does, so the reference
  # resolved against an empty map on that lane ("Available: []").
  - expectedState:
      errors:
        - on: selection ${{ steps.select-unit.selectionId }}
          from: se-gear/con-gear-max
      forces:
        - selectionCount: 1
      engines:
        newrecruit:
          errors:
            - on: selection ${{ steps.select-unit.selections.se-gear }}
              from: se-gear/con-gear-max
