id: constraint-error-owner-link-reached
category: constraint
description: >
  Which element owns a validation error raised inside a selection reached
  through an entry link. Gear's min=2 makes BattleScribe auto-add two, its
  max=1 then fires permanently — a violation raised by the Gear selection
  inside the link-reached Elite Guard. The canonical owner is the selection
  that violated (se-gear); today each engine answers with a different element
  or a different spelling of it, and this spec pins all three. See issue #400.
tags:
  - validation-errors
  - structured-errors

setup:
  gameSystem:
    categoryEntries:
      - id: cat-troops
        name: Troops
    forceEntries:
      - id: fe-1
        name: Patrol
        categoryLinks:
          - id: cl-fe-troops
            targetId: cat-troops
            name: Troops
  catalogues:
    - id: cat-1
      sharedSelectionEntries:
        - id: sse-unit
          name: Elite Guard
          type: unit
          categoryLinks:
            - id: cl-sse-troops
              targetId: cat-troops
              name: Troops
              primary: true
          selectionEntries:
            # min=2 forces auto-add to two; max=1 then fires. The deliberate
            # contradiction makes the violation permanent without further steps.
            - id: se-gear
              name: Gear
              type: upgrade
              constraints:
                - id: con-gear-min
                  type: min
                  value: 2
                  field: selections
                  scope: parent
                - id: con-gear-max
                  type: max
                  value: 1
                  field: selections
                  scope: parent
      entryLinks:
        - id: link-unit
          name: Elite Guard
          targetId: sse-unit
          type: selectionEntry

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-1

  - action: selectEntry
    id: select-unit
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: link-unit

  # Where a link-reached child's over-limit hangs. The two engines genuinely
  # disagree (issue #400), and that disagreement is the finding this spec pins:
  #  - BattleScribe owns it on the PARENT selection, consistent with how it owns
  #    every group/child constraint — the element counting the children. That
  #    parent is the link-reached Elite Guard, addressed by its target entry
  #    sse-unit (the link route is reduced away, the one shared reduction both
  #    lanes apply). Measured 2026-08-13: `selection sse-unit <-
  #    se-gear/con-gear-max`.
  #  - NewRecruit owns it on the violating child selection se-gear. Measured
  #    2026-08-13: `selection se-gear <- se-gear/con-gear-max`.
  # The `from` — the constraint and its declaring entry — is not in dispute:
  # both answer se-gear/con-gear-max. Only the owner differs, and it is declared
  # per engine rather than normalised, because the corpus convention (owner =
  # the counting parent, see collective-constraint-per-model) is BattleScribe's,
  # and moving BattleScribe's owner onto the child to match NewRecruit would
  # contradict every other group/child spec.
  - expectedState:
      errors:
        - on: selection sse-unit
          from: se-gear/con-gear-max
      forces:
        - selectionCount: 1
      engines:
        newrecruit:
          errors:
            - on: selection se-gear
              from: se-gear/con-gear-max
