id: constraint-errors-contain
category: constraint
description: errorsContain asserts subset of errors without requiring exact match

setup:
  gameSystem:
    categoryEntries:
      - id: cat-troops
        name: Troops
      - id: cat-hq
        name: HQ
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-fe-troops
            targetId: cat-troops
            name: Troops
          - id: cl-fe-hq
            targetId: cat-hq
            name: HQ
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          categoryLinks:
            - id: cl-sea-troops
              targetId: cat-troops
              name: Troops
              primary: true
          constraints:
            - id: con-min-troops
              type: min
              value: 1
              field: selections
              scope: parent
        - id: se-hq
          name: HQ Unit
          type: unit
          categoryLinks:
            - id: cl-hq
              targetId: cat-hq
              name: HQ
              primary: true
          constraints:
            - id: con-min-hq
              type: min
              value: 1
              field: selections
              scope: parent

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  # Auto-select satisfies min constraints. Remove all to trigger violations.
  - action: deselectSelection
    forceId: ${{ steps.add-patrol.forceId }}
    selectionId: ${{ steps.add-patrol.selections.se-unit-a }}

  - action: deselectSelection
    forceId: ${{ steps.add-patrol.forceId }}
    selectionId: ${{ steps.add-patrol.selections.se-hq }}

  # errorsContain: assert only one of the two errors, ignoring the other
  - expectedState:
      errorsContain:
        - on: category ${{ steps.add-patrol.categories.cat-troops }}
          from: se-unit-a/con-min-troops
      forces:
        - selectionCount: 0
