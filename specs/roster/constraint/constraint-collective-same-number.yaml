id: constraint-collective-same-number
category: constraint
description: >
  BattleScribe's collective bookkeeping error: with two Squad selections of one
  entry and a collective Weapon child added to only one of them, the app
  reports that all Squads must have the same number of Weapon selections. The
  error is engine-raised with no authored constraint behind it — the spec pins
  which element carries it and how it is identified.
tags:
  - validation-errors
  - structured-errors

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          selectionEntries:
            - id: se-weapon
              name: Weapon
              type: upgrade
              collective: true

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    id: select-squad-1
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad

  - action: selectEntry
    id: select-squad-2
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad

  - action: selectChildEntry
    id: select-weapon
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-squad-1.selectionId }}
    entryId: se-weapon

  # The error belongs to the Squad whose Weapon count is uneven — the FIRST one,
  # the Squad the Weapon was added to, not the second. Both are selections of
  # se-squad, so the entry-addressed form this used to carry could not say which
  # and passed on either. `se-weapon` is the entry the count is OF, and
  # `collective` is a reserved pseudo-constraint like `hidden` — the engine
  # raises this bookkeeping error with no authored constraint behind it, and its
  # identity is read from the captured error id (third segment "collective"), not
  # the text. NewRecruit has no equivalent bookkeeping: it raises nothing here,
  # measured 2026-08-13 — declared as an empty error set rather than left to look
  # like a missed assertion.
  - expectedState:
      errors:
        - on: selection ${{ steps.select-squad-1.selectionId }}
          from: se-weapon/collective
      forces:
        - selectionCount: 2
      engines:
        newrecruit:
          errors: []
