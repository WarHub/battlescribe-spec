id: constraint-cost-max-linked
category: constraint
description: Max cost constraint produces structured error with entry and constraint links
tags:
  - validation-errors
  - structured-errors

setup:
  gameSystem:
    costTypes:
      - id: ct-pts
        name: pts
        defaultCostLimit: 9999
    categoryEntries:
      - id: cat-troops
        name: Troops
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-fe-troops
            targetId: cat-troops
            name: Troops
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          costs:
            - name: pts
              typeId: ct-pts
              value: 100
          categoryLinks:
            - id: cl-sea-troops
              targetId: cat-troops
              name: Troops
              primary: true
          constraints:
            - id: con-cost-max
              type: max
              value: 50
              field: ct-pts
              scope: parent

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - expectedState:
      forces:
        - selectionCount: 0

  # Unit A costs 100 pts, exceeding max cost constraint of 50
  - action: selectEntry
    id: select-unit
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  # A cost constraint over its limit is placed like any other over-limit
  # violation: BattleScribe raises it on the category that counted the cost,
  # NewRecruit on the selection that carries it. Both are recorded.
  - expectedState:
      errors:
        - on: category ${{ steps.add-patrol.categories.cat-troops }}
          from: se-unit-a/con-cost-max
      forces:
        - selections:
            - name: Unit A
      engines:
        newrecruit:
          errors:
            - on: selection ${{ steps.select-unit.selectionId }}
              from: se-unit-a/con-cost-max
