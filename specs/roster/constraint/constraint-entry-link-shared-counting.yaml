id: constraint-entry-link-shared-counting
category: constraint
description: >
  Two entry links reference the same shared selection entry which has a
  shared max constraint. The shared=true flag causes the engine to count
  selections by sharedEntryId across all expanded entry links, so selecting
  from either link counts toward the shared limit.

setup:
  gameSystem:
    categoryEntries:
      - id: cat-troops
        name: Troops
    forceEntries:
      - id: fe-1
        name: Patrol
        categoryLinks:
          - targetId: cat-troops
  catalogues:
    - id: cat-1
      sharedSelectionEntries:
        - id: shared-unit
          name: Tactical Squad
          type: unit
          categoryLinks:
            - targetId: cat-troops
              primary: true
          constraints:
            - id: con-max-shared
              type: max
              value: 3
              field: selections
              scope: roster
              shared: true
      entryLinks:
        - id: link-alpha
          name: Alpha Tactical
          targetId: shared-unit
          type: selectionEntry
        - id: link-beta
          name: Beta Tactical
          targetId: shared-unit
          type: selectionEntry

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-1

  # Select 2 from first entry link (link-alpha = entryIndex 0). The first is
  # named: NewRecruit raises the shared over-limit on it — see the last step.
  - action: selectEntry
    id: select-alpha-1
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: link-alpha

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: link-alpha

  # 2 selections via link-alpha — below shared max=3
  - expectedState:
      forces:
        - selectionCount: 2

  # Select 1 from second entry link (link-beta = entryIndex 1)
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: link-beta

  # 3 total (2 from alpha + 1 from beta) — at shared limit, no errors
  - expectedState:
      forces:
        - selectionCount: 3

  # Select 1 more from second entry link
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: link-beta

  # 4 total — shared counting exceeds max=3, constraint fires.
  # The constraint is scope=roster, and BattleScribe raises it on the ROSTER, the
  # node whose scope did the counting. `on: roster` is bare: RosterState carries
  # no id on any lane, and there is exactly one roster.
  # NewRecruit names a violator, and it is the first ALPHA selection — not the
  # Beta one whose arrival broke the limit.
  - expectedState:
      errors:
        - on: roster
          from: shared-unit/con-max-shared
      forces:
        - selectionCount: 4
      engines:
        newrecruit:
          errors:
            - on: selection ${{ steps.select-alpha-1.selectionId }}
              from: shared-unit/con-max-shared
