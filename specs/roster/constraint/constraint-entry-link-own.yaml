id: constraint-entry-link-own
category: constraint
description: >
  Constraint defined directly on an entry link (not on its shared target)
  is enforced during validation. During catalogue expansion, the engine
  merges the entry link's constraints into the expanded copy alongside
  any constraints from the shared entry.

setup:
  gameSystem:
    forceEntries:
      - id: fe-1
        name: Patrol
  catalogues:
    - id: cat-1
      sharedSelectionEntries:
        - id: shared-unit
          name: Strike Team
          type: unit
      entryLinks:
        - id: link-1
          name: Strike Team
          targetId: shared-unit
          type: selectionEntry
          constraints:
            - id: con-link-max
              type: max
              value: 2
              field: selections
              scope: force

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-1

  # The first is named because NewRecruit raises the over-limit on it; see the
  # last step.
  - action: selectEntry
    id: select-first
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: link-1

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: link-1

  # At max=2 limit — no errors
  - expectedState:
      forces:
        - selections:
            - name: Strike Team
            - name: Strike Team

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: link-1

  # Exceeds max=2 — entry link's constraint (scope=force) fires. BattleScribe
  # raises it on the FORCE that did the counting; NewRecruit names a violator,
  # the first of the three Strike Team selections.
  - expectedState:
      errors:
        - on: force ${{ steps.add-patrol.forceId }}
          from: link-1/con-link-max
      forces:
        - selectionCount: 3
      engines:
        newrecruit:
          errors:
            - on: selection ${{ steps.select-first.selectionId }}
              from: link-1/con-link-max
