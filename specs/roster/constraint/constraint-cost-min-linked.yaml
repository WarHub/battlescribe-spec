id: constraint-cost-min-linked
category: constraint
description: Min cost constraint produces structured error with entry and constraint links
tags:
  - validation-errors
  - structured-errors

setup:
  gameSystem:
    costTypes:
      - id: ct-pts
        name: pts
        defaultCostLimit: 9999
    categoryEntries:
      - id: cat-troops
        name: Troops
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-fe-troops
            targetId: cat-troops
            name: Troops
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          costs:
            - name: pts
              typeId: ct-pts
              value: 10
          categoryLinks:
            - id: cl-sea-troops
              targetId: cat-troops
              name: Troops
              primary: true
          constraints:
            - id: con-cost-min
              type: min
              value: 50
              field: ct-pts
              scope: parent

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - expectedState:
      errors:
        - on: category ${{ steps.add-patrol.categories.cat-troops }}
          from: se-unit-a/con-cost-min
      forces:
        - selectionCount: 0

  # Unit A costs 10 pts, below min cost constraint of 50
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - expectedState:
      errors:
        - on: category ${{ steps.add-patrol.categories.cat-troops }}
          from: se-unit-a/con-cost-min
      forces:
        - selections:
            - name: Unit A
