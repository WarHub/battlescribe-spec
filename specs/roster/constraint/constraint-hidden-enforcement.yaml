id: constraint-hidden-enforcement
category: constraint
description: Hidden entries are not shown to users but constraints still apply to them

setup:
  gameSystem:
    categoryEntries:
      - id: ce-troops
        name: Troops
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-fe-troops
            targetId: ce-troops
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-visible
          name: Visible Unit
          type: unit
          categoryLinks:
            - id: cl-vis-troops
              targetId: ce-troops
              primary: true
        - id: se-hidden
          name: Hidden Unit
          type: unit
          hidden: true
          categoryLinks:
            - id: cl-hid-troops
              targetId: ce-troops
              primary: true
          constraints:
            - id: con-min
              type: min
              value: 1
              field: selections
              scope: parent

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  # Hidden Unit auto-selected (min=1 constraint) — hidden from user but enforced by engine.
  # The hidden entry error is produced immediately because the constraint is unsatisfied.
  # BattleScribe raises it on the force's Troops CATEGORY — the container that
  # counted the selections it may not have — not on the hidden selection itself.
  - expectedState:
      errors:
        - on: category ${{ steps.add-patrol.categories.ce-troops }}
          from: se-hidden/hidden
      forces:
        - selections:
            - name: Hidden Unit
              hidden: true
      engines:
        # NR doesn't auto-select hidden entries, so no selection and no error
        newrecruit:
          forces:
            - selectionCount: 0
          errors: []

  # Manually add Visible Unit
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-visible

  - expectedState:
      errors:
        - on: category ${{ steps.add-patrol.categories.ce-troops }}
          from: se-hidden/hidden
      forces:
        - selections:
            - name: Hidden Unit
              hidden: true
            - name: Visible Unit
      engines:
        # NR only has the manually-selected Visible Unit
        newrecruit:
          forces:
            - selections:
                - name: Visible Unit
          errors: []
