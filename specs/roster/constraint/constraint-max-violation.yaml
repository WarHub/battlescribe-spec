id: constraint-max-violation
category: constraint
description: >
  Selecting more than max constraint on an uncategorised entry doesn't produce
  validation errors in BS. The constraint validation filter at f.java:493 skips
  parent-scope constraints when the entry has no category links.
  Compare with constraint-max-violation-linked which has category links and
  works correctly on both engines — proving the bug is specifically about
  uncategorised entries.
tags: [battlescribe-bug]

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          constraints:
            - id: con-max-1
              type: max
              value: 1
              field: selections
              scope: parent

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - expectedState:
      forces:
        - selectionCount: 0

  # 1 selection — at max=1 limit
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - expectedState:
      forces:
        - selectionCount: 1

  # Exceeding max=1 should produce a validation error.
  # BS bug: the constraint validation filter (f.java:493) skips uncategorised
  # parent-scope entries, so no error is generated.
  # The same constraint WITH categories works correctly — see
  # constraint-max-violation-linked which passes on both engines.
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - expectedState:
      errors:
        - on: selection se-unit-a
          from: se-unit-a/con-max-1
      forces:
        - selectionCount: 2
      engines:
        battlescribe:
          errors: []
