id: constraint-min-uncategorised-skipped
category: constraint
description: Parent-scope min constraint on an uncategorised entry is expected to remain non-validating

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          constraints:
            - id: con-min-1
              type: min
              value: 1
              field: selections
              scope: parent

steps:
  - action: addForce
    forceEntryId: fe-patrol

  # Auto-select creates 1 Unit A (min=1 still triggers auto-select even without categories).
  # With no category wiring, entry resolves to "(No Category)" which is skipped
  # by validation traversal — so the min constraint produces no error.
  - expectedState:
      forces:
        - selections:
            - name: Unit A
