id: constraint-cost-limit-linked
category: constraint
description: Roster cost limit violation produces structured error owned by roster
tags:
  - validation-errors
  - structured-errors

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    costTypes:
      - id: ct-pts
        name: pts
        defaultCostLimit: 100
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          costs:
            - name: pts
              typeId: ct-pts
              value: 150

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - expectedState:
      forces:
        - selectionCount: 0

  # Unit A costs 150 pts, exceeding 100 pts roster cost limit
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - expectedState:
      errors:
        - on: roster
          from: costLimits/ct-pts
      forces:
        - selections:
            - name: Unit A
