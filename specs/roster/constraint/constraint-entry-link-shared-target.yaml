id: constraint-entry-link-shared-target
category: constraint
description: >
  Constraint on a shared selection entry is enforced on selections created
  via entry link. During catalogue expansion, the engine copies the shared
  entry (including its constraints) into a new entry keyed by the entry link.
  The constraint is evaluated on selections of that expanded entry.

setup:
  gameSystem:
    categoryEntries:
      - id: cat-troops
        name: Troops
    forceEntries:
      - id: fe-1
        name: Patrol
        categoryLinks:
          - targetId: cat-troops
  catalogues:
    - id: cat-1
      sharedSelectionEntries:
        - id: shared-unit
          name: Elite Guard
          type: unit
          categoryLinks:
            - targetId: cat-troops
              primary: true
          constraints:
            - id: con-max
              type: max
              value: 2
              field: selections
              scope: roster
              shared: true
      entryLinks:
        - id: link-1
          name: Elite Guard
          targetId: shared-unit
          type: selectionEntry

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-1

  # The first is named because NewRecruit raises the over-limit on it; see the
  # last step.
  - action: selectEntry
    id: select-first
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: link-1

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: link-1

  # Two selections — at the max=2 limit, no errors
  - expectedState:
      forces:
        - selections:
            - name: Elite Guard
            - name: Elite Guard

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: link-1

  # Three selections — exceeds max=2, constraint fires. It is scope=roster, so
  # BattleScribe raises it on the ROSTER that counted, written bare because
  # nothing gives that node an id a spec can name. NewRecruit names a violator —
  # the first of the three Elite Guards.
  - expectedState:
      errors:
        - on: roster
          from: shared-unit/con-max
      forces:
        - selectionCount: 3
      engines:
        newrecruit:
          errors:
            - on: selection ${{ steps.select-first.selectionId }}
              from: shared-unit/con-max
