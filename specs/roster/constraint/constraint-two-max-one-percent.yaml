id: constraint-two-max-one-percent
category: constraint
description: >
  Two max constraints of the same field and scope on one entry, one of them a
  percentValue. con-max-plain (max=9) is never violated; con-max-percent is 50%
  of parent selections, so a single selection exceeds its threshold of 0.50.
  The violation can therefore only be con-max-percent's, and the error must
  name it.
tags:
  - validation-errors
  - structured-errors

setup:
  gameSystem:
    categoryEntries:
      - id: cat-troops
        name: Troops
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-fe-troops
            targetId: cat-troops
            name: Troops
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          categoryLinks:
            - id: cl-sea-troops
              targetId: cat-troops
              name: Troops
              primary: true
          constraints:
            # Declaration order is load-bearing: the plain constraint is first, so a
            # resolver that falls back to iteration order answers with this one.
            - id: con-max-plain
              type: max
              value: 9
              field: selections
              scope: parent
            - id: con-max-percent
              type: max
              value: 50
              field: selections
              scope: parent
              percentValue: true

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - expectedState:
      forces:
        - selectionCount: 0

  # 1 selection — exceeds 50% of 1 = 0.50, and nothing else. con-max-plain's
  # limit of 9 is not approached, so con-max-percent is the only possible source.
  - action: selectEntry
    id: select-first
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  # Which constraint is named is the claim; where it is raised is the other half.
  # BattleScribe raises it on the Troops category that counted, NewRecruit on the
  # one Unit A selection. Both name con-max-percent, which is the thing under
  # test, and the two nodes are recorded rather than normalised.
  - expectedState:
      errors:
        - on: category ${{ steps.add-patrol.categories.cat-troops }}
          from: se-unit-a/con-max-percent
      forces:
        - selectionCount: 1
      engines:
        newrecruit:
          errors:
            - on: selection ${{ steps.select-first.selectionId }}
              from: se-unit-a/con-max-percent
