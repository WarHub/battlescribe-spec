id: constraint-include-child-forces
category: constraint
description: Constraint with includeChildForces counts selections across parent and child forces
tags: [newrecruit-bug]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-army
        name: Army
        forceEntries:
          - id: fe-detach
            name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          constraints:
            - id: con-1
              type: max
              value: 2
              field: selections
              scope: force
              includeChildForces: true

steps:
  - action: addForce
    id: add-army
    forceEntryId: fe-army

  - action: addChildForce
    id: add-detachment
    forceId: ${{ steps.add-army.forceId }}
    forceEntryId: fe-detach

  - action: selectEntry
    forceId: ${{ steps.add-army.forceId }}
    entryId: se-squad

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad

  # 1 Squad in Army + 1 in Detachment = 2 total (at max=2 from Army's perspective)
  - expectedState:
      forces:
        - name: Army
          selections:
            - name: Squad
          childForces:
            - name: Detachment
              selections:
                - name: Squad

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad

  # 1 in Army + 2 in Detachment = 3 total — exceeds max=2.
  # includeChildForces traverses into Detachment to count its Squads too.
  - expectedState:
      errors:
        - on: selection se-squad
          from: se-squad/con-1
      forces:
        - name: Army
          selectionCount: 1
          childForces:
            - selectionCount: 2
      engines:
        newrecruit:
          errors: []
