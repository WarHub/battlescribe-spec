id: constraint-two-max-equal-limits
category: constraint
description: >
  Two max constraints of the same field and scope on one entry with the SAME
  limit. 3 selections violate both, and each violation renders the same element
  name, entry name, kind word and number — so the two errors differ in no
  character at all. One error per violated constraint, each naming its own, is
  what the engine knows; the rendered text cannot carry it.
tags:
  - validation-errors
  - structured-errors

setup:
  gameSystem:
    categoryEntries:
      - id: cat-troops
        name: Troops
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-fe-troops
            targetId: cat-troops
            name: Troops
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          categoryLinks:
            - id: cl-sea-troops
              targetId: cat-troops
              name: Troops
              primary: true
          constraints:
            - id: con-max-alpha
              type: max
              value: 2
              field: selections
              scope: parent
            - id: con-max-beta
              type: max
              value: 2
              field: selections
              scope: parent

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - expectedState:
      forces:
        - selectionCount: 0

  # 2 selections — at both limits, neither exceeded. The first is named because
  # NewRecruit raises its one error on it; see the last step.
  - action: selectEntry
    id: select-first
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - expectedState:
      forces:
        - selectionCount: 2

  # 3 selections — exceeds both. `messageContains` is the closest the harness comes to asserting
  # the two texts are the same: it pins both errors to the same quoted limit.
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  # BattleScribe raises both on the SAME node — the force's Troops category, the
  # container that counted — so the two errors are separated by their constraint
  # ids alone. That is the point of the spec, and it is why node addressing does
  # not make every error individually identifying.
  - expectedState:
      errors:
        - on: category ${{ steps.add-patrol.categories.cat-troops }}
          from: se-unit-a/con-max-alpha
          messageContains: maximum 2
        - on: category ${{ steps.add-patrol.categories.cat-troops }}
          from: se-unit-a/con-max-beta
          messageContains: maximum 2
      forces:
        - selectionCount: 3
      engines:
        # NewRecruit names the constraint correctly — it reads e.constraint.id rather than the
        # text — but emits ONE error for the pair, not two. Measured 2026-08-12: a single
        # `se-unit-a/con-max-alpha` reading "Troops has 1 selections too many of Unit A (max 2)".
        # The collapse tracks message identity, not the constraint count: the control run with
        # limits 2 and 1 on the same entry produced two errors naming both constraints. Which of
        # the pair survives is not asserted beyond the one NR reports — nothing in the data
        # privileges alpha over beta except declaration order.
        # It raises that one on the first of the three Unit A selections, not on
        # the category BattleScribe answers with.
        newrecruit:
          errors:
            - on: selection ${{ steps.select-first.selectionId }}
              from: se-unit-a/con-max-alpha
              messageContains: max 2
