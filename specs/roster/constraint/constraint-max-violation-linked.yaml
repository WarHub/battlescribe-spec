id: constraint-max-violation-linked
category: constraint
description: Max selection constraint produces structured error with entry and constraint links
tags:
  - validation-errors
  - structured-errors

setup:
  gameSystem:
    categoryEntries:
      - id: cat-troops
        name: Troops
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-fe-troops
            targetId: cat-troops
            name: Troops
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          categoryLinks:
            - id: cl-sea-troops
              targetId: cat-troops
              name: Troops
              primary: true
          constraints:
            - id: con-max-1
              type: max
              value: 1
              field: selections
              scope: parent

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - expectedState:
      forces:
        - selectionCount: 0

  # 1 selection — at max=1 limit, no error. Named because NewRecruit raises the
  # over-limit on the first of the two Unit A selections; see the last step.
  - action: selectEntry
    id: select-first
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - expectedState:
      forces:
        - selectionCount: 1

  # 2 selections — exceeds max=1, structured error
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  # The engines raise this on different nodes and the spec records both.
  # BattleScribe raises a collective over-limit on the container that counted —
  # the force's Troops category. NewRecruit names a violator — the first of the
  # two Unit A selections. Neither is a reconstruction of the other.
  - expectedState:
      errors:
        - on: category ${{ steps.add-patrol.categories.cat-troops }}
          from: se-unit-a/con-max-1
      forces:
        - selectionCount: 2
      engines:
        newrecruit:
          errors:
            - on: selection ${{ steps.select-first.selectionId }}
              from: se-unit-a/con-max-1
