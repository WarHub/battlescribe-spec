id: constraint-max-violation-linked
category: constraint
description: Max selection constraint produces structured error with entry and constraint links
tags:
  - validation-errors
  - structured-errors

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    categoryEntries:
      - id: cat-troops
        name: Troops
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-fe-troops
            targetId: cat-troops
            name: Troops
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          categoryLinks:
            - id: cl-sea-troops
              targetId: cat-troops
              name: Troops
              primary: true
          constraints:
            - id: con-max-1
              type: max
              value: 1
              field: selections
              scope: parent

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - expectedState:
      forces:
        - selectionCount: 0

  # 1 selection — at max=1 limit, no error
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - expectedState:
      forces:
        - selectionCount: 1

  # 2 selections — exceeds max=1, structured error
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - expectedState:
      errors:
        - on: selection se-unit-a
          from: se-unit-a/con-max-1
      forces:
        - selectionCount: 2
