id: constraint-forces-field
category: constraint
description: >
  Constraint with field=forces on a SelectionEntry always counts 0 forces
  because the child filter resolves to the owning SelectionEntry (not a ForceEntry),
  so force matching fails. An atLeast 1 constraint is therefore always violated.
tags: [newrecruit-bug]

setup:
  gameSystem:
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      selectionEntries:
        - id: se-unit
          name: Unit A
          type: unit
          constraints:
            - id: con-force-field
              type: min
              value: 1
              field: forces
              scope: roster

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - expectedState:
      errors:
        - on: roster
          from: se-unit/con-force-field
      forces:
        - selectionCount: 0
      # No selections yet, but the min 1 field=forces constraint on the entry
      # is evaluated. Because the owning entry is a SelectionEntry (not ForceEntry),
      # force count is always 0 → validation error.
      engines:
        # NR auto-selects the entry and doesn't evaluate field=forces constraints
        newrecruit:
          forces:
            - selections:
                - name: Unit A
          errors: []

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit

  # Even after selecting, the constraint still counts forces (not selections).
  # Force count is still 0 → validation error persists.
  - expectedState:
      errors:
        - on: roster
          from: se-unit/con-force-field
      forces:
        - selections:
            - name: Unit A
      engines:
        # NR: 2 selections (auto-selected + manually selected), no force-field errors
        newrecruit:
          forces:
            - selections:
                - name: Unit A
                - name: Unit A
          errors: []
