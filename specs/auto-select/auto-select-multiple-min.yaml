id: auto-select-multiple-min
category: auto-select
description: Root entry with min=3 is auto-selected with number=3 after addForce
tags: [auto-select, constraint, min]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-troop
          name: Trooper
          type: model
          constraints:
            - id: con-min
              type: min
              value: 3
              field: selections
              scope: parent
            - id: con-max
              type: max
              value: 10
              field: selections
              scope: parent

steps:
  - action: addForce
    forceEntryIndex: 0

  # Entry with min=3 is auto-selected; the engine creates 3 separate
  # selections, each with number=1.
  - expectedState:
      forces:
        - selectionCount: 3
          selections:
            - name: Trooper
              type: model
              number: 1
            - name: Trooper
              type: model
              number: 1
            - name: Trooper
              type: model
              number: 1
