id: deep-group-nesting-with-links
category: deep-nesting
description: >
  Realistic 4-5 level deep hierarchy common in Warhammer 40k data:
  Unit (selectionEntry) → Equipment group (min=1 + defaultSelectionEntryId) →
  Weapon (entryLink → sharedEntry) → Weapon Options group
  (min=1 + defaultSelectionEntryId) → option entry. Groups use min=1
  constraints to force selection and defaultSelectionEntryId to pick which
  entry. Tests deeply nested structures with links and defaults at depth.
tags: [deep-nesting, entryLink, nested, defaultSelectionEntryId]
engines:
  newrecruit: fail

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      sharedSelectionEntries:
        - id: sse-bolter
          name: Bolter
          type: upgrade
          costs:
            - name: pts
              typeId: pts
              value: 0
          selectionEntryGroups:
            - id: seg-bolter-opts
              name: Bolter Modifications
              defaultSelectionEntryId: se-scope
              constraints:
                - id: con-mod-min
                  type: min
                  value: 1
                  field: selections
                  scope: parent
              selectionEntries:
                - id: se-scope
                  name: Targeting Scope
                  type: upgrade
                  costs:
                    - name: pts
                      typeId: pts
                      value: 5
                - id: se-drum
                  name: Extended Drum
                  type: upgrade
                  costs:
                    - name: pts
                      typeId: pts
                      value: 3
      selectionEntries:
        - id: se-marine
          name: Space Marine
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 20
          selectionEntryGroups:
            - id: seg-equipment
              name: Wargear
              defaultSelectionEntryId: el-bolter
              constraints:
                - id: con-wargear-min
                  type: min
                  value: 1
                  field: selections
                  scope: parent
              entryLinks:
                - id: el-bolter
                  targetId: sse-bolter
                  type: selectionEntry

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  # Space Marine selected →
  # Wargear group (min=1, default=el-bolter) → Bolter auto-selects →
  # Bolter Modifications group (min=1, default=se-scope) → Targeting Scope auto-selects.
  # Depth: unit → group → link → sharedEntry → group → entry (5 levels)
  # Costs: Marine 20 + Bolter 0 + Scope 5 = 25
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Space Marine
              type: unit
              children:
                - name: Bolter
                  type: upgrade
                  children:
                    - name: Targeting Scope
                      type: upgrade
      costs:
        - typeId: pts
          value: 25
