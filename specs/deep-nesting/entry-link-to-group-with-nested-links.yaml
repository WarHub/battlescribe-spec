id: entry-link-to-group-with-nested-links
category: deep-nesting
description: >
  An entry link targets a shared selection entry that contains both an
  inline child (min=1) and a nested entry link (min=1) to another shared
  entry. Selecting the unit and then the linked parent auto-populates
  the nested children, testing multi-hop link resolution at depth.
tags: [deep-nesting, entryLink]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      sharedSelectionEntries:
        - id: sse-special-ammo
          name: Special Ammo
          type: upgrade
          costs:
            - name: pts
              typeId: pts
              value: 3
        - id: sse-weapon-bay
          name: Weapon Bay
          type: upgrade
          costs:
            - name: pts
              typeId: pts
              value: 5
          selectionEntries:
            - id: se-blade
              name: Combat Blade
              type: upgrade
              costs:
                - name: pts
                  typeId: pts
                  value: 2
              constraints:
                - id: con-blade-min
                  type: min
                  value: 1
                  field: selections
                  scope: parent
          entryLinks:
            - id: el-ammo
              targetId: sse-special-ammo
              type: selectionEntry
              constraints:
                - id: con-ammo-min
                  type: min
                  value: 1
                  field: selections
                  scope: parent
      selectionEntries:
        - id: se-unit
          name: Heavy Trooper
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 20
          entryLinks:
            - id: el-weapons
              targetId: sse-weapon-bay
              type: selectionEntry

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  # Select the linked Weapon Bay child under Heavy Trooper.
  - action: selectChildEntry
    forceIndex: 0
    selectionIndex: 0
    childEntryIndex: 0

  # Heavy Trooper → Weapon Bay → Combat Blade (min=1) + Special Ammo (min=1, via link).
  # Costs: Trooper 20 + Bay 5 + Blade 2 + Ammo 3 = 30
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Heavy Trooper
              type: unit
              children:
                - name: Weapon Bay
                  type: upgrade
                  children:
                    - name: Combat Blade
                      type: upgrade
                    - name: Special Ammo
                      type: upgrade
      costs:
        - typeId: pts
          value: 30
