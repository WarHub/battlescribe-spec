id: modifier-number-decrement
category: modifier
description: Number decrement modifier reduces a numeric (cost) field value

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
        defaultCostLimit: -1
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Discounted Unit
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 100
          modifiers:
            - type: decrement
              field: pts
              value: "30"

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  # Number decrement: 100 - 30 = 70
  - expectedState:
      forces:
        - selections:
            - name: Discounted Unit
      costs:
        - typeId: pts
          value: 70.0
