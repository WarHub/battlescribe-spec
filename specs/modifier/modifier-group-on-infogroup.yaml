id: modifier-group-on-infogroup
category: modifier
tags: [modifierGroup, infoGroup, undefined-behavior]
description: ModifierGroup on an infoGroup modifies contained profile characteristic
engines:
  battlescribe: fail
  newrecruit: fail

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
    profileTypes:
      - id: pt-stats
        name: Combat Stats
        characteristicTypes:
          - id: ct-atk
            name: Attacks
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Fighter
          type: unit
          infoGroups:
            - id: ig-1
              name: Combat Info
              modifierGroups:
                - modifiers:
                    - type: set
                      field: ct-atk
                      value: "5"
              profiles:
                - id: prof-1
                  name: Fighter Stats
                  typeId: pt-stats
                  typeName: Combat Stats
                  characteristics:
                    - name: Attacks
                      typeId: ct-atk
                      value: "3"

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      forces:
        - selections:
            - name: Fighter
              profiles:
                - name: Fighter Stats
                  characteristics:
                    - name: Attacks
                      value: "5"
