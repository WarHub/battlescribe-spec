id: modifier-on-profile
category: modifier
description: Modifiers can be applied to profiles and rules (BaseInfo elements), not just entries
tags: []

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
    profileTypes:
      - id: stat-type
        name: Unit Stats
        characteristicTypes:
          - id: char-attacks
            name: Attacks
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Marine
          type: unit
          profiles:
            - id: prof-1
              name: Marine Stats
              typeId: stat-type
              typeName: Unit Stats
              characteristics:
                - name: Attacks
                  typeId: char-attacks
                  value: "1"
              modifiers:
                - type: increment
                  field: char-attacks
                  value: "1"
          rules:
            - id: rule-1
              name: Rapid Fire
              description: Base description
              modifiers:
                - type: append
                  field: description
                  value: (enhanced)

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  - expectedState:
      forces:
        - selections:
            - name: Marine
              profiles:
                - name: Marine Stats
                  characteristics:
                    - name: Attacks
                      value: "2"
              rules:
                - name: Rapid Fire
                  description: "Base description (enhanced)"
