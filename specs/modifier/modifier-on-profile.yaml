id: modifier-on-profile
category: modifier
description: Modifiers can be applied to profiles and rules (BaseInfo elements), not just entries
tags:
  - known-limitation-synthetic

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogue:
    id: cat-1
    name: Cat
    gameSystemId: test-gs
    selectionEntries:
      - id: se-1
        name: Marine
        type: unit
        profiles:
          - id: prof-1
            name: Marine Stats
            typeId: stat-type
            typeName: Unit Stats
            characteristics:
              - name: Attacks
                typeId: char-attacks
                value: "1"
            modifiers:
              - type: increment
                field: char-attacks
                value: "1"
        rules:
          - id: rule-1
            name: Rapid Fire
            description: Base description
            modifiers:
              - type: append
                field: description
                value: (enhanced)

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  # Both profile and rule have their own modifiers.
  # Profile modifier: increment char-attacks from 1 to 2
  # Rule modifier: append "(enhanced)" to description
  # With synthetic data, these modifiers on BaseInfo may not be evaluated.
  - expectedState:
      forces:
        - selections:
            - name: Marine
