id: modifier-category-unset-primary
category: modifier
description: Category unset-primary modifier removes primary status from a category on the selection
tags: []

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    categoryEntries:
      - id: cat-hq
        name: HQ
    forceEntries:
      - id: fe-1
        name: Detachment
        categoryLinks:
          - id: cl-fe-hq
            targetId: cat-hq
            name: HQ
            primary: false
  catalogue:
    id: cat-1
    name: Cat
    gameSystemId: test-gs
    selectionEntries:
      - id: se-1
        name: Commander
        type: unit
        categoryLinks:
          - id: cl-1
            targetId: cat-hq
            name: HQ
            primary: true
        modifiers:
          - type: unset-primary
            field: category
            value: cat-hq

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Commander
              categories:
                - name: HQ
                  primary: false
