id: modifier-repeat-round-down
category: modifier
description: Repeat with roundUp=false (default) rounds fractional repeat count down (Math.floor)

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
        defaultCostLimit: -1
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogue:
    id: cat-1
    name: Cat
    gameSystemId: test-gs
    selectionEntries:
      - id: se-1
        name: Squad
        type: unit
        costs:
          - name: pts
            typeId: pts
            value: 50
        modifiers:
          - type: increment
            field: pts
            value: "10"
            repeats:
              - value: 3
                repeats: 1
                field: selections
                scope: self
                roundUp: false

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  # self scope, 1 selection, repeat value 3 → repeats = floor(1/3) = 0
  # So no increment applied → cost stays at 50
  - expectedState:
      forces:
        - selections:
            - name: Squad
