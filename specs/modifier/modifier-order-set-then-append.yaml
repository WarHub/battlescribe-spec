id: modifier-order-set-then-append
category: modifier
tags: [newrecruit-bug]
description: >
  Modifier application order matters — same modifiers in different
  order produce different results. Forward: set overwrites base,
  appends build on it. Reverse: appends on base are overwritten by
  final set.
  NR bug: processes modifiers by type priority (set before append)
  instead of respecting list order.

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-forward
          name: Original
          type: unit
          modifiers:
            - type: set
              field: name
              value: Alpha
            - type: append
              field: name
              value: Beta
            - type: append
              field: name
              value: Gamma
        - id: se-reverse
          name: Original
          type: unit
          modifiers:
            - type: append
              field: name
              value: Gamma
            - type: append
              field: name
              value: Beta
            - type: set
              field: name
              value: Alpha

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-forward

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-reverse

  # Forward: set "Alpha" → append "Beta" → "Alpha Beta" → append "Gamma" → "Alpha Beta Gamma"
  # Reverse: append "Gamma" → "Original Gamma" → append "Beta" → "Original Gamma Beta" → set "Alpha"
  - expectedState:
      forces:
        - selections:
            - name: Alpha
            - name: Alpha Beta Gamma
      engines:
        # NR bug: sorts modifiers by type (set before append) ignoring list order.
        # Reverse entry: set "Alpha" runs first, then appends in list order → "Alpha Gamma Beta"
        newrecruit:
          forces:
            - selections:
                - name: Alpha Beta Gamma
                - name: Alpha Gamma Beta
