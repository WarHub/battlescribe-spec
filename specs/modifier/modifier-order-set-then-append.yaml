id: modifier-order-set-then-append
category: modifier
description: Modifier order matters — set name then append produces combined result

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Alpha
          type: unit
          modifiers:
            - type: set
              field: name
              value: Beta
            - type: append
              field: name
              value: Gamma

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1
  # Modifiers applied in order: set name="Beta", then append " Gamma" → "Beta Gamma"
  - expectedState:
      forces:
        - selections:
            - name: "Beta Gamma"
