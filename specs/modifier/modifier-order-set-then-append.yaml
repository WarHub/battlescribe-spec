id: modifier-order-set-then-append
category: modifier
description: Modifier order matters — set name then append produces combined result

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogue:
    id: cat-1
    name: Cat
    gameSystemId: test-gs
    selectionEntries:
      - id: se-1
        name: Alpha
        type: unit
        modifiers:
          - type: set
            field: name
            value: Beta
          - type: append
            field: name
            value: Gamma

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  # Modifiers applied in order: set name="Beta", then append " Gamma" → "Beta Gamma"
  - expectedState:
      forces:
        - selections:
            - name: "Beta Gamma"
