id: modifier-repeat-percent-value
category: modifier
description: Repeat with percentValue=true uses percentage-based threshold calculation
setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
        defaultCostLimit: -1
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Squad
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 100
          modifiers:
            - type: increment
              field: pts
              value: "10"
              repeats:
                - value: 50
                  repeats: 1
                  field: selections
                  scope: parent
                  childId: se-1
                  percentValue: true

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  # percentValue=true: raw count = 1 selection. Percentage = 1/50*100 = 2%.
  # Round: floor(0.02) = 0 repeats. Modifier not applied → pts stays 100.
  # (percentValue divides the count by the value and multiplies by 100,
  # then applies repeats multiplier — with 1 selection and value 50, this is 0)
  - expectedState:
      forces:
        - selections:
            - name: Squad
