id: modifier-field-constraint-value
category: modifier
description: Modifier can target a constraint ID as field, changing the constraint's value
tags: []

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Unit A
          type: unit
          constraints:
            - id: con-max
              type: max
              value: 2
              field: selections
              scope: parent
          modifiers:
            # This modifier targets the constraint ID, not a built-in field.
            # It changes max from 2 to 5.
            - type: set
              field: con-max
              value: "5"

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      forces:
        - selectionCount: 1

  # Select a second time — at original max=2 limit
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      forces:
        - selectionCount: 2

  # Select a third time — would exceed original max=2 but modifier changed
  # it to max=5. If modifier works, no validation error at 3 selections.
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      forces:
        - selectionCount: 3
