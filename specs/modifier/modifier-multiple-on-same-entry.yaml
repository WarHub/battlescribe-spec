id: modifier-multiple-on-same-entry
category: modifier
description: Multiple modifiers on the same entry are applied in order

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    costTypes:
      - id: pts
        name: Points
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Base
          type: unit
          costs:
            - name: Points
              typeId: pts
              value: 100
          modifiers:
            - type: set
              field: name
              value: New Name
            - type: increment
              field: pts
              value: "50"

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - expectedState:
      forces:
        - selections:
            - name: New Name
              costs:
                - typeId: pts
                  value: 150
