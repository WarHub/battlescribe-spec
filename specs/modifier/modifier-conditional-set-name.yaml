id: modifier-conditional-set-name
category: modifier
description: Conditional modifier only applies when condition is met (using instanceOf)

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogue:
    id: cat-1
    name: Test Catalogue
    gameSystemId: test-gs
    selectionEntries:
      - id: se-unit-a
        name: Base Name
        type: unit
        modifiers:
          - type: set
            field: name
            value: Conditioned Name
            conditions:
              - type: atLeast
                value: 1
                field: selections
                scope: parent
                childId: se-unit-a

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      forces:
        - selections:
            - name: Conditioned Name
