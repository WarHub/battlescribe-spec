id: modifier-group-false-condition
category: modifier
description: Modifier group with unsatisfied condition does not apply its modifiers
setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Trooper
          type: unit
          modifierGroups:
            - conditions:
                - type: atLeast
                  value: 5
                  field: selections
                  scope: parent
                  childId: se-1
              modifiers:
                - type: set
                  field: name
                  value: Veteran Trooper

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  # Modifier group condition not met (need 5 selections of se-1, have 1).
  - expectedState:
      forces:
        - selections:
            - name: Trooper
