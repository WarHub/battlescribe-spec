id: modifier-conditional-false-keeps-base-cost
category: modifier
description: When condition is false, cost modifier is not applied and base cost remains

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    costTypes:
      - id: pts
        name: Points
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-trigger
          name: Trigger
          type: unit
        - id: se-target
          name: Target
          type: unit
          costs:
            - name: Points
              typeId: pts
              value: 100
          modifiers:
            - type: set
              field: pts
              value: "0"
              conditions:
                - type: atLeast
                  value: 99
                  field: selections
                  scope: force
                  childId: se-trigger

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-target

  # Condition requires 99 triggers — false, base cost preserved
  - expectedState:
      costs:
        - typeId: pts
          value: 100
