id: modifier-entry-page
category: modifier
description: Modifier can set an entry's page field (STRING modifier on BaseBookData.page)
tags: []

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogue:
    id: cat-1
    name: Cat
    gameSystemId: test-gs
    selectionEntries:
      - id: se-1
        name: Marine
        type: unit
        page: "42"
        modifiers:
          - type: set
            field: page
            value: "99"

steps:
