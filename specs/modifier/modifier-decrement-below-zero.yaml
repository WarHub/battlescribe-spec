id: modifier-decrement-below-zero
category: modifier
description: Decrement modifier can result in negative values

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
        defaultCostLimit: -1
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Discounted Unit
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 10
          modifiers:
            - type: decrement
              field: pts
              value: "20"

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      forces:
        - selections:
            - name: Discounted Unit
              costs:
                - typeId: pts
                  value: -10
