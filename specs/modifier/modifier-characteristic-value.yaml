id: modifier-characteristic-value
category: modifier
description: Modifier can set a Profile Characteristic value (STRING modifier on CharacteristicType ID field)
tags: []

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
    profileTypes:
      - id: stat-type
        name: Unit Stats
        characteristicTypes:
          - id: char-wounds
            name: Wounds
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Marine
          type: unit
          profiles:
            - id: prof-1
              name: Marine Stats
              typeId: stat-type
              typeName: Unit Stats
              characteristics:
                - name: Wounds
                  typeId: char-wounds
                  value: "2"
              modifiers:
                - type: set
                  field: char-wounds
                  value: "3"

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  - expectedState:
      forces:
        - selections:
            - name: Marine
              profiles:
                - name: Marine Stats
                  characteristics:
                    - name: Wounds
                      value: "3"
