id: modifier-append-with-space
category: modifier
description: Append modifier adds a space prefix before appending the value to the string

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Squad
          type: unit
          modifiers:
            - type: append
              field: name
              value: Alpha

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1
  # Append adds " " + value → "Squad Alpha"
  - expectedState:
      forces:
        - selections:
            - name: Squad Alpha
