id: modifier-category-remove
category: modifier
description: Category remove modifier removes a category link from a selection
tags: [newrecruit-bug]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    categoryEntries:
      - id: cat-elite
        name: Elites
    forceEntries:
      - id: fe-1
        name: Detachment
        categoryLinks:
          - id: cl-fe-elite
            targetId: cat-elite
            name: Elites
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Veteran Squad
          type: unit
          categoryLinks:
            - id: cl-1
              targetId: cat-elite
              name: Elites
          modifiers:
            - type: remove
              field: category
              value: cat-elite

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Veteran Squad
              categories: []
      engines:
        newrecruit:
          forces:
            - selections:
                - name: Veteran Squad
                  categories:
                    - name: Uncategorized
                      entryId: (No Category)
                      primary: true
