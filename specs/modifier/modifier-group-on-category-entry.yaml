id: modifier-group-on-category-entry
category: modifier
tags: [modifierGroup, categoryEntry, engine-limitation]
description: >
  ModifierGroup on categoryEntry is accepted in XML and parsed by engines.
  Engine limitation: category roster elements get state from categoryLinks,
  not directly from categoryEntry, so the modifier effect is not observable
  in roster state.

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    categoryEntries:
      - id: cat-troops
        name: Troops
        modifierGroups:
          - modifiers:
              - type: set
                field: hidden
                value: "true"
    forceEntries:
      - id: fe-1
        name: Detachment
        categoryLinks:
          - id: cl-troops
            targetId: cat-troops
            name: Troops
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Marine
          type: unit

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - selections:
            - name: Marine
