id: modifier-rule-description
category: modifier
description: Modifier can set a Rule's description field (STRING modifier on rule description)
tags:
  - known-limitation-synthetic

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogue:
    id: cat-1
    name: Cat
    gameSystemId: test-gs
    selectionEntries:
      - id: se-1
        name: Marine
        type: unit
        rules:
          - id: rule-1
            name: Combat Doctrine
            description: Original description
            modifiers:
              - type: set
                field: description
                value: Modified description

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  # The modifier targets the rule's description field.
  # With synthetic data, rule modifiers may not be evaluated.
  # The selection appears with its base name.
  - expectedState:
      forces:
        - selections:
            - name: Marine
