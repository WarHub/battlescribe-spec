id: modifier-set-boolean
category: modifier
description: Set modifier changes a boolean field (hidden flag)
tags: [design-difference]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Secret Agent
          type: unit
          modifiers:
            - type: set
              field: hidden
              value: "true"
              conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: self

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Secret Agent
      engines:
        newrecruit:
          errors:
            - on: selection se-1
              from: se-1/hidden
