id: modifier-group-on-profile
category: modifier
tags: [modifierGroup, profile]
description: ModifierGroup on a profile modifies a characteristic

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
    profileTypes:
      - id: pt-stats
        name: Unit Stats
        characteristicTypes:
          - id: ct-m
            name: M
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Marine
          type: unit
          profiles:
            - id: prof-1
              name: Marine Stats
              typeId: pt-stats
              typeName: Unit Stats
              characteristics:
                - name: M
                  typeId: ct-m
                  value: "6"
              modifierGroups:
                - modifiers:
                    - type: set
                      field: ct-m
                      value: "8"

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      forces:
        - selections:
            - name: Marine
              profiles:
                - name: Marine Stats
                  characteristics:
                    - name: M
                      value: "8"
