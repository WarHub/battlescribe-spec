id: modifier-set-hidden-true
category: modifier
tags: [battlescribe-bug]
description: >
  A boolean SET modifier on hidden field hides the entry.
  The entry can be selected but reports as hidden, and engines should show an error.
  BattleScribe bug: Oracle cannot read modifier-applied hidden state on selections
  (only static hidden), so it reports hidden=false and produces no error.

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-hidden
          name: Hidden Unit
          type: unit
          modifiers:
            - type: set
              field: hidden
              value: "true"
        - id: se-normal
          name: Normal Unit
          type: unit

steps:
  - action: addForce
    id: add-force
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-force.forceId }}
    entryId: se-hidden

  - action: selectEntry
    forceId: ${{ steps.add-force.forceId }}
    entryId: se-normal

  - expectedState:
      forces:
        - selectionCount: 2
          selections:
            - name: Hidden Unit
              hidden: true
            - name: Normal Unit
              hidden: false
      errors:
        - on: selection se-hidden
          from: se-hidden/hidden
      engines:
        battlescribe:
          forces:
            - selectionCount: 2
              selections:
                - name: Hidden Unit
                - name: Normal Unit
                  hidden: false
          errors: []
