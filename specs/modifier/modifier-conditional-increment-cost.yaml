id: modifier-conditional-increment-cost
category: modifier
description: Conditional increment modifier only applies when condition is met

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    costTypes:
      - id: pts
        name: Points
        defaultCostLimit: -1.0
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-trigger
          name: Trigger
          type: unit
        - id: se-target
          name: Target
          type: unit
          costs:
            - name: Points
              typeId: pts
              value: 100
          modifiers:
            - type: increment
              field: pts
              value: "50"
              conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: force
                  childId: se-trigger

steps:
  - action: addForce
    forceEntryIndex: 0

  # Select target without trigger → base cost only
  - action: selectEntry
    forceIndex: 0
    entryIndex: 1

  - expectedState:
      costs:
        - typeId: pts
          value: 100
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      costs:
        - typeId: pts
          value: 150
