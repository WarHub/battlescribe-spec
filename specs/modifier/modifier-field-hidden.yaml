id: modifier-field-hidden
category: modifier
description: Modifier targeting 'hidden' field changes entry visibility (boolean set)
tags: [design-difference]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Stealth Unit
          type: unit
          modifiers:
            - type: set
              field: hidden
              value: "true"

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1
  # Hidden modifier set to true makes the entry hidden
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Stealth Unit
      engines:
        newrecruit:
          errors:
            - on: selection se-1
              from: se-1/hidden
