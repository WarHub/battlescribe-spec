id: modifier-field-hidden
category: modifier
description: Modifier targeting 'hidden' field changes entry visibility (boolean set)

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogue:
    id: cat-1
    name: Cat
    gameSystemId: test-gs
    selectionEntries:
      - id: se-1
        name: Stealth Unit
        type: unit
        hidden: false
        modifiers:
          - type: set
            field: hidden
            value: "true"

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  # Hidden modifier set to true makes the entry hidden
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Stealth Unit
