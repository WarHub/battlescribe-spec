id: modifier-group-with-repeat
category: modifier
description: ModifierGroup with its own repeat multiplier applies contained modifiers multiple times

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
        defaultCostLimit: -1
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Squad
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 50
          modifierGroups:
            - repeats:
                - value: 1
                  repeats: 1
                  field: selections
                  scope: parent
                  childId: se-1
              modifiers:
                - type: increment
                  field: pts
                  value: "5"

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  # ModifierGroup repeat: parent scope, childId se-1, 1 selection / value 1 = 1 repeat.
  # Contained modifier increments pts by 5 once → 50 + 5 = 55.
  - expectedState:
      forces:
        - selections:
            - name: Squad
              costs:
                - typeId: pts
                  value: 55
