id: modifier-increment-cost
category: modifier
description: Number INCREMENT modifier adds to the cost value

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    costTypes:
      - id: pts
        name: Points
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          costs:
            - name: Points
              typeId: pts
              value: 100
          modifiers:
            - type: increment
              field: pts
              value: "25"

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - expectedState:
      costs:
        - typeId: pts
          value: 125
