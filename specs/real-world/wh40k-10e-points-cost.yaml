id: wh40k-10e-points-cost
category: real-world
description: Verify points cost calculation for Space Marines units
tags: [wh40k-10e, real-world, space-marines, cost]
engines: [newrecruit]

setup:
  dataSource: "github:BSData/wh40k-10e@v10.14.0"

steps:
  - action: addForce
    forceEntryName: "Strike Force"

  - action: selectEntry
    forceIndex: 0
    entryName: "Intercessor Squad"

  # Points cost should be reflected in roster total
  - expectedState:
      costs:
        - name: "pts"
          value: 80
