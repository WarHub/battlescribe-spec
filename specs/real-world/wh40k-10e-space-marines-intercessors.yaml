id: wh40k-10e-space-marines-intercessors
category: real-world
description: Add Intercessor Squad to a Space Marines army and verify selection
tags: [wh40k-10e, real-world, space-marines]
engines: [newrecruit]

setup:
  dataSource: "github:BSData/wh40k-10e@v10.14.0"

steps:
  - action: addForce
    forceEntryName: "Strike Force"

  - action: selectEntry
    forceIndex: 0
    entryName: "Intercessor Squad"

  - expectedState:
      forceCount: 1
      forces:
        - name: "Strike Force"
          selections:
            - name: "Intercessor Squad"
              type: unit
