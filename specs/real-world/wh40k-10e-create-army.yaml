id: wh40k-10e-create-army
category: real-world
description: Create a basic Warhammer 40k 10th Edition roster with a Strike Force
tags: [wh40k-10e, real-world]
engines:
  # NR's forceEntries lookup fails intermittently for dataSource-loaded game systems
  newrecruit: fail
setup:
  dataSource: "github:BSData/wh40k-10e@v10.6.0"

steps:
  - action: addForce
    forceEntryName: "Army Roster"

  - expectedState:
      forceCount: 1
      forces:
        - name: "Army Roster"
