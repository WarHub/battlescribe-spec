id: wh40k-10e-multi-unit
category: real-world
description: Add multiple units to a Space Marines army and verify roster state
tags: [wh40k-10e, real-world, space-marines]
engines: [newrecruit]

setup:
  dataSource: "github:BSData/wh40k-10e@v10.14.0"

steps:
  - action: addForce
    forceEntryName: "Strike Force"

  - action: selectEntry
    forceIndex: 0
    entryName: "Captain"

  - action: selectEntry
    forceIndex: 0
    entryName: "Intercessor Squad"

  - action: selectEntry
    forceIndex: 0
    entryName: "Intercessor Squad"

  - expectedState:
      forces:
        - name: "Strike Force"
          selectionCount: 3
