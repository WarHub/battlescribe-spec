id: wh40k-10e-space-marines-army
category: real-world
description: Build a Space Marines army — verify auto-selections, unit types, and points costs
tags: [wh40k-10e, real-world, space-marines, cost, profile]
# NR can't run this spec: different auto-selections (7 vs 3), different entry names
# ("Detachment Choice" vs "Detachment"), and "Captain" not found in NR's selector tree.
# Per-engine expectedState overrides can't fix action-level incompatibilities.
engines:
  newrecruit: fail

setup:
  dataSource: "github:BSData/wh40k-10e@v10.6.0"

steps:
  - action: addForce
    forceEntryIndex: 0
    catalogueIndex: 27

  # After force creation, mandatory entries are auto-selected
  - expectedState:
      forceCount: 1
      forces:
        - name: "Army Roster"
          selectionCount: 3
          selections:
            - name: "Detachment"
              type: upgrade
            - name: "Show/Hide Options"
              type: upgrade
            - name: "Battle Size"
              type: upgrade

  - action: selectEntry
    forceIndex: 0
    entryIndex: 79

  - expectedState:
      costs:
        - name: "pts"
          value: 80
      forces:
        - name: "Army Roster"
          selectionCount: 4
          selections:
            - name: "Detachment"
              type: upgrade
            - name: "Show/Hide Options"
              type: upgrade
            - name: "Battle Size"
              type: upgrade
            - name: "Captain"
              type: model

  - action: selectEntry
    forceIndex: 0
    entryIndex: 43

  - expectedState:
      costs:
        - name: "pts"
          value: 160
      forces:
        - name: "Army Roster"
          selectionCount: 5
          selections:
            - name: "Detachment"
              type: upgrade
            - name: "Show/Hide Options"
              type: upgrade
            - name: "Battle Size"
              type: upgrade
            - name: "Captain"
              type: model
            - name: "Intercessor Squad"
              type: unit

  - action: selectEntry
    forceIndex: 0
    entryIndex: 43

  # Final state: 3 auto + 3 user = 6 selections, 80+80+80 = 240 pts
  - expectedState:
      costs:
        - name: "pts"
          value: 240
      forces:
        - name: "Army Roster"
          selectionCount: 6
