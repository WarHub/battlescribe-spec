id: cost-zero-value
category: cost
description: Selection with zero cost contributes 0 to roster cost total

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
        defaultCostLimit: -1
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogue:
    id: cat-1
    name: Cat
    gameSystemId: test-gs
    selectionEntries:
      - id: se-1
        name: Free Unit
        type: unit
        costs:
          - name: pts
            typeId: pts
            value: 0

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Free Unit
