id: cost-duplicate-increases
category: cost
description: Duplicating a selection doubles its cost contribution

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
        defaultCostLimit: -1
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogue:
    id: cat-1
    name: Cat
    gameSystemId: test-gs
    selectionEntries:
      - id: se-1
        name: Marine
        type: unit
        costs:
          - name: pts
            typeId: pts
            value: 75

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  - assert: totalCost
    costTypeId: pts
    expected: 75
  - action: duplicateSelection
    forceIndex: 0
    selectionIndex: 0
  - assert: totalCost
    costTypeId: pts
    expected: 150
  - action: duplicateSelection
    forceIndex: 0
    selectionIndex: 0
  - assert: totalCost
    costTypeId: pts
    expected: 225
