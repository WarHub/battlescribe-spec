id: cost-multi-type-aggregation
category: cost
description: Multiple cost types aggregate independently across selections

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: Points
      - id: pl
        name: Power Level
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Tactical Squad
          type: unit
          costs:
            - name: Points
              typeId: pts
              value: 100
            - name: Power Level
              typeId: pl
              value: 5
        - id: se-2
          name: Heavy Support
          type: unit
          costs:
            - name: Points
              typeId: pts
              value: 200
            - name: Power Level
              typeId: pl
              value: 10

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-2

  - expectedState:
      costs:
        - typeId: pts
          value: 300
        - typeId: pl
          value: 15
