id: cost-multi-force-aggregation
category: cost
description: Costs aggregate across multiple forces

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    costTypes:
      - id: pts
        name: Points
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          costs:
            - name: Points
              typeId: pts
              value: 100

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: addForce
    id: add-patrol-2
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - expectedState:
      costs:
        - typeId: pts
          value: 100

  - action: selectEntry
    forceId: ${{ steps.add-patrol-2.forceId }}
    entryId: se-unit-a

  - expectedState:
      costs:
        - typeId: pts
          value: 200
