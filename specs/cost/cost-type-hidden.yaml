id: cost-type-hidden
category: cost
description: Hidden cost types are tracked internally but filtered from display aggregation
tags: []

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
        defaultCostLimit: -1
      - id: cp
        name: CP
        defaultCostLimit: -1
        hidden: true
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Squad
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 100
            - name: CP
              typeId: cp
              value: 1

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  # Hidden cost types (cp) are tracked in the roster but may be filtered
  # from display. Both cost types should appear in roster state costs.
  - expectedState:
      costs:
        - typeId: pts
          value: 100.0
