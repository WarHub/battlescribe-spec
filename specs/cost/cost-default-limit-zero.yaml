id: cost-default-limit-zero
category: cost
description: DefaultCostLimit of 0 — any entry with cost > 0 triggers validation error
tags: [cost, defaultCostLimit]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
        defaultCostLimit: 0
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Cheap Unit
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 10

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  # Cost 10 exceeds defaultCostLimit of 0 → validation error
  - expectedState:
      costs:
        - typeId: pts
          value: 10
      errors:
        - on: roster
          from: costLimits/pts
