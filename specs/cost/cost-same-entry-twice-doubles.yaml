id: cost-same-entry-twice-doubles
category: cost
description: Selecting the same entry twice doubles the cost

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    costTypes:
      - id: pts
        name: Points
        defaultCostLimit: -1.0
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          costs:
            - name: Points
              typeId: pts
              value: 80

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      costs:
        - typeId: pts
          value: 80

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      costs:
        - typeId: pts
          value: 160
