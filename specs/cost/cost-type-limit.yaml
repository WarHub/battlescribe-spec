id: cost-type-limit
category: cost
description: CostType with limit flag represents a cost cap rather than an actual cost
tags:
  - known-limitation-synthetic

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
        defaultCostLimit: 2000
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogue:
    id: cat-1
    name: Cat
    gameSystemId: test-gs
    selectionEntries:
      - id: se-1
        name: Squad
        type: unit
        costs:
          - name: pts
            typeId: pts
            value: 100

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  # With a cost limit set on the cost type, the roster tracks the cost.
  # Limit-type cost types are used in query resolution to check against caps.
  - expectedState:
      costs:
        - typeId: pts
          value: 100.0
