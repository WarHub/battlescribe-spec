id: migration-entry-renamed
category: migration
description: >
  A reopened roster takes its selections' names from the data, not from the file. A roster holding
  one Squad is saved; the data editor renames the entry Veteran Squad and saves; reopening the
  roster shows Veteran Squad, though the .ros recorded Squad.
tags: [migration, reopen]

setup:
  edit: cat-1
  gameSystem:
    id: gs-1
    name: Test System
    costTypes:
      - id: ct-pts
        name: pts
    categoryEntries:
      - id: ce-troops
        name: Troops
      - id: ce-elites
        name: Elites
    forceEntries:
      - id: fe-1
        name: Detachment
        categoryLinks:
          - id: cl-fe-troops
            name: Troops
            targetId: ce-troops
          - id: cl-fe-elites
            name: Elites
            targetId: ce-elites
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          categoryLinks:
            - id: cl-squad-troops
              name: Troops
              targetId: ce-troops
              primary: true
          costs:
            - name: pts
              typeId: ct-pts
              value: 10
          selectionEntries:
            - id: se-plasma
              name: Plasma
              type: upgrade
              costs:
                - name: pts
                  typeId: ct-pts
                  value: 2

steps:
  - action: newRoster

  - roster:
      - action: addForce
        id: add-detachment
        forceEntryId: fe-1

      - action: selectEntry
        id: select-squad
        forceId: ${{ steps.add-detachment.forceId }}
        entryId: se-squad

  - action: saveRoster
    file: detachment

  - data:
      - action: setFields
        entryId: se-squad
        fields:
          name: Veteran Squad

  - action: saveData

  - action: openRoster
    file: detachment

  - roster:
      - expectedState:
          errors: []
          forces:
            - name: Detachment
              selections:
                - name: Veteran Squad
                  entryId: se-squad
