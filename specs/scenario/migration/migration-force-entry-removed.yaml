id: migration-force-entry-removed
category: migration
description: >
  A force whose force entry the data no longer has: BattleScribe drops it on reopen, NewRecruit
  refuses the file. A roster with one Detachment is saved; the data editor deletes the Detachment
  force entry from the game system, leaving a Patrol, and saves. BattleScribe opens the roster
  without the force (its dialog calls the catalogue invalid, 'No force entry found', and lists the
  selections it removed; #578), and NewRecruit will not open it at all.
tags: [migration, reopen, forceEntry, design-difference]

setup:
  edit: cat-1
  gameSystem:
    id: gs-1
    name: Test System
    costTypes:
      - id: ct-pts
        name: pts
    categoryEntries:
      - id: ce-troops
        name: Troops
      - id: ce-elites
        name: Elites
    forceEntries:
      - id: fe-1
        name: Detachment
        categoryLinks:
          - id: cl-fe-troops
            name: Troops
            targetId: ce-troops
          - id: cl-fe-elites
            name: Elites
            targetId: ce-elites
      - id: fe-2
        name: Patrol
        categoryLinks:
          - id: cl-fe2-troops
            name: Troops
            targetId: ce-troops
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          categoryLinks:
            - id: cl-squad-troops
              name: Troops
              targetId: ce-troops
              primary: true
          costs:
            - name: pts
              typeId: ct-pts
              value: 10
          selectionEntries:
            - id: se-plasma
              name: Plasma
              type: upgrade
              costs:
                - name: pts
                  typeId: ct-pts
                  value: 2

steps:
  - action: newRoster

  - roster:
      - action: addForce
        id: add-detachment
        forceEntryId: fe-1

      - action: selectEntry
        id: select-squad
        forceId: ${{ steps.add-detachment.forceId }}
        entryId: se-squad

  - action: saveRoster
    file: detachment

  - data:
      - action: openFile
        entryId: gs-1

      - action: removeEntry
        entryId: fe-1

  - action: saveData

  - action: openRoster
    file: detachment
    expectFailure:
      expected: false
      engines:
        newrecruit:
          messageContains: Couldn't add Force

  - roster:
      - expectedState:
          errors: []
          forceCount: 0
