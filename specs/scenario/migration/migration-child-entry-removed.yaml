id: migration-child-entry-removed
category: migration
description: >
  A child selection whose entry the data no longer has is dropped on reopen, and its parent stays. A
  Squad with a Plasma upgrade is saved; the data editor deletes the Plasma entry and saves;
  reopening the roster gives back the Squad, alone and priced without the upgrade. Every engine
  drops the child; BattleScribe also says so in its data-problems dialog (#578).
tags: [migration, reopen, children]

setup:
  edit: cat-1
  gameSystem:
    id: gs-1
    name: Test System
    costTypes:
      - id: ct-pts
        name: pts
    categoryEntries:
      - id: ce-troops
        name: Troops
      - id: ce-elites
        name: Elites
    forceEntries:
      - id: fe-1
        name: Detachment
        categoryLinks:
          - id: cl-fe-troops
            name: Troops
            targetId: ce-troops
          - id: cl-fe-elites
            name: Elites
            targetId: ce-elites
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          categoryLinks:
            - id: cl-squad-troops
              name: Troops
              targetId: ce-troops
              primary: true
          costs:
            - name: pts
              typeId: ct-pts
              value: 10
          selectionEntries:
            - id: se-plasma
              name: Plasma
              type: upgrade
              costs:
                - name: pts
                  typeId: ct-pts
                  value: 2

steps:
  - action: newRoster

  - roster:
      - action: addForce
        id: add-detachment
        forceEntryId: fe-1

      - action: selectEntry
        id: select-squad
        forceId: ${{ steps.add-detachment.forceId }}
        entryId: se-squad

      - action: selectChildEntry
        forceId: ${{ steps.add-detachment.forceId }}
        selectionId: ${{ steps.select-squad.selectionId }}
        entryId: se-plasma

  - action: saveRoster
    file: detachment

  - data:
      - action: removeEntry
        entryId: se-plasma

  - action: saveData

  - action: openRoster
    file: detachment

  - roster:
      - expectedState:
          errors: []
          costs:
            - typeId: ct-pts
              value: 10
          forces:
            - name: Detachment
              selections:
                - name: Squad
                  childCount: 0
