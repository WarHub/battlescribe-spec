id: reload-cost-changed
category: reload
description: >
  BattleScribe's live reload re-prices an open roster from the data saved under it. A roster holding
  one 10-point Squad is saved and stays open; the data editor sets the Squad to 15 and saves, the
  roster editor asks 'A file was modified outside of BattleScribe. Would you like to reload your
  roster?', and YES brings the roster back from its file at 15 points, as a reopen would.
tags: [reload, migration]

engines:
  # NewRecruit's roster editor does not watch the data under an open list and offers no reload: a list
  # meets changed data only when it is opened again, which the migration scenarios cover.
  newrecruit: skip

setup:
  edit: cat-1
  gameSystem:
    id: gs-1
    name: Test System
    costTypes:
      - id: ct-pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: gs-1
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          costs:
            - name: pts
              typeId: ct-pts
              value: 10
        - id: se-scout
          name: Scout
          type: unit
          costs:
            - name: pts
              typeId: ct-pts
              value: 5

steps:
  - action: newRoster

  - roster:
      - action: addForce
        id: add-detachment
        forceEntryId: fe-1

      - action: selectEntry
        id: select-squad
        forceId: ${{ steps.add-detachment.forceId }}
        entryId: se-squad

  - action: saveRoster
    file: detachment

  - data:
      - action: setFields
        entryId: se-squad
        costs:
          ct-pts: "15"

  - action: saveData

  - action: reloadRoster

  - roster:
      - expectedState:
          errors: []
          costs:
            - typeId: ct-pts
              value: 15
          forces:
            - name: Detachment
              selections:
                - name: Squad
                  costs:
                    - typeId: ct-pts
                      value: 15
