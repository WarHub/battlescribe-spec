id: scope-parent
category: scope
description: Condition with scope=parent evaluates on the parent element
tags: [design-difference]

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          constraints:
            - id: con-max-3
              type: max
              value: 3
              field: selections
              scope: parent

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  # 3 selections at max scope
  - expectedState:
      forces:
        - selectionCount: 3

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  # 4 selections exceeds max=3 — constraint violation
  - expectedState:
      forces:
        - selectionCount: 4
      errors:
        - on: selection se-unit-a
          from: se-unit-a/con-max-3
      engines:
        # BattleScribe doesn't enforce scope=parent constraints on
        # entries without categoryLinks (uncategorised root entries).
        battlescribe:
          errors: []
