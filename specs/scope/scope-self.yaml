id: scope-self
category: scope
description: Condition with scope=self evaluates on the current element

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogue:
    id: cat-1
    name: Test Catalogue
    gameSystemId: test-gs
    selectionEntries:
      - id: se-unit-a
        name: Self Check
        type: unit
        modifiers:
          - type: set
            field: name
            value: Self Found
            conditions:
              - type: atLeast
                value: 1
                field: selections
                scope: self
                childId: se-unit-a

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  # Self scope checks the element itself
  - expectedState:
      forces:
        - selectionCount: 1
