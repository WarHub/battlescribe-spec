id: scope-roster-cross-force
category: scope
description: Roster scope condition triggers from a selection in a different force

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogue:
    id: cat-1
    name: Test Catalogue
    gameSystemId: test-gs
    selectionEntries:
      - id: se-trigger
        name: Trigger
        type: unit
      - id: se-target
        name: Target
        type: unit
        modifiers:
          - type: set
            field: name
            value: Cross Force Activated
            conditions:
              - type: atLeast
                value: 1
                field: selections
                scope: roster
                childId: se-trigger

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: addForce
    forceEntryIndex: 0

  # Target in force 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 1

  - assert: selectionName
    forceIndex: 0
    selectionIndex: 0
    expected: Target

  # Trigger in force 1 → roster scope picks it up
  - action: selectEntry
    forceIndex: 1
    entryIndex: 0

  - assert: selectionName
    forceIndex: 0
    selectionIndex: 0
    expected: Cross Force Activated
