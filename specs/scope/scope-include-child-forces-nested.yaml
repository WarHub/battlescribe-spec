id: scope-include-child-forces-nested
category: scope
engines:
  newrecruit: fail
description: includeChildForces flag traverses into nested forces for query resolution
tags: []

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-army
        name: Army
        forceEntries:
          - id: fe-detach
            name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Squad
          type: unit
          modifiers:
            - type: set
              field: name
              value: Veteran Squad
              conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: force
                  includeChildForces: true

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  # includeChildForces=true traverses nested forces when counting.
  # With only the top-level Army force and no child forces selected,
  # the condition does not find matching selections. Name unchanged.
  - expectedState:
      forces:
        - selections:
            - name: Squad
