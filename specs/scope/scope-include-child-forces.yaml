id: scope-include-child-forces
category: scope
description: Condition with includeChildForces flag includes child forces in query scope
tags: [newrecruit-bug]

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit
          name: Unit A
          type: unit
          modifiers:
            - type: set
              field: name
              value: Child Forces Included
              conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: force
                  includeChildForces: true

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit

  # includeChildForces expands scope to nested forces. With only one
  # force and no child forces, the flag has no additional effect and the
  # condition evaluates the same as without the flag. Name unchanged.
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Unit A
      engines:
        # NR ignores includeChildForces flag — condition fires counting current force
        newrecruit:
          forces:
            - selectionCount: 1
              selections:
                - name: Child Forces Included
