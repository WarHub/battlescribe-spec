id: scope-child-id-filter
category: scope
description: Condition with childId filters which entries are counted

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-target
          name: Target Unit
          type: unit
        - id: se-watcher
          name: Watcher
          type: unit
          modifiers:
            - type: set
              field: name
              value: Active Watcher
              conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: roster
                  childId: se-target

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-target

  - action: selectEntry
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-watcher

  - expectedState:
      forces:
        - selectionCount: 2
          selections:
            - name: Active Watcher
            - name: Target Unit
      engines:
        # NR sorts by original pre-modifier name: Target Unit < Watcher (original).
        # BS render layer sorts by modified name: Active Watcher < Target Unit.
        newrecruit:
          forces:
            - selections:
                - name: Target Unit
                - name: Active Watcher
