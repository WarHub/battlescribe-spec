id: condition-null-childid-nr-force
category: condition
description: >
  Condition without childId on force scope — BattleScribe: condition always false (NaN).
  NR: defaults to counting all selections ("any"), so atLeast 2 fires at 2+ selections.

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          modifiers:
            - type: set
              field: name
              value: Triggered
              conditions:
                # No childId — NR defaults to "any" on force scope
                - type: atLeast
                  value: 2
                  field: selections
                  scope: force

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  # 1 selection in force, atLeast 2 → false on both engines
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Unit A

  # Add second instance — now 2 selections in force
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  # BattleScribe: null childId → condition always false → name stays "Unit A"
  # NR: null childId on force scope → counts all → atLeast 2 → true → "Triggered"
  - expectedState:
      forces:
        - selectionCount: 2
          selections:
            - name: Unit A
            - name: Unit A
      engines:
        newrecruit:
          forces:
            - selectionCount: 2
              selections:
                - name: Triggered
                - name: Triggered
