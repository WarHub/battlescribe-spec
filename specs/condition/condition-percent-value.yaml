id: condition-percent-value
category: condition
description: Condition with percentValue=true computes threshold as percentage of total selections in scope

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-trigger
          name: Trigger Unit
          type: unit
        - id: se-target
          name: Target Unit
          type: unit
          modifiers:
            - type: set
              field: name
              value: Percent Met
              conditions:
                - type: atLeast
                  value: 50
                  field: selections
                  scope: force
                  childId: se-trigger
                  percentValue: true

steps:
  - action: addForce
    forceEntryIndex: 0

  # Add target first
  - action: selectEntry
    forceIndex: 0
    entryIndex: 1

  # 0 triggers / 1 total → threshold = 1/100*50 = 0.5 → 0 >= 0.5 → false
  - expectedState:
      forces:
        - selections:
            - name: Target Unit

  # Add trigger
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  # 1 trigger / 2 total → threshold = 2/100*50 = 1.0 → 1 >= 1.0 → true
  - expectedState:
      forces:
        - selections:
            - name: Percent Met
