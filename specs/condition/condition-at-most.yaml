id: condition-at-most
category: condition
description: Condition type atMost evaluates true when count <= value

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          modifiers:
            - type: set
              field: name
              value: Few Units
              conditions:
                - type: atMost
                  value: 1
                  field: selections
                  scope: force
                  childId: se-unit-a

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  # With 1 selection, atMost(1) is true → modifier applied
  - expectedState:
      forces:
        - selections:
            - name: Few Units

  # Add second selection → atMost(1) is now false → modifier not applied
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - expectedState:
      forces:
        - selections:
            - name: Unit A
            - name: Unit A
