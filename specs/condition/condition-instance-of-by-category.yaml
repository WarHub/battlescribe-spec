id: condition-instance-of-by-category
category: condition
description: >
  instanceOf with scope=force and childId=CategoryEntry ID. scope=force
  resolves to the Force element which is not a Selection — instanceOf
  returns false. See condition-instance-of-self-category for the working
  version using scope=self.

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    categoryEntries:
      - id: cat-hq
        name: HQ
    forceEntries:
      - id: fe-patrol
        name: Patrol
        categoryLinks:
          - id: cl-fe-hq
            targetId: cat-hq
            name: HQ
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-detector
          name: Detector
          type: unit
          modifiers:
            - type: set
              field: name
              value: HQ Found
              conditions:
                - type: instanceOf
                  value: 1
                  field: selections
                  scope: force
                  childId: cat-hq
        - id: se-commander
          name: Commander
          type: unit
          categoryLinks:
            - id: cl-cmd-hq
              targetId: cat-hq
              name: HQ
              primary: true

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-detector

  # Only detector selected, no HQ-category selection yet → instanceOf false
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Detector

  # Select Commander (has HQ category link) — instanceOf by category still returns false in engine
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-commander

  - expectedState:
      forces:
        - selectionCount: 2
          selections:
            - name: Commander
            - name: Detector
      engines:
        # NR groups by primary category: HQ entries first, then Uncategorised.
        # Detector (no category) sorts into Uncategorised after Commander's HQ group.
        # But NR actually places Uncategorised entries before categorised ones.
        newrecruit:
          forces:
            - selections:
                - name: Detector
                - name: Commander
