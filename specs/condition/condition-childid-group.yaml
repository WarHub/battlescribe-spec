id: condition-childid-group
category: condition
description: childId filter can reference a SelectionEntryGroup ID to count selections from that group
tags:
  - known-limitation-synthetic

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogue:
    id: cat-1
    name: Cat
    gameSystemId: test-gs
    selectionEntries:
      - id: se-watcher
        name: Watcher
        type: unit
        modifiers:
          - type: set
            field: name
            value: Group Found
            conditions:
              - type: atLeast
                value: 1
                field: selections
                scope: force
                childId: seg-weapons
      - id: se-unit
        name: Unit
        type: unit

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  # childId references a SelectionEntryGroup ID. With synthetic data,
  # the engine's indexing doesn't resolve group IDs, so the modifier
  # is not applied.
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Watcher
