id: condition-scope-roster
category: condition
description: Condition with scope=roster counts across all forces

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-trigger
          name: Trigger
          type: unit
        - id: se-target
          name: Target
          type: unit
          modifiers:
            - type: set
              field: name
              value: Roster Triggered
              conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: roster
                  childId: se-trigger

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: addForce
    forceEntryIndex: 0

  # Select target in force 1
  - action: selectEntry
    forceIndex: 1
    entryIndex: 1

  - expectedState:
      forces:
        - {}
        - selections:
            - name: Target

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      forces:
        - {}
        - selections:
            - name: Roster Triggered
