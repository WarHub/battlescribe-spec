id: condition-instance-of-by-type
category: condition
description: instanceOf condition can match by SelectionEntry.Type (e.g. unit, model, upgrade)
tags:
  - known-limitation-synthetic

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogue:
    id: cat-1
    name: Test Catalogue
    gameSystemId: test-gs
    selectionEntries:
      - id: se-detector
        name: Detector
        type: unit
        modifiers:
          - type: set
            field: name
            value: Model Found
            conditions:
              - type: instanceOf
                value: 1
                field: selections
                scope: force
                childId: model
      - id: se-model
        name: Basic Model
        type: model

steps:
  - action: addForce
    forceEntryIndex: 0

  # Select detector - instanceOf by type 'model' does not match with synthetic data
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Detector

  # Add a model-type entry. With synthetic data, detector's modifiers
  # are not re-evaluated with proper type matching.
  - action: selectEntry
    forceIndex: 0
    entryIndex: 1

  - expectedState:
      forces:
        - selectionCount: 2
          selections:
            - name: Detector
