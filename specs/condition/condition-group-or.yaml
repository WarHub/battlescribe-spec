id: condition-group-or
category: condition
description: Condition group with OR logic on modifier (tests structure)
setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Fighter
          type: unit
          modifiers:
            - type: set
              field: name
              value: Active Fighter
              conditionGroups:
                - type: or
                  conditions:
                    - type: atLeast
                      value: 1
                      field: selections
                      scope: parent
                      childId: se-1
                    - type: atLeast
                      value: 10
                      field: selections
                      scope: parent
                      childId: se-1

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  # OR(atLeast 1, atLeast 10): with 1 selection, first true → modifier applies
  - expectedState:
      forces:
        - selections:
            - name: Active Fighter
