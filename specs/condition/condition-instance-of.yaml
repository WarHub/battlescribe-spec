id: condition-instance-of
category: condition
description: >
  instanceOf with scope=force and childId=selectionEntry ID. scope=force
  resolves to the Force element which is not a Selection — instanceOf
  returns false. See condition-instance-of-self for the working version
  using scope=self.

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          modifiers:
            - type: set
              field: name
              value: Unit Exists
              conditions:
                - type: instanceOf
                  value: 1
                  field: selections
                  scope: force
                  childId: se-unit-a

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  # instanceOf(se-unit-a) with scope=force — engine returns false, modifier not applied
  - expectedState:
      forces:
        - selectionCount: 1
