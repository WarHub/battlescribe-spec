id: condition-instance-of
category: condition
description: instanceOf condition checks if a child element of matching type exists

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogue:
    id: cat-1
    name: Test Catalogue
    gameSystemId: test-gs
    selectionEntries:
      - id: se-unit-a
        name: Unit A
        type: unit
        modifiers:
          - type: set
            field: name
            value: Unit Exists
            conditions:
              - type: instanceOf
                value: 1
                field: selections
                scope: force
                childId: se-unit-a

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      forces:
        - selectionCount: 1
