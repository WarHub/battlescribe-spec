id: condition-multiple-and
category: condition
description: Multiple conditions use AND logic (all must be true for modifier to apply)

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-trigger-a
          name: Trigger A
          type: unit
        - id: se-trigger-b
          name: Trigger B
          type: unit
        - id: se-target
          name: Target
          type: unit
          modifiers:
            - type: set
              field: name
              value: Both Present
              conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: force
                  childId: se-trigger-a
                - type: atLeast
                  value: 1
                  field: selections
                  scope: force
                  childId: se-trigger-b

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-target

  # Only target, neither trigger → no change
  - expectedState:
      forces:
        - selections:
            - name: Target

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-trigger-a

  - expectedState:
      forces:
        - selections:
            - name: Target
            - name: Trigger A

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-trigger-b

  - expectedState:
      forces:
        - selections:
            - name: Both Present
            - name: Trigger A
            - name: Trigger B
