id: condition-null-childid
category: condition
engines:
  newrecruit: fail
description: Condition with no childId evaluates to false — query cannot resolve target and returns NaN

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit
          name: Unit A
          type: unit
          modifiers:
            - type: set
              field: name
              value: Should Not Apply
              conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: force

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  # Missing childId → resolver returns null → query returns NaN → condition false
  # Modifier never fires, name stays unchanged
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Unit A
