id: condition-null-childid
category: condition
description: >
  Condition with no childId — BattleScribe: query cannot resolve target, returns NaN, condition
  is false. NR: on force scope, defaults to counting all selections ("any").
tags: [undefined-behavior]

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit
          name: Unit A
          type: unit
          modifiers:
            - type: set
              field: name
              value: Should Not Apply
              conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: force

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit

  # BattleScribe: missing childId → resolver returns null → query returns NaN → condition false
  # NR: on force scope, null childId → counts all selections → atLeast 1 → true → modifier fires
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Unit A
      engines:
        newrecruit:
          forces:
            - selectionCount: 1
              selections:
                - name: Should Not Apply
