id: condition-less-than
category: condition
description: Condition type lessThan evaluates true when count < value

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit
          modifiers:
            - type: set
              field: name
              value: Few Present
              conditions:
                - type: lessThan
                  value: 2
                  field: selections
                  scope: force
                  childId: se-unit-a

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  # With 1 selection, lessThan(2) is true
  - expectedState:
      forces:
        - selections:
            - name: Few Present

  # Add second selection → lessThan(2) is now false (2 is not < 2)
  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - expectedState:
      forces:
        - selections:
            - name: Unit A
            - name: Unit A
