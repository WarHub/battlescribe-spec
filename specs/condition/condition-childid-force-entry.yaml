id: condition-childid-force-entry
category: condition
description: childId filter can reference a ForceEntry ID to count forces of that type
tags:
  - known-limitation-synthetic

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-army
        name: Army
      - id: fe-detach
        name: Detachment
  catalogue:
    id: cat-1
    name: Cat
    gameSystemId: test-gs
    selectionEntries:
      - id: se-watcher
        name: Watcher
        type: unit
        modifiers:
          - type: set
            field: name
            value: Detach Found
            conditions:
              - type: atLeast
                value: 1
                field: forces
                scope: roster
                childId: fe-detach

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  # childId references a ForceEntry ID to count forces of that type.
  # With synthetic data, forces-field queries with childId filtering
  # do not resolve correctly.
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Watcher
