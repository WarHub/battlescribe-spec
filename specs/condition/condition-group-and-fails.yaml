id: condition-group-and-fails
category: condition
description: AND condition group fails when one condition is not met

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Guard
          type: unit
          modifiers:
            - type: set
              field: name
              value: Should Not Apply
              conditionGroups:
                - type: and
                  conditions:
                    - type: atLeast
                      value: 1
                      field: selections
                      scope: self
                    - type: atLeast
                      value: 100
                      field: selections
                      scope: self

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  - expectedState:
      forces:
        - selections:
            - name: Guard
