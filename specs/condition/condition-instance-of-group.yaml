id: condition-instance-of-group
category: condition
description: instanceOf condition can match by SelectionEntryGroup type
setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-detector
          name: Detector
          type: unit
          modifiers:
            - type: set
              field: name
              value: Group Instance Found
              conditions:
                - type: instanceOf
                  value: 1
                  field: selections
                  scope: force
                  childId: seg-weapons
        - id: se-unit
          name: Unit
          type: unit

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  # instanceOf childId=seg-weapons: no SelectionEntryGroup with that ID
  # exists, so condition is false → name stays "Detector".
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Detector
