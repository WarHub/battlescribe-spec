id: condition-childid-catalogue
category: condition
description: childId filter can reference a Catalogue ID for scoping queries to a specific catalogue
tags: []
setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogue:
    id: cat-1
    name: Cat
    gameSystemId: test-gs
    selectionEntries:
      - id: se-watcher
        name: Watcher
        type: unit
        modifiers:
          - type: set
            field: name
            value: Cat Matched
            conditions:
              - type: atLeast
                value: 1
                field: selections
                scope: roster
                childId: cat-1

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  # childId references Catalogue ID cat-1. With scope=roster, the engine
  # should count selections from that catalogue. This requires catalogue-level
  # childId resolution in the engine's condition evaluator which isn't
  # operational with synthetic data.
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Watcher
