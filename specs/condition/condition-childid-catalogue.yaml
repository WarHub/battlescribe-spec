id: condition-childid-catalogue
category: condition
description: childId filter can reference a Catalogue ID for scoping queries to a specific catalogue
tags: [undefined-behavior]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-watcher
          name: Watcher
          type: unit
          modifiers:
            - type: set
              field: name
              value: Cat Matched
              conditions:
                - type: atLeast
                  value: 1
                  field: selections
                  scope: roster
                  childId: cat-1

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  # childId=cat-1 references a Catalogue ID used as a count filter for atLeast.
  # Neither engine resolves catalogue IDs as childId filters — the condition
  # returns false on both BS Oracle and NR.
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Watcher
