id: condition-instance-of-ancestor
category: condition
description: >
  instanceOf with scope=ancestor walks up the parent chain and checks if
  any ancestor matches the childId entry. The child must be selected for
  its modifier condition to evaluate.

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-parent
          name: Parent Unit
          type: unit
          selectionEntries:
            - id: se-child
              name: Child Model
              type: model
              modifiers:
                - type: set
                  field: name
                  value: Has Ancestor
                  conditions:
                    - type: instanceOf
                      value: 1
                      field: selections
                      scope: ancestor
                      childId: se-parent

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    id: select-parent-unit
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-parent

  # Select the child entry so its modifier condition evaluates.
  - action: selectChildEntry
    forceId: ${{ steps.add-patrol.forceId }}
    selectionId: ${{ steps.select-parent-unit.selectionId }}
    entryId: CHILD_0

  # scope=ancestor walks the parent chain from the child. The parent
  # selection was created from se-parent → instanceOf matches → name set.
  - expectedState:
      forces:
        - selections:
            - name: Parent Unit
              children:
                - name: Has Ancestor
