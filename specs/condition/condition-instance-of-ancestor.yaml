id: condition-instance-of-ancestor
category: condition
description: instanceOf condition with ancestor scope checks parent hierarchy for matching entries

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-parent
          name: Parent Unit
          type: unit
          selectionEntries:
            - id: se-child
              name: Child Model
              type: model
              modifiers:
                - type: set
                  field: name
                  value: Has Ancestor
                  conditions:
                    - type: instanceOf
                      value: 1
                      field: selections
                      scope: ancestor
                      childId: se-parent

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  # Child should detect parent as ancestor via instanceOf
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Parent Unit
