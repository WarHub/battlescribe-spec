id: condition-instance-of-catalogue
category: condition
description: instanceOf condition can match against Catalogue IDs for catalogue-scoped checks
tags: []
setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogue:
    id: cat-1
    name: Cat
    gameSystemId: test-gs
    selectionEntries:
      - id: se-detector
        name: Detector
        type: unit
        modifiers:
          - type: set
            field: name
            value: Catalogue Matched
            conditions:
              - type: instanceOf
                value: 1
                field: selections
                scope: roster
                childId: cat-1
      - id: se-unit
        name: Unit
        type: unit

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  # instanceOf checks if selections are instances from catalogue cat-1.
  # Detector is from cat-1 → condition should be true.
  # With synthetic data, instanceOf catalogue matching is not operational.
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Detector
