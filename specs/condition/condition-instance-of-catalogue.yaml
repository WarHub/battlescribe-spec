id: condition-instance-of-catalogue
category: condition
description: instanceOf condition can match against Catalogue IDs for catalogue-scoped checks
tags: [undefined-behavior]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-detector
          name: Detector
          type: unit
          modifiers:
            - type: set
              field: name
              value: Catalogue Matched
              conditions:
                - type: instanceOf
                  value: 1
                  field: selections
                  scope: roster
                  childId: cat-1
        - id: se-unit
          name: Unit
          type: unit

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  # instanceOf with scope=roster always returns false in BS engine
  # (c.java:1196-1197 hardcodes return false for roster scope on instanceOf).
  # Both engines agree — condition never fires regardless of catalogue matching.
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Detector
