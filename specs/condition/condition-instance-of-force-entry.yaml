id: condition-instance-of-force-entry
category: condition
description: instanceOf condition can match against ForceEntry types
tags: []

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-patrol
        name: Patrol
      - id: fe-battalion
        name: Battalion
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-detector
          name: Detector
          type: unit
          modifiers:
            - type: set
              field: name
              value: Force Entry Matched
              conditions:
                - type: instanceOf
                  value: 1
                  field: forces
                  scope: roster
                  childId: fe-patrol
        - id: se-unit
          name: Unit
          type: unit

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  # instanceOf checks if forces in roster are instances of fe-patrol.
  # We added a force from fe-patrol (index 0) → condition should be true.
  # With synthetic data, instanceOf force entry matching is not operational.
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Detector
