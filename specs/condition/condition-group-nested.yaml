id: condition-group-nested
category: condition
description: Nested condition groups form complex boolean logic trees (AND containing OR)
setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Soldier
          type: unit
          modifiers:
            - type: set
              field: name
              value: Elite Soldier
              conditionGroups:
                - type: and
                  conditions:
                    - type: atLeast
                      value: 1
                      field: selections
                      scope: parent
                      childId: se-1
                  conditionGroups:
                    - type: or
                      conditions:
                        - type: greaterThan
                          value: 5
                          field: selections
                          scope: parent
                          childId: se-1
                        - type: lessThan
                          value: 2
                          field: selections
                          scope: parent
                          childId: se-1

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  # Nested logic: AND(atLeast 1, OR(greaterThan 5, lessThan 2))
  # With 1 selection: atLeast 1 = true, OR(1>5=false, 1<2=true) = true → AND = true
  - expectedState:
      forces:
        - selections:
            - name: Elite Soldier

  # Add 2nd selection: OR(2>5=false, 2<2=false) = false → AND = false → modifier reverts
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      forces:
        - selectionCount: 2
          selections:
            - name: Soldier
            - name: Soldier
