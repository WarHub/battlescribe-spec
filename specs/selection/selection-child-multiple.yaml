id: selection-child-multiple
category: selection
description: Multiple child entries can be selected under a parent

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-parent
          name: HQ Unit
          type: unit
          selectionEntries:
            - id: se-child-1
              name: Captain
              type: model
            - id: se-child-2
              name: Chaplain
              type: model

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    id: select-hq-unit
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-parent

  - action: selectChildEntry
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-hq-unit.selectionId }}
    entryId: se-child-1

  - action: selectChildEntry
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-hq-unit.selectionId }}
    entryId: se-child-2

  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: HQ Unit
              children:
                - name: Captain
                  type: model
                - name: Chaplain
                  type: model
