id: selection-child-multiple
category: selection
description: Multiple child entries can be selected under a parent

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogue:
    id: cat-1
    name: Cat
    gameSystemId: test-gs
    selectionEntries:
      - id: se-parent
        name: HQ Unit
        type: unit
        selectionEntries:
          - id: se-child-1
            name: Captain
            type: model
          - id: se-child-2
            name: Chaplain
            type: model

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  - action: selectChildEntry
    forceIndex: 0
    selectionIndex: 0
    childEntryIndex: 0
  - action: selectChildEntry
    forceIndex: 0
    selectionIndex: 0
    childEntryIndex: 1
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: HQ Unit
              children:
                - name: Captain
                  type: model
                - name: Chaplain
                  type: model
