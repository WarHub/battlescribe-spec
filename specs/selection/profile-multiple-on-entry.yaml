id: profile-multiple-on-entry
category: selection
description: An entry with two profiles of the same type produces both profiles in selection state
tags: []

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
    profileTypes:
      - id: pt-weapon
        name: Weapon Stats
        characteristicTypes:
          - id: char-range
            name: Range
          - id: char-str
            name: Strength
  catalogue:
    id: cat-1
    name: Cat
    gameSystemId: test-gs
    selectionEntries:
      - id: se-dual
        name: Dual Wielder
        type: unit
        profiles:
          - id: prof-axe
            name: Power Axe
            typeId: pt-weapon
            typeName: Weapon Stats
            characteristics:
              - name: Range
                typeId: char-range
                value: Melee
              - name: Strength
                typeId: char-str
                value: "6"
          - id: prof-sword
            name: Chain Sword
            typeId: pt-weapon
            typeName: Weapon Stats
            characteristics:
              - name: Range
                typeId: char-range
                value: Melee
              - name: Strength
                typeId: char-str
                value: "4"

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  - expectedState:
      forces:
        - selections:
            - name: Dual Wielder
              profiles:
                - name: Power Axe
                  characteristics:
                    - name: Range
                      value: Melee
                    - name: Strength
                      value: "6"
                - name: Chain Sword
                  characteristics:
                    - name: Range
                      value: Melee
                    - name: Strength
                      value: "4"
