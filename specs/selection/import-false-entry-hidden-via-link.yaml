id: import-false-entry-hidden-via-link
category: selection
description: Entry with import=false on base catalogue is filtered when catalogue is imported via CatalogueLink

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-1
        name: Patrol
  catalogues:
    - id: cat-base
      name: Base Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-base-1
          name: Shared Unit
          type: unit
        - id: se-base-2
          name: Internal Unit
          type: unit
          import: false
    - id: cat-faction
      name: Faction Catalogue
      gameSystemId: test-gs
      catalogueLinks:
        - id: cl-1
          name: Base Catalogue
          targetId: cat-base
      selectionEntries:
        - id: se-faction-1
          name: Faction Unit
          type: unit

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-1
    catalogueId: cat-faction

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-base-1

  - expectedState:
      forces:
        - name: Patrol
          selectionCount: 1
          selections:
            - name: Faction Unit
              type: unit
