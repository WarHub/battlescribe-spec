id: selection-with-cost
category: selection
description: Selection carries cost from its entry definition

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    costTypes:
      - id: pts
        name: Points
        defaultCostLimit: -1.0
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogue:
    id: cat-1
    name: Test Catalogue
    gameSystemId: test-gs
    selectionEntries:
      - id: se-unit-a
        name: Unit A
        type: unit
        costs:
          - name: Points
            typeId: pts
            value: 150

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      forces:
        - selections:
            - name: Unit A
              costs:
                - typeId: pts
                  value: 150
      costs:
        - typeId: pts
          value: 150
