id: selection-publication
category: selection
description: Selection entry preserves its publicationId from the catalogue definition
tags: [newrecruit-missing-feature]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      publications:
        - id: pub-1
          name: Core Rulebook
      selectionEntries:
        - id: se-1
          name: Marine
          type: unit
          publicationId: pub-1

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  - expectedState:
      forces:
        - selections:
            - name: Marine
              publicationId: pub-1
      engines:
        newrecruit:
          forces:
            - selections:
                - name: Marine
