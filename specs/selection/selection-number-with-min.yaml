id: selection-number-with-min
category: selection
description: Entry with min=3 constraint — verify initial selection number respects min
tags: [selection, number, constraint, min, newrecruit-bug]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-parent
          name: Parent Unit
          type: unit
          selectionEntries:
            - id: se-trooper
              name: Trooper
              type: model
              constraints:
                - id: con-min
                  type: min
                  value: 3
                  field: selections
                  scope: parent
                - id: con-max
                  type: max
                  value: 10
                  field: selections
                  scope: parent

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  # When Parent Unit is selected, Trooper (child with min=3) should be
  # auto-selected with number=3 to satisfy the min constraint.
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Parent Unit
              children:
                - name: Trooper
                  type: model
                  number: 3
      engines:
        # NR doesn't apply min constraint to initial number — gets number=1, reports error
        newrecruit:
          forces:
            - selectionCount: 1
              selections:
                - name: Parent Unit
                  children:
                    - name: Trooper
                      type: model
                      number: 1
          errors:
            - on: selection se-parent
              from: se-trooper/con-min
