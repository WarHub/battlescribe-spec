id: selection-deselect-middle
category: selection
description: Deselecting a middle selection removes it and shifts indices

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Alpha
          type: unit
        - id: se-unit-b
          name: Beta
          type: unit
        - id: se-unit-c
          name: Gamma
          type: unit

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-a

  - action: selectEntry
    id: select-beta
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-b

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-unit-c

  - expectedState:
      forces:
        - selectionCount: 3

  - action: deselectSelection
    forceId: ${{ steps.add-patrol.forceId }}
    selectionId: ${{ steps.select-beta.selectionId }}

  - expectedState:
      forces:
        - selectionCount: 2
          selections:
            - name: Alpha
            - name: Gamma
