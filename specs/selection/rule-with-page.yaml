id: rule-with-page
category: selection
description: Rule on a selection preserves its page field

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Veteran
          type: unit
          rules:
            - id: rule-1
              name: Stubborn
              description: This unit never falls back
              page: "42"

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  - expectedState:
      forces:
        - selections:
            - name: Veteran
              rules:
                - name: Stubborn
                  description: This unit never falls back
                  page: "42"
