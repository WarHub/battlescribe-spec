id: selection-set-count
category: selection
description: Setting selection count via setSelectionCount action
tags: []

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
        defaultCostLimit: -1
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Trooper
          type: model
          costs:
            - name: pts
              typeId: pts
              value: 10

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Trooper
              number: 1
      costs:
        - typeId: pts
          value: 10
  # setSelectionCount is a no-op for root/force-level entries in the BattleScribe engine.
  # Root entries always create new selections via selectEntry, not via count.
  # This verifies the engine correctly handles the no-op case.
  - action: setSelectionCount
    forceIndex: 0
    entryIndex: 0
    count: 3
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Trooper
              number: 1
