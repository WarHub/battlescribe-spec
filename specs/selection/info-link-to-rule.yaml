id: info-link-to-rule
category: selection
description: InfoLink of type rule resolves a shared rule onto an entry

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-1
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      sharedRules:
        - id: shared-rule-1
          name: Objective Secured
          description: This unit counts as having Objective Secured
      selectionEntries:
        - id: se-1
          name: Marine
          type: unit
          infoLinks:
            - id: il-1
              name: Objective Secured
              targetId: shared-rule-1
              type: rule

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-1

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-1

  - expectedState:
      forces:
        - selections:
            - name: Marine
              rules:
                - name: Objective Secured
                  description: This unit counts as having Objective Secured
