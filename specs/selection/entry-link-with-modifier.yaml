id: entry-link-with-modifier
category: selection
description: EntryLink can have its own modifiers that override the target entry
tags:
  - known-limitation-synthetic

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
        defaultCostLimit: -1
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogue:
    id: cat-1
    name: Cat
    gameSystemId: test-gs
    selectionEntries:
      - id: se-shared
        name: Base Weapon
        type: upgrade
        costs:
          - name: pts
            typeId: pts
            value: 10
    entryLinks:
      - id: el-1
        name: Enhanced Weapon
        targetId: se-shared
        type: selectionEntry
        modifiers:
          - type: set
            field: name
            value: Enhanced Weapon

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  # The entry link has its own modifier that sets the name.
  # The engine deep-copies the target and applies the link's modifiers.
  # With synthetic data, the link may not fully resolve.
  - expectedState:
      forces:
        - selectionCount: 1
