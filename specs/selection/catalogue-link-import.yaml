id: catalogue-link-import
category: selection
description: CatalogueLink imports entries from a linked catalogue

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-1
        name: Patrol
  catalogues:
    - id: cat-base
      name: Base Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-base-1
          name: Common Unit
          type: unit
    - id: cat-faction
      name: Faction Catalogue
      gameSystemId: test-gs
      catalogueLinks:
        - id: cl-1
          name: Base Catalogue
          targetId: cat-base
      selectionEntries:
        - id: se-faction-1
          name: Faction Unit
          type: unit

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-1
    catalogueId: cat-faction

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-faction-1

  - expectedState:
      forces:
        - name: Patrol
          selections:
            - name: Faction Unit
