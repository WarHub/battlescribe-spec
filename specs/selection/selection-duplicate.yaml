id: selection-duplicate
category: selection
description: Duplicating a selection creates a copy in the same force

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
        defaultCostLimit: -1
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogue:
    id: cat-1
    name: Cat
    gameSystemId: test-gs
    selectionEntries:
      - id: se-1
        name: Squad Alpha
        type: unit
        costs:
          - name: pts
            typeId: pts
            value: 50

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  - assert: selectionCount
    forceIndex: 0
    expected: 1
  - action: duplicateSelection
    forceIndex: 0
    selectionIndex: 0
  - assert: selectionCount
    forceIndex: 0
    expected: 2
  - expectedState:
      forces:
        - selectionCount: 2
          selections:
            - name: Squad Alpha
              type: unit
              costs:
                - typeId: pts
                  value: 50
            - name: Squad Alpha
              type: unit
              costs:
                - typeId: pts
                  value: 50
      costs:
        - typeId: pts
          value: 100
