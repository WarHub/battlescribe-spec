id: selection-set-child-count-collective
category: selection
description: >
  setSelectionCount on a collective child entry. Collective entries are shared
  across sibling instances. Verifies number=N on a single selection with
  scaled costs (N × per-unit cost).
tags:
  - selection
  - number
  - cost

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          selectionEntries:
            - id: se-weapon
              name: Weapon
              type: upgrade
              collective: true
              costs:
                - name: pts
                  typeId: pts
                  value: 5

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    id: select-squad
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-squad

  - action: selectChildEntry
    id: select-weapon
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-squad.selectionId }}
    entryId: se-weapon

  - expectedState:
      forces:
        - selections:
            - name: Squad
              children:
                - name: Weapon
                  number: 1
                  costs:
                    - name: pts
                      typeId: pts
                      value: 5
      costs:
        - typeId: pts
          value: 5

  # setSelectionCount to 3 on the collective child
  - action: setSelectionCount
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-weapon.selectionId }}
    count: 3

  - expectedState:
      forces:
        - selections:
            - name: Squad
              children:
                - name: Weapon
                  number: 3
                  costs:
                    - name: pts
                      typeId: pts
                      value: 15
      costs:
        - typeId: pts
          value: 15
