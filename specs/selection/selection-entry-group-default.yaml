id: selection-entry-group-default
category: selection
description: SelectionEntryGroup with defaultSelectionEntryId auto-selects the default entry
tags:
  - known-limitation-synthetic

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogue:
    id: cat-1
    name: Cat
    gameSystemId: test-gs
    selectionEntries:
      - id: se-parent
        name: Parent Unit
        type: unit
        selectionEntryGroups:
          - id: seg-weapons
            name: Weapon Options
            defaultSelectionEntryId: se-sword
            selectionEntries:
              - id: se-sword
                name: Sword
                type: upgrade
              - id: se-axe
                name: Axe
                type: upgrade

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  # With defaultSelectionEntryId, the engine auto-selects se-sword.
  # With synthetic data, this may not trigger.
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Parent Unit
