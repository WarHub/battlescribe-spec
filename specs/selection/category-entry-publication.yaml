id: category-entry-publication
category: selection
tags: [categoryEntry, publication, engine-limitation]
description: >
  CategoryEntry with publicationId and page is accepted in XML.
  Engine limitation: category roster elements do not expose publicationId/page
  from the entry definition.

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    categoryEntries:
      - id: cat-troops
        name: Troops
        publicationId: pub-1
        page: "10"
    forceEntries:
      - id: fe-1
        name: Detachment
        categoryLinks:
          - id: cl-troops
            targetId: cat-troops
            name: Troops
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      publications:
        - id: pub-1
          name: Core Rulebook
      selectionEntries:
        - id: se-1
          name: Marine
          type: unit

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      forces:
        - selections:
            - name: Marine
