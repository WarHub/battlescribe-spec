id: selection-nested-deselect
category: selection
description: deselectSelection can target nested selections via selectionPath
tags: [selection, nested]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-army
        name: Army
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          selectionEntries:
            - id: se-weapon
              name: Weapon
              type: upgrade

steps:
  - action: addForce
    forceEntryId: fe-army

  - action: selectEntry
    id: select-squad
    entryId: se-squad

  - action: selectChildEntry
    selectionId: ${{ steps.select-squad.selectionId }}
    entryId: CHILD_0

  - expectedState:
      forces:
        - name: Army
          selections:
            - name: Squad
              children:
                - name: Weapon

  # Deselect the nested "Weapon" using selectionPath
  - action: deselectSelection
    selectionId: ${{ steps.select-squad.selectionId }}

  - expectedState:
      forces:
        - name: Army
          selections:
            - name: Squad
              childCount: 0
