id: selection-nested-deselect
category: selection
description: deselectSelection can target nested selections via selectionPath
tags: [selection, nested]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-army
        name: Army
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-squad
          name: Squad
          type: unit
          selectionEntries:
            - id: se-weapon
              name: Weapon
              type: upgrade

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    entryIndex: 0

  - action: selectChildEntry
    selectionIndex: 0
    childEntryIndex: 0

  - expectedState:
      forces:
        - name: Army
          selections:
            - name: Squad
              children:
                - name: Weapon

  # Deselect the nested "Weapon" using selectionPath
  - action: deselectSelection
    selectionPath: [0, 0]

  - expectedState:
      forces:
        - name: Army
          selections:
            - name: Squad
              childCount: 0
