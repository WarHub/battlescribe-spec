id: selection-child-entry
category: selection
description: Selecting a child entry adds it under the parent selection

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-parent
          name: Command Squad
          type: unit
          selectionEntries:
            - id: se-child-1
              name: Sergeant
              type: model
            - id: se-child-2
              name: Medic
              type: model

steps:
  - action: addForce
    id: add-detachment
    forceEntryId: fe-1

  - action: selectEntry
    id: select-command-squad
    forceId: ${{ steps.add-detachment.forceId }}
    entryId: se-parent

  - expectedState:
      forces:
        - selectionCount: 1

  - action: selectChildEntry
    forceId: ${{ steps.add-detachment.forceId }}
    selectionId: ${{ steps.select-command-squad.selectionId }}
    entryId: CHILD_0

  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Command Squad
              children:
                - name: Sergeant
                  type: model
