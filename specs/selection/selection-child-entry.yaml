id: selection-child-entry
category: selection
description: Selecting a child entry adds it under the parent selection

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-parent
          name: Command Squad
          type: unit
          selectionEntries:
            - id: se-child-1
              name: Sergeant
              type: model
            - id: se-child-2
              name: Medic
              type: model

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  - expectedState:
      forces:
        - selectionCount: 1
  - action: selectChildEntry
    forceIndex: 0
    selectionIndex: 0
    childEntryIndex: 0
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Command Squad
              children:
                - name: Sergeant
                  type: model
