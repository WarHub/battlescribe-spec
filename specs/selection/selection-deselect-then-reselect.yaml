id: selection-deselect-then-reselect
category: selection
description: After deselecting a selection, re-selecting the same entry creates a new selection

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    costTypes:
      - id: pts
        name: pts
        defaultCostLimit: -1
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Unit A
          type: unit
          costs:
            - name: pts
              typeId: pts
              value: 50

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  - expectedState:
      forces:
        - selectionCount: 1
  - action: deselectSelection
    forceIndex: 0
    selectionIndex: 0
  - expectedState:
      forces:
        - selectionCount: 0
  - expectedState:
      costs:
        - typeId: pts
          value: 0.0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Unit A
      costs:
        - typeId: pts
          value: 50.0
