id: selection-ordering-alphabetical
category: selection
description: >
  Selections are returned in alphabetical order by name. Both BattleScribe and
  NewRecruit sort selections alphabetically in their display/render layers.
  This spec verifies the canonical alphabetical ordering for simple names.

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol

  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-charlie
          name: Charlie
          type: unit
        - id: se-alpha
          name: Alpha
          type: unit
        - id: se-bravo
          name: Bravo
          type: unit

steps:
  - action: addForce
    id: add-patrol
    forceEntryId: fe-patrol

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-charlie

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-alpha

  - action: selectEntry
    forceId: ${{ steps.add-patrol.forceId }}
    entryId: se-bravo

  - expectedState:
      forces:
        - selections:
            - name: Alpha
            - name: Bravo
            - name: Charlie
