id: infogroup-multiple-profiles
category: selection
description: An infoGroup with multiple profiles each having different characteristics all appear in state
tags: []

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
    profileTypes:
      - id: pt-weapon
        name: Weapon Stats
        characteristicTypes:
          - id: char-range
            name: Range
          - id: char-str
            name: Strength
          - id: char-ap
            name: AP
      - id: pt-ability
        name: Ability
        characteristicTypes:
          - id: char-desc
            name: Description
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Commander
          type: unit
          infoGroups:
            - id: ig-gear
              name: Commander Gear
              profiles:
                - id: prof-sword
                  name: Power Sword
                  typeId: pt-weapon
                  typeName: Weapon Stats
                  characteristics:
                    - name: Range
                      typeId: char-range
                      value: Melee
                    - name: Strength
                      typeId: char-str
                      value: "5"
                    - name: AP
                      typeId: char-ap
                      value: "-3"
                - id: prof-pistol
                  name: Plasma Pistol
                  typeId: pt-weapon
                  typeName: Weapon Stats
                  characteristics:
                    - name: Range
                      typeId: char-range
                      value: "12"
                    - name: Strength
                      typeId: char-str
                      value: "7"
                    - name: AP
                      typeId: char-ap
                      value: "-3"
                - id: prof-aura
                  name: Command Aura
                  typeId: pt-ability
                  typeName: Ability
                  characteristics:
                    - name: Description
                      typeId: char-desc
                      value: Re-roll hit rolls of 1 for friendly units within 6 inches

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  - expectedState:
      forces:
        - selections:
            - name: Commander
              profiles:
                - name: Power Sword
                  characteristics:
                    - name: Range
                      value: Melee
                    - name: Strength
                      value: "5"
                    - name: AP
                      value: "-3"
                - name: Plasma Pistol
                  characteristics:
                    - name: Range
                      value: "12"
                    - name: Strength
                      value: "7"
                    - name: AP
                      value: "-3"
                - name: Command Aura
                  characteristics:
                    - name: Description
                      value: Re-roll hit rolls of 1 for friendly units within 6 inches
