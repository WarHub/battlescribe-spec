id: selection-hidden-entry
category: selection
description: Hidden selection entries can still be selected

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-1
          name: Hidden Unit
          type: unit
          hidden: true

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Hidden Unit
      engines:
        newrecruit:
          errors:
            - on: selection se-1
              from: se-1/hidden
