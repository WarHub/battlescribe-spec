id: selection-force-level-entry
category: selection
description: Force-level entries create new selections each time they are selected
tags: []

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogue:
    id: cat-1
    name: Cat
    gameSystemId: test-gs
    selectionEntries:
      - id: se-1
        name: Stratagem
        type: upgrade

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  # Selecting the same entry twice should create two separate selections
  # (force-level entries always create new selections).
  - expectedState:
      forces:
        - selectionCount: 2
          selections:
            - name: Stratagem
            - name: Stratagem
