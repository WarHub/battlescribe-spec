id: info-link-with-modifiers
category: selection
description: InfoLink with modifiers applies modifier to the resolved target info

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-1
        name: Patrol
  catalogue:
    id: cat-1
    name: Test Catalogue
    gameSystemId: test-gs
    sharedRules:
      - id: shared-rule-1
        name: Duty Eternal
        description: Original
    selectionEntries:
      - id: se-1
        name: Marine
        type: unit
        infoLinks:
          - id: il-1
            name: Duty Eternal
            targetId: shared-rule-1
            type: rule
            modifiers:
              - type: set
                field: description
                value: Modified by InfoLink

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - expectedState:
      forces:
        - selections:
            - name: Marine
              rules:
                - name: Duty Eternal
                  description: Modified by InfoLink
