id: selection-entry-group-default-with-max
category: selection
description: DefaultSelectionEntryId with max=1 on group — default counts toward max
tags: [defaultSelectionEntryId, constraint, max]

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogues:
    - id: cat-1
      name: Cat
      gameSystemId: test-gs
      selectionEntries:
        - id: se-parent
          name: Parent Unit
          type: unit
          selectionEntryGroups:
            - id: seg-weapons
              name: Weapon Options
              defaultSelectionEntryId: se-sword
              constraints:
                - id: con-max
                  type: max
                  value: 1
                  field: selections
                  scope: parent
              selectionEntries:
                - id: se-sword
                  name: Sword
                  type: upgrade
                - id: se-axe
                  name: Axe
                  type: upgrade

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  # Parent Unit is selected; Sword is auto-selected as the group default.
  # Group has max=1, so only one weapon can be selected.
  # Verifies no errors from the max constraint interaction with default.
  - expectedState:
      forces:
        - selectionCount: 1
          selections:
            - name: Parent Unit
      errors: []
