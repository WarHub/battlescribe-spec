id: selection-multiple-types
category: selection
description: Selection entries of different types (unit, model, upgrade) coexist in the same force

setup:
  gameSystem:
    id: test-gs
    name: Test GS
    forceEntries:
      - id: fe-1
        name: Detachment
  catalogue:
    id: cat-1
    name: Cat
    gameSystemId: test-gs
    selectionEntries:
      - id: se-unit
        name: Infantry Squad
        type: unit
      - id: se-model
        name: Sergeant
        type: model
      - id: se-upgrade
        name: Power Sword
        type: upgrade

steps:
  - action: addForce
    forceEntryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 0
  - action: selectEntry
    forceIndex: 0
    entryIndex: 1
  - action: selectEntry
    forceIndex: 0
    entryIndex: 2
  - expectedState:
      forces:
        - selectionCount: 3
          selections:
            - name: Infantry Squad
              type: unit
            - name: Sergeant
              type: model
            - name: Power Sword
              type: upgrade
