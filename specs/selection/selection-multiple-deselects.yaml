id: selection-multiple-deselects
category: selection
description: Deselecting all selections leaves force empty

setup:
  gameSystem:
    id: test-gs
    name: Test Game System
    forceEntries:
      - id: fe-patrol
        name: Patrol
  catalogues:
    - id: cat-1
      name: Test Catalogue
      gameSystemId: test-gs
      selectionEntries:
        - id: se-unit-a
          name: Unit A
          type: unit

steps:
  - action: addForce
    forceEntryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - action: selectEntry
    forceIndex: 0
    entryIndex: 0

  - assert: selectionCount
    forceIndex: 0
    expected: 2

  - action: deselectSelection
    forceIndex: 0
    selectionIndex: 1

  - action: deselectSelection
    forceIndex: 0
    selectionIndex: 0

  - assert: selectionCount
    forceIndex: 0
    expected: 0
